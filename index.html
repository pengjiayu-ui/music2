"犯腔曲牌有两种情况：只犯腔不犯调（曲调变、调门不变），既犯腔又犯调（曲调与调门均变）。","它丰富了曲牌音乐的表现力，是唐宋燕乐宫调理论与后世「集曲」手法的先声。"],"keys":["犯调","犯腔","犯腔曲牌","移调","燕乐宫调"],"tip":"「犯腔换曲调、犯调换调门，两者都干叫又犯腔又犯调」。","extra":true,"syl":false,"sylNote":"考纲未列犯调"},{"q":"简述隋唐多部乐。","type":"简答","pts":["多部乐是隋唐宫廷燕乐中按乐舞来源与国别分部的乐舞体制，由隋代七部乐、九部乐发展至唐代九部乐、十部乐。","隋初颁「七部乐」：国伎（西凉乐）、清商伎、高丽伎、天竺伎、安国伎、龟兹伎、文康伎（礼毕）。","隋炀帝扩为「九部乐」，唐太宗时沿用九部乐，唐高宗时增至「十部乐」，加入高昌乐等西域乐部。","十部乐中半数以上为西域乐部，如龟兹、疏勒、高昌、安国、康国乐，体现唐代音乐的多民族性与开放性。"],"keys":["多部乐","七部乐","九部乐","十部乐","高昌乐"],"tip":"「七→九→十」步步加，半数西域乐部，高昌最后入十部。","extra":true,"syl":true,"sylNote":"考纲列七部乐、九部乐、十部乐"},{"q":"论隋唐燕乐体系的发展阶段及其历史地位。","type":"论述","pts":["燕乐即宴饮之乐，是隋唐宫廷宴享宾客时表演的歌舞音乐，也是隋唐音乐发展的主流。","第一阶段是多部乐：隋七部乐、九部乐至唐九部乐、十部乐，以国名、地名分部，体现多民族音乐并存。","第二阶段是二部伎：唐玄宗时按演出形式分为堂上坐奏的坐部伎与堂下立奏的立部伎，标志燕乐由多部乐向艺术化、精细化发展。","第三阶段是歌舞大曲、法曲与健舞、软舞的兴盛，《霓裳羽衣曲》为代表，形成器乐、声乐、舞蹈高度综合的大型乐舞。","燕乐体系还带动燕乐二十八调、教坊梨园等机构与乐调理论的发展，并广泛吸收西域音乐，成为中国古代音乐的高峰与后世戏曲说唱的源头。"],"keys":["燕乐","多部乐","二部伎","歌舞大曲","霓裳羽衣曲"],"tip":"「多部乐→二部伎→大曲法曲」三段式，最后落到燕乐二十八调与历史地位。","extra":true,"syl":true,"sylNote":"考纲列燕乐、燕乐大曲等"},{"q":"太常寺","type":"名词解释","pts":["太常寺是中国古代掌管国家礼乐的最高行政机关，隋唐时统辖大乐署与鼓吹署两大分支。","大乐署主管雅乐、燕乐的教习、排练与演出，并对宫廷乐师进行严格训练与考核。","鼓吹署掌管鼓吹乐，用于仪仗、军旅与典礼。","太常寺与内廷的教坊、梨园分工：前者掌礼乐雅乐，后两者掌宫廷燕乐，共同构成隋唐音乐管理体系。"],"keys":["太常寺","大乐署","鼓吹署","礼乐机构","教坊梨园"],"tip":"「太常寺→大乐署+鼓吹署」管雅乐，教坊梨园管内廷。","extra":true,"syl":false,"sylNote":"考纲未列太常寺"},{"q":"参军戏","type":"名词解释","pts":["参军戏是唐代兴起的一种滑稽戏（歌舞戏），源于后赵时戏弄参军的故事。","通常由两个角色表演：参军扮演呆傻的官员，苍鹘扮演机智的戏弄者，一捧一逗、即兴问答。","表演以科白为主，有化妆、服饰，并吸收歌唱与舞蹈成分。","它与《拨头》《大面》《踏摇娘》等歌舞戏同为宋杂剧的前身，是戏曲形成的重要基础。"],"keys":["参军戏","苍鹘","滑稽戏","歌舞戏","宋杂剧前身"],"tip":"「参军挨逗、苍鹘戏弄」——唐代相声式小戏，宋杂剧的祖宗。","extra":true,"syl":false,"sylNote":"考纲未列参军戏"},{"q":"论述中国古代记谱法，分析其各自的特征与对音乐传承的意义。","type":"论述","pts":["文字谱用文字叙述指法、弦序与徽位，现存《碣石调·幽兰》为最早的古琴谱，保存了唐代以前的琴曲信息。","减字谱由唐代曹柔创制，把汉字偏旁笔画拼合成符号记录古琴指法，至今仍是古琴的主要谱式。","半字谱（燕乐半字谱）、俗字谱用于唐代琵琶（《敦煌曲谱》）与宋代词乐，姜夔《白石道人歌曲》旁谱即属此类；律吕字谱以十二律吕名称记写音高。","工尺谱以「上尺工凡六五乙」记写，明清戏曲、器乐广泛使用，另有管色谱、弦索谱、二四谱等。","这些谱式保存了大量古代音乐作品，为今日「打谱」复原古曲提供依据，但它们多只记音高指法、节奏记录简略，也造成传承中的变异。"],"keys":["文字谱","减字谱","俗字谱","工尺谱","打谱"],"tip":"「文字→减字→半字俗字→工尺」——谱式愈简，传承愈广。","extra":true,"syl":true,"sylNote":"考纲列减字谱、工尺谱等"},{"q":"简述唐代歌舞大曲。","type":"简答","pts":["唐代歌舞大曲又称燕乐大曲，是综合器乐、歌唱与舞蹈、含有多段结构的大型乐舞，在隋唐宫廷燕乐中地位重要。","其结构分为散序、中序、破三部分：散序由器乐演奏、节奏自由无歌；中序是器乐伴奏的抒情歌唱、节拍稳定。","破以舞蹈为主，速度逐渐加快，在热烈气氛中结束，每部分都由数量不等的多支曲子组成。","代表作《霓裳羽衣曲》相传由李隆基据印度《婆罗门曲》改编，体现盛唐中外音乐的高度融合。"],"keys":["歌舞大曲","散序","中序","破","霓裳羽衣曲"],"tip":"「散序—中序—破」三段，散序器乐、中序歌唱、破舞蹈。","extra":true,"syl":true,"sylNote":"考纲列燕乐大曲"},{"q":"谈谈中国古代中外音乐交流。","type":"论述","pts":["秦汉时张骞出使西域带回《摩诃兜勒》，丝绸之路开辟后胡笛、胡箜篌等乐器与杂伎乐舞传入，佛教音乐随佛教东传。","魏晋南北朝时天竺乐、龟兹乐传入，吕光得龟兹乐与中原乐舞融合成西凉乐；苏祗婆传入龟兹琵琶与「五旦七调」，催生八十四调。","隋唐是交流的高峰：多部乐中半数为西域乐部，日本先后派出遣隋使、遣唐使学习唐乐，鉴真东渡传播中国文化。","宋元明清继续交流：元代回回乐、伊斯兰音乐传入；明代利玛窦带来西洋乐器与乐理，唢呐、扬琴等乐器陆续传入中国。","中外音乐交流丰富了中国的乐器、乐曲、乐律与音乐机构，使中国古代音乐在吸收中不断发展，也把中国音乐传播到东亚与中亚。"],"keys":["丝绸之路","苏祗婆","多部乐","遣唐使","利玛窦"],"tip":"「秦汉开路、魏晋传律、隋唐高峰、明清西乐东来」四段推进。","extra":true,"syl":true,"sylNote":"考纲列丝绸之路、对外交流"},{"q":"简述隋唐时期的多部乐制度。","type":"简答","pts":["多部乐是隋唐宫廷燕乐中按乐舞来源与国别分部的乐舞体制，隋代颁「七部乐」，其后扩为「九部乐」。","唐代沿用九部乐，唐高宗时增至「十部乐」，加入高昌乐等西域乐部。","十部乐中半数以上为西域乐部，如龟兹、疏勒、高昌、安国、康国乐，体现多民族音乐并存。","多部乐以国名、地名分部，是宫廷宴享的乐舞节目单，也是唐代开放包容的文化象征。"],"keys":["多部乐","七部乐","九部乐","十部乐","高昌乐"],"tip":"「七→九→十」步步加，半数是西域乐部。","extra":true,"syl":true,"sylNote":"考纲列七部乐、九部乐、十部乐"},{"q":"论述隋唐时期燕乐艺术的发展。","type":"论述","pts":["燕乐即宴饮之乐，是隋唐宫廷宴享宾客时表演的歌舞音乐，也是隋唐音乐发展的主流。","多部乐由隋七部乐、九部乐发展至唐九部乐、十部乐，按国别、地域分部，半数以上为西域乐部。","唐玄宗时形成坐部伎与立部伎，按堂上坐奏、堂下立奏区分，标志燕乐向艺术化、精细化发展。","歌舞大曲、法曲与健舞、软舞兴盛，《霓裳羽衣曲》为代表，形成器乐、声乐、舞蹈高度综合的大型乐舞。","燕乐体系带动燕乐二十八调、教坊梨园等机构与乐调理论的发展，广泛吸收西域音乐，成为中国古代音乐的高峰。"],"keys":["燕乐","多部乐","二部伎","霓裳羽衣曲","燕乐二十八调"],"tip":"「多部乐→二部伎→大曲法曲→二十八调」四层递进。","extra":true,"syl":true,"sylNote":"考纲列燕乐、燕乐大曲等"}]},{"id":"cn07","num":"七","title":"宋元音乐","era":"960—1368","intro":"词乐、说唱、戏曲成熟，音乐重心由宫廷转向市井。","cards":[{"q":"姜夔与《白石道人歌曲》","type":"名词解释","pts":["南宋姜夔，号白石道人，词人兼作曲家。","《白石道人歌曲》存十七首旁谱，是现存最早的宋词乐谱。","自度曲：《扬州慢》《杏花天影》《暗香》《疏影》。","为研究宋代词乐提供珍贵实证。"],"keys":["姜夔","白石道人歌曲","自度曲","扬州慢"],"tip":"「十七首旁谱」是数字考点；自度曲举《扬州慢》。"},{"q":"《潇湘水云》","type":"名词解释","pts":["南宋郭沔（楚望）作，浙派古琴代表作。","借九嶷山云水缭绕之景，抒家国沦亡之痛。","技法上多用「吟猱」，意境深远。"],"keys":["潇湘水云","郭沔","浙派"],"tip":"人、派、情三点：郭沔、浙派、家国之痛。"},{"q":"宋元说唱音乐","type":"简答","pts":["鼓子词：以鼓伴奏，同一曲牌反复，赵令畤《商调蝶恋花》。","唱赚：张五牛创，集合多种曲牌，有「赚」的独特唱腔。","诸宫调：孔三传创，多宫调联缀说唱长篇故事，《西厢记诸宫调》。","货郎儿、陶真、涯词：市井说唱形式。"],"keys":["鼓子词","唱赚","诸宫调","孔三传","货郎儿"],"tip":"「鼓—赚—诸」三级递进，诸宫调最成熟，必举《西厢记》。"},{"q":"杂剧与南戏","type":"论述","pts":["杂剧：金元北方戏曲，四折一楔子，一人主唱，一宫到底。","关汉卿《窦娥冤》、王实甫《西厢记》、马致远《汉宫秋》。","南戏：温州杂剧，南方戏曲，结构灵活，多人分唱。","「四大传奇」：《荆钗记》《白兔记》《拜月亭》《杀狗记》。","元杂剧标志中国戏曲的成熟。"],"keys":["杂剧","四折一楔子","窦娥冤","南戏","四大传奇"],"tip":"「北杂剧严、南戏活」——结构对比是论述得分点。"},{"q":"散曲","type":"名词解释","pts":["元代兴盛，分小令与套数。","与杂剧合称「元曲」。","音乐上吸收民间曲调，语言通俗。"],"keys":["散曲","小令","套数","元曲"],"tip":"「小令短、套数长，合称元曲」。"},{"q":"蔡元定十八律","type":"名词解释","pts":["南宋蔡元定创，为解决旋宫转调问题。","在十二律基础上增加六个变律，共十八律。","使十二律各均都能构成完整的七声音阶。","是律学史上的重要成果。"],"keys":["蔡元定","十八律","变律"],"tip":"「十二加六变十八」，目的：各均成七声。"},{"q":"《海青拿天鹅》与奚琴","type":"简答","pts":["《海青拿天鹅》：元代琵琶曲，现存最早的琵琶独奏曲之一。","描绘海青（猎鹰）捕捉天鹅的场景，技法丰富。","奚琴：宋代拉弦乐器，二胡的前身。","反映器乐独立发展的趋势。"],"keys":["海青拿天鹅","奚琴","琵琶独奏"],"tip":"一曲一器：琵琶曲 + 奚琴（二胡前身）。"},{"q":"宋元音乐著作","type":"简答","pts":["陈旸《乐书》：中国第一部音乐百科全书式著作。","王灼《碧鸡漫志》：词乐研究。","朱长文《琴史》：第一部琴史专著。","《唐会要·乐类》、《事林广记》。","燕南芝庵《唱论》：演唱理论。"],"keys":["陈旸乐书","碧鸡漫志","琴史","唱论"],"tip":"「乐书百科、琴史首部、唱论唱法」三顶帽子。"},{"q":"宋代市民音乐","type":"论述","pts":["城市经济繁荣，出现「瓦舍」「勾栏」等固定演艺场所。","曲子词、说唱（鼓子词、唱赚、诸宫调）、杂剧、傀儡戏等在市井繁荣。","音乐重心由宫廷转向市民，音乐商品化、职业化。","为元杂剧与明清戏曲、说唱的发展奠定基础。"],"keys":["瓦舍","勾栏","曲子词","市民音乐"],"tip":"「瓦舍勾栏」是标志性名词；答题时点出「重心下移、商品化」两条。"},{"q":"唱赚","type":"名词解释","pts":["唱赚是宋代艺术歌曲的最高形式，由北宋说唱发展而来，所用音乐丰富、表演难度很大。","其曲式结构主要有缠令（引子加若干曲牌联缀再加尾声）与缠达（两曲交替循环）两种，均只能联缀同一宫调的曲牌。","南宋时出现了专门演唱唱赚的社团「遏云社」，说明其专业化程度之高。","唱赚的曲牌联缀体制对后世说唱、戏曲的音乐结构影响深远。"],"keys":["唱赚","缠令","缠达","遏云社","曲牌联缀"],"tip":"「缠令联套、缠达两曲交替，南宋遏云社专唱赚」。","extra":true,"syl":true,"sylNote":"考纲列唱赚"},{"q":"宋杂剧","type":"名词解释","pts":["宋杂剧是兴起于北方、北宋时已很流行的戏曲形式，是元杂剧的前身。","其表演结构由艳段（开场小戏）、正杂剧（表演完整故事）、散段（又称杂扮，滑稽表演）三部分组成。","内容上分以对白为主的滑稽戏和以歌舞为主的歌舞戏两类。","已形成付净、付末、孤、旦等固定角色行当，音乐使用曲牌，为元杂剧的成熟奠定基础。"],"keys":["宋杂剧","艳段","正杂剧","散段","角色行当"],"tip":"「艳段—正杂剧—散段」三段演，付净付末孤旦四个行当。","extra":true,"syl":true,"sylNote":"考纲列杂剧"},{"q":"简述曲牌联缀特征及运用。","type":"简答","pts":["曲牌联缀体又称曲牌体，是以曲牌为基本单位按一定顺序连缀成套的音乐结构。","常见形式有缠令（引子加若干曲牌再加尾声）与缠达（两曲交替循环），二者可混合使用。","联缀通常受宫调限制，同一套数多在同一宫调内进行，形成「一宫到底」的套曲。","它广泛运用于诸宫调、元杂剧、南戏及说唱，元杂剧一本四折、一折用同一宫调的曲牌联缀，是宋元以后戏曲说唱最主要的音乐结构。"],"keys":["曲牌联缀","缠令","缠达","宫调","元杂剧"],"tip":"「引子—曲牌—尾声」串成套，一宫到底；元杂剧一折一套。","extra":true,"syl":false,"sylNote":"考纲未列曲牌联缀"},{"q":"宋元时期市民音乐兴起的社会背景及其对音乐形态的影响。","type":"论述","pts":["宋代商品经济繁荣、城市发展，市民阶层壮大，出现瓦子、勾栏等固定的商业演出场所，音乐主流由宫廷燕乐转向市民音乐。","歌曲方面，曲子、唱赚、散曲兴盛，唱赚成为宋代艺术歌曲的最高形式，并有遏云社等专业社团。","说唱方面，鼓子词、诸宫调、陶真、货郎儿、涯词等新形式大量涌现，题材贴近市民生活。","戏曲方面，宋杂剧与南戏形成发展，把歌唱、说白、表演综合起来，成为市民音乐的重要载体。","市民音乐的兴起使音乐走向世俗化、商品化与专业化，戏曲与说唱成为此后中国音乐的中心，为元明清戏曲的繁荣奠定基础。"],"keys":["市民音乐","瓦子勾栏","唱赚","诸宫调","宋杂剧"],"tip":"「经济→市民→瓦舍→说唱戏曲」一条因果链。","extra":true,"syl":true,"sylNote":"考纲列唱赚、诸宫调等"},{"q":"《瑟谱》（仅华师）","type":"名词解释","pts":["《瑟谱》是宋末元初学者熊朋来编撰的瑟谱，共六卷，是现存较早的瑟乐文献。","全书收录《诗经》等诗乐作品，注明瑟的弦位、指法与唱词，供弦歌之用。","它保存了宋代诗乐的演唱与瑟伴唱形式，是研究古代诗乐与瑟演奏的重要资料。","该书体现了元代对先秦雅乐的追慕，对后世诗乐复兴有影响。"],"keys":["瑟谱","熊朋来","诗乐","瑟","元代"],"tip":"「熊朋来《瑟谱》——六卷诗乐，瑟伴弦歌」。（讲义未展开）","extra":true,"syl":false,"sylNote":"考纲未列《瑟谱》"},{"q":"简述宋元时期说唱音乐。","type":"简答","pts":["鼓子词以同一曲牌反复演唱，说唱相间，篇幅短小，代表有赵令畤《商调蝶恋花鼓子词》。","诸宫调以多种宫调的曲牌联缀成大型套曲，说唱长篇故事，代表为董解元《西厢记诸宫调》。","陶真与涯词是民间说唱形式，多为七字句，流行于南宋城市。","货郎儿由叫卖声发展而来，唱赚则是宋代艺术歌曲的最高形式，这些说唱形式为元杂剧、南戏提供了音乐与叙事基础。"],"keys":["鼓子词","诸宫调","陶真","货郎儿","唱赚"],"tip":"「鼓子词短、诸宫调大、陶真涯词民间、货郎儿叫卖」。","extra":true,"syl":true,"sylNote":"考纲列鼓子词、诸宫调等"},{"q":"简述宋元戏曲。","type":"简答","pts":["宋元戏曲有杂剧与南戏两大体系：杂剧兴起于北方，北宋已流行，元代达到高峰。","元杂剧结构为一本四折加楔子，一人主唱，音乐属曲牌体、一折用同一宫调，代表关汉卿《窦娥冤》、王实甫《西厢记》。","南戏兴起于南宋温州一带，结构灵活、角色众多、曲牌联缀自由，代表「四大南戏」与高明《琵琶记》。","杂剧与南戏的成熟标志中国戏曲的正式形成，为明清传奇与四大声腔的发展奠定基础。"],"keys":["杂剧","南戏","关汉卿","琵琶记","曲牌体"],"tip":"「杂剧一折一宫调、南戏灵活多角色」——宋元两大体系。","extra":true,"syl":true,"sylNote":"考纲列杂剧、南戏"},{"q":"《唱论》","type":"名词解释","pts":["《唱论》是元代燕南芝庵撰写的歌唱理论著作，是我国古代研究歌唱艺术较为全面的理论著作。","全书论述歌唱的气息、咬字、行腔、音色与风格，并涉及宫调与曲牌演唱的要求。","它总结了宋元说唱、戏曲的演唱经验，提出「声要圆熟、腔要彻满」等要求。","《唱论》是研究中国古代声乐艺术的重要文献，对后世戏曲演唱理论影响深远。"],"keys":["唱论","燕南芝庵","元代","歌唱理论","宫调"],"tip":"「元代燕南芝庵《唱论》——古代最全的唱法书」。","extra":true,"syl":true,"sylNote":"考纲列《唱论》"}]},{"id":"cn08","num":"八","title":"明清音乐","era":"1368—1911","intro":"戏曲声腔更迭、说唱繁盛、朱载堉十二平均律领先世界。","cards":[{"q":"明清民歌与歌舞","type":"简答","pts":["民歌小曲兴盛，《山歌》《挂枝儿》等集子出现。","歌舞：秧歌、花鼓、采茶广泛流行。","少数民族音乐：新疆木卡姆、西藏囊玛与堆谐。"],"keys":["山歌","挂枝儿","木卡姆","囊玛","堆谐"],"tip":"「汉地小曲、南北歌舞、边疆三类」。"},{"q":"明清说唱音乐","type":"简答","pts":["弹词：南方说唱，琵琶、三弦伴奏，苏州弹词为代表。","鼓词：北方说唱，以鼓板击节，发展为京韵大鼓。","京韵大鼓：刘宝全改革定型。","牌子曲、道情、琴书等遍布各地。"],"keys":["弹词","鼓词","京韵大鼓","刘宝全"],"tip":"「南弹北鼓」，再记一个代表人物刘宝全。"},{"q":"四大声腔","type":"名词解释","pts":["明代戏曲四大声腔：海盐腔、余姚腔、弋阳腔、昆山腔。","昆山腔经魏良辅改革，形成「水磨调」，即昆曲。","汤显祖《牡丹亭》为昆曲代表作。","昆曲被誉为「百戏之祖」。"],"keys":["海盐腔","余姚腔","弋阳腔","昆山腔","魏良辅"],"tip":"「海余弋昆」四字；改革者魏良辅、水磨调必写。"},{"q":"乱弹、梆子腔与皮黄腔","type":"简答","pts":["清代「花雅之争」，花部（乱弹）兴起，雅部（昆曲）衰落。","梆子腔：源于秦腔，板腔体，胡琴伴奏，高亢激越。","皮黄腔：西皮与二黄，为京剧音乐基础。","板腔体逐渐取代曲牌体成为戏曲音乐主流。"],"keys":["花雅之争","梆子腔","皮黄腔","板腔体"],"tip":"「花雅之争」是明清戏曲的分水岭，务必点出。"},{"q":"明清器乐","type":"简答","pts":["乐种：西安鼓乐、福建南音、十番锣鼓。","古琴流派：浙派、虞山派（严澂《松弦馆琴谱》）、广陵派（徐常遇）。","名曲：《平沙落雁》《十面埋伏》。"],"keys":["西安鼓乐","福建南音","虞山派","广陵派","平沙落雁"],"tip":"「三大乐种、三大琴派、两首名曲」。"},{"q":"朱载堉「新法密率」","type":"名词解释","pts":["明代朱载堉创，即十二平均律，见《律学新说》《律吕精义》。","以算盘计算 2 的十二次方根，求出等比律。","1584 年提出，早于欧洲约半个世纪。","是世界律学史上的重大贡献。"],"keys":["朱载堉","新法密率","十二平均律","1584"],"tip":"人、名、年、义四项；「早于欧洲半世纪」是采分句。"},{"q":"明清重要曲谱","type":"简答","pts":["《神奇秘谱》：朱权编，现存最早的琴谱集。","《九宫大成南北词宫谱》：1746 年，规模最大的曲谱集。","《纳书楹曲谱》《弦索备考》《魏氏乐谱》。","《华秋苹琵琶谱》：第一部琵琶谱。","《南北十三套大曲琵琶新谱》。"],"keys":["神奇秘谱","九宫大成","华秋苹琵琶谱"],"tip":"「最早琴谱、最大曲谱、最早琵琶谱」三顶帽子。"},{"q":"工尺谱","type":"名词解释","pts":["以「上、尺、工、凡、六、五、乙」记音的唱名谱。","明清最通行的记谱法，由管色谱发展而来。","广泛应用于戏曲、器乐、说唱。"],"keys":["工尺谱","上尺工凡六五乙"],"tip":"七字谱字按序背，别写成「合四一上尺工凡」。"},{"q":"利玛窦与明清中外音乐交流","type":"简答","pts":["利玛窦 1601 年进京，献古钢琴（大键琴）。","唢呐、扬琴等乐器陆续传入。","西方乐理随传教士进入中国。","中西音乐交流进入新阶段。"],"keys":["利玛窦","古钢琴","唢呐","扬琴"],"tip":"「一琴两器」：古钢琴 + 唢呐、扬琴。"},{"q":"《溪山琴况》","type":"名词解释","pts":["明末虞山派琴家徐上瀛著，古琴美学专著。","仿司空图《二十四诗品》，提出琴乐「二十四况」。","以「和」为总纲，讲求清、微、淡、远，是虞山派美学的总结。","与《乐记》《声无哀乐论》并称中国古代三大音乐美学著作。"],"keys":["溪山琴况","徐上瀛","二十四况","虞山派"],"tip":"「徐上瀛、二十四况、虞山派」三件套；三大美学著作之一。"},{"q":"简述昆曲「水磨腔」的改革内容。","type":"简答","pts":["水磨腔是明代魏良辅改革昆山腔后形成的新唱腔，因曲调细腻婉转如「水磨」而得名。","魏良辅融合海盐腔、弋阳腔及北曲的演唱技法，在唱法上强调吐字、过腔、收音。","改革后的新腔轻柔婉转、一唱三叹，并丰富了笛、琵琶等伴奏，音乐表现力大大增强。","昆山腔由此从地方土戏发展为全国性声腔，成为昆曲的基础，被誉为「百戏之祖」。"],"keys":["水磨腔","魏良辅","昆山腔","吐字收音","四大声腔"],"tip":"「魏良辅+吐字过腔收音=水磨腔」，昆山腔由此称霸全国。","extra":true,"syl":false,"sylNote":"考纲仅列四大声腔"},{"q":"明清戏曲声腔的演变及其历史意义。","type":"论述","pts":["明前期形成海盐、余姚、弋阳、昆山四大声腔，其中昆山腔经魏良辅改革为水磨腔，风靡全国。","明代昆曲兴盛，汤显祖《临川四梦》等传奇把曲牌体戏曲推向高峰。","明末清初梆子腔兴起，以板式变化体取代曲牌联缀，音乐更灵活、戏剧性更强。","清代皮黄腔形成，西皮、二黄结合，为京剧的形成奠定基础。","乾隆年间「花雅之争」后，花部（梆子、皮黄）取代雅部昆曲成为主流，中国戏曲音乐完成由曲牌体向板腔体的转变。"],"keys":["四大声腔","魏良辅","梆子腔","皮黄腔","花雅之争"],"tip":"「四大声腔→昆曲→梆子→皮黄→花雅之争」，一条线走完明清戏曲。","extra":true,"syl":true,"sylNote":"考纲列四大声腔、梆子腔"},{"q":"论述中国民间歌曲的发展。","type":"论述","pts":["先秦时期，《诗经》中的《国风》与《楚辞》的《九歌》保存了最早的民歌，题材广泛、句式自由，是民歌传统的源头。","汉魏时期，乐府广泛采集民歌，相和歌与清商乐（吴歌、西曲）成为民歌发展的两大系统，并推动歌舞大曲的形成。","隋唐时期，曲子盛行，多为长短句、可即兴填词，是汉魏乐府民歌的延续，也是宋代曲子的直接前身。","宋元时期，曲子、小唱、散曲发达，民歌与说唱、戏曲相互吸收，市民阶层成为民歌的主要受众。","明清时期，民歌小曲（时调、小令、杂曲）繁荣，出现《霓裳续谱》《白雪遗音》等民歌集，木卡姆、囊玛、堆谐等少数民族民歌也被记录整理。"],"keys":["诗经国风","乐府","相和歌","曲子","明清小曲"],"tip":"「诗经—乐府—曲子—小唱—明清小曲」五段一条线。","extra":true,"syl":true,"sylNote":"考纲列民间歌曲"},{"q":"十二平均律","type":"名词解释","pts":["十二平均律是把一个八度均分为十二个相等半音的律制，明代朱载堉在《律学新说》《律吕精义》中提出，称「新法密率」。","他以2开十二次方求得相邻两律的长度比值，是世界上最早对十二平均律的成功计算。","它解决了三分损益律「仲吕不能还生黄钟」的缺陷，使自由旋宫转调成为可能。","新法密率是中国律学史与世界律学史上的重大成就，为近现代音乐实践提供了律制基础。"],"keys":["十二平均律","朱载堉","新法密率","旋宫转调","律学"],"tip":"「朱载堉+2的12次方根+新法密率」——世界最早的十二平均律。","extra":true,"syl":true,"sylNote":"考纲作新法密率"},{"q":"《弦索备考》","type":"名词解释","pts":["《弦索备考》是清嘉庆十九年（1814年）蒙古族文人荣斋抄编的器乐合奏曲谱，又名《弦索十三套》。","全书收录十三套弦索合奏曲，用琵琶、弦子（三弦）、筝、二胡四件乐器演奏。","除总谱外，四种乐器均有分谱，以工尺谱记写，保存了清代民间器乐合奏的原貌。","它是现存重要的弦索乐器合奏谱集，对研究传统器乐与合奏技法具有珍贵价值。"],"keys":["弦索备考","荣斋","弦索十三套","工尺谱","器乐合奏"],"tip":"「荣斋+十三套+四件乐器（琵琶三弦筝二胡）」。","extra":true,"syl":true,"sylNote":"考纲列《弦索备考》"},{"q":"简述南词北鼓。","type":"简答","pts":["南词指南方的弹词，以苏州为中心，用琵琶、小三弦伴奏，讲究说、噱、弹、唱，代表为苏州弹词。","北鼓指北方的鼓词，以北京、山东为中心，用大三弦与鼓板伴奏，唱腔高亢，代表为京韵大鼓。","二者一南一北各成一派：弹词细腻委婉，鼓词刚健豪放，语言、伴奏与唱腔均因地域而异。","南词北鼓是明清说唱艺术的两大系统，对近代曲艺与戏曲的发展影响深远。"],"keys":["南词","北鼓","弹词","鼓词","京韵大鼓"],"tip":"「南弹词、北鼓词，小三弦对大三弦」。","extra":true,"syl":true,"sylNote":"考纲列弹词、鼓词"},{"q":"举例 3 首琵琶曲。","type":"简答","pts":["《十面埋伏》是琵琶武曲代表作，描绘楚汉垓下之战，运用轮指、扫弦等技法渲染激烈的战争场面。","《霸王卸甲》同为武曲，从项羽视角写垓下别姬，音乐悲壮苍凉，与《十面埋伏》形成对照。","《月儿高》是琵琶文曲代表，旋律典雅清丽，描绘月夜景色，意境优美。","《海青拿天鹅》是元代已有记载的琵琶武曲，以琵琶模拟海青与天鹅搏斗的声响，技术性很强。"],"keys":["十面埋伏","霸王卸甲","月儿高","海青拿天鹅","文武曲"],"tip":"「武曲十面埋伏、霸王卸甲；文曲月儿高；元曲海青拿天鹅」。","extra":true,"syl":true,"sylNote":"考纲列琵琶音乐、《十面埋伏》"},{"q":"简述明清时期古琴流派。","type":"简答","pts":["浙派古琴源于南宋郭楚望，明清仍有传承，其演奏讲究流畅清越，代表琴谱有《神奇秘谱》所收曲目。","虞山派以严澂《松弦馆琴谱》、徐上瀛《溪山琴况》为代表，主张「清微淡远」，强调琴乐的气韵与意境。","广陵派以徐常遇《澄鉴堂琴谱》、徐祺《五知斋琴谱》为代表，风格绮丽细腻、跌宕多变。","三派各具特色，推动古琴演奏与琴学理论的发展，使古琴成为明清文人音乐的核心。"],"keys":["浙派","虞山派","广陵派","溪山琴况","松弦馆琴谱"],"tip":"「浙派清越、虞山清微淡远、广陵绮丽细腻」——三派三风格。","extra":true,"syl":true,"sylNote":"考纲列浙派、虞山派、广陵派"},{"q":"简述昆山腔。","type":"简答","pts":["昆山腔是元末明初产生于江苏昆山一带的戏曲声腔，为明代四大声腔之一。","明代魏良辅对它进行系统改革，融合海盐、弋阳及北曲唱法，创「水磨腔」，曲调细腻婉转。","梁辰鱼以昆山腔创作《浣纱记》，使昆曲与传奇结合，风靡全国。","昆山腔成为明清传奇的主要声腔，被誉为「百戏之祖」，对京剧等后世剧种影响深远。"],"keys":["昆山腔","魏良辅","水磨腔","浣纱记","四大声腔"],"tip":"「昆山腔→魏良辅水磨腔→梁辰鱼《浣纱记》」。","extra":true,"syl":false,"sylNote":"考纲仅列四大声腔"},{"q":"囊玛","type":"名词解释","pts":["囊玛是流传于西藏地区的一种藏族歌舞音乐。","其初期演出形式主要是歌唱，伴奏乐器只有六弦琴；清代嘉庆年间传入洋琴、京胡、竹笛、串铃等，音乐更为丰富。","曲式结构常见有「引子—歌曲」「引子—舞曲」「引子—歌曲—舞曲」等几种。","歌唱时曲调典雅、节奏舒展，舞蹈时急速欢快、情绪奔放，歌舞两部分形成鲜明对比。"],"keys":["囊玛","藏族","歌舞音乐","六弦琴","引子"],"tip":"「藏族囊玛：引子+歌曲+舞曲，歌雅舞欢」。","extra":true,"syl":true,"sylNote":"考纲列囊玛"},{"q":"简述曲牌联缀。","type":"简答","pts":["曲牌联缀体又称曲牌体，是以曲牌为基本单位按一定顺序连缀成套的音乐结构。","常见形式有缠令（引子加若干曲牌再加尾声）与缠达（两曲交替循环），二者可混合使用。","联缀通常受宫调限制，同一套数多在同一宫调内进行，形成「一宫到底」的套曲。","它广泛运用于诸宫调、元杂剧、南戏与明清传奇，是戏曲、说唱最主要的音乐结构之一。"],"keys":["曲牌联缀","缠令","缠达","宫调","传奇"],"tip":"「引子—曲牌—尾声」串成套，一宫到底。","extra":true,"syl":false,"sylNote":"考纲未列曲牌联缀"}]},{"id":"cn09","num":"九","title":"清末民初音乐","era":"1840—1919","intro":"西乐东渐、学堂乐歌兴起，中国音乐近代转型的起点。","cards":[{"q":"学堂乐歌","type":"名词解释","pts":["清末新式学堂开设乐歌课，集体歌唱成为制度化的音乐教育。","多采用日本、欧美曲调重新填词，少量自创曲调。","代表人物：沈心工、李叔同、曾志忞。","标志中国近代音乐教育与群众歌咏的开端。"],"keys":["学堂乐歌","沈心工","李叔同","曾志忞","填词"],"tip":"「旧曲填新词」是本质特征；三人名必写。"},{"q":"沈心工","type":"名词解释","pts":["学堂乐歌代表人物，被誉为「学堂乐歌之父」。","编《学校唱歌集》（1904），影响广泛。","代表作《体操—兵操》（《男儿第一志气高》）、《黄河》。","主张音乐教育面向大众、振奋国民精神。"],"keys":["沈心工","学校唱歌集","男儿第一志气高"],"tip":"「一书一歌一号」：唱歌集、兵操、乐歌之父。"},{"q":"李叔同","type":"名词解释","pts":["学堂乐歌代表人物，后出家为弘一法师。","《送别》采用奥德威《梦见家和母亲》曲调填词，传唱至今。","《春游》为三部合唱，中国最早的合唱作品之一。","1906 年创办《音乐小杂志》，中国第一份音乐刊物。"],"keys":["李叔同","送别","春游","音乐小杂志"],"tip":"三件套：送别、春游、音乐小杂志（1906）。"},{"q":"曾志忞","type":"简答","pts":["学堂乐歌代表人物、音乐理论译介者。","编《乐典教科书》《教育唱歌集》。","组织「音乐讲习会」，推动乐理普及。"],"keys":["曾志忞","乐典教科书","音乐讲习会"],"tip":"「曾译书、办讲习」——理论一侧的代表。"},{"q":"清末民初的其他音乐成果","type":"简答","pts":["《和平进行曲》（赵元任，1915）：中国第一首钢琴曲。","《行路难》（李四光，1920）：中国第一首小提琴曲。","狄就烈《乐法启蒙》：早期乐理教材。","伶工学社（南通，张謇、欧阳予倩）：戏曲改良实践。","王国维《宋元戏曲史》：戏曲史学的奠基之作。"],"keys":["和平进行曲","行路难","乐法启蒙","伶工学社","宋元戏曲史"],"tip":"两个「第一」：钢琴《和平进行曲》、小提琴《行路难》。"},{"q":"清末民初的音乐思想","type":"论述","pts":["改良与启蒙：以音乐「新民」，梁启超提倡小说戏曲的社会功能。","美育：蔡元培「以美育代宗教」，把音乐纳入教育体系。","国粹与西化之争：既学习西方，又整理国乐。","为五四以后专业音乐的发展做了思想准备。"],"keys":["美育","以美育代宗教","新民","国粹"],"tip":"三条线：启蒙、美育、中西之争。"},{"q":"伶工学社","type":"名词解释","pts":["伶工学社是1919年由张謇创办于江苏南通的中国第一所新型戏曲学校。","它突破旧科班制，实行文化课与戏曲专业并重的现代教育模式，由欧阳予倩主持教务。","办学宗旨是「改良旧戏，培养新才」，开创了戏曲教育现代化的先河。","它对近代京剧及戏曲音乐的规范化教学产生了深远影响。"],"keys":["伶工学社","张謇","欧阳予倩","南通","戏曲教育"],"tip":"「张謇创办、欧阳予倩主持、南通第一所新型戏曲学校」。","extra":true,"syl":true,"sylNote":"考纲列伶工学社"},{"q":"中国近代新音乐兴起的历史背景及其早期实践。","type":"论述","pts":["背景上，鸦片战争后西方音乐随传教士、新式军队和学堂传入中国，维新变法主张开办新式学堂，留学日本的学生带回新的音乐知识与技能。","早期实践以学堂乐歌为中心：沈心工、李叔同、曾志忞等依曲填词，编写《黄河》《春游》《送别》等乐歌，在学校中集体歌唱。","乐歌活动采用简谱、五线谱，出版《音乐小杂志》，举办音乐讲习会，狄就烈《乐法启蒙》等教材传播了西洋乐理。","早期实践还包括军乐队、铜管乐队与教会音乐活动，为中国培养了第一批新式音乐人才。","学堂乐歌运动使音乐教育进入学校体系，为20世纪20年代专业音乐教育与创作奠定了基础。"],"keys":["学堂乐歌","沈心工","李叔同","西方音乐传入","音乐教育"],"tip":"「西乐东传→学堂乐歌→沈李曾填词→音乐教育立基」。","extra":true,"syl":true,"sylNote":"考纲列学堂乐歌、西方音乐传入"},{"q":"河南坠子","type":"名词解释","pts":["河南坠子是清末民初形成的说唱曲种，由河南道情与「颖歌柳」「三弦书」等合流而成。","它以坠胡为主要伴奏乐器，歌唱性较强，唱腔富于地方色彩。","曲目内容富有生活气息，多取材于民间故事与日常生活。","河南坠子流行于河南及周边地区，是近代北方说唱的重要曲种。"],"keys":["河南坠子","坠胡","道情","说唱","河南"],"tip":"「道情+颖歌柳+三弦书=河南坠子，主奏坠胡」。","extra":true,"syl":false,"sylNote":"考纲未列河南坠子"},{"q":"简述「美育代宗教」。","type":"简答","pts":["「美育代宗教」是蔡元培1917年提出的教育主张，认为美育可以取代宗教的教化功能，陶冶人的高尚情感。","他主张以音乐、美术等艺术教育培养国民的审美与道德，使情感得到净化与提升。","这一思想推动了北京大学音乐研究会（蔡元培任会长）、中华美育会等社团的建立，形成「艺术教育化」的实践。","它促使音乐教育进入国民教育体系，是清末民初音乐思想中最具影响力的命题之一。"],"keys":["美育代宗教","蔡元培","音乐教育","北京大学音乐研究会","艺术教育化"],"tip":"「蔡元培：以美育代宗教→音乐进课堂」。","extra":true,"syl":true,"sylNote":"属考纲清末民初音乐思想"},{"q":"试论西方音乐对中国近代音乐发展的影响，并列举两个例子。","type":"论述","pts":["西方音乐随传教士、新式军队与学堂传入中国，简谱、五线谱、集体歌唱与西洋乐器逐渐普及，催生了学堂乐歌。","专业音乐教育由此建立：北京大学音乐传习所、上海国立音乐院及国立音专培养出萧友梅、黄自、贺绿汀等第一代专业音乐家。","作曲技法上，中国作曲家学习和声、复调、曲式与配器，赵元任、黄自等把西洋技法与民族音调结合，形成「中国派」风格。","器乐领域出现钢琴、小提琴、管弦乐创作，如贺绿汀《牧童短笛》、马思聪小提琴曲、黄自《怀旧》序曲。","西方音乐还带来新的音乐观念与美育思想，引发「全盘西化」与「国乐改进」的论争，推动中国传统音乐的改良与近代新音乐体系的形成。"],"keys":["学堂乐歌","专业音乐教育","作曲技法","中国派","国乐改进"],"tip":"「乐谱、教育、技法、器乐、观念」五个层面的影响，各配一例。","extra":true,"syl":true,"sylNote":"考纲列西方音乐的传入"}]},{"id":"cn10","num":"十","title":"二十世纪二十年代音乐","era":"1919—1929","intro":"专业音乐教育建立、艺术歌曲与国乐改进并起。","cards":[{"q":"萧友梅","type":"名词解释","pts":["中国专业音乐教育的奠基人。","1927 年创办上海国立音乐院（后改国立音乐专科学校）。","代表作《问》（易韦斋词）、《新霓裳羽衣舞》。","主张「以西乐为参照，建立中国专业音乐教育体系」。"],"keys":["萧友梅","上海国立音乐院","问"],"tip":"「1927 上音」是必背年份事件。"},{"q":"赵元任","type":"名词解释","pts":["语言学家、作曲家，中国艺术歌曲的奠基者。","《新诗歌集》：中国第一部个人艺术歌曲集，收《教我如何不想他》《卖布谣》等。","《教我如何不想他》（刘半农词）、《海韵》（合唱）、《卖布谣》。","注重汉语声调与旋律的结合，追求「依字行腔」。","把民族语言韵味带入艺术歌曲创作。"],"keys":["赵元任","教我如何不想他","新诗歌集","海韵","依字行腔"],"tip":"「语言学家的作曲家」——声调与旋律结合是关键评价。"},{"q":"黎锦晖","type":"名词解释","pts":["儿童歌舞剧的开创者。","作品《麻雀与小孩》《小小画家》《可怜的秋香》。","中国流行音乐的先驱（《毛毛雨》）。","作品通俗、贴近儿童生活，影响广泛。"],"keys":["黎锦晖","儿童歌舞剧","麻雀与小孩","毛毛雨"],"tip":"「儿童歌舞剧之父 + 流行乐先驱」双重身份。"},{"q":"刘天华","type":"论述","pts":["二胡、琵琶演奏家、作曲家、教育家。","十首二胡曲：《病中吟》《月夜》《苦闷之讴》《悲歌》《良宵》《闲居吟》《空山鸟语》《光明行》《独弦操》《烛影摇红》。","1927 年发起「国乐改进社」，主张「从东西调和与合作中打出一条新路」。","把二胡从民间乐器提升到专业独奏地位。"],"keys":["刘天华","十首二胡曲","国乐改进社","良宵","光明行"],"tip":"十曲至少记「病、月、苦、悲、良、闲、空、光、独、烛」。"},{"q":"王光祈","type":"名词解释","pts":["音乐学家，比较音乐学的先驱。","《东西乐制之研究》《东方民族之音乐》《中国音乐史》。","旅居德国，用比较方法研究世界音乐。","为中国音乐学引入现代学术方法。"],"keys":["王光祈","东西乐制之研究","比较音乐学"],"tip":"「三书一学」：三本著作 + 比较音乐学。"},{"q":"二十年代的音乐社团与机构","type":"简答","pts":["北京大学音乐研究会（1919，蔡元培支持）。","大同乐会（1920，郑觐文）——整理国乐、改良乐器。","北京大学附设音乐传习所（1922，萧友梅）。","上海工部局乐队（梅百器）——中国最早的职业交响乐团之一。"],"keys":["北大音乐研究会","大同乐会","音乐传习所","工部局乐队","梅百器"],"tip":"按「北大—大同—传习所—工部局」时间顺序记。"},{"q":"早期的中国音乐史著作","type":"简答","pts":["叶伯和《中国音乐史》（1922）：中国第一部中国音乐史。","郑觐文《中国音乐史》。","顾梅羹《中国音乐史》。","童斐《中乐寻源》。"],"keys":["叶伯和","郑觐文","顾梅羹","童斐","中乐寻源"],"tip":"「叶第一」——1922 叶伯和，务必记牢。"},{"q":"二十年代的革命音乐","type":"简答","pts":["《国际歌》：瞿秋白 1923 年译配。","《赤潮曲》：瞿秋白作词作曲。","工农革命歌曲在根据地传唱。","音乐开始与革命运动结合。"],"keys":["国际歌","瞿秋白","赤潮曲"],"tip":"「瞿秋白两首歌」：译《国际歌》、写《赤潮曲》。"},{"q":"大同乐会","type":"名词解释","pts":["大同乐会是1920年由郑觐文发起于上海的重要民族器乐社团。","它以「复兴雅乐、中西合璧」为宗旨，致力于古乐器的研制改良与古乐的改编演奏。","乐会组建新型民族管弦乐队，柳尧章等把琵琶曲《夕阳箫鼓》改编为合奏曲《春江花月夜》。","大同乐会推动了国乐的整理与改良，是近代民族管弦乐事业的先声。"],"keys":["大同乐会","郑觐文","春江花月夜","国乐改良","上海"],"tip":"「郑觐文+上海+《春江花月夜》改编」。","extra":true,"syl":true,"sylNote":"考纲列大同乐会"},{"q":"简述二胡音乐创作。","type":"简答","pts":["刘天华创作十首二胡曲，如《病中吟》《良宵》《空山鸟语》《光明行》《烛影摇红》，把二胡从民间伴奏乐器提升为独奏乐器。","他改进二胡的演奏技法与记谱，编写练习曲、灌录唱片并举办独奏音乐会，推动二胡进入专业音乐教育。","华彦钧（阿炳）留下《二泉映月》《听松》等二胡名曲，以民间音乐语言展现深沉的人生感慨。","近代二胡音乐由此形成专业创作与民间传统两条脉络，并为建国后刘文金等作曲家的二胡创作奠定基础。"],"keys":["刘天华","二泉映月","华彦钧","二胡独奏","光明行"],"tip":"「刘天华十首+阿炳《二泉映月》」——二胡从伴奏到独奏。","extra":true,"syl":true,"sylNote":"考纲列刘天华及十首二胡曲"},{"q":"《可怜的秋香》","type":"名词解释","pts":["《可怜的秋香》是黎锦晖1921年创作的儿童歌舞表演曲，是他儿童歌舞音乐的代表作之一。","作品写牧羊女秋香自幼失去父母、饱受苦难的身世，以朴素的语言表达对弱者的同情。","旋律采用民族音调，歌词通俗，适合儿童演唱与表演，体现黎锦晖「平民音乐」的主张。","它与《麻雀与小孩》《小小画家》等共同开创了中国儿童歌舞音乐，影响深远。"],"keys":["可怜的秋香","黎锦晖","儿童歌舞","民族音调","平民音乐"],"tip":"「黎锦晖写牧羊女秋香」——儿童歌舞音乐的开山之作。","extra":true,"syl":true,"sylNote":"考纲列《可怜的秋香》"}]},{"id":"cn11","num":"十一","title":"二十世纪三十年代音乐","era":"1930—1939","intro":"救亡歌咏高涨、学院派成熟、中国歌剧开始探索。","cards":[{"q":"抗日救亡歌咏运动","type":"名词解释","pts":["九一八事变后兴起的群众歌咏运动。","左翼音乐家联盟等组织推动，歌曲成为救亡武器。","代表：聂耳、冼星海、任光、张曙、张寒晖。","群众歌咏遍及全国，是中国近代音乐史上规模最大的音乐运动。"],"keys":["救亡歌咏","左翼","聂耳","冼星海"],"tip":"「九一八起、群众唱、救亡用」三句。"},{"q":"萧友梅与上海国立音乐院","type":"简答","pts":["1927 年创办，1929 年改组为「国立音乐专科学校」。","设理论作曲、声乐、钢琴、管弦等组。","培养贺绿汀、冼星海、丁善德、江定仙等。","是中国专业音乐教育的摇篮。"],"keys":["国立音专","1927","贺绿汀","丁善德"],"tip":"「1927 建、1929 改、四组设」。"},{"q":"黄自","type":"论述","pts":["作曲家、音乐教育家，学院派代表。","《长恨歌》：中国第一部清唱剧。","《玫瑰三愿》《抗敌歌》《旗正飘飘》《点绛唇》。","任教国立音专，培养大批作曲人才。"],"keys":["黄自","长恨歌","玫瑰三愿","清唱剧"],"tip":"「第一部清唱剧《长恨歌》」是最高频考点。"},{"q":"青主","type":"名词解释","pts":["作曲家、音乐美学家。","《大江东去》（苏轼词）：中国第一首艺术歌曲。","《我住长江头》。","著作《乐话》《音乐通论》，带表现主义美学倾向。"],"keys":["青主","大江东去","我住长江头","乐话"],"tip":"「两歌两书」；第一首艺术歌曲是《大江东去》。"},{"q":"齐尔品与中国风味钢琴曲","type":"名词解释","pts":["俄裔作曲家齐尔品 1934 年在上海「征求有中国风味的钢琴曲」。","贺绿汀《牧童短笛》获头奖，《摇篮曲》获名誉奖。","推动中国钢琴音乐的民族化创作。","是中国钢琴作品走向世界的起点。"],"keys":["齐尔品","牧童短笛","贺绿汀","中国风味"],"tip":"「齐尔品征稿、牧童短笛夺魁」。"},{"q":"三十年代的其他作曲家与作品","type":"简答","pts":["刘雪庵《长城谣》。","陈田鹤《采桑曲》。","江文也《台湾舞曲》。","任光《渔光曲》，张寒晖《松花江上》。"],"keys":["长城谣","台湾舞曲","渔光曲","松花江上"],"tip":"「一谣一曲一舞一歌」四件作品对号入座。"},{"q":"聂耳与冼星海","type":"论述","pts":["聂耳：《义勇军进行曲》《毕业歌》《铁蹄下的歌女》《卖报歌》。","聂耳的音乐短小精悍、节奏有力，塑造劳动者与战斗者形象。","冼星海：《黄河大合唱》（光未然词）、《在太行山上》《救国军歌》。","《黄河大合唱》是中国近代合唱艺术的里程碑。"],"keys":["聂耳","义勇军进行曲","冼星海","黄河大合唱"],"tip":"「聂短促有力、冼宏大史诗」——风格对比。"},{"q":"三十年代歌剧艺术的探索","type":"简答","pts":["《扬子江暴风雨》（聂耳）。","《观音》《王昭君》《岳飞》《荆轲》《孟姜女》。","《农村曲》《军民进行曲》《大地之歌》《秋子》。","多尝试中西结合，尚未形成成熟范式。"],"keys":["扬子江暴风雨","秋子","农村曲","歌剧探索"],"tip":"记「聂耳一部 + 秋子一部」即可撑起简答。"},{"q":"外国音乐家与中国音乐社团","type":"简答","pts":["梅百器：指挥上海工部局乐队。","查哈罗夫：钢琴教育家。","阿隆·阿甫夏洛穆夫：创作《北平胡同》等中国题材作品。","齐尔品：推动中国风味钢琴曲。","中华口琴会、今虞琴社（1936）等社团活跃。"],"keys":["梅百器","查哈罗夫","阿甫夏洛穆夫","今虞琴社"],"tip":"「一指挥、一钢琴、一作曲、一征稿」。"},{"q":"刘雪庵","type":"名词解释","pts":["刘雪庵是中国近代作曲家、音乐教育家，黄自「四大弟子」之一。","其创作以旋律优美、情感真挚著称，兼擅艺术歌曲、抗战歌曲与电影音乐，是近代「雅俗兼善」的典型。","艺术歌曲《红豆词》以《红楼梦》词为词，旋律婉转、情感含蓄，是近代抒情艺术歌曲的典范。","抗战歌曲《长城谣》苍凉悲壮，与《红豆词》的婉约形成鲜明对照，另有《流亡三部曲》。","电影音乐为十余部影片配乐，《何日君再来》流传极广；钢琴曲《中国组曲》是较早以西方复调写中国风格的作品。"],"keys":["刘雪庵","红豆词","长城谣","四大弟子","何日君再来"],"tip":"「一婉约一悲壮」——《红豆词》对《长城谣》。","extra":true},{"q":"陈田鹤","type":"名词解释","pts":["陈田鹤是中国近代作曲家，黄自「四大弟子」之一，是中国艺术歌曲领域「学者型创作」的代表。","其创作质量极高，风格朴实、素材精炼、结构严谨，富于民族色彩。","艺术歌曲《山中》《枫桥夜泊》以清新雅致的风格与精致和声著称，歌词多取古典诗词，音乐与诗词意境高度融合。","另有《讴歌》《春归何处》等艺术歌曲及少量器乐作品。","他长期从事音乐教育，培养了不少音乐人才，是黄自弟子中走得最早的一位。"],"keys":["陈田鹤","山中","枫桥夜泊","四大弟子","黄自"],"tip":"「《山中》《枫桥夜泊》」——清冷空灵是陈田鹤的标签。","extra":true},{"q":"任光","type":"名词解释","pts":["任光是中国近代作曲家，左翼音乐运动的主要骨干，以电影歌曲创作著称。","他早年曾在法国学习钢琴修理与作曲，回国后任百代唱片公司音乐部主任，创作歌曲四十余首，多为电影歌曲。","《渔光曲》旋律抒情委婉、带有民族风格，是 30 年代电影歌曲的名作。","随救亡运动高涨，其风格转向雄壮坚毅，作《打回老家去》《大地行军曲》，并写民族器乐曲《彩云追月》。","抗战期间他在新加坡、法国等地从事抗日音乐活动，对扩大抗战歌曲的国际影响贡献很大，后牺牲于皖南事变。"],"keys":["任光","渔光曲","打回老家去","彩云追月","左翼音乐"],"tip":"「前期《渔光曲》抒情、后期《打回老家去》雄壮」——风格转折最好记。","extra":true},{"q":"张寒晖","type":"名词解释","pts":["张寒晖是中国近代作曲家，救亡歌曲创作的重要代表，与麦新等同为救亡歌咏作曲家群的骨干。","代表作《松花江上》以东北流亡者的口吻哭诉山河沦丧，旋律悲怆，是抗战歌曲中流传最广的作品之一。","他长期从事教育与民众宣传，作品多取材现实苦难，语言朴素、情感真挚。","其创作体现了救亡歌咏「为大众而歌」的方向，与聂耳、冼星海等人的群众歌曲共同构成 30 年代音乐的主流。"],"keys":["张寒晖","松花江上","救亡歌曲","流亡"],"tip":"「《松花江上》即张寒晖」一对一指认（讲义未直接展开）。","extra":true},{"q":"江文也","type":"名词解释","pts":["江文也是中国近现代作曲家，祖籍福建、生于台湾，13 岁赴日本学习，是近代具国际声誉的作曲家。","其创作受齐尔品「用 20 世纪技法写有民族内涵的音乐」的思想影响，1934 至 1937 年连续在日本音乐比赛中获奖。","成名作《台湾舞曲》是标题性幻想音诗，用自由体回旋奏鸣曲式，融入十二音技法与巴托克式手法，织体清淡、配器洗练。","管弦乐有《孔庙大成乐章》《北京点描》《第一交响曲》《第二交响曲——北京》，另有歌剧《香妃传》、歌舞剧《大地之歌》。","声乐套曲《台湾山地同胞歌》以高山族民歌为素材，钢琴伴奏用对位并模仿笛声、琴声与舞步。","他一生致力中西音乐融合，创作跨越台湾、日本、大陆三地，是中国现代音乐的重要先驱。"],"keys":["江文也","台湾舞曲","孔庙大成乐章","台湾山地同胞歌","中西融合"],"tip":"「一舞一曲一乐章」——《台湾舞曲》《台湾山地同胞歌》《孔庙大成乐章》。","extra":true},{"q":"郑律成","type":"名词解释","pts":["郑律成是朝鲜族作曲家，1937年奔赴延安，是延安时期革命音乐的重要骨干之一。","代表作有《延安颂》《延水谣》以及《八路军大合唱》，其中《八路军军歌》《八路军进行曲》流传极广。","他与冼星海、吕骥、马可、安波等共同构成延安音乐创作的中坚力量。","《八路军进行曲》后发展成为《中国人民解放军军歌》，其作品气势雄壮、富于战斗性。"],"keys":["郑律成","延安颂","八路军大合唱","八路军进行曲","延安音乐"],"tip":"「延安颂、八路军进行曲」——朝鲜族作曲家郑律成。","extra":true,"syl":false,"sylNote":"考纲未列郑律成"},{"q":"简述贺绿汀的音乐创作。","type":"简答","pts":["贺绿汀是30年代学院派作曲家，黄自的学生，创作涉及钢琴、歌曲、电影音乐、合唱与器乐多个领域。","钢琴曲《牧童短笛》1934年在齐尔品「征求有中国风味的钢琴曲」中获一等奖，标志中国钢琴创作进入新阶段。","歌曲《游击队歌》《嘉陵江上》流传极广，是抗战音乐的代表作。","他为电影《马路天使》配乐，写出《天涯歌女》《四季歌》，其创作把民族音调与西方技法结合，风格质朴而富于个性。"],"keys":["贺绿汀","牧童短笛","游击队歌","嘉陵江上","马路天使"],"tip":"「牧童短笛+游击队歌+天涯歌女」——贺绿汀三张名片。","extra":true,"syl":true,"sylNote":"考纲列贺绿汀《牧童短笛》"},{"q":"列举 3 个音乐社团。","type":"简答","pts":["大同乐会：1920年郑觐文创办于上海，致力于国乐整理与改良，改良乐器并编配《春江花月夜》。","国乐改进社：1927年刘天华等创办于北京，出版《音乐杂志》，主张从东西调和合作中打出一条新路。","今虞琴社：1936年查阜西等创办于苏州、上海，整理琴谱、复兴古琴，是近代最有影响的琴社。","此外还有北京大学音乐研究会、中华美育会等，共同推动国乐改进与新音乐的发展。"],"keys":["大同乐会","国乐改进社","今虞琴社","郑觐文","刘天华"],"tip":"「上海大同乐会、北京国乐改进社、苏州今虞琴社」三地三社。","extra":true,"syl":true,"sylNote":"考纲列音乐社团、大同乐会等"},{"q":"列举 5 首近代合唱作品。","type":"简答","pts":["《黄河大合唱》（冼星海，1939）是近代最著名的合唱作品，共八个乐章，气势磅礴。","黄自的《抗敌歌》《旗正飘飘》是学院派爱国合唱的代表，写于九一八、一·二八事变之后。","冼星海的《救国军歌》《在太行山上》《到敌人后方去》流传极广，兼具战斗性与抒情性。","贺绿汀的《游击队歌》是近代流传最广的合唱曲之一。"],"keys":["黄河大合唱","抗敌歌","旗正飘飘","游击队歌","在太行山上"],"tip":"「黄河、抗敌、旗正飘飘、游击队、太行山」五首记牢。","extra":true,"syl":false,"sylNote":"考纲仅列《黄河大合唱》"},{"q":"例举 5 部近代合唱曲。","type":"简答","pts":["《黄河大合唱》（冼星海，1939）是近代最著名的合唱作品，共八个乐章，气势磅礴。","黄自的《抗敌歌》《旗正飘飘》是学院派爱国合唱的代表，写于九一八、一·二八事变之后。","冼星海的《救国军歌》《在太行山上》《到敌人后方去》流传极广，兼具战斗性与抒情性。","贺绿汀的《游击队歌》是近代流传最广的合唱曲之一，另有黄自清唱剧《长恨歌》等大型合唱作品。"],"keys":["黄河大合唱","抗敌歌","旗正飘飘","游击队歌","在太行山上"],"tip":"「黄河、抗敌、旗正飘飘、游击队、太行山」五首。","extra":true,"syl":false,"sylNote":"考纲仅列《黄河大合唱》"},{"q":"列举 5 首艺术歌曲。","type":"简答","pts":["青主的《大江东去》以苏轼词谱曲，是中国最早的艺术歌曲之一；《我住长江头》以李之仪词表达深切思念。","黄自的《玫瑰三愿》《春思曲》《思乡》以钢琴与声乐合作、和声色彩变化刻画形象，意境情景交融。","赵元任的《教我如何不想他》借鉴京剧音调，是中国艺术歌曲的经典；《海韵》为大型合唱曲。","萧友梅《问》等也属近代艺术歌曲的代表作，这些作品把西方作曲技法与中国诗词、民族音调结合。"],"keys":["大江东去","玫瑰三愿","教我如何不想他","青主","黄自"],"tip":"「青主《大江东去》、黄自《玫瑰三愿》、赵元任《教我如何不想他》」。","extra":true,"syl":true,"sylNote":"考纲列《大江东去》等"},{"q":"《乐话》","type":"名词解释","pts":["《乐话》是青主（廖尚果）1930年出版的音乐美学著作，与《音乐通论》并称中国近代最早系统阐述音乐美学的专著。","全书以书信体写成，主张音乐是「上界的语言」，是表现人的心灵与情感的最高艺术。","它强调音乐的表现性与独立性，反对把音乐当作政治或礼教的工具。","《乐话》奠定了中国近代音乐美学的理论基础，对后世音乐美学研究影响深远。"],"keys":["乐话","青主","音乐美学","上界的语言","音乐通论"],"tip":"「青主《乐话》：音乐是上界的语言」——近代音乐美学开山。","extra":true,"syl":true,"sylNote":"考纲列《乐话》"},{"q":"简述 5 首抗日救亡歌咏。","type":"简答","pts":["聂耳《义勇军进行曲》原为电影《风云儿女》主题歌，旋律昂扬，后成为中华人民共和国国歌。","张寒晖《松花江上》以悲愤的音调诉说东北沦陷的苦难，传唱极广。","麦新《大刀进行曲》节奏铿锵，表现军民抗击日寇的斗志。","冼星海《救国军歌》《在太行山上》与贺绿汀《游击队歌》等也都是抗日救亡歌咏的代表作。"],"keys":["义勇军进行曲","松花江上","大刀进行曲","救国军歌","游击队歌"],"tip":"「聂耳、张寒晖、麦新、冼星海、贺绿汀」——五首救亡歌。","extra":true,"syl":true,"sylNote":"考纲列抗日救亡歌曲"},{"q":"简述左翼音乐运动的历史意义。","type":"简答","pts":["左翼音乐运动是20世纪30年代以上海为中心、由左翼文化运动推动的革命音乐运动，骨干有聂耳、任光、张曙、吕骥等。","它把音乐与民族救亡、工农大众结合起来，创作了大量电影歌曲与群众歌曲，如《义勇军进行曲》《毕业歌》《渔光曲》。","左翼音乐家深入工厂、学校开展歌咏活动，使群众歌咏成为抗日救亡的重要形式。","它奠定了中国革命音乐的传统，为全面抗战时期的救亡歌咏运动与延安音乐运动准备了队伍与经验。"],"keys":["左翼音乐运动","聂耳","田汉","救亡歌咏","群众歌曲"],"tip":"「上海左翼+聂耳田汉+救亡歌咏」——革命音乐的开端。","extra":true,"syl":true,"sylNote":"属考纲30年代音乐思想"},{"q":"《牧童短笛》","type":"名词解释","pts":["《牧童短笛》是贺绿汀1934年创作的钢琴曲。","它在齐尔品「征求有中国风味的钢琴曲」比赛中获头奖，是中国钢琴音乐史上的重要事件。","作品以五声性旋律与模仿复调写成，描绘牧童骑牛吹笛、悠然自得的田园景象，风格清新质朴。","它的问世标志中国钢琴音乐创作进入新的历史阶段，是民族风格钢琴曲的开山之作。"],"keys":["牧童短笛","贺绿汀","齐尔品","钢琴曲","民族风格"],"tip":"「1934齐尔品头奖+五声旋律+田园牧童」。","extra":true,"syl":true,"sylNote":"考纲列《牧童短笛》"}]},{"id":"cn12","num":"十二","title":"二十世纪四十年代音乐","era":"1940—1949","intro":"延安文艺方向确立、民族新歌剧诞生、戏曲曲艺繁荣。","cards":[{"q":"马思聪","type":"名词解释","pts":["小提琴家、作曲家，中国小提琴音乐奠基人。","《思乡曲》《绥远组曲》（《内蒙组曲》）。","作品融合民歌素材与西方技法。","晚年旅居海外。"],"keys":["马思聪","思乡曲","绥远组曲"],"tip":"「小提琴 + 思乡曲」两个关键词。"},{"q":"谭小麟与丁善德","type":"简答","pts":["谭小麟：欣德米特弟子，作室内乐，技法现代。","丁善德：《春之旅》钢琴组曲、《长征交响曲》。","二人代表中国作曲技术的现代化探索。"],"keys":["谭小麟","欣德米特","丁善德","长征交响曲"],"tip":"「谭现代、丁交响」——师生两代的技术路线。"},{"q":"杨荫浏","type":"名词解释","pts":["音乐学家，中国民族音乐学的奠基人。","《中国音乐史纲》（1952）、《中国古代音乐史稿》（1981）。","抢救录制阿炳《二泉映月》等。","开创实地考察与文献互证的研究范式。"],"keys":["杨荫浏","中国古代音乐史稿","二泉映月"],"tip":"「史稿 + 阿炳」是杨荫浏的两个标签。"},{"q":"鲁艺、新音乐社与民间音乐研究","type":"简答","pts":["鲁迅艺术学院（1938，延安）：音乐系培养革命音乐干部。","新音乐社（1939，李凌、赵沨）：推动新音乐运动。","中国民间音乐研究会：系统采集民歌。","吕骥《中国民间音乐研究提纲》（1941）：民间音乐研究的纲领性文献。"],"keys":["鲁艺","新音乐社","吕骥","民间音乐研究提纲"],"tip":"「一院一社一会一提纲」。"},{"q":"延安文艺座谈会与秧歌运动","type":"论述","pts":["1942 年毛泽东《在延安文艺座谈会上的讲话》确立「文艺为工农兵服务」。","秧歌运动兴起，新秧歌《兄妹开荒》《夫妻识字》。","秧歌剧为民族新歌剧积累经验。","1945 年《白毛女》（马可等）诞生，标志民族新歌剧的成熟。"],"keys":["延安文艺座谈会","秧歌运动","兄妹开荒","白毛女"],"tip":"「讲话—秧歌—秧歌剧—白毛女」一条发展链。"},{"q":"四十年代的戏曲与曲艺","type":"简答","pts":["京剧「四大须生」：马连良、谭富英、杨宝森、奚啸伯。","京剧「四大名旦」：梅兰芳、程砚秋、尚小云、荀慧生。","越剧、黄梅戏等地方戏曲发展。","江南丝竹等器乐乐种繁荣。"],"keys":["四大须生","四大名旦","梅兰芳","越剧","黄梅戏"],"tip":"须生四人「马谭杨奚」，名旦四人「梅程尚荀」。"},{"q":"华彦钧与广东音乐","type":"简答","pts":["华彦钧（阿炳）：《二泉映月》《听松》《寒春风曲》。","广东音乐：《步步高》《雨打芭蕉》《赛龙夺锦》。","潮州音乐与潮州大锣鼓、汉剧汉乐、客家山歌、雷剧。","体现岭南音乐的丰富生态。"],"keys":["华彦钧","二泉映月","步步高","广东音乐","潮州大锣鼓"],"tip":"「一盲人、一乐种」：阿炳 + 广东音乐。"},{"q":"李凌","type":"名词解释","pts":["李凌是中国近代音乐评论家、音乐活动家，新音乐运动的重要组织者之一。","抗战时期他任教于陶行知创办的重庆育才学校音乐组，与贺绿汀、任光、黎国荃等共同培养音乐人才。","他与赵沨等创办并主持《新音乐》月刊、组织新音乐社，推动国统区的进步音乐活动与音乐评论。","其乐评关注音乐的大众化与民族化，主张音乐为抗战、为民众服务。","新中国成立后他长期担任中央乐团团长等职，著有《音乐艺术漫谈》。"],"keys":["李凌","新音乐","育才学校","音乐评论"],"tip":"「李凌、赵沨 = 《新音乐》双主编」（讲义仅提及育才任教，其余按通行教材补）。","extra":true},{"q":"赵沨","type":"名词解释","pts":["赵沨是中国近代音乐评论家、音乐教育家、音乐活动家。","抗战时期他与李凌等创办《新音乐》月刊、组织新音乐社，是国统区进步音乐运动的核心人物之一。","他长期从事音乐评论与音乐理论研究，关注音乐的民族形式与大众化方向。","新中国成立后他历任中央音乐学院院长、音乐出版社社长等职，对中国专业音乐教育与音乐出版影响深远。"],"keys":["赵沨","新音乐","中央音乐学院","音乐评论"],"tip":"「李凌编刊、赵沨掌院」——一刊一校（讲义未直接展开）。","extra":true},{"q":"杨仲子","type":"名词解释","pts":["杨仲子是中国近代音乐教育家、篆刻家，中国专业音乐教育的早期开拓者之一。","1920 年代他任教于国立北京女子高等师范学校音乐科与北京大学附设音乐传习所，教授钢琴，与萧友梅、刘天华等共事。","他参与了中国最早一批由国家兴办的高等音乐系科的建设，是北方专业音乐教育的重要奠基者。","抗战时期他曾任国立音乐院院长，主持战时音乐人才的培养。","其篆刻与书法亦享盛名，是近代少有的兼通音乐与金石艺术的学者型教育家。"],"keys":["杨仲子","音乐传习所","钢琴","国立音乐院","音乐教育"],"tip":"「北方音教奠基 + 国立音乐院院长」（讲义仅提及他任钢琴教师）。","extra":true},{"q":"吴伯超","type":"名词解释","pts":["吴伯超是中国近代作曲家、指挥家、音乐教育家，中国合唱与交响乐指挥事业的先驱之一。","他早年任教于上海国立音乐专科学校，教授合唱与指挥，是国立音专的教学骨干。","1943 年他接任重庆青木关国立音乐院院长，抗战胜利后主持国立音乐院复员南京。","他创办国立音乐院幼年班，从儿童中选拔培养管弦乐后备人才，为中国交响乐事业储备了骨干。","1949 年他赴台途中因轮船失事遇难，中国近代专业音乐教育由此失去一位重要的组织者。"],"keys":["吴伯超","国立音乐院","幼年班","合唱指挥"],"tip":"「院长 + 幼年班 + 遇难」三事记一人（讲义仅提及他教合唱）。","extra":true},{"q":"简述近代小提琴音乐创作。","type":"简答","pts":["近代小提琴音乐以马思聪为代表，他20世纪三四十年代的创作奠定了中国小提琴音乐的基础。","马思聪的作品大多采用民歌素材写成，具有浓郁的中国风格，如《思乡曲》《内蒙组曲》《牧歌》等。","他从小提琴的艺术规律出发进行创作，注重发挥小提琴演奏技巧，并使小提琴与钢琴伴奏共同构思。","此外冼星海等作曲家也有小提琴作品问世，共同开启了中国小提琴专业创作的道路。"],"keys":["马思聪","思乡曲","民歌素材","小提琴","钢琴伴奏"],"tip":"「马思聪三四十年代+民歌素材+思乡曲」——中国小提琴的开端。","extra":true,"syl":false,"sylNote":"考纲未列小提琴音乐"},{"q":"简述近代传统音乐的发展。","type":"简答","pts":["戏曲方面，京剧经梅兰芳等「四大名旦」的改革走向成熟并影响世界，越剧、评剧等吸收新文化、新音乐成分获得较大发展。","说唱方面，京韵大鼓（刘宝全）、苏州弹词等在城市中繁荣，成为市民娱乐的重要形式。","器乐方面，刘天华改进二胡、琵琶并创立国乐改进社，华彦钧（阿炳）留下《二泉映月》等名作。","民间乐种方面，江南丝竹、广东音乐等继续发展，传统音乐在西方音乐冲击下呈现出改良与保存并行的格局。"],"keys":["京剧","梅兰芳","刘天华","二泉映月","广东音乐"],"tip":"「戏曲、说唱、器乐、乐种」四条线，各举一例即可成段。","extra":true,"syl":true,"sylNote":"考纲列京剧、江南丝竹等"},{"q":"新秧歌运动","type":"名词解释","pts":["新秧歌运动是1943年在延安兴起的群众性秧歌改革运动，以鲁迅艺术学院师生为骨干。","它用旧秧歌的形式表现新生活，创作了《兄妹开荒》等秧歌剧，使秧歌从民间歌舞变为戏剧化的综合艺术。","秧歌剧以旧秧歌的「小场子戏」为基础，吸收民歌、地方戏曲、民间歌舞、话剧、新舞蹈等因素综合而成。","新秧歌运动推动了文艺的大众化，为民族新歌剧《白毛女》的诞生奠定了基础。"],"keys":["新秧歌运动","延安","秧歌剧","兄妹开荒","白毛女"],"tip":"「1943延安+兄妹开荒+秧歌剧→白毛女」。","extra":true,"syl":true,"sylNote":"考纲列秧歌运动"},{"q":"论 20 世纪 30 至 40 年代中国音乐创作的主要成就及其历史意义。","type":"论述","pts":["抗日救亡歌咏成为时代主流，聂耳《义勇军进行曲》、冼星海《黄河大合唱》、张寒晖《松花江上》、任光《渔光曲》等唱响全国，激发民族救亡热情。","学院派创作走向成熟，黄自《长恨歌》《玫瑰三愿》，青主《大江东去》《我住长江头》，贺绿汀《牧童短笛》等体现专业作曲水平。","歌剧艺术开始探索，出现《扬子江暴风雨》《农村曲》《军民进行曲》《大地之歌》《秋子》《孟姜女》等作品。","器乐创作取得突破，马思聪的小提琴曲、丁善德的钢琴曲、江文也的管弦乐等拓展了中国的器乐领域。","延安根据地的音乐运动产生《白毛女》等民族新歌剧，形成革命音乐传统，为新中国的音乐发展奠定方向。"],"keys":["抗日救亡歌咏","黄河大合唱","贺绿汀","白毛女","学院派"],"tip":"「救亡歌咏、学院派、歌剧探索、器乐突破、延安新歌剧」五路并进。","extra":true,"syl":true,"sylNote":"考纲列抗日救亡歌曲等"},{"q":"吕文成","type":"名词解释","pts":["吕文成是广东音乐最杰出的代表人物，被誉为「广东音乐之王」。","他改良高胡形制，把丝弦改为钢弦并提高定弦，使高胡音色明亮清脆，确立了高胡在广东音乐中的主奏地位。","代表作有《步步高》《平湖秋月》《渔歌晚唱》等，旋律优美、流传极广。","他与何柳堂、严老烈等共同推动广东音乐在20世纪二三十年代走向繁荣。"],"keys":["吕文成","广东音乐之王","高胡","步步高","平湖秋月"],"tip":"「吕文成改高胡、写《步步高》」——广东音乐之王。","extra":true,"syl":false,"sylNote":"考纲仅列广东音乐"},{"q":"论述中国近现代传统音乐在西方音乐冲击下的生存与变革（可结合具体乐种与代表人物）。","type":"论述","pts":["近代西方音乐随传教士、学堂与新式军队传入，传统音乐面临前所未有的冲击，但戏曲、说唱、器乐等仍以改良方式延续。","戏曲方面，京剧经梅兰芳等「四大名旦」的改革走向成熟并影响世界，越剧、评剧等吸收新文化、新音乐成分获得较大发展，伶工学社开戏曲教育现代化先河。","说唱方面，京韵大鼓（刘宝全）、苏州弹词等在城市中繁荣，成为市民娱乐的重要形式。","器乐方面，刘天华改进二胡、琵琶并创立国乐改进社，华彦钧（阿炳）留下《二泉映月》，吕文成改良高胡使广东音乐风行，江南丝竹等乐种继续流传。","传统音乐一部分吸收新因素改良发展，一部分保持原貌传承，并成为近代新音乐创作的重要素材，构成中国音乐现代转型的底色。"],"keys":["京剧","梅兰芳","刘天华","二泉映月","广东音乐"],"tip":"「冲击—改良—保存」三条路，各举一个乐种一个人。","extra":true,"syl":true,"sylNote":"考纲列京剧、广东音乐等"},{"q":"简述京剧的形成及发展。","type":"简答","pts":["1790年乾隆八十大寿，四大徽班进京汇演，徽班与汉剧艺人频繁交流，形成「徽汉合流」。","京剧在徽汉合流基础上吸收昆腔、秦腔、南梆子、四平调等声腔，逐渐演变成全国性剧种。","唱腔以皮黄腔为主，即西皮与二黄的结合，角色分生、旦、净、丑四大行当。","程长庚、谭鑫培等推进京剧成熟，民国时期梅兰芳、尚小云、程砚秋、荀慧生「四大名旦」使其走向世界。"],"keys":["京剧","四大徽班","徽汉合流","皮黄腔","四大名旦"],"tip":"「徽班进京→徽汉合流→皮黄腔→四大名旦」。","extra":true,"syl":true,"sylNote":"考纲列京剧"},{"q":"简述近代器乐创作。","type":"简答","pts":["钢琴方面，贺绿汀《牧童短笛》在1934年获奖，标志中国钢琴创作的新阶段，丁善德《春之旅》、江文也的钢琴曲各有特色。","小提琴方面，马思聪以民歌素材创作《思乡曲》《内蒙组曲》等，奠定中国小提琴音乐的基础。","管弦乐方面，黄自《怀旧》序曲、冼星海《民族解放交响曲》等开始运用西方管弦乐形式表现中国题材。","民族器乐方面，刘天华的二胡曲、任光与聂耳的民乐合奏，推动传统器乐的现代化，近代器乐创作由此形成多元格局。"],"keys":["牧童短笛","马思聪","怀旧序曲","民族解放交响曲","民族器乐"],"tip":"「钢琴贺绿汀、小提马思聪、管弦黄自冼星海、民乐刘天华」四路。","extra":true,"syl":true,"sylNote":"考纲列马思聪、丁善德等"},{"q":"简述三首粤曲。","type":"简答","pts":["粤曲是流行于广东及港澳地区的曲艺形式，以梆子、二黄（梆黄）为主要唱腔，并吸收粤剧唱腔与广东音乐。","代表曲目有《帝女花》《客途秋恨》《昭君出塞》等，唱腔分平喉、子喉、大喉。","20世纪二三十年代粤曲进入歌坛、茶座，出现红线女「红腔」等流派，名家辈出。","粤曲与粤剧相互影响，是岭南音乐文化的代表，至今仍在粤港澳广泛传唱。"],"keys":["粤曲","帝女花","客途秋恨","红线女","梆黄"],"tip":"「《帝女花》《客途秋恨》《昭君出塞》」——粤曲三大名曲。（讲义未展开）","extra":true,"syl":true,"sylNote":"考纲列粤曲"},{"q":"简述中国近代新歌剧的发展。","type":"简答","pts":["20世纪30年代出现歌剧探索，代表作有《扬子江暴风雨》《农村曲》《军民进行曲》《大地之歌》《秋子》《孟姜女》等。","延安时期在秧歌运动基础上创作秧歌剧，为民族新歌剧积累了经验。","1945年《白毛女》问世，把民族民间音调与西洋歌剧形式结合，是中国新歌剧的第一个里程碑。","建国后又有《小二黑结婚》《洪湖赤卫队》《江姐》等作品，形成中国民族歌剧的传统。"],"keys":["新歌剧","白毛女","秧歌剧","民族歌剧","扬子江暴风雨"],"tip":"「30年代探索→秧歌剧→《白毛女》里程碑→建国后民族歌剧」。","extra":true,"syl":true,"sylNote":"考纲列《白毛女》"},{"q":"论述中国近代新音乐的发展。","type":"论述","pts":["清末民初为启蒙阶段，以学堂乐歌为中心，沈心工、李叔同、曾志忞依曲填词，传播西洋乐理与集体歌唱形式。","20世纪20年代进入初步发展阶段，萧友梅创办专业音乐教育，赵元任、刘天华、黎锦晖、王光祈分别在歌曲、二胡、儿童歌舞与音乐学领域开拓。","30年代抗日救亡歌咏成为主流，聂耳、冼星海、贺绿汀、黄自等创作大量群众歌曲、艺术歌曲与钢琴曲，学院派与革命音乐并行。","40年代延安音乐运动产生《黄河大合唱》《白毛女》等里程碑作品，马思聪、丁善德、谭小麟等在器乐与作曲技术上有新突破。","近代新音乐把西方技法与中国题材、民族音调结合，建立专业音乐教育与创作体系，为新中国音乐的发展奠定基础。"],"keys":["学堂乐歌","萧友梅","抗日救亡","白毛女","专业音乐教育"],"tip":"「清末启蒙→20年代奠基→30年代救亡→40年代高峰」四段式。","extra":true,"syl":true,"sylNote":"考纲列学堂乐歌、40年代创作"}]},{"id":"cn13","num":"十三","title":"新中国成立后至改革开放前","era":"1949—1978","intro":"专业音乐体系重建，红色经典与民族化创作的高峰。","cards":[{"q":"建国初期的音乐事业格局","type":"简答","pts":["群众歌咏、广播音乐、唱片出版迅速发展。","院系调整：中央音乐学院（1950）、上海音乐学院（1956）等建立。","成立民族音乐研究所，开展普查与整理。","音乐创作与政治运动紧密关联。"],"keys":["中央音乐学院","上海音乐学院","民族音乐研究所"],"tip":"「两院一所」+ 群众歌咏。"},{"q":"建国后至改革开放前的声乐作品","type":"简答","pts":["《歌唱祖国》（王莘）、《我的祖国》（刘炽）。","《我们走在大路上》《让我们荡起双桨》。","《长征组歌》（1965）。","合唱事业与群众歌咏相互推动。"],"keys":["歌唱祖国","我的祖国","长征组歌"],"tip":"「两歌一组歌」，作者王莘、刘炽。"},{"q":"建国后至改革开放前的歌剧与舞剧","type":"论述","pts":["歌剧《洪湖赤卫队》（1959）、《江姐》（1964）、《刘胡兰》。","舞剧《红色娘子军》（1964）、《白毛女》（1965）、《小刀会》。","民族歌剧在板腔体与西方歌剧结构间探索。","红色题材成为主流。"],"keys":["洪湖赤卫队","江姐","红色娘子军","白毛女"],"tip":"「两剧两舞」：洪湖、江姐、娘子军、白毛女。"},{"q":"建国后至改革开放前的器乐创作","type":"论述","pts":["小提琴协奏曲《梁祝》（何占豪、陈钢，1959）：越剧音调与奏鸣曲式结合。","钢琴协奏曲《黄河》（殷承宗等，1969）。","二胡《赛马》（黄海怀）、琵琶《彝族舞曲》（王惠然）。","「民族化」是核心命题：民歌、戏曲素材 + 西方体裁。"],"keys":["梁祝","何占豪","黄河协奏曲","赛马","彝族舞曲"],"tip":"《梁祝》= 越剧 + 奏鸣曲式，这句可作论述总纲。"},{"q":"戏曲现代化与「样板戏」","type":"简答","pts":["京剧现代戏《红灯记》《沙家浜》《智取威虎山》。","另有《海港》《奇袭白虎团》《杜鹃山》等。","唱腔、乐队、舞美全面改革，加用西洋乐器。","艺术上有创新，但创作被高度政治化。"],"keys":["红灯记","沙家浜","智取威虎山","样板戏"],"tip":"三出必记：《红灯记》《沙家浜》《智取威虎山》。"},{"q":"民族音乐研究与音乐考古","type":"简答","pts":["杨荫浏《中国古代音乐史稿》完成。","《中国民间歌曲集成》等「十大集成」启动。","1978 年曾侯乙编钟出土，引发音乐考古热潮。","传统音乐研究走向系统化。"],"keys":["音乐史稿","十大集成","曾侯乙编钟","音乐考古"],"tip":"「一史稿、一集成、一编钟」。"},{"q":"《长征组歌》","type":"名词解释","pts":["《长征组歌》是1965年为纪念红军长征胜利三十周年创作的大型合唱组歌，由肖华作词。","晨耕、生茂、唐诃、遇秋作曲，全曲共十首，包括《告别》《突破封锁线》《遵义会议放光辉》《过雪山草地》等。","作品吸收各地民歌与红军歌曲的音调，把朗诵、独唱、合唱与乐队结合，气势恢宏。","它是建国后合唱创作的代表作，体现革命历史题材与民族音乐形式相结合的时代风格。"],"keys":["长征组歌","肖华","十首","合唱组歌","革命历史题材"],"tip":"「肖华词、十首组歌、1965年」——建国后合唱代表作。","extra":true,"syl":false,"sylNote":"考纲仅列合唱代表作品"},{"q":"戏曲的现代戏创作及其改革。（仅华师）","type":"论述","pts":["新中国成立后推行「改戏、改人、改制」的戏曲改革，整理改编传统剧目，创作反映现实生活的现代戏。","现代戏创作以京剧《红灯记》《沙家浜》《智取威虎山》等为代表，一度形成「样板戏」的高潮；沪剧《芦荡火种》等也产生影响。","音乐改革上，现代戏创新板式与唱腔，加入西洋管弦乐队与和声配器，并运用人物主题音乐（主导动机）贯穿全剧。","舞剧方面出现民族芭蕾《红色娘子军》《白毛女》，把民族音调与芭蕾形式结合。","这些改革推动戏曲音乐现代化，扩大了戏曲的表现力，但也存在政治化、公式化的局限。"],"keys":["戏曲改革","现代戏","红灯记","样板戏","红色娘子军"],"tip":"「改戏改人改制→现代戏→样板戏→民族芭蕾」。","extra":true,"syl":true,"sylNote":"考纲列戏曲的现代化创作"},{"q":"《红灯记》／《红色娘子军》（二选一）（仅华师）","type":"名词解释","pts":["《红灯记》是1964年由中国京剧院排演的现代京剧，翁偶虹、阿甲等改编，写李玉和一家三代护送密电码的革命故事。","其音乐在传统皮黄唱腔基础上创新板式，加入西洋乐器伴奏，塑造出李玉和、李铁梅等人物形象。","《红色娘子军》是1964年首演的中国芭蕾舞剧，吴祖强、杜鸣心等作曲，以海南琼崖纵队女子军为题材。","它把民族音调与芭蕾形式结合，是「民族芭蕾」的代表作，二者均为戏曲、舞剧现代化的标志性作品。"],"keys":["红灯记","红色娘子军","现代京剧","民族芭蕾","样板戏"],"tip":"「现代京剧《红灯记》、民族芭蕾《红色娘子军》」——两个现代化样本。","extra":true,"syl":false,"sylNote":"考纲仅列戏曲现代化创作"}]},{"id":"cn14","num":"十四","title":"改革开放后音乐","era":"1978 至今","intro":"新潮音乐、流行音乐、影视音乐多元并进。","cards":[{"q":"「新潮音乐」","type":"名词解释","pts":["1980 年代兴起的现代作曲潮流。","代表：谭盾、瞿小松、叶小钢、郭文景、陈其钢。","借鉴西方现代技法（音块、微分音、偶然音乐），并融入中国素材。","标志中国当代作曲与国际接轨。"],"keys":["新潮音乐","谭盾","瞿小松","叶小钢","郭文景"],"tip":"五个人名 + 一句「现代技法 + 中国素材」。"},{"q":"谭盾","type":"名词解释","pts":["作曲家，新潮音乐代表人物。","《离骚》《九歌》《地图》《水乐》。","《卧虎藏龙》配乐获奥斯卡最佳原创配乐。","擅长以非常规音响与多媒体构建「有机音乐」。"],"keys":["谭盾","卧虎藏龙","地图","水乐"],"tip":"「一奖两作」：奥斯卡 + 《地图》《水乐》。"},{"q":"中国流行音乐的发展","type":"简答","pts":["1980 年代港台流行歌曲涌入内地。","内地流行音乐兴起，西北风、摇滚等潮流。","崔健《一无所有》（1986）标志中国摇滚的诞生。","流行音乐逐渐获得文化合法性。"],"keys":["港台流行","西北风","崔健","一无所有"],"tip":"「1986 崔健」是摇滚元年考点。"},{"q":"影视音乐","type":"简答","pts":["王立平：《红楼梦》（1987）配乐、《大海啊故乡》。","赵季平：《红高粱》《霸王别姬》配乐。","三宝等新一代影视音乐人。","影视音乐成为大众音乐生活的重要部分。"],"keys":["王立平","红楼梦","赵季平","红高粱"],"tip":"「王红楼、赵红高粱」——两人两作。"},{"q":"改革开放后的歌剧与舞剧","type":"简答","pts":["歌剧《原野》（金湘，1987）：走向国际。","舞剧《丝路花雨》（1979）：敦煌题材。","《木兰》等新编剧目。","创作观念由政治叙事转向人性与审美。"],"keys":["原野","金湘","丝路花雨"],"tip":"「一歌剧一舞剧」：原野、丝路花雨。"},{"q":"声乐与合唱的发展","type":"简答","pts":["艺术歌曲创作复兴。","合唱事业蓬勃发展，职业与业余合唱团并起。","青歌赛等赛事推动声乐人才成长。","民族唱法、美声唱法、流行唱法三足鼎立。"],"keys":["艺术歌曲","合唱","青歌赛","三种唱法"],"tip":"「三唱法」是声乐领域的常用概括。"},{"q":"简述电影音乐创作。","type":"简答","pts":["中国电影音乐随20世纪30年代有声电影的兴起而发展，聂耳、任光、贺绿汀是最早的开拓者。","任光为电影《渔光曲》写作同名主题歌，聂耳为《风云儿女》写《义勇军进行曲》、为《桃李劫》写《毕业歌》，贺绿汀为《马路天使》写《天涯歌女》《四季歌》。","建国后电影音乐走向专业化，出现大批电影歌曲与配乐；改革开放后影视音乐更加多样，流行、交响、民族风格并存。","影视音乐成为20世纪中国音乐传播最广的领域之一，推动了中国歌曲的大众化与专业化。"],"keys":["电影音乐","聂耳","任光","贺绿汀","影视音乐"],"tip":"「聂耳《义勇军进行曲》、任光《渔光曲》、贺绿汀《天涯歌女》」——三张电影名片。","extra":true,"syl":true,"sylNote":"考纲列影视音乐创作"}]},{"id":"cn15","num":"十五","title":"港澳台地区音乐","era":"20 世纪以来","intro":"岭南与海岛语境下的流行、国乐与专业创作。","cards":[{"q":"香港音乐","type":"简答","pts":["粤语流行曲在 1970—80 年代走向高峰。","代表创作者：顾嘉辉、黄霑。","香港中乐团（1977）推动中乐现代化。","影视主题曲与流行乐相互成就。"],"keys":["粤语流行曲","顾嘉辉","黄霑","香港中乐团"],"tip":"「辉黄组合 + 香港中乐团」。"},{"q":"台湾音乐","type":"简答","pts":["1970 年代校园民歌运动，提倡「唱自己的歌」。","许常惠等推动现代音乐创作与民族音乐研究。","台北市立国乐团等职业国乐团体。","流行音乐产业高度发达。"],"keys":["校园民歌","唱自己的歌","许常惠","台北市立国乐团"],"tip":"「民歌运动」口号「唱自己的歌」是标志。"},{"q":"澳门音乐","type":"简答","pts":["澳门中乐团等团体推动中乐普及。","澳门国际音乐节成为重要文化品牌。","中西交融是澳门音乐的底色。"],"keys":["澳门中乐团","澳门国际音乐节"],"tip":"「一团一节」即可。"},{"q":"20 世纪下半叶港澳台地区音乐。（仅华师）","type":"论述","pts":["香港音乐以流行音乐最为发达，20世纪70—80年代粤语流行曲风靡华语世界，同时中乐团、管弦乐团与音乐教育体系逐步建立。","台湾音乐在1970年代兴起校园民歌运动，推动原创流行音乐发展；国乐（国乐团）与现代音乐创作（如许常惠）并行，传统戏曲与歌仔戏得到保存。","澳门音乐体现中西交融，既有粤曲、南音等传统乐种，也有西式管弦乐与音乐节活动。","三地均重视传统音乐的传承与专业音乐教育，并与内地、海外保持密切的创作与演出交流。","港澳台音乐构成中国近现代音乐的重要一翼，其多元文化经验为中国音乐的现代化提供了参照。"],"keys":["粤语流行曲","校园民歌","国乐","中西交融","音乐教育"],"tip":"「香港流行、台湾民歌、澳门中西交融」三地各表。（讲义未展开）","extra":true,"syl":true,"sylNote":"考纲列港澳台地区的音乐"}]}]},{"part":"西方音乐史","short":"西","chapters":[{"id":"w01","num":"一","title":"古希腊与古罗马","era":"前12世纪—公元5世纪","intro":"西方音乐的观念源头：单音音乐、歌舞乐一体、理论先行。","cards":[{"q":"古希腊音乐的整体特征","type":"简答","pts":["歌舞乐三位一体：诗、歌、舞不可分。","单音音乐：单声部，齐唱或同度伴奏。","音乐与社会生活紧密：祭祀、戏剧、体育、教育。","理论成就突出：调式、音程、律学。"],"keys":["歌舞乐一体","单音音乐","调式"],"tip":"三点定性 + 一点理论，构成标准开头。"},{"q":"古希腊的音乐理论","type":"简答","pts":["四音音列：构成旋律的基本单位，下行排列。","大完美体系：由四音音列组合成的两八度音阶体系。","毕达哥拉斯：以数解释音程，提出五度相生与和谐论。","托勒密《和声学》：总结古希腊音乐理论。","三种主要调式：多利亚、弗里吉亚、利底亚。"],"keys":["四音音列","大完美体系","毕达哥拉斯","托勒密"],"tip":"「四音列→大完美→毕氏数论→托勒密」递进记。"},{"q":"古希腊的代表乐器","type":"简答","pts":["里拉琴（lyre）：弦乐器，阿波罗的象征，用于教育与祭祀。","基萨拉琴：里拉的大型化，用于专业演奏。","阿夫洛斯管（aulos）：双管吹奏乐器，狄奥尼索斯崇拜，戏剧中常用。"],"keys":["里拉琴","基萨拉琴","阿夫洛斯管"],"tip":"「阿波罗里拉、酒神阿夫洛斯」——神祇对应乐器。"},{"q":"古罗马音乐","type":"简答","pts":["继承希腊音乐，但更重实用与娱乐。","音乐用于军队、竞技、宴会，规模宏大。","水压风琴等大型乐器出现。","基督教音乐兴起，为中世纪圣咏埋下伏笔。"],"keys":["继承希腊","水压风琴","基督教音乐"],"tip":"「继承 + 世俗化 + 基督教兴起」三段论。"},{"q":"荷马史诗","type":"名词解释","pts":["《荷马史诗》是古希腊最早被记录下来的大型史诗，相传由盲诗人荷马编撰。","它以特洛伊战争为题材，把民间传唱的神话英雄叙事诗篇汇集整理而成，包括《伊利亚特》和《奥德赛》两部。","史诗采用扬抑抑格六音步诗行写作，节奏感强烈，由诗人自弹自唱，伴奏乐器为里拉琴。","它原以口口相传的方式流传，是古希腊诗歌与音乐相结合的重要代表。"],"keys":["荷马史诗","伊利亚特","奥德赛","里拉琴","六音步"],"tip":"盲诗人荷马把「伊利亚特+奥德赛」弹唱成诗——诗乐一体的开端。","extra":true,"syl":false,"sylNote":"考纲仅列叙事诗"},{"q":"四音音列","type":"名词解释","pts":["四音音列是古希腊理论家阿里斯多塞诺斯提出的音列理论，记载于《和谐与要素》。","它以固定的四度音程为框架，中间两个音的音高可以变化，从而形成自然音列、变化音列（半音）与微分音列三种。","若干四音音列组合起来可以构成完整音列体系，即「大完整音列体系」「小完整音列体系」。","四音音列是古希腊音阶与调式构成的基础，当时七声音阶尚未形成。"],"keys":["四音音列","阿里斯多塞诺斯","四度框架","三种音列","调式基础"],"tip":"「四度框、中间音变、三种列」——古希腊音阶的最小积木。","extra":true,"syl":false,"sylNote":"考纲未列四音音列"},{"q":"和谐论","type":"名词解释","pts":["和谐论是古希腊毕达哥拉斯学派以数解释音乐的理论，其核心主张是「一切皆数」。","学派通过实验发现：弦长比2:1得八度、3:2得纯五度、4:3得纯四度，简单的数量比例构成完美协和音程。","他们把八度、五度、四度视为协和音程，其余为不协和音程，并把这一原理推广到宇宙秩序，提出「天体的音乐」。","和谐论成为西方音乐理论的奠基石，后世乐理中纯一、四、五、八度的概念即源于此。"],"keys":["和谐论","毕达哥拉斯","一切皆数","协和音程","天体音乐"],"tip":"「2:1八度、3:2五度、4:3四度」——三组比例定和谐。","extra":true,"syl":false,"sylNote":"考纲未列和谐论"},{"q":"简述古希腊音乐的主要特征。","type":"简答","pts":["古希腊音乐与神话、宗教祭祀紧密相连，被视为通神、教化与医疗的手段。","音乐以单声部为主，音域较窄，旋律采用多种调式，并以字母谱记谱。","诗、乐、舞三位一体，音乐常与诗歌、舞蹈结合，歌词多取自荷马史诗、抒情诗等诗篇。","音乐具有强烈的社会功能，柏拉图、亚里士多德等认为音乐能教化品性、净化心灵。"],"keys":["单声部","诗乐舞一体","调式","字母谱","教化功能"],"tip":"「神话、单声、三位一体、多调式、重教化」五个关键词。","extra":true,"syl":true,"sylNote":"考纲要求各时期音乐特征"},{"q":"简述古希腊音乐理论的核心成就。","type":"简答","pts":["毕达哥拉斯学派提出「和谐论」，以2:1、3:2、4:3的弦长比例说明八度、五度、四度的协和关系，认为「一切皆数」。","阿里斯多塞诺斯提出四音音列理论，以固定四度框架内中间音的变化构成自然、变化、微分三种音列。","古希腊形成以氏族部落命名的调式体系，如多利亚、弗里几亚、利地亚及其副调式共七种。","记谱以字母谱为主，《塞基洛斯歌》墓志铭是现存最早、最完整的西方音乐实物。"],"keys":["和谐论","四音音列","古希腊调式","字母谱","塞基洛斯歌"],"tip":"「和谐论、四音列、七调式、字母谱」四件套。","extra":true,"syl":false,"sylNote":"考纲未列古希腊乐理"},{"q":"简述古希腊乐器。","type":"简答","pts":["古希腊乐器分弦乐与管乐两类，里拉琴与阿夫洛斯管分别是这两类乐器的代表。","里拉琴最早由龟壳张弦制成，有四根弦，音色柔和，用于敬奉太阳神阿波罗，后发展出七弦的基萨拉琴。","阿夫洛斯管是双管吹奏乐器，音色洪亮坚硬，用于敬奉酒神狄奥尼索斯，也用于悲剧与狂欢节。","两者分别象征理性与狂放，反映了古希腊人对音乐中数学性与艺术表现力的双重追求，也奠定了后世乐器分类的基础。"],"keys":["里拉琴","阿夫洛斯管","基萨拉琴","阿波罗","狄奥尼索斯"],"tip":"「里拉属阿波罗（理性）、阿夫洛斯属酒神（狂放）」——弦管两代表。","extra":true,"syl":false,"sylNote":"考纲未列古希腊乐器"},{"q":"简述和谐论。","type":"简答","pts":["和谐论是古希腊毕达哥拉斯学派以数解释音乐的理论，其核心主张是「一切皆数」。","学派通过实验发现：弦长比2:1得八度、3:2得纯五度、4:3得纯四度，简单的数量比例构成完美协和音程。","他们把八度、五度、四度视为协和音程，其余为不协和音程，并把这一原理推广到宇宙秩序，提出「天体的音乐」。","和谐论成为西方音乐理论的奠基石，后世乐理中的纯一、四、五、八度概念即由此而来。"],"keys":["和谐论","毕达哥拉斯","一切皆数","协和音程","天体音乐"],"tip":"「2:1八度、3:2五度、4:3四度」——三组比例定和谐。","extra":true,"syl":false,"sylNote":"考纲未列和谐论"},{"q":"简述古希腊音乐特征。","type":"简答","pts":["古希腊音乐与神话、宗教祭祀紧密相连，被视为通神、教化与医疗的手段。","音乐以单声部为主，音域较窄，旋律采用多种调式，并以字母谱记谱。","诗、乐、舞三位一体，歌词多取自荷马史诗、抒情诗等诗篇。","音乐具有强烈的社会功能，柏拉图、亚里士多德认为音乐能教化品性、净化心灵，其理论成为西方音乐理论的源头。"],"keys":["单声部","诗乐舞一体","调式","字母谱","教化功能"],"tip":"「神话、单声、三位一体、多调式、重教化」。","extra":true,"syl":true,"sylNote":"考纲要求各时期音乐特征"}]},{"id":"w02","num":"二","title":"中世纪音乐","era":"5—14世纪","intro":"格里高利圣咏一统，复调诞生，新艺术开启近代之门。","cards":[{"q":"中世纪音乐的分期与总体特征","type":"简答","pts":["早期（5—10 世纪）：教会音乐主导，单音圣咏。","中期（11—13 世纪）：复调产生，古艺术。","晚期（14 世纪）：新艺术，世俗音乐兴起。","总体：宗教音乐为中心，单声向复调过渡。"],"keys":["教会音乐","复调","古艺术","新艺术"],"tip":"「单—复—新」三阶段，一句一段。"},{"q":"格里高利圣咏","type":"名词解释","pts":["罗马教会仪式音乐，托名教皇格里高利一世。","单声部、无伴奏、拉丁文、男声演唱。","旋律平稳级进，风格肃穆，称「平旋律」。","用于日课与弥撒，采用教会调式。","是中世纪音乐的基础与后世创作的素材。"],"keys":["格里高利圣咏","单声部","无伴奏","拉丁文","教会调式"],"tip":"四要素「单、无、拉、男」+ 功能（日课弥撒）。"},{"q":"规多","type":"名词解释","pts":["中世纪音乐理论家，意大利阿雷佐的修士。","推行四线谱，使音高记录更精确。","创唱名法 ut、re、mi、fa、sol、la（六声音阶）。","编《交替圣歌集》，影响后世音乐教育。"],"keys":["规多","四线谱","唱名法","六声音阶"],"tip":"「四线谱 + 六声唱名」两大贡献。"},{"q":"复调音乐的诞生","type":"论述","pts":["奥尔加农：最早的复调形式，在圣咏下方加声部，初期平行进行。","第斯康特：声部进行反向、斜向，节奏更独立。","克劳苏拉：奥尔加农的段落，后独立成曲。","康杜克图斯：非圣咏定旋律的复调作品。","经文歌：13 世纪成熟，多声部、多歌词，复调音乐的典型体裁。"],"keys":["奥尔加农","第斯康特","克劳苏拉","康杜克图斯","经文歌"],"tip":"五个体裁按出现顺序背，经文歌是终点。"},{"q":"古艺术（Ars Antiqua）","type":"名词解释","pts":["12—13 世纪法国复调音乐，以巴黎圣母院乐派为中心。","莱奥南：编纂《大奥尔加农》（Magnus Liber Organi），收集并创作奥尔加农。","佩罗坦：发展三、四声部复调，节奏更活跃。","弗朗科：创立有量记谱法，使节奏时值可精确记录。"],"keys":["古艺术","莱奥南","佩罗坦","有量记谱法"],"tip":"「莱编、佩扩、弗记谱」——三人分工。"},{"q":"新艺术（Ars Nova）","type":"名词解释","pts":["14 世纪法国、意大利的新音乐风格。","马肖：《圣母弥撒》，现存最早的完整常规弥撒曲。","世俗歌曲：维勒莱、回旋歌、叙事歌。","兰迪尼：意大利代表，兰迪尼终止式。","记谱法革新，节奏更自由，世俗性增强。"],"keys":["新艺术","马肖","圣母弥撒","兰迪尼终止式"],"tip":"「马肖弥撒 + 兰迪尼终止」两个硬考点。"},{"q":"中世纪的世俗音乐","type":"简答","pts":["游吟诗人（法国南方）：贵族与骑士，用奥克语歌唱。","恋歌诗人（法国北方）：用奥依语，题材多爱情。","名歌手（德国）：市民行会歌手，重规则与技巧。","多为单声部歌曲，旋律来自民歌。"],"keys":["游吟诗人","恋歌诗人","名歌手"],"tip":"「南游吟、北恋歌、德名歌手」——地域对应。"},{"q":"莱奥南","type":"名词解释","pts":["莱奥南是 12 世纪巴黎圣母院乐派的复调作曲家，被称作「奥尔加农的最佳作者」（又译雷奥南）。","他编成《奥尔加农大全》，是 12 世纪圣母院二声部复调曲集，为应答圣咏与独唱段落配写复调。","他把华丽奥尔加农发展到顶峰，上方声部花唱流动，在教堂中形成空旷高耸的空间感。","其曲集后经佩罗坦修订增补，成为古艺术复调创作的基础文献。"],"keys":["莱奥南","巴黎圣母院乐派","奥尔加农大全","华丽奥尔加农"],"tip":"「莱编《大全》、佩修《大全》」——圣母院乐派两代接力。","extra":true},{"q":"佩罗坦","type":"名词解释","pts":["佩罗坦是巴黎圣母院乐派第二阶段的代表人物，被称为「迪斯康特的最佳作者」。","他对莱奥南《奥尔加农大全》进行修订增补，使曲集篇幅与声部编制进一步扩大。","他创作大量三声部、四声部复调作品，音响更丰满、节奏更活跃，使第斯康特手法趋于成熟。","他在节奏组织与声部写作上贡献突出，把古艺术复调推向高峰，为经文歌的成熟准备了条件。"],"keys":["佩罗坦","迪斯康特","三声部四声部","古艺术"],"tip":"「莱奥南编、佩罗坦扩」——声部由二扩到四。","extra":true},{"q":"马肖","type":"名词解释","pts":["马肖是 14 世纪法国作曲家、诗人，新艺术时期最杰出的音乐家，被誉为「中世纪最后一位伟大的诗人音乐家」。","《圣母弥撒》是西方音乐史上第一部由单一作曲家独立创作的完整常规弥撒套曲，含慈悲经至羔羊经五个乐章。","他运用等节奏技术把五个乐章统一为整体，确立了弥撒套曲的创作范式。","世俗音乐上大量创作叙事歌、回旋歌、维勒莱，把复调技法用于爱情题材，提升了世俗歌曲的艺术地位。","他首开作曲家自编作品全集的先河，创作兼具理性结构与细腻情感，是中世纪向文艺复兴过渡的关键人物。"],"keys":["马肖","圣母弥撒","等节奏","新艺术","叙事歌"],"tip":"「一部弥撒定范式，三种世俗歌开先河」——宗教、世俗两条腿。","extra":true},{"q":"兰迪尼","type":"名词解释","pts":["兰迪尼是 14 世纪意大利新艺术时期最重要的作曲家、管风琴家，意大利新艺术的集大成者。","他留存作品 154 首，其中 140 首为巴拉塔，把巴拉塔从民间舞曲提升为高度艺术化的复调歌曲。","他创立「兰迪尼终止式」：上方声部由导音下方邻音跳进导音再解决至主音，成为 14 至 16 世纪意大利音乐的标志性终止公式。","其旋律优美流畅，声部写作精致抒情，与法国马肖的创作形成南北呼应。"],"keys":["兰迪尼","巴拉塔","兰迪尼终止式","意大利新艺术"],"tip":"「一术语定终身」——西方音乐史上少有的以人名命名的终止式。","extra":true},{"q":"游吟诗人","type":"名词解释","pts":["游吟诗人是11—13世纪法国世俗方言歌曲的创作者与演唱者，其出现与十字军东征有关。","成员包括宫廷贵族、骑士以及有才华的下层诗人和音乐家，法国南部的称特罗巴多，北部的称特罗维尔。","他们自创诗歌、谱写曲调并亲自演唱，也常请流浪艺人代唱，歌曲多为单声，常加乐器伴奏即兴弹唱。","题材以爱情为主，「宫廷之恋」最为流行；南方歌曲旋律细腻精美、节奏自由，北方歌曲朴实规整。"],"keys":["游吟诗人","特罗巴多","特罗维尔","宫廷之恋","单声歌曲"],"tip":"「南特罗巴多、北特罗维尔，自弹自唱宫廷之恋」。","extra":true,"syl":false,"sylNote":"考纲未列游吟诗人"},{"q":"经文歌","type":"名词解释","pts":["经文歌是13世纪在克劳苏拉基础上发展起来的中世纪复调体裁，典型形式为三声部。","其前身克劳苏拉是替换圣咏的二声部复调片段，当上方声部被填入歌词后便成为经文歌。","上方两声部先唱拉丁文，后用法文方言，形成「复歌词」现象；下声部圣咏为拉丁文定旋律。","因方言加入，经文歌内容逐渐世俗化，音乐与歌词重心都在上方声部，有弗朗科经文歌、彼特罗经文歌等形式。"],"keys":["经文歌","克劳苏拉","三声部","复歌词","定旋律"],"tip":"「克劳苏拉+上方加词=经文歌」，三层歌词各唱各的。","extra":true,"syl":true,"sylNote":"考纲列经文歌"},{"q":"简述奥尔加农的几种发展形式。","type":"简答","pts":["早期为平行奥尔加农，附加声部与圣咏成四度、五度严格平行进行。","随后出现平行奥尔加农的变体：两声部同音斜向开始，进入四度后平行，最后汇合于同音。","自由或反向奥尔加农中反向、斜向进行增多，声部出现交错与超越，下方声部变得活跃。","华丽奥尔加农的附加声部转到上方，流动华丽，与下方缓慢的圣咏「持续声部」形成对比，圣咏由此成为tenor定旋律。"],"keys":["奥尔加农","平行","反向/自由","华丽奥尔加农","tenor"],"tip":"「平行→变体→自由反向→华丽」四步走，圣咏变tenor。","extra":true,"syl":true,"sylNote":"考纲列奥尔加农"},{"q":"等节奏","type":"名词解释","pts":["等节奏是14世纪「新艺术」时期的重要复调技法，马肖等作曲家广泛使用。","其做法是在定旋律声部预先设定反复的节奏型（talea）与音高型（color），二者按不同周期组合反复。","节奏型与音高型的错位循环使复调在统一之中产生变化，增强了作品的结构力。","它体现中世纪后期作曲的理性化倾向，是马肖《圣母弥撒》等作品的重要技术手段。"],"keys":["等节奏","新艺术","马肖","talea","color"],"tip":"「节奏型+音高型错位循环」——新艺术的等节奏。","extra":true,"syl":false,"sylNote":"考纲未列等节奏"},{"q":"简述中世纪世俗音乐。","type":"简答","pts":["拉丁歌曲方面有孔杜克图斯与戈利亚德歌曲，后者多由游荡诗人创作，内容涉及酒、爱情与讽刺。","法国游吟诗人是世俗方言歌曲的代表，南部称特罗巴多、北部称特罗维尔，以单声歌曲咏唱爱情。","德国有恋诗歌手，以「巴体歌曲」（aab）创作爱情歌曲；意大利有巴拉塔、劳达赞歌。","世俗音乐多为单声、用方言演唱、以爱情与生活为题材，常加乐器伴奏，与复调的宗教音乐形成鲜明对比。"],"keys":["游吟诗人","恋诗歌手","戈利亚德","单声歌曲","方言"],"tip":"「拉丁戈利亚德、法国游吟诗人、德国恋诗歌手、意大利巴拉塔」。","extra":true,"syl":false,"sylNote":"考纲未列世俗音乐"},{"q":"简述「新艺术」。","type":"简答","pts":["「新艺术」指14世纪（约1300—1450年）法国与意大利的音乐时期，名称来自维特里的理论著作《新艺术》。","其特征是世俗性增强、有量记谱与节奏精细化、等节奏技法、兰迪尼终止式，三度六度被视为协和音程。","法国代表为马肖，作有《圣母弥撒》（首次把弥撒五个部分视为整体、用四声部）及大量世俗歌曲；意大利代表为兰迪尼。","新艺术突破了古艺术的宗教与复调束缚，是文艺复兴音乐的先声。"],"keys":["新艺术","马肖","兰迪尼","有量记谱","等节奏"],"tip":"「14世纪、马肖兰迪尼、等节奏+兰迪尼终止式」——文艺复兴的先声。","extra":true,"syl":true,"sylNote":"考纲列新艺术"},{"q":"简述教会调式。","type":"简答","pts":["教会调式是中世纪以格里高利圣咏为基础的调式体系，源于古希腊调式而加以基督教化。","它共有八种：多利亚、弗里几亚、利地亚、混合利地亚四个正调式及其四个副调式。","每种调式有终结音与吟诵音，音阶中无导音，强调自然音程，适合无伴奏的圣咏演唱。","教会调式在文艺复兴时期逐渐衰落，巴洛克时期被大小调体系取代。"],"keys":["教会调式","格里高利圣咏","正调式","副调式","终结音"],"tip":"「四个正调式+四个副调式=八调式」，后被大小调取代。","extra":true,"syl":false,"sylNote":"考纲未列教会调式"},{"q":"纽姆谱","type":"名词解释","pts":["纽姆谱是中世纪早期用于记写格里高利圣咏的记谱法，在歌词上方写下简单符号指示声调的升降变化。","它最初没有固定音高与精确节奏，主要起帮助记忆的作用，不能精确读唱新谱。","后来在符号前加上线，出现四线谱，使音的相对高度得以明确显示。","纽姆谱保存了圣咏旋律，并为后续有量记谱法与复调音乐的发展奠定基础。"],"keys":["纽姆谱","格里高利圣咏","四线谱","记谱法","中世纪"],"tip":"「歌词上方的升降小符号→加线成四线谱」。","extra":true,"syl":false,"sylNote":"考纲未列纽姆谱"},{"q":"论述中世纪复调音乐的发展情况。","type":"论述","pts":["西方复调起源于格里高利圣咏的纵向扩展，最早的二声部复调是奥尔加农，由平行奥尔加农经变体、自由或反向奥尔加农发展到华丽奥尔加农。","11—12世纪出现第斯康特，运用节奏模式，形成音对音的织体，与即兴松散的奥尔加农形成对比。","12—13世纪出现孔杜克图斯与克劳苏拉，克劳苏拉上方声部填入歌词后形成经文歌，经文歌有复歌词现象并逐渐世俗化。","巴黎圣母院乐派（莱奥南、佩罗坦）是复调创作的中心，创作了大量华丽奥尔加农、第斯康特与三声部经文歌。","14世纪新艺术时期，马肖把弥撒五个部分视为整体、写作四声部《圣母弥撒》，并运用等节奏技法，标志中世纪复调的成熟。"],"keys":["奥尔加农","第斯康特","经文歌","圣母院乐派","马肖"],"tip":"「奥尔加农→第斯康特→克劳苏拉→经文歌→弥撒曲」一条进化链。","extra":true,"syl":true,"sylNote":"考纲列奥尔加农、经文歌"}]},{"id":"w03","num":"三","title":"文艺复兴音乐","era":"约1430—1600","intro":"人文主义抬头，复调声乐达顶峰，器乐开始独立。","cards":[{"q":"文艺复兴音乐的总体特征","type":"简答","pts":["人文主义：关注人的情感与现世生活。","复调声乐达到顶峰，四声部模仿复调成熟。","印刷术推广乐谱，音乐传播加速。","世俗体裁（牧歌、尚松）兴盛，器乐逐步独立。"],"keys":["人文主义","复调","印刷术","世俗体裁"],"tip":"「人文、复调、印刷、世俗」四点开头。"},{"q":"勃艮第乐派","type":"名词解释","pts":["15 世纪上半叶，勃艮第宫廷为中心。","代表：迪费、班舒瓦。","体裁：弥撒、经文歌、尚松。","风格：三声部为主，旋律优美，音响清澈。"],"keys":["勃艮第乐派","迪费","班舒瓦","尚松"],"tip":"「迪费班舒瓦，三声部尚松」。"},{"q":"弗兰德乐派","type":"论述","pts":["15 世纪下半叶至 16 世纪，欧洲音乐的主流。","代表：奥克冈、若斯坎、拉索。","四声部模仿复调成熟，弥撒与经文歌创作高峰。","若斯坎：以音乐表达歌词情感，被视为「音乐人文主义」的先声。","拉索：《回声》等，风格多样，集文艺复兴之大成。"],"keys":["弗兰德乐派","奥克冈","若斯坎","拉索"],"tip":"「奥奠基、若表情、拉拉索大成」。"},{"q":"罗马乐派与威尼斯乐派","type":"简答","pts":["罗马乐派：帕莱斯特里那，《马切洛斯教皇弥撒》，风格纯净、声部均衡。","威尼斯乐派：维拉尔特奠基，A. 加布里埃利与 G. 加布里埃利发展「复合唱」。","威尼斯乐派善用乐器与空间对比，色彩华丽。","两派形成「纯净」与「华丽」的对照。"],"keys":["帕莱斯特里那","罗马乐派","威尼斯乐派","复合唱"],"tip":"「罗马纯、威尼斯艳」——一句话抓住对比。"},{"q":"文艺复兴的世俗声乐体裁","type":"简答","pts":["牧歌（意大利）：多声部，重歌词表达，后发展出独唱牧歌。","尚松（法国）：节奏轻快，题材世俗。","利德（德国）：多声部歌曲。","三者共同推动世俗音乐的发展。"],"keys":["牧歌","尚松","利德"],"tip":"「意牧、法尚、德利」——国别对应体裁。"},{"q":"文艺复兴的器乐","type":"简答","pts":["利切卡尔：由模仿复调发展而来的器乐体裁，赋格的前身。","坎佐纳：由尚松改编的器乐曲。","幻想曲：自由展开的器乐曲。","舞曲：帕凡、加利亚德等成对出现。","器乐逐渐脱离声乐独立。"],"keys":["利切卡尔","坎佐纳","幻想曲","舞曲"],"tip":"「利切卡尔→赋格，坎佐纳→奏鸣曲」两条演化线。"},{"q":"帕莱斯特里纳","type":"名词解释","pts":["帕莱斯特里纳是文艺复兴晚期意大利作曲家，罗马乐派的核心人物，被誉为「教会音乐之父」。","其创作集中于宗教领域，以弥撒曲最重要，代表作有《马尔切里斯教皇弥撒》，另有大量经文歌。","他坚持自然调式音阶，避免半音化与不协和音，各声部清晰、歌词可辨，旋律以级进为主、呈拱形起伏。","其音乐被称为「古风格」，证明复调音乐与宗教虔诚并不矛盾，奠定了天主教音乐数百年的审美标准。"],"keys":["帕莱斯特里纳","罗马乐派","教会音乐之父","马尔切里斯教皇弥撒","古风格"],"tip":"「罗马乐派核心+教会音乐之父+马尔切里斯弥撒」。","extra":true,"syl":false,"sylNote":"考纲仅列罗马乐派"},{"q":"简述马丁·路德音乐改革。","type":"简答","pts":["16世纪罗马教廷在德国出售赎罪券，马丁·路德发表《九十五条论纲》，引发宗教改革并产生新教。","音乐上最重要的成果是众赞歌，即新教礼拜仪式中使用的德语会众赞美诗，以取代拉丁文圣咏。","众赞歌曲调多来自格里高利圣咏与世俗歌曲，采用德语歌词，由全体会众齐唱，代表作《上帝是我们的坚固堡垒》。","改革主张简化礼拜仪式、用民族语言礼拜，使音乐走向大众，为德国民族音乐的发展奠定基础。"],"keys":["马丁·路德","宗教改革","众赞歌","德语礼拜","上帝是我们的坚固堡垒"],"tip":"「反赎罪券→新教→德语众赞歌」一条链，代表作《上帝是我们的坚固堡垒》。","extra":true,"syl":false,"sylNote":"考纲未列宗教改革"},{"q":"文艺复兴时期复调音乐的发展成就及其对西方音乐史的影响。","type":"论述","pts":["勃艮第乐派（迪费、班舒瓦）把弥撒曲写成四声部，定旋律采用世俗旋律，常用假低音与兰迪尼终止式，使常规弥撒的五个部分逐渐连成整体。","法—佛兰德乐派（奥克冈、若斯坎、拉索）强调各声部地位平等，发展模仿对位与二重风格，三和弦形式完整出现，拉索的无伴奏合唱《回声》是集大成之作。","罗马乐派以帕莱斯特里纳为代表，坚持自然调式、声部清晰、歌词可辨，其《马尔切里斯教皇弥撒》成为宗教复调的典范。","威尼斯乐派（维拉尔特、加布里埃利）首创复合唱与双合唱队，探索空间音响对比，并加强器乐与合唱的音色对比，开巴洛克协奏风格之先声。","文艺复兴复调完成了四声部复调主流的定型，发展绘词法等词曲结合手法，为巴洛克主调音乐、歌剧与器乐的发展准备了条件。"],"keys":["勃艮第乐派","法—佛兰德乐派","帕莱斯特里纳","威尼斯乐派","绘词法"],"tip":"「勃艮第→佛兰德→罗马→威尼斯」四个乐派一串，最后落到巴洛克的前奏。","extra":true,"syl":false,"sylNote":"考纲未列复调音乐成就"},{"q":"众赞歌","type":"名词解释","pts":["众赞歌是16世纪德国宗教改革后新教礼拜仪式中使用的德语会众赞美诗。","由马丁·路德倡导，歌词用德语，曲调多取自格里高利圣咏与世俗歌曲，由全体会众齐唱。","代表作是路德作词曲的《上帝是我们的坚固堡垒》。","众赞歌成为德国新教音乐的基础，巴赫的康塔塔、受难曲大量采用众赞歌旋律。"],"keys":["众赞歌","马丁·路德","德语","会众齐唱","上帝是我们的坚固堡垒"],"tip":"「路德+德语+会众齐唱」——新教的众赞歌。","extra":true,"syl":false,"sylNote":"考纲未列众赞歌"},{"q":"简述德国宗教改革。","type":"简答","pts":["16世纪罗马教廷在德国出售赎罪券，马丁·路德发表《九十五条论纲》，引发宗教改革并建立新教。","音乐上以众赞歌取代拉丁文圣咏：德语歌词、会众齐唱，曲调多取自格里高利圣咏与世俗歌曲。","路德主张简化礼拜仪式、用民族语言礼拜，代表作是《上帝是我们的坚固堡垒》。","改革使音乐走向大众，为德国民族音乐的发展以及巴赫的创作奠定了基础。"],"keys":["宗教改革","马丁·路德","众赞歌","德语礼拜","新教"],"tip":"「路德反赎罪券→新教→德语众赞歌」。","extra":true,"syl":false,"sylNote":"考纲未列宗教改革"},{"q":"简述文艺复兴时期「牧歌」的发展阶段。","type":"简答","pts":["牧歌是文艺复兴时期意大利重要的世俗复调歌曲，以较高水准的诗歌为词谱曲，通谱体、歌词多为单段。","早期牧歌为四声部，基本是主调风格，音乐注重对歌词的清晰表达。","中期牧歌声部增多，主调与复调手法并用，绘词法大量运用。","晚期牧歌发展为高度精致的作品，重视歌词与音乐的戏剧性效果，并出现牧歌剧，在蒙特威尔第手中达到顶峰。"],"keys":["牧歌","意大利","复调歌曲","绘词法","蒙特威尔第"],"tip":"「早期四声部主调→中期复调绘词→晚期戏剧化」三步走。","extra":true,"syl":true,"sylNote":"考纲列牧歌"}]},{"id":"w04","num":"四","title":"巴洛克音乐","era":"1600—1750","intro":"通奏低音、歌剧诞生、器乐勃兴，巴赫与亨德尔集大成。","cards":[{"q":"巴洛克音乐的总体特征","type":"简答","pts":["通奏低音（数字低音）贯穿全曲，是巴洛克的标志。","主调音乐兴起，与复调并存。","歌剧、清唱剧、康塔塔等大型声乐体裁诞生。","器乐独立发展：协奏曲、奏鸣曲、赋格。","「情感论」：用音乐表现特定情绪。"],"keys":["通奏低音","主调音乐","歌剧","情感论"],"tip":"「低音、主调、歌剧、器乐、情感」五点。"},{"q":"歌剧的诞生","type":"论述","pts":["16 世纪末佛罗伦萨「卡梅拉塔」社团，试图复兴古希腊戏剧。","佩里《达芙妮》（1597，失传）被视为第一部歌剧。","佩里《尤丽狄茜》（1600）现存最早完整歌剧。","蒙特威尔第《奥菲欧》（1607）确立歌剧的戏剧表现力。"],"keys":["卡梅拉塔","达芙妮","尤丽狄茜","奥菲欧"],"tip":"「1597 达芙妮、1600 尤丽狄茜、1607 奥菲欧」三个年份。"},{"q":"巴洛克歌剧的发展","type":"简答","pts":["威尼斯歌剧：蒙特威尔第、卡瓦利，公开歌剧院兴起。","那不勒斯歌剧：A. 斯卡拉蒂，确立「返始咏叹调」，重歌唱技艺。","阉人歌手盛行，声乐炫技达到极致。","法国歌剧：吕利创「抒情悲剧」，重芭蕾与朗诵。","英国：普赛尔《狄多与埃涅阿斯》；德国：许茨。"],"keys":["返始咏叹调","斯卡拉蒂","吕利","普赛尔"],"tip":"「意—法—英」三国歌剧路线，各记一人一作。"},{"q":"清唱剧、康塔塔与受难曲","type":"简答","pts":["清唱剧：大型声乐戏剧，无舞台表演，代表作亨德尔《弥赛亚》。","康塔塔：多乐章声乐套曲，巴赫创作大量教堂康塔塔。","受难曲：以福音书为词的清唱剧，巴赫《马太受难曲》。"],"keys":["清唱剧","康塔塔","受难曲","弥赛亚"],"tip":"「清唱剧无演、康塔塔多章、受难曲讲福音」。"},{"q":"巴洛克器乐","type":"简答","pts":["维瓦尔第《四季》：小提琴协奏曲，标题性描绘。","科雷利：三重奏鸣曲、大协奏曲的奠基者。","D. 斯卡拉蒂：键盘奏鸣曲，结构清晰。","体裁：托卡塔、赋格、变奏曲、协奏曲（大协奏曲、独奏协奏曲）。"],"keys":["四季","科雷利","三重奏鸣曲","大协奏曲"],"tip":"「维四季、科三重、D 键盘」。"},{"q":"巴赫","type":"论述","pts":["德国作曲家、管风琴家，巴洛克音乐的集大成者。","键盘：《平均律钢琴曲集》《哥德堡变奏曲》《赋格的艺术》。","器乐：《勃兰登堡协奏曲》《管弦乐组曲》。","宗教声乐：《马太受难曲》《b 小调弥撒》《约翰受难曲》。","被誉为「西方音乐之父」，复调技术的顶峰。"],"keys":["巴赫","平均律","勃兰登堡","马太受难曲"],"tip":"按「键盘—器乐—宗教」三类记作品，条理清楚。"},{"q":"亨德尔","type":"论述","pts":["德国出生、英国发展的作曲家。","清唱剧《弥赛亚》，其中《哈利路亚》合唱最为著名。","管弦乐《水上音乐》《皇家焰火音乐》。","歌剧创作丰富，风格国际化和世俗化。","与巴赫并称巴洛克双峰，但一为宗教一为世俗。"],"keys":["亨德尔","弥赛亚","水上音乐","哈利路亚"],"tip":"「巴赫内省宗教、亨德尔外向世俗」——对比评价。"},{"q":"巴洛克时期的法国与德国音乐","type":"简答","pts":["吕利：法国歌剧奠基，创「抒情悲剧」，序曲形式影响深远。","库普兰：键盘音乐，古钢琴小品。","拉莫：《和声学》，理论奠基。","许茨：德国宗教音乐的先驱，融合意大利风格。"],"keys":["吕利","库普兰","拉莫","许茨"],"tip":"「吕歌剧、库键盘、拉和声、许宗教」。"},{"q":"维瓦尔迪","type":"名词解释","pts":["维瓦尔迪是意大利巴洛克晚期作曲家、小提琴家、音乐教育家，巴洛克独奏协奏曲的奠基人。","他一生作有约四五百首协奏曲，确立了独奏协奏曲「快—慢—快」三乐章的标准套曲模式。","他规范了第一乐章「利都奈罗」结构：全奏主题在乐队与独奏之间循环交替，形成竞奏对比。","小提琴协奏曲《四季》由《春》《夏》《秋》《冬》四首组成，是最早的标题音乐典范之一。","其明快的节奏、优美的旋律与炫技性写作，直接影响了古典主义协奏曲的发展。"],"keys":["维瓦尔迪","四季","独奏协奏曲","利都奈罗"],"tip":"「快慢快 + 利都奈罗 + 《四季》」三件套。","extra":true},{"q":"科雷利","type":"名词解释","pts":["科雷利是意大利小提琴家、作曲家、指挥家，博洛尼亚乐派最有影响的代表，被誉为「小提琴音乐的奠基人」。","他是第一位完全运用大小调体系进行创作的作曲家，作品调性清晰，对位以和声为基础，系统运用模进手法。","他创作了巴洛克第一部经典大协奏曲集（作品 6 号），把大协奏曲体裁推向成熟。","其奏鸣曲为教堂奏鸣曲与室内奏鸣曲两种范型奠定基础，并推动了小提琴演奏技术的发展。"],"keys":["科雷利","博洛尼亚乐派","大协奏曲","大小调体系"],"tip":"「大协奏曲集 + 大小调第一人」两大标签。","extra":true},{"q":"D·斯卡拉蒂","type":"名词解释","pts":["D·斯卡拉蒂是意大利巴洛克晚期作曲家、键盘演奏家，A·斯卡拉蒂之子，巴洛克与古典主义之间的桥梁人物。","他作有约 555 首单乐章键盘奏鸣曲，多为教学而写，每首集中解决一种技巧或表现课题。","他大量运用双手交叉、快速重复音、远距离跳进、震音等超前技法，被誉为「近代钢琴演奏技巧的先驱」。","其风格融合意大利旋律的歌唱性、西班牙舞曲的节奏活力与宫廷典雅气质，和声大胆使用不协和音与突然转调。","他使键盘音乐从复调思维转向主调炫技，预示了钢琴时代的到来。"],"keys":["D·斯卡拉蒂","键盘奏鸣曲","555 首","近代钢琴演奏技巧的先驱"],"tip":"「555 首单乐章」——数量加单乐章，两个特征一起记。","extra":true},{"q":"返始咏叹调","type":"名词解释","pts":["返始咏叹调是巴洛克正歌剧中的一种咏叹调形式，由那不勒斯歌剧、A·斯卡拉蒂等人确立并广泛使用。","其结构为ABA三段体，第三段标注「da capo」（从头反复），再现第一段的音乐。","歌手在再现段可自由加花、即兴炫技，充分展示嗓音技巧。","它体现了正歌剧「重声乐、轻戏剧」的特点，也造成剧情拖沓，成为后来格鲁克歌剧改革的对象。"],"keys":["返始咏叹调","da capo","ABA","A·斯卡拉蒂","正歌剧"],"tip":"「A-B-A，第三段da capo＝从头再来」，给歌手炫技的舞台。","extra":true,"syl":false,"sylNote":"考纲未列返始咏叹调"},{"q":"《勃兰登堡协奏曲》","type":"名词解释","pts":["《勃兰登堡协奏曲》是巴赫1721年题献给勃兰登堡侯爵的六首大协奏曲的合称。","每首由不同的独奏乐器小组与弦乐队加通奏低音竞奏，乐器组合丰富多样。","作品充分展示大协奏曲「独奏组与全奏相对比」的原则，是巴洛克协奏曲的典范之作。","它代表了巴洛克器乐的高峰，也体现巴赫复调技巧与主调织体的完美结合。"],"keys":["布兰登堡协奏曲","巴赫","大协奏曲","独奏组","巴洛克器乐"],"tip":"「巴赫题献侯爵的六首大协奏曲」，独奏组与乐队斗彩。","extra":true,"syl":false,"sylNote":"考纲仅列巴赫与协奏曲"},{"q":"简述巴洛克时期协奏曲的主要类型及其特征。","type":"简答","pts":["大协奏曲是协奏曲最早、最主要的形式，由独奏者组成的小组与较大乐队相互抗衡，巴赫《勃兰登堡协奏曲》、维瓦尔第《四季》为代表。","乐队协奏曲是稍晚出现的形式，没有独奏，只有弦乐队与通奏低音协奏。","独奏协奏曲是发展最晚、影响最深远的形式，为一件独奏乐器与乐队而作。","其共同特征是独奏（组）与全奏的对比竞奏，维瓦尔第确立快—慢—快三个乐章的结构。"],"keys":["大协奏曲","乐队协奏曲","独奏协奏曲","维瓦尔第","快慢快"],"tip":"「大协奏→乐队协奏→独奏协奏」三步演化，快慢快三乐章。","extra":true,"syl":true,"sylNote":"考纲列协奏曲"},{"q":"简述巴洛克时期「情感论」的美学内涵及其在音乐中的体现。","type":"简答","pts":["情感论是巴洛克时期的重要音乐美学观念，认为音乐的主要目的是唤起听众的情感。","它表现的不是作曲家个人的情感，而是类型化的人类共通基本情感，这与浪漫主义音乐有本质区别。","作曲家通常在一首作品或一个乐章中只用一种基本情感，并以此统一全曲。","这种情感通过调式、和声、节奏、音程等音乐手段来表现，形成一套「音乐修辞」式的表达方式。"],"keys":["情感论","类型化情感","音乐修辞","巴洛克美学","唤起情感"],"tip":"「唤起类型化情感，一乐章一情感」——巴洛克的情感公式，不是个人抒情。","extra":true,"syl":false,"sylNote":"考纲未列情感论"},{"q":"论巴洛克时期器乐音乐。","type":"论述","pts":["巴洛克时期器乐彻底摆脱对声乐的依附，作曲家开始为特定乐器写作，纯器乐体裁获得长足发展。","主要体裁有奏鸣曲（独奏奏鸣曲、三重奏鸣曲）、协奏曲、赋格、组曲、变奏曲，以及前奏曲、幻想曲、托卡塔等。","代表作曲家与作品：巴赫的《勃兰登堡协奏曲》《赋格的艺术》、维瓦尔第《四季》、科雷利的三重奏鸣曲、D·斯卡拉蒂的键盘奏鸣曲、库普兰的组曲。","技术上，通奏低音、成熟的调性和声、力度与音色的对比以及即兴装饰，构成巴洛克器乐特有的音乐语言。","巴洛克器乐把器乐创作推向高峰，其奏鸣曲、协奏曲、组曲等形式直接孕育了古典时期的奏鸣曲—交响曲体系。"],"keys":["器乐独立","奏鸣曲","协奏曲","赋格","通奏低音"],"tip":"「独立、体裁多、名家多、技术新、奠基古典」——五条线写满一篇论述。","extra":true,"syl":true,"sylNote":"考纲列巴洛克协奏曲等"},{"q":"意大利序曲","type":"名词解释","pts":["意大利序曲是17世纪意大利歌剧使用的器乐序曲，由那不勒斯乐派的A·斯卡拉蒂确立。","其结构为快—慢—快三部分，与法国序曲的慢—快—慢形成对照。","它使歌剧序曲从附属音乐变为独立的器乐体裁，推动了器乐的发展。","快—慢—快的三段布局后来成为古典交响曲三个乐章结构的直接来源。"],"keys":["意大利序曲","A·斯卡拉蒂","快慢快","法国序曲","交响曲前身"],"tip":"「快—慢—快」是意大利，反着来的「慢—快—慢」是法国。","extra":true,"syl":false,"sylNote":"考纲未列意大利序曲"},{"q":"卡梅拉塔","type":"名词解释","pts":["卡梅拉塔是16世纪末佛罗伦萨的文人音乐家社团，由巴尔迪伯爵赞助。","成员包括伽利莱、佩里、卡契尼、里努契尼等，主张复兴古希腊戏剧的朗诵性歌唱。","他们创作单声歌曲，强调歌词清晰与情感表达，形成主调风格。","其探索促成1597年《达芙妮》与1600年《尤丽迪茜》的诞生，标志歌剧的诞生。"],"keys":["卡梅拉塔","佛罗伦萨","单声歌曲","尤丽迪茜","歌剧诞生"],"tip":"「佛罗伦萨文人小圈子→单声歌曲→歌剧诞生」。","extra":true,"syl":false,"sylNote":"考纲未列卡梅拉塔"},{"q":"库朗特","type":"名词解释","pts":["库朗特是巴洛克组曲中的舞曲之一，通常位于阿拉曼德之后、萨拉班德之前。","它有法国式与意大利式两种：法国库朗特庄重优雅、节奏复杂，意大利库朗特（corrente）轻快流畅。","多为三拍子、二部曲式，常以模仿对位手法写成。","它与阿拉曼德、萨拉班德、吉格共同构成巴洛克组曲的核心舞曲序列。"],"keys":["库朗特","组曲","阿拉曼德","萨拉班德","三拍子"],"tip":"「阿拉曼德—库朗特—萨拉班德—吉格」组曲四舞曲，库朗特居中。","extra":true,"syl":false,"sylNote":"考纲未列库朗特"},{"q":"简述受难乐。","type":"简答","pts":["受难乐是用音乐表现《圣经》中耶稣受难故事的一种古老体裁。","其发展分三阶段：单声的格里高利圣咏受难乐、复调受难乐、巴洛克时期的受难清唱剧。","受难清唱剧引入宣叙调、咏叹调与器乐伴奏，福音史家用宣叙调叙事，咏叹调抒发内心情感。","巴赫的《马太受难曲》《约翰受难曲》是受难乐的最高峰，也是巴洛克宗教音乐的巅峰之作。"],"keys":["受难乐","受难清唱剧","巴赫","马太受难曲","约翰受难曲"],"tip":"「圣咏受难→复调受难→受难清唱剧」，巴赫双峰。","extra":true,"syl":true,"sylNote":"考纲列受难曲"},{"q":"简述康塔塔。","type":"简答","pts":["康塔塔是巴洛克时期的大型声乐体裁，原泛指声乐作品，与器乐的奏鸣曲相对。","它由咏叹调、宣叙调、合唱与乐队组成，多乐章，分世俗康塔塔与宗教康塔塔两类。","意大利世俗康塔塔多为单声独唱加通奏低音；宗教康塔塔用于教堂礼拜，合唱地位突出。","巴赫作有二百余部教堂康塔塔，大量采用众赞歌旋律，是巴洛克康塔塔的顶峰。"],"keys":["康塔塔","咏叹调","宣叙调","巴赫","众赞歌"],"tip":"「咏叹调+宣叙调+合唱」的巴洛克大型声乐，巴赫写了二百多部。","extra":true,"syl":true,"sylNote":"考纲列康塔塔"},{"q":"托卡塔","type":"名词解释","pts":["托卡塔是一种键盘器乐体裁，名称源自意大利语toccare（意为「触键」）。","其特点是自由、接近即兴，技巧性很高，强调手指触键的快速灵巧与音型的辉煌。","它于文艺复兴晚期发展起来，巴洛克时期常与赋格组合成套，如巴赫的《d小调托卡塔与赋格》。","托卡塔体现了巴洛克键盘音乐即兴性与技巧性的一面，是管风琴与古钢琴音乐的重要体裁。"],"keys":["托卡塔","触键","即兴","键盘音乐","巴赫"],"tip":"「toccare＝触键」：快、自由、炫技的键盘曲。","extra":true,"syl":false,"sylNote":"考纲未列托卡塔"},{"q":"简述拉莫的音乐贡献。","type":"简答","pts":["拉莫是法国18世纪最重要的作曲家、理论家和键盘乐器演奏家，也是吕利之后法国歌剧的代表。","他继承吕利的抒情悲剧传统，作有约三十部舞台作品，加强合唱、歌舞场面与乐队伴奏的戏剧表现力。","其理论著作《和声学》（1722）从声音的物理性质出发研究和声，主张和声是音乐的基础、旋律由和声派生。","拉莫奠定了近代功能和声体系，对后世作曲与和声教学影响深远。"],"keys":["拉莫","和声学","功能和声","法国歌剧","吕利"],"tip":"「拉莫《和声学》——功能和声的奠基人」。","extra":true,"syl":false,"sylNote":"考纲未列拉莫"},{"q":"简述法国歌剧。","type":"简答","pts":["法国歌剧在17世纪70年代发展起来，被称为「带音乐的悲剧」，后称「抒情悲剧」。","吕利是法国歌剧的代表作曲家，其歌剧取材神话、历史与骑士传奇，由一个序幕和五幕构成，常插入芭蕾。","吕利开创法国序曲（慢—快—慢），宣叙调带有歌唱性、不突出宣叙调与咏叹调的对比，且不用阉人歌手。","代表作品有《阿尔米德》《罗兰德》《阿尔切斯特》，其后拉莫继承并发展了这一传统。"],"keys":["法国歌剧","抒情悲剧","吕利","法国序曲","芭蕾"],"tip":"「吕利+抒情悲剧+序幕五幕+慢快慢法国序曲」。","extra":true,"syl":true,"sylNote":"考纲列歌剧（法国歌剧）"},{"q":"大协奏曲","type":"名词解释","pts":["大协奏曲是巴洛克协奏曲最早、最主要的形式，由独奏者组成的小组与较大的乐队相互抗衡竞奏。","其典型结构为快—慢—快三个乐章，强调独奏组（小全奏）与全奏之间的音色与力度对比。","巴赫《勃兰登堡协奏曲》是大协奏曲的不朽名作，维瓦尔第《四季》也属此类。","大协奏曲为独奏协奏曲与古典交响曲的形成奠定了基础。"],"keys":["大协奏曲","独奏组","全奏","勃兰登堡协奏曲","巴洛克"],"tip":"「小组斗大乐队」——巴洛克大协奏曲，巴赫《勃兰登堡》。","extra":true,"syl":false,"sylNote":"考纲仅列协奏曲"}]},{"id":"w05","num":"五","title":"古典主义音乐","era":"1750—1820","intro":"启蒙时代的理性与均衡，奏鸣曲式与古典交响曲成熟。","cards":[{"q":"古典主义音乐的总体特征","type":"简答","pts":["受启蒙运动影响，追求理性、均衡、清晰。","主调音乐占主导，织体透明。","奏鸣曲式确立，成为大型器乐的核心结构。","交响曲、弦乐四重奏、协奏曲、奏鸣曲四大体裁成熟。"],"keys":["启蒙运动","主调音乐","奏鸣曲式","四大体裁"],"tip":"「理性、主调、奏鸣曲式、四体裁」。"},{"q":"奏鸣曲式的成熟","type":"名词解释","pts":["大型器乐曲的核心结构，古典时期确立。","三部分：呈示部（主部、连接部、副部、结束部）。","展开部：发展主题材料，调性游移。","再现部：主题回归，调性统一。","体现「对立—发展—统一」的古典美学。"],"keys":["呈示部","展开部","再现部","调性统一"],"tip":"结构图必背：呈示（主连副结）—展开—再现。"},{"q":"海顿","type":"论述","pts":["奥地利作曲家，被誉为「交响曲之父」「弦乐四重奏之父」。","作 104 部交响曲，代表作《伦敦交响曲》《惊愕》《告别》。","清唱剧《创世纪》《四季》。","确立四乐章结构与乐队编制，风格明朗幽默。"],"keys":["海顿","104 部交响曲","惊愕","创世纪"],"tip":"两个「之父」+ 104 部 + 两部清唱剧。"},{"q":"莫扎特","type":"论述","pts":["奥地利作曲家，古典主义的完美代表。","歌剧《费加罗的婚礼》《唐璜》《魔笛》。","交响曲第 40、41《朱庇特》。","协奏曲、室内乐、宗教音乐均有极高成就。","风格优雅、均衡，旋律天赋极高。"],"keys":["莫扎特","费加罗的婚礼","魔笛","朱庇特"],"tip":"「三歌剧、两交响」——最常考的组合。"},{"q":"贝多芬","type":"论述","pts":["德国作曲家，古典向浪漫过渡的关键人物。","创作分三时期：早期继承古典、中期英雄性、晚期内省。","9 部交响曲：第三《英雄》、第五《命运》、第六《田园》、第九《合唱》。","32 首钢琴奏鸣曲，如《悲怆》《月光》《热情》。","晚期《庄严弥撒》《第九交响曲》拓展了音乐的精神维度。"],"keys":["贝多芬","英雄","命运","田园","合唱"],"tip":"「三、五、六、九」四部交响曲是论述骨架。"},{"q":"曼海姆乐派与格鲁克歌剧改革","type":"简答","pts":["曼海姆乐派：善用渐强渐弱、震音，推进交响曲发展。","格鲁克：歌剧改革，主张音乐服从戏剧，代表作《奥菲欧与尤丽狄茜》。","喜歌剧兴起，题材世俗、语言通俗。","二者共同推动古典风格的形成。"],"keys":["曼海姆乐派","格鲁克","歌剧改革","喜歌剧"],"tip":"「曼海姆强交响、格鲁克改歌剧」。"},{"q":"简述古典主义时期交响曲。","type":"简答","pts":["交响曲由巴洛克意大利序曲经曼海姆乐派等前古典时期的探索逐渐定型，成为古典时期最重要的器乐体裁。","曼海姆乐派贡献突出：多写四乐章，第一乐章更接近古典奏鸣曲式，善用双主题对比与渐强渐弱。","海顿正式确立交响曲四乐章的结构与性质，一生创作一百余部，被誉为「交响曲之父」。","莫扎特增强旋律的歌唱性与配器色彩，贝多芬把交响曲推向戏剧性、哲理性的高峰，代表作第三《英雄》、第五《命运》、第六《田园》、第九《合唱》。"],"keys":["交响曲","曼海姆乐派","海顿","莫扎特","贝多芬"],"tip":"「曼海姆定型→海顿确立→莫扎特润色→贝多芬登顶」四步走。","extra":true,"syl":true,"sylNote":"考纲列交响曲"},{"q":"维也纳古典乐派三位作曲家的创作特征及历史地位。","type":"论述","pts":["海顿被誉为「交响曲之父」，作有一百余部交响曲，正式确立四乐章结构与弦乐四重奏体裁，代表作清唱剧《创世纪》《四季》，风格明朗乐观、幽默质朴。","莫扎特以歌剧为创作重心，代表作《费加罗的婚礼》《唐璜》《魔笛》，同时写下大量协奏曲与交响曲，旋律歌唱性强、和声丰富、结构均衡优雅。","贝多芬作有九部交响曲（第三《英雄》、第五《命运》、第六《田园》、第九《合唱》）与三十二首钢琴奏鸣曲，突破古典形式，注入启蒙思想与革命精神，戏剧性与哲理性强烈。","三人共同确立了古典交响曲、奏鸣曲、弦乐四重奏与协奏曲的范式，以主调织体、奏鸣曲式和双管编制奠定古典风格。","维也纳古典乐派是西方音乐发展的高峰，上承巴洛克、下启浪漫主义，其作品至今仍是音乐会的核心曲目。"],"keys":["海顿","莫扎特","贝多芬","交响曲之父","奏鸣曲式"],"tip":"「海顿奠基、莫扎特润色、贝多芬突破」——三句话概括三人。","extra":true,"syl":true,"sylNote":"考纲列海顿、莫扎特、贝多芬"},{"q":"论述奏鸣曲的发展演进。","type":"论述","pts":["巴洛克时期形成三重奏鸣曲与独奏奏鸣曲，科雷利确立教堂奏鸣曲慢—快—慢—快的四乐章形式。","前古典时期，D·斯卡拉蒂写下大量单乐章键盘奏鸣曲，曼海姆乐派与柏林乐派推动奏鸣曲式的成熟。","海顿、莫扎特确立古典奏鸣曲三至四乐章的结构，钢琴奏鸣曲与由三重奏鸣曲演变而来的弦乐四重奏繁荣。","贝多芬以三十二首钢琴奏鸣曲扩展奏鸣曲的规模与表现力，把奏鸣曲式推向戏剧性的高峰。","浪漫主义时期奏鸣曲出现单乐章化、标题化倾向（李斯特），20世纪又有新古典主义与自由处理，但奏鸣曲始终是器乐创作的核心体裁。"],"keys":["奏鸣曲","三重奏鸣曲","奏鸣曲式","贝多芬","斯卡拉蒂"],"tip":"「巴洛克三重奏→斯卡拉蒂单乐章→海顿莫扎特定型→贝多芬登顶→浪漫变形」。","extra":true,"syl":true,"sylNote":"考纲列奏鸣曲"},{"q":"简述喜歌剧之争。","type":"简答","pts":["1752年佩格莱西的意大利喜歌剧《女仆作夫人》在巴黎上演，引发西方音乐史上著名的「喜歌剧之争」。","争论一方是以卢梭为代表的百科全书派，支持自然朴素的意大利喜歌剧；另一方维护法国宫廷歌剧传统。","争论促使法国喜歌剧兴起，格雷特里的《狮心王理查》为代表作。","它冲击了正歌剧僵化的程式，为格鲁克歌剧改革与古典主义音乐开辟了道路。"],"keys":["喜歌剧之争","佩格莱西","女仆作夫人","卢梭","法国喜歌剧"],"tip":"「《女仆作夫人》搅动巴黎，卢梭参战」——喜歌剧之争。","extra":true,"syl":false,"sylNote":"考纲未列喜歌剧之争"},{"q":"简述格鲁克歌剧改革。","type":"简答","pts":["格鲁克针对正歌剧形式僵化、歌手炫技等问题进行改革，主张音乐必须服从戏剧，追求自然与真实。","改革措施包括：序曲与剧情相联系，减少返始咏叹调的炫技，加强合唱与剧情的结合，用乐队伴奏宣叙调，使芭蕾与剧情统一。","代表作有《奥菲欧与尤丽狄茜》《阿尔切斯特》，其歌剧序言明确阐述了改革主张。","改革影响了莫扎特、瓦格纳等人的歌剧创作，是歌剧史上的重要转折。"],"keys":["格鲁克","歌剧改革","音乐服从戏剧","奥菲欧与尤丽狄茜","阿尔切斯特"],"tip":"「音乐服从戏剧、砍掉炫技」——格鲁克的改革宣言。","extra":true,"syl":false,"sylNote":"考纲未列格鲁克"},{"q":"简述曼海姆乐派。","type":"简答","pts":["曼海姆乐派是18世纪中叶德国曼海姆宫廷乐队形成的器乐乐派，代表人物有约翰·施塔米茨等。","它把交响曲定型为四个乐章，第一乐章更接近古典奏鸣曲式的双主题对比与展开、再现原则。","乐派以乐队演奏的戏剧性著称，善用渐强渐弱、颤音、滚奏等手法，被称为「曼海姆叹息」「曼海姆火箭」。","曼海姆乐派为海顿、莫扎特的古典交响曲与奏鸣曲式奠定了基础。"],"keys":["曼海姆乐派","施塔米茨","四乐章","渐强渐弱","奏鸣曲式"],"tip":"「四乐章+双主题+渐强渐弱」——曼海姆给古典交响曲打样。","extra":true,"syl":false,"sylNote":"考纲未列曼海姆乐派"},{"q":"「激情风格」","type":"名词解释","pts":["「激情风格」即「情感风格」（Empfindsamer Stil），是18世纪前古典时期德国中产阶级的一种音乐风格。","它以C.P.E.巴赫的交响曲和奏鸣曲为代表，脱胎于华丽风格而更注重内在的激情。","音乐上避免过多外在装饰，常出现有意识的半音化、突然的音型与和声变化。","它预示了浪漫主义的音乐风格，与德国狂飙突进运动的浪漫精神相联系。"],"keys":["激情风格","情感风格","C.P.E.巴赫","半音化","狂飙运动"],"tip":"「C.P.E.巴赫+内在激情+突然变化」——前古典的情感风格。","extra":true,"syl":false,"sylNote":"考纲未列激情风格"},{"q":"简述奏鸣曲的发展过程。","type":"简答","pts":["巴洛克时期形成三重奏鸣曲与独奏奏鸣曲，科雷利确立教堂奏鸣曲慢—快—慢—快的四乐章形式。","前古典时期，D·斯卡拉蒂写下大量单乐章键盘奏鸣曲，曼海姆乐派与柏林乐派推动奏鸣曲式的成熟。","海顿、莫扎特确立古典奏鸣曲三至四乐章的结构，钢琴奏鸣曲与弦乐四重奏繁荣。","贝多芬以三十二首钢琴奏鸣曲扩展奏鸣曲的规模与表现力，把奏鸣曲式推向戏剧性高峰，此后浪漫主义与20世纪又不断加以变形发展。"],"keys":["奏鸣曲","三重奏鸣曲","奏鸣曲式","贝多芬","斯卡拉蒂"],"tip":"「巴洛克三重奏→斯卡拉蒂单乐章→海顿莫扎特定型→贝多芬登顶」。","extra":true,"syl":true,"sylNote":"考纲列奏鸣曲"}]},{"id":"w06","num":"六","title":"浪漫主义音乐","era":"19世纪","intro":"情感、标题、民族与和声色彩，个性张扬的百年。","cards":[{"q":"浪漫主义音乐的总体特征","type":"简答","pts":["强调个人情感与主观体验，反对古典的克制。","标题音乐兴盛，音乐与文学、绘画结合。","民族乐派兴起，挖掘本民族民间音乐。","和声色彩化、半音化，调性开始松动。","体裁小型化（艺术歌曲、钢琴小品）与大型化（交响诗、乐剧）并行。"],"keys":["标题音乐","民族乐派","半音化","艺术歌曲"],"tip":"「情感、标题、民族、和声、体裁」五点。"},{"q":"德奥浪漫主义作曲家","type":"论述","pts":["韦伯《魔弹射手》：德国民族歌剧的开山之作。","舒伯特：艺术歌曲《魔王》《冬之旅》，「未完成」交响曲。","门德尔松：《仲夏夜之梦》序曲，创办莱比锡音乐学院。","舒曼：《童年情景》《狂欢节》，音乐评论家。","勃拉姆斯：4 部交响曲，继承古典传统。","马勒：交响曲套曲，《大地之歌》。","理查·施特劳斯：交响诗《查拉图斯特拉如是说》。"],"keys":["韦伯","舒伯特","门德尔松","舒曼","勃拉姆斯","马勒"],"tip":"按「歌剧—歌曲—序曲—钢琴—交响」分工记，不要混。"},{"q":"法国浪漫主义音乐","type":"简答","pts":["柏辽兹《幻想交响曲》：标题音乐典范，「固定乐思」。","古诺《浮士德》、比才《卡门》、奥芬巴赫《地狱中的奥菲欧》。","法国歌剧重戏剧性与现实题材。"],"keys":["柏辽兹","幻想交响曲","固定乐思","卡门"],"tip":"「柏固定、比卡门」两个关键词。"},{"q":"意大利歌剧","type":"论述","pts":["罗西尼《塞维利亚的理发师》，美声歌剧代表。","贝利尼《诺尔玛》、多尼采蒂《拉美莫尔的露琪亚》。","威尔第《茶花女》《阿依达》《奥赛罗》《弄臣》。","普契尼《波希米亚人》《托斯卡》《蝴蝶夫人》《图兰朵》。","意大利歌剧以人声为中心，旋律优美。"],"keys":["罗西尼","威尔第","普契尼","图兰朵"],"tip":"「罗—贝—多—威—普」五代链条，各记一部。"},{"q":"瓦格纳","type":"论述","pts":["德国作曲家，创「乐剧」（Musikdrama）。","《尼伯龙根的指环》（《莱茵的黄金》《女武神》《齐格弗里德》《众神的黄昏》）。","「主导动机」贯穿全剧，交响化乐队。","《特里斯坦与伊索尔德》的「特里斯坦和弦」推动半音化和声。","创办拜罗伊特节日剧院。"],"keys":["瓦格纳","乐剧","指环","主导动机","特里斯坦和弦"],"tip":"「乐剧 + 主导动机 + 指环 + 拜罗伊特」四件套。"},{"q":"民族乐派","type":"论述","pts":["挪威：格里格《培尔·金特》组曲。","捷克：斯美塔那《我的祖国》、德沃夏克《自新大陆交响曲》。","俄罗斯：格林卡奠基，「五人团」（巴拉基列夫、穆索尔斯基、里姆斯基-科萨科夫、鲍罗丁、居伊），柴可夫斯基。","芬兰：西贝柳斯《芬兰颂》。","西班牙：阿尔贝尼斯、法雅。","共同点：民族题材、民间音调、民族精神。"],"keys":["格里格","斯美塔那","德沃夏克","五人团","西贝柳斯"],"tip":"「挪格、捷斯德、俄五柴、芬西」——国别 + 人名速记。"},{"q":"肖邦","type":"名词解释","pts":["波兰作曲家、钢琴家，「钢琴诗人」。","体裁：玛祖卡、波罗乃兹、夜曲、练习曲、叙事曲、圆舞曲。","作品融合波兰民间音乐与法国沙龙趣味。","一生几乎只为钢琴创作。"],"keys":["肖邦","玛祖卡","波罗乃兹","夜曲"],"tip":"「一器一体裁」：钢琴 + 玛祖卡/波罗乃兹。"},{"q":"李斯特","type":"名词解释","pts":["匈牙利作曲家、钢琴家，炫技演奏的代表。","创「交响诗」体裁，如《前奏曲》《塔索》。","《匈牙利狂想曲》融合民族音调。","魏玛乐派的核心人物。"],"keys":["李斯特","交响诗","匈牙利狂想曲","魏玛乐派"],"tip":"「交响诗之父」是最高频标签。"},{"q":"浪漫主义艺术歌曲与钢琴小品","type":"简答","pts":["艺术歌曲：诗歌与音乐结合，舒伯特、舒曼、勃拉姆斯、沃尔夫。","声乐套曲：《冬之旅》《诗人之恋》。","钢琴小品：门德尔松《无词歌》、舒曼《童年情景》、勃拉姆斯间奏曲。","小型体裁的繁荣反映浪漫主义的私人化倾向。"],"keys":["艺术歌曲","声乐套曲","无词歌","童年情景"],"tip":"「歌成套、琴成集」——两条线索。"},{"q":"浪漫主义和声的发展","type":"简答","pts":["离调、副属和弦大量使用。","半音化增强，瓦格纳「特里斯坦和弦」为标志。","调性扩张，出现「调性模糊」。","为 20 世纪无调性音乐埋下伏笔。"],"keys":["离调","半音化","调性扩张"],"tip":"「离调→半音→模糊→无调性」演化链。"},{"q":"韦伯","type":"名词解释","pts":["韦伯是德国作曲家，德国浪漫主义歌剧的奠基人，被誉为德国民族歌剧的开创者。","歌剧《魔弹射手》（《自由射手》）是德国浪漫主义歌剧的诞生标志，以德奥歌唱剧为框架，用德文对白衔接段落。","歌剧取材德国民间传说，运用民歌风旋律、自然音阶和声与森林鬼怪的魔幻色彩，狼谷场景的管弦乐音效尤为著名。","其序曲以主题、调性、和声、织体、音色的对比预示剧情，把奏鸣曲式与戏剧内容结合。","钢琴曲《邀舞》开创了标题钢琴曲的先河，后经柏辽兹配器而广为流传。","他为瓦格纳的乐剧改革铺平了道路。"],"keys":["韦伯","魔弹射手","德国浪漫主义歌剧","邀舞"],"tip":"「《魔弹射手》一炮立派」——德国浪漫主义歌剧从韦伯算起。","extra":true},{"q":"舒伯特","type":"名词解释","pts":["舒伯特是奥地利作曲家，早期浪漫主义音乐的代表，被誉为「艺术歌曲之王」。","他一生写有 600 余首艺术歌曲，按曲式分为分节歌（《野玫瑰》）、通谱歌（《魔王》）与声乐套曲（《美丽的磨坊女》《冬之旅》）。","他使诗乐高度统一，钢琴不再是伴奏而是独立声部，以三连音、循环音型描绘马蹄与纺车。","器乐创作有《第八「未完成」交响曲》《第九「伟大」交响曲》、《鳟鱼五重奏》《死神与少女》四重奏，并首创钢琴小品「音乐瞬间」。","他把艺术歌曲从诗歌的附属品提升为独立的高艺术体裁，其道路为舒曼、勃拉姆斯、马勒所继承。"],"keys":["舒伯特","艺术歌曲之王","魔王","冬之旅","未完成交响曲"],"tip":"「600 首歌曲」是最大标签，三类曲体加两部交响收尾。","extra":true},{"q":"柏辽兹","type":"名词解释","pts":["柏辽兹是法国作曲家、指挥家、音乐评论家，标题交响曲的奠基人。","他创立标题交响曲体裁，为每一乐章附文字标题与说明，把文学戏剧内容引入交响乐，开器乐叙事化的先河。","《幻想交响曲》是其成名作与标题交响曲典范，全曲五个乐章写艺术家失恋后服鸦片产生的幻觉。","他首创「固定乐思」手法：代表恋人的主题贯穿五个乐章并随情节变形，开主导动机的先声。","他是配器法的革新者，首次系统地把乐器音色作为独立表现手段，所著《配器法》成为后世教材。","代表作还有《罗马狂欢节序曲》、歌剧《特洛伊人》、清唱剧《基督的童年》。"],"keys":["柏辽兹","幻想交响曲","固定乐思","标题交响曲","配器法"],"tip":"「固定乐思 + 配器法」——柏辽兹留下的两大技术遗产。","extra":true},{"q":"门德尔松","type":"名词解释","pts":["门德尔松是德国浪漫主义早期作曲家、指挥家，音乐以旋律优美、结构清晰、配器精致著称。","他确立了标题性音乐会序曲体裁，《仲夏夜之梦序曲》以莎士比亚戏剧为题材，是标题序曲的典范。","他首创钢琴「无词歌」体裁，共作 48 首，代表作《春之歌》《威尼斯船歌》，被舒曼誉为「用钢琴歌唱的典范」。","他作有五部交响曲，《第三「苏格兰」》《第四「意大利」》以旅行见闻为题材，把标题性思维与古典四乐章结构融合。","他 1829 年指挥演出《马太受难曲》，掀起复兴巴赫的风潮，并参与筹建莱比锡音乐学院。"],"keys":["门德尔松","仲夏夜之梦","无词歌","苏格兰交响曲","莱比锡音乐学院"],"tip":"「序曲、无词歌、复兴巴赫」——三大功绩。","extra":true},{"q":"舒曼","type":"名词解释","pts":["舒曼是德国浪漫主义音乐的核心人物，兼具作曲家与音乐评论家双重身份。","他 1834 年创办《新音乐杂志》，以「大卫同盟」为笔名群体撰写乐评，推崇肖邦、勃拉姆斯、柏辽兹，抨击沙龙炫技与保守僵化。","钢琴创作以性格小品套曲为主，代表作《童年情景》（含《梦幻曲》）《狂欢节》《蝴蝶》，每首用标题刻画人物与情景。","艺术歌曲继承舒伯特传统而更重钢琴与人声的平等对话，代表作声乐套曲《诗人之恋》《妇女的爱情与生活》。","其节奏常用切分错位，和声偏爱不协和音的延迟解决与突然转调，音乐由文学思维主导。"],"keys":["舒曼","新音乐杂志","大卫同盟","童年情景","诗人之恋"],"tip":"「创作与评论两手抓」；弗洛列斯坦、埃塞比乌斯是他的两面。","extra":true},{"q":"勃拉姆斯","type":"名词解释","pts":["勃拉姆斯是德国浪漫主义中后期作曲家，被视为贝多芬之后最伟大的交响曲作家之一。","他坚持古典曲式与严谨逻辑，把浪漫主义的抒情性纳入古典结构，是浪漫主义潮流中的「反潮流」者。","他作有四部交响曲，《第一交响曲》被誉为「贝多芬第十」，以动机发展、厚重复调与深沉情感著称。","室内乐有《钢琴五重奏》《单簧管五重奏》，钢琴有《亨德尔主题变奏曲》《帕格尼尼主题变奏曲》与间奏曲等小品。","艺术歌曲继承舒伯特、舒曼传统，代表作《四首严肃的歌》歌词多取自《圣经》，体现晚年对人生与信仰的思考。"],"keys":["勃拉姆斯","第一交响曲","贝多芬第十","四首严肃的歌","室内乐"],"tip":"「用古典的壳装浪漫的心」——「贝多芬第十」是最高频标签。","extra":true},{"q":"贝利尼","type":"名词解释","pts":["贝利尼是 19 世纪上半叶意大利作曲家，与罗西尼、多尼采蒂并称「意大利美声歌剧三巨头」。","他被誉为「美声歌剧的诗人」，旋律精美悠长、气息宽广，以极长的线条考验歌者的呼吸与音色。","代表作《诺尔玛》中的咏叹调《圣洁女神》以极长的气息线条成为女高音的试金石。","另有《梦游女》《清教徒》，其正歌剧的悲剧性与抒情性高度统一。","他在罗西尼退隐与威尔第崛起之间，以质量的深度延续了美声歌剧的辉煌。"],"keys":["贝利尼","诺尔玛","圣洁女神","美声歌剧"],"tip":"「贝利尼写长句、多尼采蒂写数量」——两位桥梁的分工。","extra":true},{"q":"多尼采蒂","type":"名词解释","pts":["多尼采蒂是 19 世纪上半叶意大利作曲家，与罗西尼、贝利尼并称「意大利美声歌剧三巨头」。","他是罗西尼与威尔第之间的桥梁人物，创作数量庞大，旋律优美流畅、声乐技巧华丽。","喜歌剧《爱之甘醇》以机智幽默的剧情与流畅旋律著称，是美声喜歌剧的名作。","正歌剧《拉美莫尔的露琪亚》以「疯狂场景」展现悲剧张力与高难花腔。","他以数量的广度延续了美声歌剧的辉煌，为威尔第的戏剧性歌剧准备了观众与演唱传统。"],"keys":["多尼采蒂","爱之甘醇","拉美莫尔的露琪亚","美声歌剧"],"tip":"「一喜一悲」记两部：《爱之甘醇》喜、《露琪亚》悲。","extra":true},{"q":"罗西尼","type":"名词解释","pts":["罗西尼是 19 世纪初意大利歌剧的杰出代表，美声唱法黄金时代的开创者。","其音乐以明快活泼的节奏、流畅优美的旋律与「罗西尼渐强」为标志：同一片段反复演奏并逐步加强加快，层层推高情绪。","他放松咏叹调与宣叙调的严格区分，以「场」衔接剧情，乐队编制简洁、织体清晰透明。","喜歌剧《塞维利亚的理发师》是意大利喜歌剧的巅峰，费加罗的咏叹调以绕口令式歌唱展现机敏自信。","《威廉·退尔》是其最后一部歌剧，为法国大歌剧的奠基之作，按题材也属正歌剧范畴。"],"keys":["罗西尼","塞维利亚的理发师","罗西尼渐强","威廉·退尔"],"tip":"「渐强 + 理发师」两个标签；《威廉·退尔》记得顺手提「大歌剧」。","extra":true},{"q":"威尔第","type":"名词解释","pts":["威尔第是 19 世纪意大利歌剧的巅峰人物，被誉为「意大利民族精神的音乐化身」。","早期以爱国英雄题材为主，《纳布科》中的合唱《飞吧，思想，乘着金色的翅膀》成为民族复兴的象征。","中期进入黄金时代，《茶花女》《游吟诗人》《弄臣》转向人性悲剧，以细腻心理刻画与优美咏叹调著称。","晚期吸收瓦格纳的「无终旋律」，打破分曲结构，《奥赛罗》《法尔斯塔夫》均取材莎士比亚，后者是他唯一的喜歌剧。","他始终坚持意大利旋律至上的传统，把戏剧性与音乐性高度统一，使意大利歌剧走向现代。"],"keys":["威尔第","纳布科","茶花女","奥赛罗","法尔斯塔夫"],"tip":"「早爱国、中人性、晚瓦格纳」——三阶段串记。","extra":true},{"q":"普契尼","type":"名词解释","pts":["普契尼是 19 世纪末 20 世纪初意大利作曲家，威尔第之后意大利歌剧最重要的代表人物。","他受真实主义影响又超越其局限，题材关注普通人命运，旋律直击人心，一句咏叹调即可立住人物。","其乐队写作精致细腻，达到意大利歌剧的最高水平，木管与弦乐的特殊音色常用来暗示剧情。","他善用异国情调：《蝴蝶夫人》用日本五声音阶，《图兰朵》引用中国民歌《茉莉花》。","代表作《艺术家的生涯》（《波西米亚人》）《托斯卡》《蝴蝶夫人》，悲剧多以极弱力度安静收束。"],"keys":["普契尼","波西米亚人","托斯卡","蝴蝶夫人","图兰朵"],"tip":"「三部歌剧 + 《茉莉花》」；他改变了意大利歌剧重人声轻器乐的状况。","extra":true},{"q":"古诺","type":"名词解释","pts":["古诺是 19 世纪法国作曲家，法国抒情歌剧的代表人物。","抒情歌剧介于大歌剧与喜歌剧之间：篇幅较长但不浮华，重人物心理与情感刻画，以说白代替宣叙调。","其音乐以歌曲、舞曲、进行曲为主，注重抒情旋律的感染力，常取文学名著中的爱情情节。","《浮士德》是他的代表作，以爱情故事为主线，旋律优美、抒情细腻，是法国抒情歌剧的典范。","另有《罗密欧与朱丽叶》，同样以文学名著中的爱情为题材，使抒情歌剧成为 19 世纪下半叶法国歌剧的主流。"],"keys":["古诺","抒情歌剧","浮士德","罗密欧与朱丽叶"],"tip":"「古诺即抒情歌剧，《浮士德》即代表作」；与奥芬巴赫的轻歌剧对照记。","extra":true},{"q":"比才","type":"名词解释","pts":["比才是法国作曲家，法国浪漫主义歌剧的代表人物。","《卡门》取材梅里美同名小说，写吉普赛女郎卡门与士兵唐·何塞的爱情悲剧，戏剧冲突极为激烈。","该剧体裁上被官方归为喜歌剧，以说白代替宣叙调，但悲剧结局与深刻心理描写远超传统喜歌剧的娱乐范畴。","音乐以强烈的西班牙地方色彩著称：《哈巴涅拉》用古巴舞曲节奏，《斗牛士之歌》以进行曲节奏塑造斗牛士气概。","首演因题材大胆、结局悲惨遭批评，后被公认为法国歌剧史上最伟大的杰作之一，是现实主义歌剧的先声。"],"keys":["比才","卡门","哈巴涅拉","斗牛士之歌","现实主义歌剧"],"tip":"「一剧两歌」——《哈巴涅拉》《斗牛士之歌》必须落到名字上。","extra":true},{"q":"奥芬巴赫","type":"名词解释","pts":["奥芬巴赫是 19 世纪法国作曲家，轻歌剧最重要的代表人物，被誉为「轻歌剧之父」。","轻歌剧由喜歌剧演变而来，以讽刺幽默与浪漫爱情为主题，结构短小灵活、旋律通俗上口，说白贯穿全剧。","其音乐常用康康舞、圆舞曲等流行舞曲节奏，追求娱乐效果而非艺术深度。","《地狱中的奥菲欧》以希腊神话为框架讽刺第二帝国社会，序曲中的康康舞曲成为轻歌剧的标志性音调。","《美丽的海伦》同样以讽刺手法解构古典题材，使轻歌剧成为 19 世纪欧洲最流行的歌剧体裁。"],"keys":["奥芬巴赫","轻歌剧","地狱中的奥菲欧","康康舞曲"],"tip":"「轻歌剧 = 奥芬巴赫 = 康康舞」三连。","extra":true},{"q":"马勒","type":"名词解释","pts":["马勒是 19 世纪末 20 世纪初奥地利作曲家、指挥家，被誉为「最后的浪漫主义交响乐大师」。","他作有九部完整交响曲与交响声乐套曲《大地之歌》，后者以中国唐诗德译本为歌词，由男高音与女中音交替演唱。","他极大发展了贝多芬开创的声乐交响传统：《第二「复活」》加入合唱与独唱，《第八「千人」》因编制庞大得名。","其交响曲与艺术歌曲互渗，歌曲主题常成为交响曲素材，形成「歌化交响」风格；声乐套曲有《少年魔角》《流浪者之歌》《亡儿之歌》。","他极大扩充乐队编制，配器既造宏伟音响洪流又突出细腻音色对比，晚期和声已现无调性倾向。","其创作影响了贝尔格、肖斯塔科维奇、布里顿等 20 世纪作曲家。"],"keys":["马勒","大地之歌","复活交响曲","千人交响曲","歌化交响"],"tip":"「九部半交响 + 《大地之歌》」；「歌化交响」是他的独门标签。","extra":true},{"q":"理查·施特劳斯","type":"名词解释","pts":["理查·施特劳斯是德国晚期浪漫主义作曲家、指挥家，创作集中于交响诗与歌剧两大领域。","他继承并发展李斯特的交响诗传统，把标题音乐的描写能力推向极致，代表作《查拉图斯特拉如是说》《唐璜》《蒂尔的恶作剧》。","歌剧延续瓦格纳的「乐剧」理念而保持调性基础：《莎乐美》以不协和音写病态欲望，「七纱舞」最为著名。","《玫瑰骑士》转向新古典主义的优雅，以莫扎特式的明朗与圆舞曲节奏写 18 世纪维也纳爱情喜剧。","其艺术歌曲延续德奥传统，代表作《明晨》《黄昏之梦》旋律深情、配器精致。","他是晚期浪漫主义音乐的集大成者，在和声上把调性推向边缘，又能回归古典的优雅。"],"keys":["理查·施特劳斯","查拉图斯特拉如是说","莎乐美","玫瑰骑士","交响诗"],"tip":"「交响诗 + 两部歌剧」：《莎乐美》惊悚、《玫瑰骑士》优雅。","extra":true},{"q":"《大地之歌》","type":"名词解释","pts":["《大地之歌》是马勒1908年创作的交响声乐套曲，为男高音、女低音（或男中音）与乐队而作。","歌词选用汉斯·贝特格转译的中国唐诗德文译本，涉及李白、王维、孟浩然等诗人的作品。","全曲共六个乐章，末乐章《告别》以悠长的「永远……永远」结束，表达对生命与尘世的眷恋。","它是马勒交响曲与歌曲创作交融的代表，体现晚期浪漫主义对生命、自然与死亡的哲思。"],"keys":["大地之歌","马勒","交响声乐套曲","唐诗","告别"],"tip":"「马勒用唐诗写成的六乐章交响声乐套曲，末章《告别》」。","extra":true,"syl":false,"sylNote":"考纲所列同名者为中国歌剧"},{"q":"幻想交响曲","type":"名词解释","pts":["《幻想交响曲》是柏辽兹1830年创作的五乐章标题交响曲，副标题为「一个艺术家生涯中的插曲」。","全曲以一个代表恋人的固定乐思（idée fixe）贯穿各乐章，并随情节需要而变形出现。","各乐章均有标题说明（梦幻、舞会、田野、赴刑、女巫安息日），体现音乐与文学、戏剧结合的理想。","它是标题交响曲的代表作，配器新颖、色彩丰富，对浪漫主义标题音乐的发展影响深远。"],"keys":["幻想交响曲","柏辽兹","固定乐思","标题音乐","五乐章"],"tip":"「固定乐思贯穿五个标题乐章」——柏辽兹的艺术家自传。","extra":true,"syl":false,"sylNote":"考纲仅列柏辽兹及标题性"},{"q":"无终旋律","type":"名词解释","pts":["无终旋律是瓦格纳乐剧中使用的旋律织体手法，目的是让音乐连续不断地推动戏剧。","它避免传统声乐完整的乐段与明确的段落终止，把歌唱作为一个声部融入管弦乐织体。","声乐与器乐线条此起彼伏，清晰的调性终止式只安排在一幕的结尾。","它与主导动机、整体艺术、半音化和声共同构成瓦格纳乐剧的音乐语言。"],"keys":["无终旋律","瓦格纳","乐剧","终止式","主导动机"],"tip":"「唱进乐队、不给终止，只在幕末收」——瓦格纳的无终旋律。","extra":true,"syl":false,"sylNote":"考纲未列无终旋律"},{"q":"谈谈浪漫主义时期钢琴音乐。","type":"论述","pts":["钢琴制造的改良（铁架、音域扩大、踏板完善）为浪漫主义钢琴音乐的发展提供了物质基础。","特性小品盛行，夜曲、玛祖卡、无词歌、即兴曲、叙事曲、圆舞曲、练习曲等成为作曲家抒写个性的重要体裁。","肖邦以玛祖卡、夜曲、叙事曲、练习曲开拓钢琴的诗意与民族性；李斯特以匈牙利狂想曲、超技练习曲把钢琴技巧推向极致。","舒曼《狂欢节》《童年情景》、门德尔松《无词歌》、勃拉姆斯晚期间奏曲，体现标题性、文学性与个人抒情。","浪漫主义钢琴音乐追求个性化、情感化、民族化，和声色彩丰富、旋律歌唱性强，是浪漫主义音乐最重要的领域之一。"],"keys":["特性小品","肖邦","李斯特","舒曼","标题性"],"tip":"「夜曲、玛祖卡、无词歌、叙事曲」——小品体裁串起肖邦李斯特舒曼。","extra":true,"syl":true,"sylNote":"考纲列特性小品、肖邦李斯特"},{"q":"整体艺术","type":"名词解释","pts":["「整体艺术」（Gesamtkunstwerk）是瓦格纳提出的乐剧理想。","他主张诗歌、音乐、戏剧、表演、舞台美术等诸种艺术综合为统一的整体艺术品。","他反对传统歌剧「分曲结构」把音乐与戏剧割裂，要求音乐服从戏剧的连续发展。","其实现手段包括主导动机、无终旋律与半音化和声，对后世歌剧与音乐戏剧影响深远。"],"keys":["整体艺术","Gesamtkunstwerk","瓦格纳","乐剧","分曲结构"],"tip":"「诗、乐、戏、演、美五合一」——瓦格纳的整体艺术。","extra":true,"syl":false,"sylNote":"考纲未列整体艺术"},{"q":"《卡门》","type":"名词解释","pts":["《卡门》是比才1875年创作的四幕歌剧，取材于梅里美的小说《嘉尔曼》。","音乐以鲜明的西班牙风格（哈巴涅拉、塞吉第亚、斗牛士之歌）塑造人物与异国色彩。","比才用音乐刻画出卡门、唐霍塞等性格各异的人物，具有强烈的现实主义倾向。","它是法国歌剧的杰作，对19世纪末意大利真实主义歌剧及民族乐派歌剧产生深远影响。"],"keys":["卡门","比才","四幕歌剧","哈巴涅拉","现实主义"],"tip":"「比才+梅里美+哈巴涅拉」——西班牙风的现实主义歌剧。","extra":true,"syl":false,"sylNote":"考纲仅列比才"},{"q":"真实主义歌剧","type":"名词解释","pts":["真实主义歌剧是19世纪末意大利出现的歌剧流派，受真实主义文学影响，把描写社会底层小人物的命运视为己任。","它力求真实反映贫苦人民的悲欢离合，暴露社会黑暗面，题材写实、戏剧冲突强烈。","代表作为马斯卡尼《乡村骑士》与列昂卡瓦洛《丑角》，两部作品常在同一晚上演出。","普契尼的《艺术家的生涯》《托斯卡》《蝴蝶夫人》延续了真实主义的写实倾向，使意大利歌剧走向新阶段。"],"keys":["真实主义歌剧","马斯卡尼","乡村骑士","列昂卡瓦洛","丑角"],"tip":"「乡村骑士+丑角」一对真实主义双联剧，普契尼续其写实风。","extra":true,"syl":false,"sylNote":"考纲未列真实主义"},{"q":"19 世纪浪漫主义时期「标题音乐」与「绝对音乐」之争，并结合具体创作加以说明。","type":"论述","pts":["标题音乐是以文学、绘画、戏剧等内容引导欣赏的音乐，代表有柏辽兹《幻想交响曲》、李斯特的交响诗、理查·施特劳斯的交响诗。","绝对音乐（无标题音乐）主张音乐的美在于形式本身，不依赖文学内容，代表为勃拉姆斯及汉斯力克《论音乐的美》。","争论的核心是音乐能否表现文学内容、标题是否损害音乐的纯粹性；李斯特主张「标题是作品的序言」，汉斯力克则坚持形式自律。","创作上，柏辽兹以固定乐思贯穿五个乐章，李斯特以主题变形统一单乐章交响诗，使文学内容与音乐结构融为一体。","这场论争推动了标题音乐体裁的繁荣，也深化了人们对音乐本质与形式价值的认识，影响直至20世纪。"],"keys":["标题音乐","绝对音乐","柏辽兹","李斯特","汉斯力克"],"tip":"「柏辽兹李斯特要标题，勃拉姆斯汉斯力克守形式」——两军对垒。","extra":true,"syl":true,"sylNote":"考纲列标题性、交响诗"},{"q":"《狂欢节》","type":"名词解释","pts":["《狂欢节》是舒曼1835年创作的钢琴套曲（Op.9），副标题为「四个音符的小场景」。","全曲由二十一首小品组成，描绘假面舞会场景，舒曼虚构的弗洛列斯坦、埃塞比乌斯等形象穿插其间。","音乐以「ASCH」四个音构成动机贯穿全曲，体现舒曼的文学性、标题性追求。","它是浪漫主义钢琴特性小品的代表作，展现了舒曼双重性格的音乐表达。"],"keys":["狂欢节","舒曼","钢琴套曲","ASCH动机","特性小品"],"tip":"「舒曼二十一首都叫《狂欢节》，ASCH四音串全场」。","extra":true,"syl":false,"sylNote":"考纲仅列舒曼及特性小品"},{"q":"简述 19 世纪音乐评论。","type":"简答","pts":["19世纪报刊业兴盛，音乐评论成为专门职业，舒曼创办《新音乐杂志》，以「大卫同盟」之名撰写评论。","柏辽兹、李斯特、瓦格纳等作曲家也写下大量评论文章，阐述标题音乐、乐剧等主张。","汉斯力克《论音乐的美》主张音乐的美在于形式，反对情感美学，成为绝对音乐的理論代表。","音乐评论引导听众趣味、确立经典曲目，并直接参与标题音乐与绝对音乐之争，推动浪漫主义音乐思潮的发展。"],"keys":["音乐评论","舒曼","新音乐杂志","汉斯力克","标题音乐之争"],"tip":"「舒曼办杂志、汉斯力克立形式美学」——19世纪乐评双峰。","extra":true,"syl":false,"sylNote":"考纲未列音乐评论"},{"q":"简述 19 世纪钢琴音乐。","type":"简答","pts":["19世纪钢琴制造不断改良（铁架、音域扩大、踏板完善），为钢琴音乐的发展提供了物质基础。","特性小品盛行，夜曲、玛祖卡、无词歌、即兴曲、叙事曲、圆舞曲、练习曲等成为作曲家抒写个性的重要体裁。","肖邦以玛祖卡、夜曲、叙事曲、练习曲开拓钢琴的诗意与民族性，李斯特以匈牙利狂想曲、超技练习曲把技巧推向极致。","舒曼《狂欢节》《童年情景》、门德尔松《无词歌》、勃拉姆斯晚期间奏曲各具特色，整体上追求抒情性、民族性、标题性与技巧性的统一。"],"keys":["特性小品","肖邦","李斯特","舒曼","无词歌"],"tip":"「夜曲玛祖卡、无词歌、匈牙利狂想曲」——小品四大家。","extra":true,"syl":true,"sylNote":"考纲列特性小品、肖邦李斯特"},{"q":"柴可夫斯基歌舞剧创作。","type":"简答","pts":["柴可夫斯基是俄罗斯浪漫主义作曲家，创作涉及交响曲、歌剧、舞剧、协奏曲与室内乐。","歌剧代表作有《叶甫盖尼·奥涅金》《黑桃皇后》，以抒情心理刻画见长。","三部芭蕾舞剧《天鹅湖》《睡美人》《胡桃夹子》成为古典芭蕾音乐的典范：《天鹅湖》以双簧管奏出忧伤的天鹅主题，《睡美人》被称为「芭蕾音乐的百科全书」，《胡桃夹子》用钢片琴描绘童话色彩。","他把交响音乐的手法引入芭蕾，提高了芭蕾音乐的艺术地位，使舞剧音乐成为可以独立欣赏的作品。"],"keys":["柴可夫斯基","天鹅湖","睡美人","胡桃夹子","芭蕾音乐"],"tip":"「奥涅金、黑桃皇后+天鹅湖、睡美人、胡桃夹子」——歌剧舞剧两手抓。","extra":true,"syl":false,"sylNote":"考纲未列柴可夫斯基"},{"q":"《奥赛罗》","type":"名词解释","pts":["《奥赛罗》是威尔第1887年创作的四幕歌剧，脚本由博伊托根据莎士比亚同名悲剧改编。","它是威尔第晚年杰作，以严密的戏剧结构与连贯的音乐发展著称，吸收并超越了瓦格纳的无终旋律手法。","歌剧中合唱、重唱与咏叹调融为一体，突出戏剧的真实与人物心理的刻画。","它被誉为意大利歌剧史上最伟大的悲剧之一，标志威尔第晚年戏剧境界的最高成就。"],"keys":["奥赛罗","威尔第","莎士比亚","博伊托","晚年杰作"],"tip":"「威尔第晚年+莎剧+博伊托脚本」——意大利歌剧最伟大的悲剧。","extra":true,"syl":false,"sylNote":"考纲仅列威尔第"},{"q":"举例三个浪漫主义时期交响诗的作者及其创作，并举例具体作品。","type":"简答","pts":["李斯特是交响诗的创立者，作有十三首交响诗，代表作《前奏曲》《塔索》《匈牙利》，采用单乐章结构并自由处理音乐材料。","斯美塔那作有交响诗套曲《我的祖国》，其中《沃尔塔瓦河》最为著名，描绘捷克的自然与历史。","理查·施特劳斯把交响诗推向高峰，代表作《唐璜》《查拉图斯特拉如是说》《英雄生涯》，配器辉煌、标题性强烈。","此外圣桑《骷髅之舞》、西贝柳斯《芬兰颂》、柴可夫斯基《罗密欧与朱丽叶》幻想序曲等也属标题性交响音乐的重要作品。"],"keys":["李斯特","前奏曲","斯美塔那","我的祖国","理查·施特劳斯"],"tip":"「李斯特首创、斯美塔那《我的祖国》、施特劳斯《唐璜》」。","extra":true,"syl":true,"sylNote":"考纲列交响诗"},{"q":"简述浪漫主义钢琴音乐创作。","type":"简答","pts":["钢琴制造的改良（铁架、音域扩大、踏板完善）为浪漫主义钢琴音乐提供了物质基础。","特性小品盛行，夜曲、玛祖卡、无词歌、即兴曲、叙事曲、圆舞曲、练习曲等成为作曲家抒写个性的体裁。","肖邦以玛祖卡、夜曲、叙事曲、练习曲开拓钢琴的诗意与民族性，李斯特以匈牙利狂想曲、超技练习曲把技巧推向极致。","舒曼《狂欢节》《童年情景》、门德尔松《无词歌》、勃拉姆斯晚期间奏曲各具特色，整体追求抒情性、民族性与标题性。"],"keys":["特性小品","肖邦","李斯特","无词歌","标题性"],"tip":"「夜曲玛祖卡、无词歌、匈牙利狂想曲」——浪漫钢琴四大家。","extra":true,"syl":true,"sylNote":"考纲列特性小品、肖邦李斯特"},{"q":"《冬之旅》","type":"名词解释","pts":["《冬之旅》是舒伯特1827年创作的声乐套曲，歌词取自德国诗人缪勒的二十四首诗。","全曲写一位失恋的流浪者在冬日旅途中孤独前行，情感由哀伤走向绝望，末曲《老艺人》尤为苍凉。","音乐多用分节歌、变化分节歌与通体歌，钢琴伴奏与歌声共同塑造意象。","它是舒伯特艺术歌曲的巅峰之作，也是浪漫主义声乐套曲的典范。"],"keys":["冬之旅","舒伯特","缪勒","声乐套曲","艺术歌曲"],"tip":"「舒伯特+缪勒二十四首诗+冬日流浪者」——艺术歌曲巅峰。","extra":true,"syl":false,"sylNote":"考纲仅列舒伯特及艺术歌曲"},{"q":"结合自身演唱或弹奏实践，论述某一西方器乐或声乐作品的艺术特色及演奏（演唱）技巧。","type":"论述","pts":["选择一首熟悉的浪漫主义作品（如肖邦《夜曲》Op.9 No.2或舒伯特《魔王》），先说明其体裁、作曲家与创作背景。","从音乐要素分析艺术特色：旋律的歌唱性、和声的色彩变化、织体的层次、曲式结构与情感的展开逻辑。","器乐演奏要讲触键与力度层次、踏板运用、声部平衡与rubato处理；声乐演唱要讲气息支持、咬字归韵、共鸣与情感表达。","结合练习体会说明技术难点如何克服，如肖邦夜曲的装饰性经过句需要手指独立与柔和触键，《魔王》的叙事需要音色与角色的快速转换。","最后总结作品的艺术价值与个人演奏（演唱）的收获，做到技术分析与情感体验相统一。"],"keys":["艺术特色","触键","气息","rubato","情感表达"],"tip":"「背景—分析—技巧—难点—体会」五步成文，选一首最有把握的作品。","extra":true,"syl":true,"sylNote":"考纲要求结合实践分析作品"},{"q":"交响诗","type":"名词解释","pts":["交响诗是李斯特首创的单乐章标题管弦乐体裁，是用音乐融化诗歌的一种新形式。","它采用单乐章结构，内部包含奏鸣曲式的三段逻辑，但根据内容需要自由处理音乐材料。","交响诗常取材于文学、诗歌、绘画或历史，通过主题变形等手法统一全曲。","代表作有李斯特《前奏曲》、斯美塔那《我的祖国》、理查·施特劳斯《唐璜》等，对后世标题音乐影响深远。"],"keys":["交响诗","李斯特","单乐章","标题音乐","主题变形"],"tip":"「李斯特首创：单乐章+标题+诗意」。","extra":true,"syl":true,"sylNote":"考纲列交响诗"}]},{"id":"w07","num":"七","title":"20世纪音乐","era":"1900 至今","intro":"印象、表现、新古典、民族与实验，多元并置的世纪。","cards":[{"q":"20世纪音乐的总体特征","type":"简答","pts":["风格多元：印象主义、表现主义、新古典主义、民族主义、先锋派。","调性体系瓦解，出现无调性、十二音、多调性。","节奏复杂化，不协和音被解放。","音色与音响成为新的表现手段，电子音乐出现。","作曲家与听众的距离拉大。"],"keys":["多元","无调性","十二音","音色"],"tip":"「调性没了、节奏碎了、音色新了」。"},{"q":"印象主义音乐","type":"名词解释","pts":["受印象派绘画与象征主义诗歌影响。","德彪西《牧神午后》前奏曲、《大海》《月光》。","拉威尔《波莱罗》《达夫尼与克罗埃》。","手法：全音阶、五声音阶、色彩性和声、弱化功能。","重感官印象而非叙事。"],"keys":["德彪西","牧神午后","拉威尔","全音阶"],"tip":"「德牧神、拉波莱罗」+ 全音阶。"},{"q":"表现主义音乐","type":"论述","pts":["勋伯格：无调性、《月迷彼埃罗》，创「十二音技法」。","贝尔格《沃采克》：表现主义歌剧代表作。","韦伯恩：点描风格，音色与静默的极致。","第二维也纳乐派的核心。","强调内心焦虑与潜意识的极端表达。"],"keys":["勋伯格","十二音","月迷彼埃罗","沃采克","韦伯恩"],"tip":"「勋—贝—韦」三人的代表作各记一部。"},{"q":"新古典主义","type":"简答","pts":["1920 年代兴起，主张回到古典的形式与客观。","斯特拉文斯基《春之祭》（原始主义）、《士兵的故事》、《诗篇交响曲》。","萨蒂、六人团。","以现代手法重建古典结构。"],"keys":["新古典主义","斯特拉文斯基","春之祭","士兵的故事"],"tip":"「春之祭是原始主义，不是新古典」——注意区分。"},{"q":"民族主义与英美作曲家","type":"论述","pts":["巴托克《乐队协奏曲》，采集民间音乐。","柯达伊：匈牙利民歌研究。","布里顿《彼得·格莱姆斯》《战争安魂曲》。","肖斯塔科维奇《第五交响曲》《第七「列宁格勒」》。","普罗科菲耶夫《彼得与狼》《古典交响曲》。","科普兰《阿巴拉契亚之春》；格什温《蓝色狂想曲》。"],"keys":["巴托克","布里顿","肖斯塔科维奇","普罗科菲耶夫","科普兰"],"tip":"「东欧巴托克、苏联肖普、英国布里顿、美国科普兰」。"},{"q":"先锋派与实验音乐","type":"简答","pts":["施托克豪森：电子音乐《青年之歌》，序列与空间音乐。","瓦列兹《电离》：打击乐与噪音实验。","约翰·凯奇《4 分 33 秒》：偶然音乐，观念艺术。","微分音音乐、具体音乐。","音乐的概念被重新定义。"],"keys":["施托克豪森","瓦列兹","凯奇","偶然音乐"],"tip":"「电子、噪音、无声」三件作品对应三人。"},{"q":"苏联与东欧音乐","type":"简答","pts":["肖斯塔科维奇：15 部交响曲，在政治压力下写作。","普罗科菲耶夫：舞剧《罗密欧与朱丽叶》。","哈恰图良：民族色彩浓郁。","创作在「社会主义现实主义」框架下展开。"],"keys":["肖斯塔科维奇","普罗科菲耶夫","社会主义现实主义"],"tip":"「肖十五、普罗朱、哈民族」。"},{"q":"美国音乐","type":"简答","pts":["科普兰《阿巴拉契亚之春》《小伙子比利》，美国风味。","格什温《蓝色狂想曲》《波吉与贝丝》，爵士与古典融合。","伯恩斯坦《西区故事》，音乐剧经典。","艾夫斯：实验性先驱。"],"keys":["科普兰","格什温","伯恩斯坦","西区故事"],"tip":"「科美国、格爵士、伯音乐剧」。"},{"q":"20世纪音乐的历史意义","type":"论述","pts":["打破调性中心，拓展了音响的可能性。","作曲家角色转变，从工匠走向探索者。","与大众趣味分离，形
