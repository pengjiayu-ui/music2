<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>音乐史 · 背诵打卡</title>
<style>
:root{
  --paper:#f7f3eb; --paper2:#ece5d7; --card:#fffdf8;
  --ink:#211d18; --ink2:#4c443b; --muted:#8d8375; --line:#e3dbcb;
  --accent:#a63d2f; --accent2:#b0863f; --accent-soft:#f5e6e1;
  --jade:#2f5d54; --ok:#3f7d55; --amber:#a9741f;
  --hero1:#fffdf8; --hero2:#f4ecdd;
  --shadow:0 1px 2px rgba(33,29,24,.04),0 14px 30px -22px rgba(33,29,24,.55);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#161412; --paper2:#241f1a; --card:#1e1b17;
    --ink:#f3ede3; --ink2:#cec5b6; --muted:#93897a; --line:#332d26;
    --accent:#d97763; --accent2:#d0a75e; --accent-soft:#33221d;
    --jade:#84b7aa; --ok:#6fb187; --amber:#d5a355;
    --hero1:#201c17; --hero2:#191612;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -26px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  background:#e7e0d2; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
}
@media (prefers-color-scheme:dark){ body{background:#0d0c0a} }
.serif{font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif}
.shell{min-height:100dvh;display:flex;justify-content:center}
.app{
  width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;
  background:var(--paper);position:relative;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.05),0 40px 90px -40px rgba(0,0,0,.45);
}
/* ---------- top ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 8px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;font-size:16px;
  background:linear-gradient(145deg,#bd4c33,#8c2d20);box-shadow:0 8px 18px -10px #8c2d20}
.brand h1{font-size:15.5px;margin:0;letter-spacing:.03em;font-weight:600;white-space:nowrap}
.brand p{margin:1px 0 0;font-size:10.5px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:11.5px;padding:7px 11px;
  border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
/* ---------- main ---------- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 26px;overscroll-behavior:contain}
.view{animation:viewIn .28s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stack{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px;font-size:12px;color:var(--muted);letter-spacing:.08em}
.sec-title b{color:var(--ink2);font-weight:600;font-size:13px;letter-spacing:.02em}
/* hero */
.hero{position:relative;overflow:hidden;padding:20px 18px 18px;border-radius:24px;
  background:linear-gradient(155deg,var(--hero1),var(--hero2));border:1px solid var(--line);box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(176,134,63,.20),transparent 65%)}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:1}
.eyebrow{margin:0;font-size:11px;letter-spacing:.14em;color:var(--muted)}
.big{display:flex;align-items:baseline;gap:6px;margin:6px 0 2px}
.big b{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:52px;line-height:.95;font-weight:600;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big span{font-size:13px;color:var(--muted);letter-spacing:.1em}
.datesub{margin:4px 0 0;font-size:11.5px;color:var(--muted)}
.ring{width:88px;height:88px;flex:none}
.ring-fg{transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring-t{font-size:19px;font-weight:600;fill:var(--ink);font-variant-numeric:tabular-nums}
.ring-s{font-size:8px;fill:var(--muted);letter-spacing:.1em}
/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px}
.tico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:16px;flex:none}
.tico.rev{background:var(--accent-soft);color:var(--accent)}
.tico.new{background:rgba(47,93,84,.12);color:var(--jade)}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:14px;font-weight:600;letter-spacing:.01em}
.task .tx small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.task em{font-style:normal;font-family:"Songti SC",Georgia,serif;font-size:22px;font-variant-numeric:tabular-nums}
.task em.zero{color:var(--muted);opacity:.55}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;border:1px solid transparent;
  background:var(--accent);color:#fff;font-size:15.5px;font-weight:600;letter-spacing:.03em;cursor:pointer;
  font-family:inherit;transition:transform .12s ease,filter .2s;box-shadow:0 10px 22px -14px rgba(166,61,47,.9)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line);box-shadow:none;font-weight:500}
.btn:disabled{opacity:.5;pointer-events:none}
/* forecast */
.forecast{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;padding:14px 14px 10px}
.fcol{display:flex;flex-direction:column;align-items:center;gap:7px}
.fnum{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fbar{width:100%;max-width:22px;border-radius:6px 6px 3px 3px;min-height:4px;
  background:linear-gradient(180deg,var(--accent),rgba(166,61,47,.45))}
.fbar.low{background:var(--paper2)}
.flab{font-size:10px;color:var(--muted)}
.fcol.today .flab{color:var(--accent);font-weight:600}
/* memory tip */
.tipcard{padding:15px 16px;border-radius:18px;background:linear-gradient(160deg,var(--accent-soft),transparent 90%);border:1px solid var(--line)}
.tipcard h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:600}
.tipcard p{margin:0;font-size:12.5px;line-height:1.7;color:var(--ink2)}
/* tabbar */
.tabbar{flex:none;display:flex;gap:2px;padding:5px 10px calc(5px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border:0;background:none;
  color:var(--muted);font-size:10px;font-family:inherit;cursor:pointer;border-radius:12px;letter-spacing:.04em}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--accent)}
/* search */
.searchwrap{position:relative;margin:10px 0 14px}
.searchwrap input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  padding:0 14px 0 38px;font-size:16px;color:var(--ink);font-family:inherit;outline:none}
.searchwrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sicon{position:absolute;left:14px;top:12px;color:var(--muted);font-size:15px}
.segs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.seg{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:inherit;white-space:nowrap}
.seg.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* chapter */
.chap{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.chaphead{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:none;border:0;font-family:inherit;
  color:inherit;text-align:left;cursor:pointer}
.chnum{width:26px;height:26px;flex:none;border-radius:9px;background:var(--paper2);color:var(--ink2);display:grid;place-items:center;
  font-size:11px;font-family:"Songti SC",serif}
.cht{flex:1;min-width:0}
.cht b{display:block;font-size:14px;font-weight:600}
.cht small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.chev{color:var(--muted);transition:transform .2s;font-size:16px}
.chap.open .chev{transform:rotate(90deg)}
.chapbody{border-top:1px dashed var(--line);padding:6px 8px 8px}
.crow{display:flex;align-items:center;gap:9px;width:100%;padding:9px 6px;background:none;border:0;font-family:inherit;
  color:var(--ink2);font-size:13px;text-align:left;cursor:pointer;border-radius:9px}
.crow:active{background:var(--paper2)}
.crow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow em{font-style:normal;font-size:10px;color:var(--muted);flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line)}
.dot[data-s="new"]{background:transparent;border:1px solid var(--muted);opacity:.7}
.dot[data-s="learn"]{background:var(--accent2)}
.dot[data-s="mastered"]{background:var(--ok)}
/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.tile b{display:block;font-family:"Songti SC",Georgia,serif;font-size:27px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{display:block;font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.06em}
.panel{padding:15px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px;font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:600}
.bar{height:7px;border-radius:99px;background:var(--paper2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#c0603f,#b0863f);transition:width .5s}
.legend{display:flex;gap:14px;margin-top:10px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:1fr;gap:4px;width:100%}
.heat i{width:100%;height:11px;border-radius:3px;background:var(--paper2)}
.heat i[data-l="1"]{background:#ead6c2}.heat i[data-l="2"]{background:#dba98d}
.heat i[data-l="3"]{background:#c0745a}.heat i[data-l="4"]{background:#a63d2f}
@media (prefers-color-scheme:dark){
  .heat i[data-l="1"]{background:#3a2e24}.heat i[data-l="2"]{background:#5a3a2c}
  .heat i[data-l="3"]{background:#8a4a37}.heat i[data-l="4"]{background:#c4654e}
}
.chline{display:flex;align-items:center;gap:10px;padding:7px 0}
.chline span{width:112px;flex:none;font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chline .bar{flex:1}
.chline em{font-style:normal;font-size:10.5px;color:var(--muted);width:38px;text-align:right;font-variant-numeric:tabular-nums}
.weakrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;color:var(--ink2);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;font-family:inherit;text-align:left}
.weakrow:last-child{border-bottom:0}
.weakrow em{font-style:normal;font-size:10px;color:var(--accent);margin-left:auto;flex:none}
/* settings */
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .tx{flex:1}
.setrow b{display:block;font-size:13.5px;font-weight:600}
.setrow small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.stepper button{width:32px;height:32px;border:0;background:var(--card);color:var(--ink2);font-size:17px;cursor:pointer;font-family:inherit}
.stepper b{min-width:34px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.dateinput{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:8px 10px;font-family:inherit;font-size:12.5px}
.about{font-size:11.5px;line-height:1.85;color:var(--muted)}
.about b{color:var(--ink2)}
/* overlay */
#overlay{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;background:rgba(22,18,14,.45);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.panel-full{width:100%;max-width:460px;background:var(--paper);height:100dvh;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.study-top{flex:none;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.icon-btn{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  font-size:14px;cursor:pointer;display:grid;place-items:center;font-family:inherit}
.sprog{flex:1;height:5px;border-radius:99px;background:var(--paper2);overflow:hidden}
.sprog i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s}
.scount{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.study-body{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 19px;box-shadow:var(--shadow);
  display:flex;flex-direction:column}
.qcard.front{flex:1}
.qcard.back{margin:auto 0}
.qcard.front .qtitle{margin:auto 0;padding:16px 0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ptag{font-size:10px;letter-spacing:.08em;padding:4px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.ptag.w{background:rgba(47,93,84,.13);color:var(--jade)}
.ptag.f{background:rgba(176,134,63,.15);color:var(--accent2)}
.qtype{font-size:10px;color:var(--muted);letter-spacing:.06em;border:1px solid var(--line);padding:3.5px 8px;border-radius:99px}
.qtitle{font-size:25px;line-height:1.45;margin:14px 0 0;font-weight:600;letter-spacing:.01em}
.qhint{margin:auto 0 0;padding-top:26px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.qlabel{margin:0 0 10px;font-size:10px;letter-spacing:.14em;color:var(--muted)}
.qbody{margin-top:16px;padding-top:15px;border-top:1px dashed var(--line);animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.pts li{position:relative;padding-left:17px;font-size:14px;line-height:1.8;color:var(--ink2)}
.pts li:before{content:"";position:absolute;left:2px;top:10px;width:6px;height:6px;border-radius:2px;background:var(--accent2);opacity:.6}
mark{background:linear-gradient(transparent 55%,rgba(176,134,63,.48) 55%);color:inherit;padding:0 1px;border-radius:2px}
@media (prefers-color-scheme:dark){mark{background:linear-gradient(transparent 62%,rgba(208,167,94,.32) 62%)}}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.key{font-size:11px;padding:4px 9px;border-radius:8px;background:var(--paper2);color:var(--ink2);letter-spacing:.02em}
.tipbox{margin-top:14px;padding:11px 12px;border-radius:12px;background:linear-gradient(160deg,var(--accent-soft),transparent);
  border:1px solid var(--line);font-size:12px;line-height:1.65;color:var(--ink2)}
.tipbox b{color:var(--accent);font-weight:600;font-size:10.5px;letter-spacing:.1em;display:block;margin-bottom:4px}
.study-foot{flex:none;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.rbtn{height:62px;border-radius:15px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
  color:var(--ink2);transition:transform .1s}
.rbtn:active{transform:scale(.97)}
.rbtn small{font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.02em}
.rbtn[data-lvl="got"]{background:linear-gradient(160deg,#45875c,#2f6045);border-color:transparent;color:#fff;
  box-shadow:0 10px 20px -14px rgba(47,96,69,.9)}
.rbtn[data-lvl="got"] small{color:rgba(255,255,255,.78)}
.rbtn[data-lvl="forgot"]{color:var(--accent);border-color:rgba(166,61,47,.3)}
.rbtn[data-lvl="vague"]{color:var(--amber);border-color:rgba(169,116,31,.3)}
/* done */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 26px;text-align:center}
.done-mark{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;
  background:linear-gradient(150deg,#4d9166,#2f6045);box-shadow:0 18px 40px -20px rgba(47,96,69,.9);animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.done h2{font-size:22px;margin:22px 0 8px;letter-spacing:.02em}
.done p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.8}
.done-stat{display:flex;gap:26px;margin:22px 0 26px}
.done-stat div{text-align:center}
.done-stat b{display:block;font-family:"Songti SC",serif;font-size:24px;font-variant-numeric:tabular-nums}
.done-stat small{font-size:10px;color:var(--muted);letter-spacing:.08em}
/* sheet */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(22,18,14,.45);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{width:100%;max-width:460px;background:var(--paper);border-radius:24px 24px 0 0;max-height:84dvh;overflow-y:auto;
  padding:18px 20px calc(22px + env(safe-area-inset-bottom));animation:sheetup .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheetup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:560px){
  #modal{align-items:center}
  .sheet{border-radius:24px;max-height:78dvh}
}
.sheet h2{font-size:21px;line-height:1.45;margin:14px 0 4px;font-weight:600}
.sheet .mbody{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.sheet-actions{display:flex;gap:9px;margin-top:18px}
.sheet-actions .btn{height:44px;font-size:13.5px;border-radius:13px}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:99;
  background:rgba(33,29,24,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:99px;opacity:0;
  pointer-events:none;transition:.25s;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.warnbar{display:flex;gap:8px;background:rgba(169,116,31,.12);border:1px solid rgba(169,116,31,.35);
  color:var(--amber);font-size:11.5px;line-height:1.65;padding:10px 12px;border-radius:12px;margin-bottom:12px}
/* exam */
.exam-top{display:flex;align-items:center;gap:8px;padding:8px 0 10px;position:sticky;top:0;z-index:6;
  background:linear-gradient(var(--paper) 72%,transparent);}
.clock{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink2);margin-left:auto;padding:6px 11px;
  border-radius:999px;background:var(--card);border:1px solid var(--line)}
.clock.warn{color:var(--accent);border-color:rgba(166,61,47,.45)}
.qblock{padding:15px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.qhead{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted);letter-spacing:.05em}
.qno{width:22px;height:22px;border-radius:7px;background:var(--paper2);display:grid;place-items:center;
  font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.qfull{margin-left:auto}
.qtext{margin:10px 0 12px;font-size:15px;line-height:1.8;color:var(--ink);font-family:"Songti SC","Noto Serif SC",serif}
.ansbox{width:100%;min-height:92px;border:1px dashed var(--line);border-radius:12px;background:var(--paper);
  padding:10px;font-family:inherit;font-size:13.5px;line-height:1.7;color:var(--ink);resize:vertical;outline:none}
.ansbox:focus{border-color:var(--accent);background:var(--card)}
.paperhint{font-size:11.5px;color:var(--muted);padding:11px 12px;border:1px dashed var(--line);border-radius:12px;line-height:1.6}
.scoregrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.score{text-align:center;padding:13px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.score b{display:block;font-family:"Songti SC",Georgia,serif;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.score small{font-size:10px;color:var(--muted);letter-spacing:.06em}
.score.mid{border-color:var(--accent);box-shadow:0 12px 26px -20px rgba(166,61,47,.9)}
.score.mid b{color:var(--accent)}
.rub{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.rub td{padding:6px 2px;border-bottom:1px dashed var(--line);vertical-align:top;color:var(--ink2);line-height:1.6}
.rub td:last-child{width:46px;text-align:right;color:var(--muted);white-space:nowrap}
.rub td.lost{border-bottom:0;padding-top:0;text-align:left;font-size:11px;color:var(--muted)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);
  font-size:13px;line-height:1.55;color:var(--ink2);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{margin:3px 0 0;accent-color:var(--accent);width:15px;height:15px;flex:none}
.mini{font-size:11px;color:var(--muted);line-height:1.7}
.histrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.histrow:last-child{border-bottom:0}
.histrow b{font-variant-numeric:tabular-nums}
.histrow .muted{margin-left:auto;font-size:11px}
.muted{color:var(--muted)}
.center{text-align:center}
</style>
</head>
