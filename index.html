function lvlName(d){ return d === "basic" ? "基础" : (d === "hard" ? "拔高" : "标准"); }

var EXAM_MAP = {};
["items", "chapters", "real", "hot"].forEach(function(k){
  (EX[k] || []).forEach(function(it){ EXAM_MAP[it.id] = it; });
});
function fitItem(it, full){
  if(Math.abs(it.full - full) < 0.01) return it;
  var k = full / it.full;
  var rub = it.rubric.map(function(r){ return {t:r.t, s: Math.round(r.s * k * 2) / 2}; });
  var sum = 0; rub.forEach(function(r){ sum += r.s; });
  rub[rub.length - 1].s = Math.round((rub[rub.length - 1].s + (full - sum)) * 2) / 2;
  return {qid: it.qid || it.id, type: it.type, part: it.part, full: full,
          diff: it.diff || it.difficulty || 2, tag: it.tag || (it.year ? "真题 " + it.year : ""),
          pref: it.pref || 1, q: it.q, chIds: (it.chIds || []).slice(), refCards: (it.refCards || []).slice(),
          rubric: rub, answer: it.answer || "", hint: it.hint || ""};
}

function balanceRubric(list, full){
  var sum = 0;
  list.forEach(function(r){ sum += r.s; });
  if(list.length && Math.abs(sum - full) > 0.001){
    var last = list[list.length - 1];
    last.s = Math.round((last.s + (full - sum)) * 2) / 2;
  }
  return list;
}
function rubricFromCard(c, type, full){
  var pts = c.pts.slice(0, 6);
  var content, extra;
  if(type === "名词解释"){ content = full - 2; extra = [{t:"表述准确、条理清晰", s:2}]; }
  else if(type === "简答"){ content = full - 3; extra = [{t:"条理清晰，能举例说明", s:3}]; }
  else { content = full - 4; extra = [{t:"论证充分，有作品举例", s:2},{t:"结构完整，术语准确", s:2}]; }
  var per = Math.round((content / pts.length) * 2) / 2;
  var list = pts.map(function(p){ return {t:p, s:per}; });
  return balanceRubric(list.concat(extra), full);
}
function cardItem(c, type, full){
  var q = c.exam || c.q;
  var pre = type === "简答" ? "简述" : (type === "论述" ? "试论" : "");
  if(pre && !/[？?]$/.test(q) && !/^(简述|试述|试论|比较|说明|论述|分析|评述|为什么)/.test(q)) q = pre + q;
  return {
    qid: "c-" + c.id + "-" + type, type: type, part: c.part, full: full,
    diff: c.type === "名词解释" ? 1 : 2, tag: "",
    pref: type === "论述" && c.type !== "论述" ? 0.45 : 1,
    q: q, chIds: [c.chId], refCards: [c.id],
    rubric: rubricFromCard(c, type, full),
    answer: "", hint: c.tip || ""
  };
}
function snapItem(e){
  return {
    qid: e.id, type: e.type, part: e.part, full: e.full, diff: e.difficulty || 2,
    tag: e.tag || "", pref: (e.difficulty || 2) >= 3 ? 1.2 : 0.9, q: e.q, chIds: (e.chIds || []).slice(), refCards: (e.refCards || []).slice(),
    rubric: e.rubric.map(function(r){ return {t:r.t, s:r.s}; }), answer: e.answer, hint: ""
  };
}
function buildPools(){
  var ming = [], jian = [], lun = [];
  CARDS.forEach(function(c){
    if(c.part === "中国音乐史"){
      if(c.type === "名词解释") ming.push(cardItem(c, "名词解释", 10));
      else jian.push(cardItem(c, "简答", 15));
    } else if(c.part === "西方音乐史"){
      lun.push(cardItem(c, "论述", 13));
    }
  });
  (EX.chapters || []).forEach(function(e){
    if(e.part === "西方音乐史") lun.push(snapItem(e));
  });
  ["items", "real", "hot"].forEach(function(k){
    (EX[k] || []).forEach(function(e){
      var it = snapItem(e);
      if(k === "real") it.pref = 1.3;
      if(it.type === "名词解释" && it.part === "中国音乐史") ming.push(it);
      else if(it.type === "简答" && it.part === "中国音乐史") jian.push(it);
      else if(it.type === "论述" && it.part === "西方音乐史") lun.push(it);
    });
  });
  return {ming:ming, jian:jian, lun:lun};
}
function weightedPick(arr, ws){
  var total = 0;
  ws.forEach(function(w){ total += w; });
  var r = Math.random() * total;
  for(var i = 0; i < arr.length; i++){ r -= ws[i]; if(r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}
function recentQids(n){
  var set = {}, list = examHistory().slice(-n);
  list.forEach(function(p){ (p.items || []).forEach(function(it){ set[it.qid] = 1; }); });
  return set;
}
function genItems(){
  var cfg = examCfg();
  var target = cfg.difficulty === "basic" ? 1 : (cfg.difficulty === "hard" ? 3 : 2);
  var pools = buildPools();
  var recent = recentQids(3);

  function prep(pool){
    return pool.filter(function(it){
      if(cfg.difficulty === "basic" && it.diff > 2) return false;
      if(!cfg.hot && it.tag === "押题") return false;
      return true;
    });
  }
  function pickMany(pool, count, minUnique){
    var base = prep(pool);
    var cands = base.filter(function(it){ return !recent[it.qid]; });
    if(cands.length < count) cands = base;
    var out = [], used = {};
    for(var i = 0; i < count; i++){
      var avail = cands.filter(function(it){ return out.indexOf(it) < 0; });
      if(!avail.length) break;
      if(out.length < (minUnique || 0)){
        var strict = avail.filter(function(it){ return !it.chIds.some(function(c){ return used[c]; }); });
        if(strict.length) avail = strict;
      }
      var ws = avail.map(function(it){
        var w = Math.max(0.12, 1 - 0.5 * Math.abs(it.diff - target));
        if(it.tag === "押题") w *= 1.5;
        if(it.pref) w *= it.pref;
        var dup = it.chIds.some(function(c){ return used[c]; });
        if(dup) w *= 0.22;
        return w;
      });
      var it = weightedPick(avail, ws);
      out.push(it);
      it.chIds.forEach(function(c){ used[c] = 1; });
    }
    return out;
  }
  return pickMany(pools.ming, 4, 3).map(function(it){ return fitItem(it, 10); })
    .concat(pickMany(pools.jian, 3, 3).map(function(it){ return fitItem(it, 15); }))
    .concat(pickMany(pools.lun, 5, 4).map(function(it){ return fitItem(it, 13); }));
}
function newPaper(){
  var cfg = examCfg();
  var items = genItems();
  var d = todayStr().replace(/-/g, "").slice(2);
  var n = examHistory().filter(function(p){ return p.date === todayStr(); }).length + 1;
  var paper = {
    id: "M-" + d + "-" + (n < 10 ? "0" : "") + n,
    date: todayStr(), ts: Date.now(),
    cfg: {difficulty:cfg.difficulty, hot:cfg.hot, duration:cfg.duration, mode:cfg.mode},
    items: items, answers: {}, startedAt: Date.now(), elapsed: 0, result: null
  };
  paper.items.forEach(function(it, i){ it.no = i + 1; });
  S.examDraft = paper;
  save();
  return paper;
}
function startExam(){
  if(S.examDraft && !confirm("还有一份未交卷的模拟卷，开始新的会丢弃它，继续吗？")) return;
  newPaper();
  examView = "paper";
  renderExam();
  startTimer();
}
function stopTimer(){ if(examTimer){ clearInterval(examTimer); examTimer = null; } }
function clockText(){
  var p = S.examDraft;
  if(!p) return "--:--";
  var total = (p.cfg.duration || 180) * 60;
  var left = total - Math.floor((Date.now() - p.startedAt) / 1000);
  var m = Math.floor(Math.abs(left) / 60), s = Math.abs(left) % 60;
  return (left < 0 ? "+" : "") + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function startTimer(){
  stopTimer();
  examTimer = setInterval(function(){
    var el = $("#clock");
    if(!el) return;
    el.textContent = clockText();
    var p = S.examDraft;
    if(p){
      var left = (p.cfg.duration || 180) * 60 - Math.floor((Date.now() - p.startedAt) / 1000);
      el.classList.toggle("warn", left < 900);
    }
  }, 1000);
}
function submitPaper(){
  var p = S.examDraft;
  if(!p) return;
  var blank = 0;
  p.items.forEach(function(it){ if(!p.answers[it.no]) blank++; });
  var msg = "确认交卷？交卷后不能再修改答案。";
  if(p.cfg.mode !== "paper" && blank) msg = "还有 " + blank + " 题没有作答，仍要交卷吗？";
  if(!confirm(msg)) return;
  p.elapsed = Math.max(1, Math.round((Date.now() - p.startedAt) / 60000));
  p.submittedAt = Date.now();
  examHistory().push(p);
  S.examCurrent = p.id;
  S.examDraft = null;
  save();
  stopTimer();
  examView = "review";
  renderExam();
}

function renderExam(){
  if(S.examDraft){ examView = "paper"; return renderPaper(); }
  if(examView === "review" && S.examCurrent && findExam(S.examCurrent)) return renderReview();
  if(examView === "result" && S.examCurrent && findExam(S.examCurrent)) return renderResult();
  if(examView === "hot" || examView === "real") return renderList(examView);
  return renderExamHome();
}

function renderList(mode){
  var isHot = mode === "hot";
  var list = isHot
    ? (EX.items || []).concat(EX.hot || []).filter(function(i){ return i.tag === "押题"; })
    : (EX.real || []).slice().sort(function(a, b){
        var ord = {"名词解释": 0, "简答": 1, "论述": 2};
        return (a.year - b.year) || (ord[a.type] - ord[b.type]);
      });
  var html = '<div class="exam-top"><span class="pill">' + (isHot ? "押题专区" : "历年真题") + '</span>' +
    '<span class="clock">' + list.length + ' 道</span>' +
    '<button class="seg" data-act="exam-home">返回</button></div>';
  if(isHot){
    html += '<div class="panel" style="margin-bottom:12px"><p class="mini" style="margin:0">' +
      '按广大出题规律做的预测：周年纪念、跨时期比较、当代议题。点开看评分点与思路，可直接加入背诵。</p></div>';
  } else {
    html += '<div class="panel" style="margin-bottom:12px"><p class="mini" style="margin:0">' +
      '2012—2023 年回忆版真题（剔除作品分析部分）。注意高频主题：学堂乐歌、礼乐制度、乐律、宋代市民音乐、歌剧。</p></div>';
  }
  var lastYear = null;
  html += '<div class="card" style="padding:4px 8px">';
  list.forEach(function(it){
    if(!isHot && it.year !== lastYear){
      lastYear = it.year;
      html += '<p class="mini" style="margin:10px 6px 4px;letter-spacing:.1em">' + it.year + ' 年</p>';
    }
    html += '<button class="crow" data-act="exam-item" data-id="' + it.id + '">' +
      '<i class="dot" data-s="learn"></i><span>' + esc(it.q) + '</span>' +
      '<em>' + esc(it.type) + ' · ' + it.full + '分</em></button>';
  });
  html += '</div>';
  $("#view-exam").innerHTML = html;
}

function addItemToReview(id){
  var it = EXAM_MAP[id];
  if(!it) return;
  var t = todayStr(), n = 0;
  (it.refCards || []).forEach(function(cid){
    if(!BY_ID[cid]) return;
    var c = S.cards[cid] || {stage:0, seen:0, lapses:0};
    c.stage = 0; c.due = t; c.last = t; c.seen = (c.seen || 0) + 1;
    S.cards[cid] = c; n++;
  });
  save();
  closeCard();
  toast(n ? "已加入今日复习（" + n + " 张卡片）" : "该题暂无关联卡片");
}

    '<div class="score"><b>' + r.lenient + '</b><small>从宽</small></div>' +
  '</div>';
  if(r.comment) html += '<div class="panel" style="margin-top:12px"><p class="mini" style="margin:0">' + esc(r.comment) + '</p></div>';

  html += '<div class="sec-title"><b>逐题得分</b><span>满分 150</span></div><div class="panel"><table class="rub">';
  (r.items || []).forEach(function(it){
    var item = p.items[it.no - 1];
    html += '<tr><td>' + it.no + '. ' + esc(item ? item.q.slice(0, 22) : "") + (item && item.q.length > 22 ? "…" : "") + '</td>' +
      '<td>' + it.score + '/' + (item ? item.full : "") + '</td></tr>';
    if(it.lost) html += '<tr><td colspan="2" class="lost">失分：' + esc(it.lost) + '</td></tr>';
  });
  html += '</table></div>';

  var weak = [];
  (r.items || []).forEach(function(it){
    var item = p.items[it.no - 1];
    if(!item) return;
    if(it.score < item.full * 0.6){
      (it.cards && it.cards.length ? it.cards : item.refCards || []).forEach(function(cid){
        if(BY_ID[cid] && weak.indexOf(cid) < 0) weak.push(cid);
      });
    }
  });
  if(weak.length){
    if(!Object.keys(examChecks).length) weak.forEach(function(c){ examChecks[c] = true; });
    html += '<div class="sec-title"><b>没掌握的考点</b><span>勾选加入复习</span></div><div class="panel">';
    weak.forEach(function(cid){
      var c = BY_ID[cid];
      html += '<label class="chk"><input type="checkbox" data-cid="' + cid + '"' + (examChecks[cid] ? " checked" : "") + '>' +
        '<span><b style="font-weight:600">' + esc(c.q) + '</b><br><span class="mini">' + esc(c.part) + ' · ' + esc(c.chTitle) + '</span></span></label>';
    });
    html += '</div>';
    if(p.applied) html += '<p class="mini center" style="margin:12px 0 0">✓ 这些考点已加入复习队列</p>';
    else html += '<div style="margin-top:12px"><button class="btn" data-act="exam-apply">加入艾宾浩斯复习队列</button></div>';
  }
  html += '<div style="margin-top:12px"><button class="btn ghost" data-act="exam-again">再考一套</button></div>';
  $("#view-exam").innerHTML = html;
}

function gradePack(p){
  var L = [];
  L.push("【模拟卷批改请求】");
  L.push("试卷编号：" + p.id + "　日期：" + p.date);
  L.push("科目：广州大学 713 中西音乐史（模拟）　满分：150 分");
  L.push("难度：" + lvlName(p.cfg.difficulty) + "　用时：" + p.elapsed + " 分钟");
  L.push("作答方式：" + (p.cfg.mode === "paper" ? "纸上作答，答题照片按题号顺序附上" : "电子作答，答案见每题下方"));
  L.push("");
  p.items.forEach(function(it){
    L.push(it.no + ".（" + it.full + " 分）" + it.q);
    if(p.cfg.mode !== "paper") L.push("   我的作答：" + (p.answers[it.no] || "（未作答）"));
    L.push("   评分点：");
    it.rubric.forEach(function(r){ L.push("   - " + r.t + "（" + r.s + " 分）"); });
    if(it.answer) L.push("   参考答案：" + it.answer);
    if(it.refCards && it.refCards.length) L.push("   关联卡片：" + it.refCards.join(","));
    L.push("");
  });
  L.push("【请只返回下面这个 JSON，不要输出任何其他文字】");
  L.push(JSON.stringify({paper:p.id, strict:0, mid:0, lenient:0,
    items:[{no:1, score:0, lost:"", cards:[]}], comment:""}, null, 2));
  L.push("");
  L.push("打分口径：strict＝从严，只认踩点，表述含糊不给分；mid＝按考研评分标准；lenient＝从宽，有合理延伸可给分。");
  L.push("cards 填该题失分对应的关联卡片 id；comment 控制在 100 字以内。");
  return L.join("\n");
}
function copyText(text, ok){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text, ok); });
  } else fallbackCopy(text, ok);
}
function fallbackCopy(text, ok){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
  ok();
}
function openImport(){
  var p = findExam(S.examCurrent);
  if(!p) return;
  $("#modal").hidden = false;
  $("#modal").innerHTML = '<div class="sheet">' +
    '<h2 style="margin-top:0;font-size:17px">粘贴批改结果</h2>' +
    '<p class="mini" style="margin:6px 0 12px">把 AI 返回的 JSON 原样贴进来即可。</p>' +
    '<textarea class="ansbox" id="resBox" style="min-height:180px" placeholder=\'{"paper":"' + p.id + '", "strict":0, ...}\'></textarea>' +
    '<div class="sheet-actions"><button class="btn ghost" data-act="modal-close">取消</button>' +
    '<button class="btn" data-act="exam-apply-result">确认导入</button></div></div>';
}
function applyResultText(){
  var p = findExam(S.examCurrent);
  var box = $("#resBox");
  if(!p || !box) return;
  var raw = (box.value || "").trim().replace(/^```(json)?/i, "").replace(/```$/, "").trim();
  if(!raw){ toast("先粘贴批改结果"); return; }
  var obj;
  try { obj = JSON.parse(raw); } catch(e){ toast("格式不对，请粘贴完整 JSON"); return; }
  var num = function(v, d){ var n = Number(v); return isFinite(n) ? n : d; };
  p.result = {
    strict: Math.round(num(obj.strict, 0)),
    mid: Math.round(num(obj.mid, 0)),
    lenient: Math.round(num(obj.lenient, 0)),
    items: (obj.items || []).map(function(it){
      return {no: num(it.no, 0), score: num(it.score, 0), lost: it.lost || "", cards: it.cards || []};
    }),
    comment: obj.comment || ""
  };
  examChecks = {};
  save();
  closeCard();
  examView = "result";
  renderExam();
  toast("批改结果已导入");
}
function applyWeak(){
  var ids = Object.keys(examChecks).filter(function(k){ return examChecks[k]; });
  if(!ids.length){ toast("没有勾选考点"); return; }
  var t = todayStr(), n = 0;
  ids.forEach(function(id){
    if(!BY_ID[id]) return;
    var c = S.cards[id] || {stage:0, seen:0, lapses:0};
    c.stage = 0; c.lapses = (c.lapses || 0) + 1; c.due = addDays(t, 1); c.last = t;
    c.seen = (c.seen || 0) + 1;
    S.cards[id] = c; n++;
  });
  var cur = findExam(S.examCurrent);
  if(cur) cur.applied = true;
  save();
  toast(n + " 个考点已加入复习，明天到期");
  examChecks = {};
  renderExam();
}

/* ---------------- 事件 ---------------- */
document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]");
  if(!el) return;
  var a = el.dataset.act;

  if(a === "tab"){
    state.tab = el.dataset.tab;
    $$(".tab").forEach(function(b){ b.classList.toggle("on", b.dataset.tab === state.tab); });
    $$(".view").forEach(function(v){ v.hidden = v.dataset.view !== state.tab; });
    render();
  }
  else if(a === "exam-diff"){ examCfg().difficulty = el.dataset.v; save(); renderExamHome(); }
  else if(a === "exam-hot"){ examCfg().hot = el.dataset.v === "1"; save(); renderExamHome(); }
  else if(a === "exam-mode"){ examCfg().mode = el.dataset.v; save(); renderExamHome(); }
  else if(a === "exam-dur"){ examCfg().duration = parseInt(el.dataset.v, 10) || 180; save(); renderExamHome(); }
  else if(a === "exam-start"){ startExam(); }
  else if(a === "exam-submit"){ submitPaper(); }
  else if(a === "exam-home"){ examView = "home"; renderExam(); }
  else if(a === "exam-open"){
    var pid = el.dataset.id, pp = findExam(pid);
    if(pp){ S.examCurrent = pid; examView = pp.result ? "result" : "review"; renderExam(); }
  }
  else if(a === "exam-pack"){
    var pk = findExam(S.examCurrent);
    if(pk) copyText(gradePack(pk), function(){ toast("批改包已复制，去对话里粘贴并发照片"); });
  }
  else if(a === "exam-import"){ openImport(); }
  else if(a === "exam-apply-result"){ applyResultText(); }
  else if(a === "exam-apply"){ applyWeak(); }
  else if(a === "exam-again"){ examView = "home"; renderExam(); }
  else if(a === "exam-hot-list"){ examView = "hot"; renderExam(); }
  else if(a === "exam-real-list"){ examView = "real"; renderExam(); }
  else if(a === "exam-item"){ openItem(el.dataset.id); }
  else if(a === "exam-add"){ addItemToReview(el.dataset.id); }
  else if(a === "start"){ startSession(false); }
  else if(a === "close"){ closeStudy(); }
  else if(a === "reveal"){ study.revealed = true; renderStudy(); }
  else if(a === "rate"){ if(study && study.revealed) rate(study.queue[study.i], el.dataset.lvl); }
  else if(a === "chapter"){
    var ch = el.dataset.ch;
    state.open[ch] = !state.open[ch];
    renderLibList();
  }
  else if(a === "part"){ state.part = el.dataset.part; renderLib(); }
  else if(a === "card"){ openCard(el.dataset.id); }
  else if(a === "modal-close"){ closeCard(); }
  else if(a === "master"){
    var id = el.dataset.id;
    S.cards[id] = {stage:5, due:addDays(todayStr(), 30), last:todayStr(), seen:(S.cards[id]?S.cards[id].seen:0)+1, lapses:(S.cards[id]?S.cards[id].lapses:0)};
    save(); closeCard(); render(); toast("已标记为掌握");
  }
  else if(a === "quota-inc"){ S.settings.quota = Math.min(40, S.settings.quota + 1); save(); renderMe(); }
  else if(a === "quota-dec"){ S.settings.quota = Math.max(2, S.settings.quota - 1); save(); renderMe(); }
  else if(a === "pace"){ S.settings.pace = el.dataset.pace; save(); renderMe(); }
  else if(a === "export"){ exportData(); }
  else if(a === "import"){ $("#importFile").click(); }
  else if(a === "reset"){
    if(confirm("确定清空所有学习进度？此操作不可恢复。")){
      S = defaultState(); save(); render(); toast("已清空");
    }
  }
});

document.addEventListener("input", function(ev){
  if(ev.target && ev.target.id === "search"){
    state.q = ev.target.value;
    renderLibList();
  }
  if(ev.target && ev.target.classList && ev.target.classList.contains("ansbox") && ev.target.dataset.no){
    if(S.examDraft){
      S.examDraft.answers[ev.target.dataset.no] = ev.target.value;
      clearTimeout(window.__ansT);
      window.__ansT = setTimeout(function(){ save(); }, 500);
    }
  }
});
document.addEventListener("change", function(ev){
  if(ev.target && ev.target.id === "examInput"){
    var v = ev.target.value;
    if(v){ S.settings.exam = v; save(); render(); }
  }
  if(ev.target && ev.target.dataset && ev.target.dataset.cid){
    examChecks[ev.target.dataset.cid] = ev.target.checked;
  }
  if(ev.target && ev.target.id === "importFile"){
    var f = ev.target.files && ev.target.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var o = JSON.parse(reader.result);
        if(!o || !o.settings || !o.cards) throw new Error("bad");
        S = o; if(!S.days) S.days = {}; save(); render(); toast("导入成功");
      } catch(e){ toast("文件格式不正确"); }
      ev.target.value = "";
    };
    reader.readAsText(f);
  }
});

document.addEventListener("keydown", function(ev){
  if($("#overlay").hidden || !study) return;
  if(ev.key === "Escape"){ closeStudy(); return; }
  if(ev.key === " " || ev.key === "Enter"){
    ev.preventDefault();
    if(!study.revealed){ study.revealed = true; renderStudy(); }
    return;
  }
  if(study.revealed){
    if(ev.key === "1") rate(study.queue[study.i], "forgot");
    else if(ev.key === "2") rate(study.queue[study.i], "vague");
    else if(ev.key === "3") rate(study.queue[study.i], "got");
  }
});

function registerSW(){
  if(typeof navigator === "undefined" || !("serviceWorker" in navigator)) return;
  if(location.protocol !== "http:" && location.protocol !== "https:") return;
  var had = !!navigator.serviceWorker.controller;
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(had) setTimeout(function(){ toast("已更新到新版本"); }, 600);
    had = true;
  });
}
function offlineReady(){
  return typeof navigator !== "undefined" && ("serviceWorker" in navigator) && !!navigator.serviceWorker.controller;
}

function exportData(){
  var blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "音乐史打卡备份-" + todayStr() + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  toast("备份已导出");
}

/* ---------------- 启动 ---------------- */
storageOK = probeStorage();
registerSW();
S = load();
if(!S.exams) S.exams = [];
if(!S.settings.examCfg) S.settings.examCfg = {difficulty:"standard", hot:true, duration:180, mode:"paper"};
day();           // 记录当日基线
render();
})();
</script>
