成「现代音乐」的接受难题。","为当代音乐、影视音乐、电子音乐提供语汇。"],"keys":["调性瓦解","音响拓展","接受难题"],"tip":"「破调性、拓音响、远大众」——三点收尾。"},{"q":"德彪西","type":"名词解释","pts":["德彪西是法国作曲家，印象主义音乐的开创者，20 世纪现代音乐的先驱。","他反对德奥浪漫主义的冗长厚重，追求音响的色彩、瞬间的氛围与朦胧的美感。","他常用全音阶、五声音阶，摆脱大小调功能体系；和弦按色彩而非功能连接，不强调解决，和声处于漂浮状态。","其旋律短小零碎，多为片段式动机；配器细腻精致，追求层次叠置与光影变化。","《牧神午后前奏曲》是印象主义的开山之作，《大海》为三首交响素描，钢琴曲《月光》以平行和弦写出水波月影。"],"keys":["德彪西","牧神午后","大海","月光","全音阶"],"tip":"「牧神、大海、月光」三作品串起整个印象派。","extra":true},{"q":"拉威尔","type":"名词解释","pts":["拉威尔是法国作曲家，印象主义音乐的另一位代表，与德彪西并称「印象派双峰」。","他更重结构清晰、配器精密与形式感，深受古典传统、西班牙民间音乐与爵士乐影响。","他被誉为「管弦乐色彩大师」，配器精妙，每件乐器都放在最合适的位置；节奏精准，舞曲感强烈。","《波莱罗》以同一旋律作 18 遍变奏，节奏固定不变，仅靠配器逐层叠加把力度从极弱推到极强。","《达芙妮与克洛埃》芭蕾音乐配器绚丽，《G 大调钢琴协奏曲》融入爵士乐元素。"],"keys":["拉威尔","波莱罗","管弦乐色彩大师","达芙妮与克洛埃"],"tip":"「用配器代替和声发展」——《波莱罗》一句话说尽拉威尔。","extra":true},{"q":"勋伯格","type":"名词解释","pts":["勋伯格是奥地利作曲家，新维也纳乐派的核心与领袖，十二音体系的创始人。","其创作分三个阶段：晚期浪漫主义（《升华之夜》）、自由无调性（《月迷彼埃罗》）、十二音体系。","十二音体系把八度内十二个半音排成固定音列，以原形、逆行、倒影、逆行倒影四种形式组织全曲，十二音地位平等、彻底取消主音。","《钢琴组曲》Op.25 是第一首完全采用十二音技法的作品，《华沙幸存者》是十二音技法的巅峰。","他瓦解了统治三百余年的大小调体系，直接启发战后整体序列主义与先锋派音乐。"],"keys":["勋伯格","十二音体系","月迷彼埃罗","华沙幸存者","新维也纳乐派"],"tip":"「三阶段 + 四变形」——原、逆、倒、逆倒。","extra":true},{"q":"贝尔格","type":"名词解释","pts":["贝尔格是奥地利作曲家，勋伯格的学生，新维也纳乐派成员。","他是三人中把无调性音乐与传统形式结合得最紧密、最富情感表现力的一位，十二音中仍保留调性暗示。","他把无调性技法植入歌剧、协奏曲等传统体裁，音乐兼具抒情性与戏剧张力。","其作品常以回文结构、对称段落与数字 3、7 为组织原则，体现精密逻辑。","歌剧《沃采克》是表现主义歌剧代表作（自由无调性），《璐璐》用十二音体系，《小提琴协奏曲》融入巴赫众赞歌。"],"keys":["贝尔格","沃采克","璐璐","小提琴协奏曲","新维也纳乐派"],"tip":"「勋伯格定规矩、贝尔格装感情、韦伯恩榨干骨架」——三人分工。","extra":true},{"q":"韦伯恩","type":"名词解释","pts":["韦伯恩是奥地利作曲家，勋伯格的学生，新维也纳乐派成员。","他把十二音体系推向极端简化与浓缩，作品篇幅极短，音乐语言高度凝练。","他创「点描织体」：单个音符孤立分布，音与音之间是巨大的沉默间隙，与浪漫主义的线状旋律迥异。","其序列运用以倒影、逆行、逆行倒影为主，结构精密对称，并把序列拆成三音、四音小组，以极简材料组织全曲。","代表作《六首管弦乐小品》《交响曲》《变奏曲》，最小作品仅 12 小节，其写法直接启示战后整体序列主义。"],"keys":["韦伯恩","点描织体","六首管弦乐小品","整体序列主义"],"tip":"「点描 + 极短」——总时长五分钟，最小 12 小节。","extra":true},{"q":"斯特拉文斯基","type":"名词解释","pts":["斯特拉文斯基是美籍俄罗斯作曲家，20 世纪最重要的作曲家之一，被誉为「音乐界的毕加索」。","俄罗斯风格时期以民间音乐、神话与原始仪式为题材，《火鸟》是成名作，《春之祭》以不规则重音、复节奏与多调性颠覆传统。","新古典主义时期回归 18 世纪巴洛克与古典的形式，《浦契涅拉》被视为新古典主义的开山之作。","序列主义时期受韦伯恩影响转向十二音，《管弦乐队变奏曲》是第一首完全使用十二音序列的重要乐队作品。","其创作三阶段被视为 20 世纪音乐风格的「活地图」。"],"keys":["斯特拉文斯基","春之祭","浦契涅拉","新古典主义","音乐界的毕加索"],"tip":"「俄—古—序」三阶段：原始主义、新古典、序列。","extra":true},{"q":"施托克豪森","type":"名词解释","pts":["施托克豪森是德国作曲家，20 世纪下半叶先锋派的核心人物，整体序列主义与偶然音乐的双重代表。","他把序列原则从音高扩展到节奏、力度、音色、演奏法，追求对音乐材料的绝对控制。","偶然音乐作品《钢琴曲十一首》让演奏者在乐谱上随机选择片段并按任意顺序演奏，体现「开放曲式」理念。","电子音乐代表作《少年之歌》把人声与电子音响结合，是电子音乐史上的重要里程碑。","其创作连接了序列主义、电子音乐与空间音乐，深刻影响战后先锋派的发展。"],"keys":["施托克豪森","钢琴曲十一首","少年之歌","整体序列","电子音乐"],"tip":"「一手序列、一手偶然」——《钢琴曲十一首》开曲式、《少年之歌》开电子。","extra":true},{"q":"巴托克","type":"名词解释","pts":["巴托克是匈牙利作曲家、钢琴家、民族音乐学家，新民族主义音乐最核心的代表人物。","他深入东欧、北非、土耳其采集民歌，系统分析其调式、节奏与结构，再融入现代和声与复调，形成独特风格。","其创作以线性复调为主，声部独立清晰、织体透明，感情克制，用不协和音与不对称节奏刻画现代人的复杂内心。","代表作《管弦乐队协奏曲》《舞蹈组曲》《小宇宙》、歌剧《蓝胡子的城堡》。","六首弦乐四重奏被视为其最高艺术成就，作品逻辑严密、结构精炼。"],"keys":["巴托克","管弦乐队协奏曲","小宇宙","蓝胡子的城堡","新民族主义"],"tip":"「采民歌 + 六首四重奏」——民族音乐学家与作曲家两个身份。","extra":true},{"q":"布里顿","type":"名词解释","pts":["布里顿是英国作曲家、指挥家、钢琴家，20 世纪英国最重要的作曲家之一，使英国歌剧重新走向世界。","歌剧《彼得·格莱姆斯》以渔村悲剧写个人与社会的冲突，是 20 世纪英国歌剧的开山之作。","《战争安魂曲》为二战死难者而作，把拉丁安魂弥撒与英国诗人欧文的诗并置，兼用合唱、独唱与童声。","《青少年管弦乐队指南》以普赛尔主题写变奏与赋格，逐件介绍管弦乐队乐器，是著名的音乐普及作品。","其创作兼顾传统曲式与现代技法，题材多关注人性、战争与边缘人的命运。"],"keys":["布里顿","彼得·格莱姆斯","战争安魂曲","青少年管弦乐队指南"],"tip":"「一歌剧、一安魂、一指南」——英国歌剧复兴三件代表作（讲义未直接展开）。","extra":true},{"q":"肖斯塔科维奇","type":"名词解释","pts":["肖斯塔科维奇是苏联时期最重要的作曲家，创作以交响曲与弦乐四重奏为核心。","其音乐兼具悲剧性的深刻与讽刺性的尖锐，常以不协和音响与激烈节奏表达对社会现实的复杂态度。","《第七「列宁格勒」交响曲》写战争，第一乐章的「入侵主题」以简单动机反复递增，震撼人心。","《第五交响曲》以从阴暗到辉煌的转变成为其最著名的作品。","他被誉为「苏联音乐的良心」，音乐记录了 20 世纪苏联社会的沉重历史。"],"keys":["肖斯塔科维奇","第七列宁格勒","第五交响曲","苏联音乐的良心"],"tip":"「七写战争、五写转折」——两部交响各记一句。","extra":true},{"q":"普罗科菲耶夫","type":"名词解释","pts":["普罗科菲耶夫是 20 世纪俄罗斯作曲家，音乐以尖锐的不协和音响、鲜明的节奏动力与清晰的古典结构为特征。","交响童话《彼得与狼》用不同乐器代表角色，是儿童音乐教育的经典。","芭蕾舞剧《罗密欧与朱丽叶》把悲剧爱情转化为交响化的舞剧音乐，《第三钢琴协奏曲》以独特主题与辉煌技巧闻名。","《第七交响曲》是其最后一部交响曲，带有温暖的怀旧气息。","其风格介于新古典主义与现代主义之间，既有激进音响又保持旋律的可听性与古典结构逻辑。"],"keys":["普罗科菲耶夫","彼得与狼","罗密欧与朱丽叶","第三钢琴协奏曲"],"tip":"「一童话一舞剧一协奏」——《彼得与狼》是最好记的入口。","extra":true},{"q":"瓦列兹","type":"名词解释","pts":["瓦列兹是法裔美国作曲家，20 世纪电子音乐与噪音实验的先驱。","他早年以打击乐为核心写作，《电离》全部使用打击乐器，把噪音与节奏当作独立的音乐语言。","《电子音诗》为 1958 年布鲁塞尔世博会而作，利用数百个扬声器制造空间音响，是电子音乐史上的里程碑。","他主张解放一切音响，为具体音乐、电子音乐与新音色的探索开辟了道路。","其观念直接影响了战后先锋派对「音源」与「空间」的理解。"],"keys":["瓦列兹","电子音诗","电离","电子音乐","噪音"],"tip":"「《电离》写打击、《电子音诗》写电子」；讲义只提到《电子音诗》。","extra":true},{"q":"科普兰","type":"名词解释","pts":["科普兰是美国作曲家，20 世纪美国民族主义音乐的代表人物。","他以美国本土民间音乐（牛仔歌曲、教堂赞美诗、爵士乐）为基础，营造开阔明朗的「美国音响」。","芭蕾《阿巴拉契亚之春》以开阔纯朴的音响成为美国音乐最具辨识度的作品。","另有《牧场竞技》《小伙子比利》与三部交响曲，题材多取美国西部与乡村生活。","他使美国专业音乐摆脱对欧洲的模仿，确立了本土化的音乐语言。"],"keys":["科普兰","阿巴拉契亚之春","小伙子比利","美国音响"],"tip":"「三部芭蕾」：阿巴拉契亚之春、牧场竞技、小伙子比利。","extra":true},{"q":"拼贴音乐","type":"名词解释","pts":["拼贴音乐是20世纪西方现代音乐中的一种手法与流派，把不同风格、不同来源的现成音乐片段并置拼贴。","它常引用已有的乐曲、民歌、流行曲调等材料，打破原作的完整性，形成多元并置、引用与反讽的效果。","代表作曲家如艾夫斯、克拉姆等，在作品中大量使用拼贴手法。","拼贴音乐体现20世纪音乐对传统统一性、原创性观念的突破，是后现代音乐的重要特征之一。"],"keys":["拼贴音乐","现成素材","并置","艾夫斯","后现代"],"tip":"「把现成音乐剪贴并置」——20世纪的拼贴（collage）。","extra":true,"syl":false,"sylNote":"考纲未列拼贴音乐"},{"q":"《一个华沙的幸存者》","type":"名词解释","pts":["《一个华沙的幸存者》是勋伯格1947年创作的合唱作品（Op.46），为朗诵、男声合唱与管弦乐队而作。","作品取材于二战期间华沙犹太区幸存者的经历，以幸存者的叙述与合唱的怒吼形成强烈戏剧对比。","它采用十二音技法，是勋伯格十二音创作的巅峰之作，也是表现主义音乐的杰作。","作品以音乐控诉法西斯暴行，具有强烈的现实关怀与震撼力。"],"keys":["一个华沙的幸存者","勋伯格","十二音技法","朗诵合唱","表现主义"],"tip":"「勋伯格用十二音写华沙犹太区幸存者」——表现主义的控诉。","extra":true,"syl":false,"sylNote":"考纲仅列勋伯格"},{"q":"线性复调","type":"名词解释","pts":["线性复调是20世纪新古典主义、新客观性音乐中恢复的一种复调手法，强调各声部横向线条的独立清晰。","它弱化和声的功能性，使织体透明、声部线条各自展开，形成对浪漫主义和声厚重的反拨。","欣德米特、斯特拉文斯基等作曲家常用这一手法，其做法与中世纪、文艺复兴的线性复调遥相呼应。","线性复调体现了20世纪音乐在复古中求新的倾向，是「回到巴赫」口号在技法上的具体实践。"],"keys":["线性复调","新古典主义","声部独立","欣德米特","织体透明"],"tip":"「各声部横着走、织体透明」——新古典主义的线性复调。","extra":true,"syl":false,"sylNote":"考纲未列线性复调"},{"q":"整体序列主义","type":"名词解释","pts":["整体序列主义是20世纪50年代在十二音技法基础上发展起来的作曲体系，又称整体序列音乐。","它把音高、节奏、时值、力度、音色等音乐参数都纳入序列控制，全面组织音乐材料。","代表作曲家为梅西安、布列兹、施托克豪森等，如布列兹的《结构Ⅰ》。","它把序列思维推向极致，也因机械性引发偶然音乐、音色音乐等后来流派的反拨。"],"keys":["整体序列主义","十二音","布列兹","梅西安","全面控制"],"tip":"「音高、节奏、力度、音色全部系列化」——序列的极致。","extra":true,"syl":true,"sylNote":"考纲列序列音乐"},{"q":"简述偶然音乐。","type":"简答","pts":["偶然音乐是20世纪中叶兴起的先锋派音乐，作曲家只规定作品的大致框架，细节由演奏者或偶然因素决定。","代表人物是约翰·凯奇，代表作有《4分33秒》《0′00″》等，前者全曲无声，让听众聆听环境之声。","其观念受东方禅宗与《易经》影响，打破作曲家对作品的完全控制，强调「听」与偶然。","偶然音乐引发了对音乐本质、作品概念的讨论，是二战后先锋派音乐的重要方向。"],"keys":["偶然音乐","约翰·凯奇","4分33秒","先锋派","不确定性"],"tip":"「凯奇《4分33秒》——全曲无声，让偶然与环境发声」。","extra":true,"syl":false,"sylNote":"考纲未列偶然音乐"},{"q":"《春之祭》","type":"名词解释","pts":["《春之祭》是斯特拉文斯基1913年创作的芭蕾舞剧，由佳吉列夫的俄罗斯芭蕾舞团首演。","作品描写远古俄罗斯的春天献祭仪式，体现原始主义音乐风格。","音乐以不规则重音、复节奏、多调性与强烈的音响对比彻底颠覆了传统音乐语言。","首演引发剧场骚动，成为20世纪现代音乐的里程碑之作。"],"keys":["春之祭","斯特拉文斯基","原始主义","复节奏","现代音乐"],"tip":"「1913首演大乱+不规则重音与复节奏」——20世纪的震撼弹。","extra":true,"syl":false,"sylNote":"考纲仅列斯特拉文斯基"},{"q":"微分音乐","type":"名词解释","pts":["微分音乐是20世纪运用小于半音的音程（微分音，microtone）创作的现代音乐。","它突破十二平均律的半音限制，把一个八度细分为四分之一音、六分之一音等更多音级。","捷克作曲家哈巴是微分音乐的代表，创用四分音体系并写作微分音歌剧。","微分音乐拓展了音高材料与音响色彩，是20世纪先锋派探索的重要方向。"],"keys":["微分音乐","微分音","四分音","哈巴","20世纪"],"tip":"「把半音再切小」——微分音，哈巴的四分音体系。","extra":true,"syl":false,"sylNote":"考纲未列微分音乐"},{"q":"列举 20 世纪 5 个音乐流派。","type":"简答","pts":["印象主义音乐以德彪西、拉威尔为代表，用色彩性和声、全音阶与细腻配器描绘光影与意境。","表现主义音乐以勋伯格、贝尔格、韦伯恩为代表，用无调性与十二音技法表现强烈的主观情感。","新古典主义音乐以斯特拉文斯基、欣德米特、法国六人团为代表，主张回到古典形式，织体清晰、情感克制。","民族主义音乐以巴托克、科普兰、格什温等为代表，运用本民族民间音乐素材；此外还有序列音乐、偶然音乐、电子音乐、微分音乐、拼贴音乐、简约派等。"],"keys":["印象主义","表现主义","新古典主义","民族主义","序列音乐"],"tip":"「印象、表现、新古典、民族、序列」五派打底。","extra":true,"syl":true,"sylNote":"考纲列印象、表现、新古典等"},{"q":"《画家马蒂斯》","type":"名词解释","pts":["《画家马蒂斯》是欣德米特1934—1935年创作的歌剧，取材于德国文艺复兴画家马蒂斯·格吕内瓦尔德的生活。","作品表现艺术家在宗教改革动荡中的精神挣扎，具有强烈的社会与政治隐喻，曾因纳粹阻挠而延后首演。","欣德米特又据此写成同名交响曲，由《天使的音乐会》《埋葬》《圣安东尼的诱惑》三个乐章组成。","它是新古典主义、新客观性音乐的代表作，织体清晰、线性复调突出。"],"keys":["画家马蒂斯","欣德米特","歌剧","交响曲","新古典主义"],"tip":"「欣德米特：歌剧+三乐章交响曲《画家马蒂斯》」。","extra":true,"syl":false,"sylNote":"考纲未列欣德米特"},{"q":"论述 20 世纪上半叶现代音乐的主要流派及其对传统音乐观念的突破。","type":"论述","pts":["印象主义音乐以德彪西、拉威尔为代表，用色彩性和声、全音阶、平行和弦与细腻配器取代传统的功能和声与动机发展。","表现主义音乐以勋伯格、贝尔格、韦伯恩为代表，从半音化走向无调性，进而创立十二音体系，表现强烈的主观情感。","新古典主义音乐以斯特拉文斯基、欣德米特、法国六人团为代表，主张回到巴赫以前的古典形式，织体清晰、情感克制、客观冷静。","民族主义音乐以巴托克、亚那切克、科普兰、格什温等为代表，把民间音乐的调式、节奏与音色引入专业创作。","这些流派共同突破了传统的大小调体系、功能和声、优美旋律与匀称形式，使音乐走向多调性、无调性、复杂节奏与多元风格。"],"keys":["印象主义","表现主义","新古典主义","民族主义","调性瓦解"],"tip":"「印象调色、表现无调、新古典复古、民族寻根」——四派共破传统。","extra":true,"syl":true,"sylNote":"考纲列印象、表现、新古典"},{"q":"列举 5 个二十世纪音乐流派。","type":"简答","pts":["印象主义音乐以德彪西、拉威尔为代表，用色彩性和声、全音阶与细腻配器描绘光影意境。","表现主义音乐以勋伯格、贝尔格、韦伯恩为代表，用无调性与十二音技法表现强烈的主观情感。","新古典主义音乐以斯特拉文斯基、欣德米特、法国六人团为代表，主张回到古典形式、织体清晰。","此外还有民族主义音乐（巴托克、科普兰）、序列音乐、偶然音乐、电子音乐、微分音乐、拼贴音乐与简约派等。"],"keys":["印象主义","表现主义","新古典主义","民族主义","序列音乐"],"tip":"「印象、表现、新古典、民族、序列」五派打底。","extra":true,"syl":true,"sylNote":"考纲列印象、表现、新古典等"},{"q":"新维也纳乐派","type":"名词解释","pts":["新维也纳乐派是20世纪表现主义音乐的代表乐派，核心人物是勋伯格及其学生贝尔格、韦伯恩。","三人都活动于维也纳，故称「新维也纳乐派」，又称第二维也纳乐派。","勋伯格创立十二音体系，贝尔格、韦伯恩加以发展，作品以无调性、强烈的表现主义情感为特征。","代表作有勋伯格《一个华沙的幸存者》、贝尔格歌剧《沃采克》、韦伯恩的十二音小品，对20世纪现代音乐影响巨大。"],"keys":["新维也纳乐派","勋伯格","贝尔格","韦伯恩","十二音"],"tip":"「勋伯格+贝尔格+韦伯恩=新维也纳乐派，十二音大本营」。","extra":true,"syl":true,"sylNote":"考纲列表现主义、勋伯格等"}]}]},{"part":"作品分析","short":"析","chapters":[{"id":"f01","num":"附","title":"曲式与和声基础","era":"考试第三部分 · 选学","intro":"作品分析的骨架：结构原则、曲式类型、和声语汇。","cards":[{"q":"曲式发展的基本结构原则与陈述类型","type":"简答","pts":["结构原则：重复、对比、展开（变奏）、再现。","陈述类型：呈示型（稳定、完整）、展开型（片段、不稳定）、结束型（收束）。","表现手段：旋律、节奏、织体、和声、音色。","分析时先判断原则，再判断曲式类型。"],"keys":["重复","对比","展开","呈示型","展开型"],"tip":"「四原则、三陈述」——答题先列框架。"},{"q":"一部曲式（乐段）","type":"名词解释","pts":["由若干乐句构成的完整结构单位，可独立成曲。","乐句通常 4 或 8 小节，以终止划分。","平行乐段（a+a'）与对比乐段（a+b）。","单乐段、复乐段；可带引子与尾声。"],"keys":["乐段","乐句","终止","平行乐段"],"tip":"「句—段—终止」三级单位，图示要标小节数。"},{"q":"单二部曲式","type":"名词解释","pts":["由两个乐段构成，AB。","有再现的单二（AB，B 含 A 材料）与无再现的单二（AB 对比）。","常用于艺术歌曲、舞曲、进行曲。","结构图需标明引子、尾声与调性。"],"keys":["单二部","AB","有再现","无再现"],"tip":"「单二看 B 段有没有回头」。"},{"q":"单三部曲式","type":"名词解释","pts":["ABA 三段结构，A 与 A' 为再现关系。","中段分「展开性中段」（发展 A 材料）与「对比性中段」（新材料）。","常用于钢琴小品、歌曲。","与单二部的区别：A 段是否完整再现。"],"keys":["单三部","ABA","展开性中段","对比性中段"],"tip":"「单三 ABA、复三 ABA 但每部大于乐段」。"},{"q":"复三部曲式","type":"名词解释","pts":["ABA 结构，每个部分本身大于乐段（常为单二或单三部）。","中段常为「三声中部」（Trio），结构完整、调性对比。","典型用于交响曲的谐谑曲、圆舞曲。","图示须标出各部的次级结构与调性。"],"keys":["复三部","三声中部","Trio"],"tip":"判断标准只有一条：每部是否大于乐段。"},{"q":"和声分析的基本语汇","type":"简答","pts":["正三和弦（I、IV、V）与副三和弦（II、III、VI、VII）。","终止四六和弦（K46）、属七、属九、属十一、十三和弦。","重属和弦、副属和弦，形成离调。","一级关系转调、等音转调、交替大小调。","和弦外音：经过音、辅助音、延留音、先现音。","持续音：主持续、属持续。"],"keys":["正三和弦","终止四六","重属和弦","离调","持续音"],"tip":"标记用 T/S/D 或罗马数字均可，但全篇要统一。"},{"q":"调性布局与综合分析","type":"论述","pts":["呈示部：主调与副部调性形成对比（近关系调）。","展开部：调性游移，常走向下属方向。","再现部：副部回归主调，实现调性统一。","分析维度：主题材料、和声语言、节奏织体、调性布局、结构比例。","中国作品另需辨识调式与地域、民族特征。"],"keys":["调性布局","呈示-展开-再现","结构比例"],"tip":"论述题按「材料—和声—调性—结构—风格」五段写。"}]}]}],"built":"2026-11-16","exam":{"items":[{"id":"x-p01","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"比较题","chIds":["w02"],"q":"比较奥尔加农与第斯康特的异同，并说明二者在复调音乐发展中的位置。","rubric":[{"t":"界定奥尔加农：在格里高利圣咏定旋律上附加声部，9 世纪起","s":2},{"t":"界定第斯康特：声部节奏相近、音对音进行，12—13 世纪","s":2},{"t":"指出相同点：都以圣咏为定旋律，都属于复调","s":2},{"t":"指出不同：节奏关系、声部独立性、对记谱的要求","s":3},{"t":"串出发展链：奥尔加农—克劳苏拉—经文歌","s":2},{"t":"结构清晰、术语准确","s":2}],"answer":"奥尔加农是 9 世纪起在圣咏定旋律上附加声部的复调形式，早期为平行进行，后发展为花唱奥尔加农；第斯康特是 12—13 世纪巴黎圣母院乐派发展的写法，两个声部节奏相近、音对音进行。二者都以圣咏为定旋律、都是复调，区别在于节奏关系与声部独立性。第斯康特的段落独立后成为克劳苏拉，填入新词后演化为经文歌，构成中世纪复调发展的主线。","refCards":["w02-4","w02-5"]},{"id":"x-p02","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"比较题","chIds":["w04"],"q":"巴赫与亨德尔同为巴洛克晚期的集大成者，请比较二人在创作领域、风格与历史影响上的不同。","rubric":[{"t":"创作领域：巴赫以宗教康塔塔、受难曲、管风琴与键盘乐为主；亨德尔以歌剧、清唱剧为主","s":3},{"t":"风格：巴赫复调严密、内省；亨德尔主调化、戏剧性强、面向公众","s":3},{"t":"各举两部代表作","s":3},{"t":"历史影响：巴赫被重新发现并奠定德奥传统；亨德尔影响英国清唱剧与合唱传统","s":2},{"t":"结构清晰、比较意识明确","s":2}],"answer":"巴赫一生以教堂与宫廷职位为主，创作集中于宗教康塔塔、受难曲、管风琴与键盘音乐，复调技术登峰造极，风格内省；亨德尔长期在英国发展，以意大利正歌剧与英语清唱剧成名，风格外向、戏剧性强、面向市民公众。代表作分别为《马太受难曲》《平均律钢琴曲集》与《弥赛亚》《水上音乐》。二人一内一外，共同构成巴洛克的双峰。","refCards":["w04-6","w04-7"]},{"id":"x-p03","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"比较题","chIds":["w05","w06"],"q":"从音乐观念、体裁与和声语言三个方面，论述古典主义与浪漫主义音乐的主要差异。","rubric":[{"t":"观念：理性、均衡、客观 vs 情感、个性、主观","s":3},{"t":"体裁：奏鸣曲、交响曲、四重奏成熟 vs 艺术歌曲、钢琴小品、交响诗、乐剧兴起","s":3},{"t":"和声：功能清晰、调性稳定 vs 半音化、离调、调性扩张","s":3},{"t":"两个时期各举两位代表作曲家","s":2},{"t":"结构清晰、能指出承续关系","s":2}],"answer":"古典主义受启蒙运动影响，追求理性与均衡，主调织体透明，奏鸣曲式与交响曲、四重奏等体裁成熟，和声以功能逻辑为主、调性稳定；浪漫主义强调个人情感与想象，标题音乐兴盛，艺术歌曲、钢琴小品、交响诗与乐剧并行，和声走向半音化与调性扩张。二者并非断裂：贝多芬处于转折点，浪漫主义在古典的形式上注入了主观表达。","refCards":["w05-1","w06-1"]},{"id":"x-p04","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"比较题","chIds":["w06"],"q":"瓦格纳与威尔第代表了 19 世纪歌剧的两条道路，请比较二者的歌剧观念与音乐手法。","rubric":[{"t":"瓦格纳：乐剧观念、整体艺术、主导动机、无终旋律","s":3},{"t":"威尔第：人声中心、分曲结构、戏剧张力与旋律性","s":3},{"t":"各举两部代表作","s":3},{"t":"对后世的影响：瓦格纳式和声与乐剧观念、威尔第式意大利歌剧传统","s":2},{"t":"结构清晰","s":2}],"answer":"瓦格纳提出「整体艺术」的乐剧观念，以主导动机贯穿全剧、用无终旋律取消分曲，乐队交响化，《特里斯坦与伊索尔德》的和声推动调性瓦解；威尔第坚持人声中心与分曲结构，旋律鲜明、戏剧冲突强烈，代表作《茶花女》《阿依达》。前者把歌剧推向交响化与哲学化，后者把意大利美声传统推向戏剧高峰。","refCards":["w06-5","w06-4"]},{"id":"x-p05","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"比较题","chIds":["w07"],"q":"比较印象主义与表现主义音乐在美学观念、音高组织与代表作品上的差异。","rubric":[{"t":"美学：感官印象与色彩 vs 内心焦虑与潜意识","s":3},{"t":"音高：全音阶、五声、色彩性和声 vs 无调性、十二音","s":3},{"t":"代表作品：德彪西《牧神午后》、拉威尔《波莱罗》 vs 勋伯格《月迷彼埃罗》、贝尔格《沃采克》","s":3},{"t":"共同点：都突破功能调性、都弱化传统发展手法","s":2},{"t":"结构清晰","s":2}],"answer":"印象主义受绘画与象征主义诗歌影响，重感官与色彩，用全音阶、五声与色彩性和声弱化功能，代表作《牧神午后》《波莱罗》；表现主义直面焦虑与潜意识，勋伯格走向无调性并创立十二音技法，代表作《月迷彼埃罗》《沃采克》。二者方向相反，却共同瓦解了功能调性体系。","refCards":["w07-2","w07-3"]},{"id":"x-p06","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"比较题","chIds":["w03"],"q":"比较勃艮第乐派与弗兰德乐派在体裁、织体与历史地位上的异同。","rubric":[{"t":"勃艮第：三声部为主，尚松与弥撒，迪费、班舒瓦","s":3},{"t":"弗兰德：四声部模仿复调成熟，奥克冈、若斯坎、拉索","s":3},{"t":"相同：同属文艺复兴早期，都服务于宫廷与教会","s":2},{"t":"历史地位：勃艮第是过渡，弗兰德成为欧洲主流并影响后世","s":3},{"t":"结构清晰","s":2}],"answer":"勃艮第乐派以三声部为主，尚松与弥撒并重，风格清澈优美，代表迪费与班舒瓦；弗兰德乐派把四声部模仿复调推向成熟，若斯坎以音乐表达歌词情感，拉索集文艺复兴之大成。二者都属于文艺复兴早期、都服务于宫廷与教会，但弗兰德乐派影响遍及欧洲，成为 16 世纪音乐的主流。","refCards":["w03-2","w03-3"]},{"id":"x-p07","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"比较题","chIds":["w06"],"q":"民族乐派与浪漫主义主流在题材、音调来源与美学追求上有何不同？请结合具体作曲家说明。","rubric":[{"t":"题材：民族历史与民间生活 vs 个人情感与文学幻想","s":3},{"t":"音调：民间调式与节奏 vs 共性写作语言","s":3},{"t":"举出格里格、斯美塔那、德沃夏克、五人团、西贝柳斯中的至少三位","s":3},{"t":"指出民族乐派是浪漫主义的延伸而非对立","s":2},{"t":"结构清晰","s":2}],"answer":"民族乐派把目光转向本民族的历史、传说与民间音乐，用民间调式、舞曲节奏与民族题材写作，如格里格《培尔·金特》、斯美塔那《我的祖国》、德沃夏克《自新大陆》、西贝柳斯《芬兰颂》；浪漫主义主流更关注个人情感与文学幻想。二者并非对立，民族乐派正是浪漫主义「回到民间」思潮的产物。","refCards":["w06-6","w06-1"]},{"id":"x-p08","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"比较题","chIds":["w02","w03"],"q":"从格里高利圣咏到文艺复兴弥撒，欧洲复调音乐经历了怎样的变化？","rubric":[{"t":"圣咏：单声、无伴奏、拉丁文、教会调式","s":3},{"t":"中世纪复调：奥尔加农、第斯康特、经文歌","s":3},{"t":"文艺复兴弥撒：定旋律弥撒与模仿弥撒、四声部织体","s":3},{"t":"变化实质：从仪式功能走向艺术表达，人的情感进入音乐","s":2},{"t":"结构清晰","s":2}],"answer":"格里高利圣咏是单声部、无伴奏的仪式音乐，用教会调式；中世纪在圣咏上附加声部，产生奥尔加农、第斯康特，并发展出经文歌；文艺复兴时期弥撒曲走向四声部模仿复调，定旋律弥撒与模仿弥撒相继成熟，帕莱斯特里那把声部均衡与纯净推向极致。这一过程既是技术的累积，也是从仪式功能向人文表达的转变。","refCards":["w02-2","w03-4"]},{"id":"x-c01","part":"中国音乐史","type":"简答","full":15,"difficulty":3,"tag":"比较题","chIds":["cn03","cn08"],"q":"简述三分损益法与朱载堉新法密率的联系与区别。","rubric":[{"t":"三分损益：见于《管子·地员》，先益后损求五音","s":3},{"t":"《吕氏春秋》推全十二律，仲吕不能还生黄钟的缺陷","s":3},{"t":"新法密率：朱载堉 1584 年提出，以 2 的十二次方根求十二平均律","s":3},{"t":"区别：不平均律与平均律、能否自由旋宫","s":3},{"t":"表述准确","s":3}],"answer":"三分损益法以弦长或管长的三分损一、三分益一相生，见于《管子·地员》，《吕氏春秋》推全十二律，但仲吕不能还生黄钟，无法自由旋宫。朱载堉《律学新说》提出新法密率，用 2 的十二次方根算出十二平均律，使十二律可自由旋宫，早于欧洲约半个世纪。二者都是解决旋宫问题的律学探索，前者是不平均律，后者是平均律。","refCards":["cn03-5","cn08-6"]},{"id":"x-c02","part":"中国音乐史","type":"简答","full":15,"difficulty":3,"tag":"比较题","chIds":["cn05"],"q":"比较嵇康《声无哀乐论》与阮籍《乐论》的音乐思想。","rubric":[{"t":"嵇康：声音自当以善恶为主，无关于哀乐，哀乐生于人心","s":3},{"t":"阮籍：乐者天地之体、万物之性，仍强调乐与政通","s":3},{"t":"相同：都受魏晋玄学影响，都讨论音乐的本质","s":3},{"t":"不同：一个消解儒家教化论，一个保留乐的政教功能","s":3},{"t":"表述准确","s":3}],"answer":"嵇康认为音乐本体无哀乐，哀乐由人心而生，反对把音乐直接等同于政治，带有消解儒家教化论的意义；阮籍《乐论》主张「乐者，天地之体，万物之性」，仍强调乐的政教功能。二人同受玄学影响，却走向不同方向：嵇康重审美本体，阮籍重宇宙论与教化。","refCards":["cn05-3","cn05-4"]},{"id":"x-c03","part":"中国音乐史","type":"简答","full":15,"difficulty":3,"tag":"比较题","chIds":["cn09","cn11"],"q":"比较学堂乐歌与三十年代左翼音乐运动在音乐功能、传播方式与历史意义上的不同。","rubric":[{"t":"学堂乐歌：新式学堂乐歌课，多依曲填词，重启蒙与美育","s":3},{"t":"左翼音乐：救亡歌咏，群众性、战斗性，聂耳、冼星海","s":3},{"t":"传播：课堂与教材 vs 歌咏运动、电影与唱片","s":3},{"t":"意义：近代音乐教育开端 vs 音乐与民族救亡结合","s":3},{"t":"表述准确","s":3}],"answer":"学堂乐歌依托新式学堂的乐歌课，多以日本、欧美曲调填词，承担启蒙与美育功能，代表人物沈心工、李叔同；三十年代左翼音乐运动以救亡歌咏为手段，面向群众，聂耳、冼星海把音乐变成战斗武器。前者开启近代音乐教育，后者把音乐与社会运动紧密结合。","refCards":["cn09-1","cn11-1"]},{"id":"x-c04","part":"中国音乐史","type":"简答","full":15,"difficulty":3,"tag":"比较题","chIds":["cn07"],"q":"简述诸宫调与鼓子词的区别，并说明它们在说唱艺术史上的地位。","rubric":[{"t":"鼓子词：同一曲牌反复，以鼓伴奏，赵令畤《商调蝶恋花》","s":3},{"t":"诸宫调：多宫调联缀、篇幅宏大、孔三传创","s":3},{"t":"区别：宫调运用、结构规模与叙事能力","s":3},{"t":"地位：诸宫调为戏曲音乐准备了条件","s":3},{"t":"表述准确","s":3}],"answer":"鼓子词用同一曲牌反复咏唱，以鼓击节，结构短小；诸宫调把不同宫调的曲牌联缀起来铺叙长篇故事，孔三传创，代表作《西厢记诸宫调》。前者是小型说唱，后者是大型说唱，诸宫调的曲牌联缀与叙事结构为元杂剧准备了音乐基础。","refCards":["cn07-3"]},{"id":"x-c05","part":"中国音乐史","type":"简答","full":15,"difficulty":3,"tag":"比较题","chIds":["cn10","cn11"],"q":"比较萧友梅与黄自在中国专业音乐教育史上的贡献。","rubric":[{"t":"萧友梅：1927 年创办上海国立音乐院，建立专业教育体系","s":3},{"t":"黄自：任教国立音专，培养作曲人才，创作《长恨歌》","s":3},{"t":"相同：都推动中国专业音乐教育的制度化","s":3},{"t":"不同：一个重制度建设，一个重创作与教学实践","s":3},{"t":"表述准确","s":3}],"answer":"萧友梅 1927 年创办上海国立音乐院，确立了中国专业音乐教育的体制与课程；黄自任教国立音专，培养贺绿汀、陈田鹤等一批作曲家，并以《长恨歌》开创中国清唱剧。萧友梅重在制度建设，黄自重在教学与创作，二者共同奠定中国专业音乐教育的根基。","refCards":["cn10-1","cn11-3"]},{"id":"x-h01","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"押题","chIds":["w05"],"q":"2027 年是贝多芬逝世两百周年。试论贝多芬「承古典、启浪漫」的历史地位，并结合具体作品说明。","rubric":[{"t":"三个创作时期的分期与各自特征","s":3},{"t":"交响曲的突破：第三《英雄》、第五《命运》、第六《田园》、第九《合唱》","s":3},{"t":"钢琴奏鸣曲与晚期风格","s":2},{"t":"对浪漫主义的影响：标题性、英雄叙事、结构扩展、个人化表达","s":3},{"t":"结构清晰","s":2}],"answer":"贝多芬早期承海顿、莫扎特的形式，中期以《英雄》《命运》把交响曲变成个人意志的表达，篇幅、力度与和声都大幅扩张，晚期《第九交响曲》《庄严弥撒》走向内省与超越。他在古典的体裁里注入浪漫的精神，标题性、英雄叙事与结构扩展直接启发了柏辽兹、瓦格纳与马勒。","refCards":["w05-5"]},{"id":"x-h02","part":"中国音乐史","type":"简答","full":15,"difficulty":3,"tag":"押题","chIds":["cn04","cn06","cn09"],"q":"试述中国音乐史上三次中外音乐交流高潮及其影响。","rubric":[{"t":"汉代丝绸之路：鼓吹、琵琶、箜篌、胡笳传入","s":3},{"t":"隋唐：多部乐、龟兹乐、苏祗婆五旦七调、八十四调","s":3},{"t":"近现代：学堂乐歌、西方乐理与专业音乐教育","s":3},{"t":"规律：每次交流都带来乐器、体裁与观念的更新","s":3},{"t":"表述准确","s":3}],"answer":"汉代张骞通西域，横吹、琵琶、箜篌、胡笳进入中原；隋唐设七部乐、九部乐、十部乐，龟兹乐与苏祗婆五旦七调推动八十四调理论；近代随学堂乐歌与专业音乐教育，西方乐理、记谱与体裁系统进入中国。三次高潮都由乐器始、以观念终，不断重塑中国音乐的面貌。","refCards":["cn04-8","cn06-1","cn09-1"]},{"id":"x-h03","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"押题","chIds":["w06"],"q":"试论西方标题音乐从柏辽兹到理查·施特劳斯的发展脉络。","rubric":[{"t":"柏辽兹《幻想交响曲》与「固定乐思」","s":3},{"t":"李斯特创立交响诗，标题与文学结合","s":3},{"t":"瓦格纳乐剧与主导动机的叙事功能","s":2},{"t":"理查·施特劳斯《查拉图斯特拉如是说》等交响诗","s":3},{"t":"评价与结构","s":2}],"answer":"柏辽兹《幻想交响曲》用固定乐思把文学情节写进交响曲；李斯特创交响诗，让标题与文学、绘画结合；瓦格纳用主导动机在乐剧中承担叙事；理查·施特劳斯把交响诗推向音响的极致，《查拉图斯特拉如是说》《唐璜》皆是代表。标题音乐由此从「说明情节」走向「用音响思考」。","refCards":["w06-3","w06-8","w06-5"]},{"id":"x-h04","part":"中国音乐史","type":"简答","full":15,"difficulty":3,"tag":"押题","chIds":["cn09","cn10","cn13"],"q":"简述中国近现代音乐教育的几次重要转型。","rubric":[{"t":"学堂乐歌时期：乐歌课进入新式学堂，沈心工、李叔同","s":3},{"t":"专业教育建立：1927 年上海国立音乐院，萧友梅","s":3},{"t":"建国后：院系调整，专业与师范教育体系成型","s":3},{"t":"改革开放后：普及、考级与多元发展","s":3},{"t":"表述准确","s":3}],"answer":"清末民初学堂乐歌把音乐课带进新式学堂，完成从「师徒传授」到「课堂普及」的转变；1927 年萧友梅创办上海国立音乐院，建立专业音乐教育体系；建国后院系调整，形成专业院校与师范教育并行的格局；改革开放后音乐教育走向普及与多元。四次转型共同构成中国近现代音乐教育的主线。","refCards":["cn09-1","cn10-1","cn13-1"]},{"id":"x-h05","part":"中国音乐史","type":"简答","full":15,"difficulty":3,"tag":"押题","chIds":["cn08","cn15"],"q":"结合「非物质文化遗产保护」，谈谈中国传统音乐在当代的传承困境与可能路径。","rubric":[{"t":"传统音乐的活态性与口传心授特征","s":3},{"t":"困境：传承人断层、原生语境消失、过度商业化","s":3},{"t":"路径：教育传承、录音记录、舞台化与适度创新","s":3},{"t":"结合具体乐种举例（如福建南音、西安鼓乐、木卡姆）","s":3},{"t":"表述准确、有观点","s":3}],"answer":"中国传统音乐多为口传心授的活态艺术，依附于具体的民俗语境。当代困境在于传承人断层、仪式语境消失与过度商业化。可行路径包括把乐种引入学校教育、用录音与影像做系统性存档、在保留核心风格的前提下做舞台化改编，福建南音、西安鼓乐与新疆木卡姆的实践都可作为例证。","refCards":["cn08-5","cn08-1"]},{"id":"x-h06","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"押题","chIds":["w07"],"q":"20 世纪音乐「调性瓦解」有哪几条主要路径？请结合作曲家与作品说明。","rubric":[{"t":"勋伯格：无调性走向十二音，《月迷彼埃罗》","s":3},{"t":"斯特拉文斯基：节奏与原始主义，《春之祭》；后期新古典","s":3},{"t":"巴托克：民族音调与调式综合，《乐队协奏曲》","s":3},{"t":"德彪西：全音阶与色彩性和声","s":2},{"t":"结构清晰","s":2}],"answer":"调性瓦解有多条路径：勋伯格从无调性走向十二音，《月迷彼埃罗》《升华之夜》是标志；斯特拉文斯基以节奏与不协和音响冲击传统，《春之祭》之后又转向新古典；巴托克把民间调式与半音手法综合；德彪西用全音阶与色彩和声弱化功能。它们共同把「调性」从唯一语法变成一种可选语言。","refCards":["w07-3","w07-4","w07-5"]}],"chapters":[{"id":"x-ch-w01","part":"西方音乐史","type":"论述","full":13,"difficulty":2,"chIds":["w01"],"q":"试论古希腊音乐的观念与理论成就，并说明它对后世西方音乐的影响。","rubric":[{"t":"歌舞乐一体、单音音乐的基本形态","s":3},{"t":"四音音列、大完美体系、调式理论","s":3},{"t":"毕达哥拉斯的数理和谐观","s":3},{"t":"对中世纪教会调式与文艺复兴人文主义的影响","s":2},{"t":"结构清晰","s":2}],"answer":"古希腊音乐是诗、歌、舞一体的单音音乐，理论上有四音音列、大完美体系与多利亚等调式，毕达哥拉斯以数解释音程。其调式观念经中世纪教会调式传承，其「音乐净化心灵」的观念在文艺复兴被重新发现。","refCards":["w01-1","w01-2"]},{"id":"x-ch-w02","part":"西方音乐史","type":"论述","full":13,"difficulty":2,"chIds":["w02"],"q":"试论中世纪音乐从单声圣咏走向复调的发展过程。","rubric":[{"t":"格里高利圣咏的地位与特征","s":3},{"t":"奥尔加农到第斯康特的演进","s":3},{"t":"古艺术与巴黎圣母院乐派","s":3},{"t":"新艺术与世俗音乐的兴起","s":2},{"t":"结构清晰","s":2}],"answer":"中世纪以格里高利圣咏为中心，9 世纪起在圣咏上附加声部产生奥尔加农，12 世纪巴黎圣母院乐派把复调推向三、四声部，14 世纪新艺术带来世俗音乐与记谱革新。","refCards":["w02-2","w02-4","w02-6"]},{"id":"x-ch-w03","part":"西方音乐史","type":"论述","full":13,"difficulty":2,"chIds":["w03"],"q":"试论文艺复兴时期复调声乐的成就与器乐的独立。","rubric":[{"t":"人文主义背景与印刷术的推动","s":3},{"t":"勃艮第、弗兰德、罗马、威尼斯四个乐派","s":3},{"t":"弥撒、经文歌、牧歌、尚松等体裁","s":3},{"t":"利切卡尔、坎佐纳等器乐体裁的出现","s":2},{"t":"结构清晰","s":2}],"answer":"文艺复兴以人文主义为底色，四声部模仿复调成熟，勃艮第、弗兰德、罗马、威尼斯四派相继主导，弥撒与经文歌达到高峰，牧歌与尚松繁荣；同时利切卡尔、坎佐纳等器乐体裁出现，器乐开始脱离声乐独立。","refCards":["w03-1","w03-6"]},{"id":"x-ch-w04","part":"西方音乐史","type":"论述","full":13,"difficulty":2,"chIds":["w04"],"q":"试论巴洛克时期歌剧的诞生与器乐的发展。","rubric":[{"t":"佛罗伦萨卡梅拉塔与早期歌剧","s":3},{"t":"蒙特威尔第、那不勒斯歌剧与返始咏叹调","s":3},{"t":"通奏低音与主调音乐的兴起","s":3},{"t":"协奏曲、奏鸣曲、赋格等器乐体裁","s":2},{"t":"结构清晰","s":2}],"answer":"巴洛克以通奏低音为标志，佛罗伦萨卡梅拉塔催生歌剧，蒙特威尔第《奥菲欧》确立戏剧表现力，那不勒斯歌剧确立返始咏叹调；器乐方面协奏曲、奏鸣曲与赋格成熟，维瓦尔第、巴赫把器乐推向高峰。","refCards":["w04-2","w04-5"]},{"id":"x-ch-w05","part":"西方音乐史","type":"论述","full":13,"difficulty":2,"chIds":["w05"],"q":"试论古典主义时期器乐体裁的成熟，并以海顿、莫扎特、贝多芬为例说明。","rubric":[{"t":"启蒙背景与主调风格","s":3},{"t":"奏鸣曲式的结构与意义","s":3},{"t":"交响曲、四重奏、协奏曲、奏鸣曲的成熟","s":3},{"t":"三位作曲家的各自贡献","s":2},{"t":"结构清晰","s":2}],"answer":"古典时期在启蒙运动影响下追求理性与均衡，奏鸣曲式确立，交响曲、弦乐四重奏、协奏曲与奏鸣曲四大体裁成熟。海顿确立四乐章结构与乐队编制，莫扎特把旋律与戏剧性推向完美，贝多芬则把形式撑到极限并注入个人意志。","refCards":["w05-2","w05-3","w05-5"]},{"id":"x-ch-w06","part":"西方音乐史","type":"论述","full":13,"difficulty":2,"chIds":["w06"],"q":"试论浪漫主义音乐的特征，并结合歌剧、艺术歌曲与钢琴音乐说明。","rubric":[{"t":"情感至上、标题音乐、民族乐派","s":3},{"t":"歌剧：意大利、法国、德国三条线索","s":3},{"t":"艺术歌曲与声乐套曲","s":3},{"t":"钢琴小品与炫技传统","s":2},{"t":"结构清晰","s":2}],"answer":"浪漫主义强调个人情感，标题音乐与民族乐派兴起，和声走向半音化。歌剧形成意大利（罗西尼、威尔第、普契尼）、法国（柏辽兹、比才）与德国（瓦格纳）三条线索；艺术歌曲由舒伯特、舒曼推向高峰；钢琴音乐有肖邦的诗意与李斯特的炫技。","refCards":["w06-1","w06-4","w06-9"]},{"id":"x-ch-w07","part":"西方音乐史","type":"论述","full":13,"difficulty":2,"chIds":["w07"],"q":"试论 20 世纪音乐的多元格局。","rubric":[{"t":"调性体系瓦解与不协和的解放","s":3},{"t":"印象主义、表现主义、新古典主义","s":3},{"t":"民族主义与英美作曲家","s":3},{"t":"先锋派、电子音乐与偶然音乐","s":2},{"t":"结构清晰","s":2}],"answer":"20 世纪音乐走向多元：印象主义重色彩，表现主义走向无调性与十二音，新古典主义回到古典形式，民族主义从民间音乐取材，先锋派则用电子、噪音与偶然性重新定义音乐。调性从唯一语法变成一种可选语言。","refCards":["w07-1","w07-6"]}],"real":[{"id":"r-2013-1","year":2013,"part":"中国音乐史","type":"名词解释","full":5,"difficulty":1,"q":"八音分类法","rubric":[{"t":"按制作材料把乐器分为八类，见于《周礼·春官》","s":2},{"t":"金、石、土、革、丝、木、匏、竹八类","s":2},{"t":"是中国最早的乐器科学分类法","s":1}],"answer":"八音分类法是中国古代按乐器制作材料划分的八类分类法，见于《周礼·春官》，即金、石、土、革、丝、木、匏、竹，是世界上最早的乐器科学分类之一。","refCards":["cn03-3"],"chIds":["cn03"]},{"id":"r-2013-2","year":2013,"part":"中国音乐史","type":"名词解释","full":5,"difficulty":2,"q":"减字谱","rubric":[{"t":"唐代曹柔在文字谱基础上创制","s":2},{"t":"以减笔汉字拼合记录指法、弦序、徽位","s":2},{"t":"古琴专用谱式，沿用至今","s":1}],"answer":"减字谱是唐代曹柔在文字谱基础上创制的古琴专用记谱法，用减笔汉字拼合表示指法、弦序与徽位，只记音位不记节奏，沿用至今。","refCards":["cn06-8"],"chIds":["cn06"]},{"id":"r-2013-3","year":2013,"part":"中国音乐史","type":"名词解释","full":5,"difficulty":1,"q":"明代「四大声腔」","rubric":[{"t":"海盐腔、余姚腔、弋阳腔、昆山腔","s":3},{"t":"昆山腔经魏良辅改革形成水磨调","s":1},{"t":"是明代戏曲音乐的主流","s":1}],"answer":"明代戏曲的四种主要声腔：海盐腔、余姚腔、弋阳腔、昆山腔。其中昆山腔经魏良辅改革形成「水磨调」，成为明代戏曲音乐的主流。","refCards":["cn08-3"],"chIds":["cn08"]},{"id":"r-2013-4","year":2013,"part":"中国音乐史","type":"名词解释","full":5,"difficulty":1,"q":"萧友梅","rubric":[{"t":"中国专业音乐教育的奠基人","s":2},{"t":"1927 年创办上海国立音乐院","s":2},{"t":"代表作《问》","s":1}],"answer":"萧友梅是中国专业音乐教育的奠基人，1927 年创办上海国立音乐院，著有《问》《新霓裳羽衣舞》等作品，奠定了中国现代专业音乐教育体系。","refCards":["cn10-1"],"chIds":["cn10"]},{"id":"r-2019-1","year":2019,"part":"中国音乐史","type":"名词解释","full":10,"difficulty":2,"q":"梨园","rubric":[{"t":"唐玄宗设立的音乐机构","s":3},{"t":"专习法曲，乐工称「皇帝梨园弟子」","s":3},{"t":"与教坊、大乐署共同构成唐代宫廷音乐体系","s":2},{"t":"对后世戏曲界称「梨园」有深远影响","s":2}],"answer":"梨园是唐玄宗设立的音乐机构，专司法曲的排练与演出，乐工被称为「皇帝梨园弟子」。它与大乐署、教坊共同构成唐代宫廷音乐机构体系，后世戏曲界因此自称「梨园行」。","refCards":["cn06-3"],"chIds":["cn06"]},{"id":"r-2019-2","year":2019,"part":"中国音乐史","type":"名词解释","full":10,"difficulty":2,"q":"国立音乐院","rubric":[{"t":"1927 年萧友梅创办于上海","s":3},{"t":"1929 年改组为国立音乐专科学校","s":2},{"t":"设理论作曲、声乐、钢琴、管弦等组","s":3},{"t":"中国专业音乐教育的摇篮","s":2}],"answer":"国立音乐院是 1927 年萧友梅在上海创办的中国第一所独立高等音乐学府，1929 年改组为国立音乐专科学校，设理论作曲、声乐、钢琴、管弦等组，培养出贺绿汀、冼星海、丁善德等一批音乐家。","refCards":["cn11-2"],"chIds":["cn11"]},{"id":"r-2022-1","year":2022,"part":"中国音乐史","type":"名词解释","full":8,"difficulty":1,"q":"葛天氏之乐","rubric":[{"t":"传说中的原始乐舞，八阙歌舞","s":3},{"t":"内容涉及载民、玄鸟、遂草木、奋五谷等","s":3},{"t":"反映农耕祭祀与图腾崇拜","s":2}],"answer":"《葛天氏之乐》是传说中的原始乐舞，由八阙组成，内容涉及载民、玄鸟、遂草木、奋五谷、敬天常等，反映原始先民的农耕生活与祭祀、图腾崇拜。","refCards":["cn01-1"],"chIds":["cn01"]},{"id":"r-2022-2","year":2022,"part":"中国音乐史","type":"名词解释","full":8,"difficulty":2,"q":"诸宫调","rubric":[{"t":"宋代说唱形式，孔三传创","s":3},{"t":"联合多个宫调的曲牌演唱长篇故事","s":3},{"t":"代表作《西厢记诸宫调》，为戏曲音乐准备条件","s":2}],"answer":"诸宫调是宋代的大型说唱形式，相传为孔三传所创，把不同宫调的曲牌联缀起来演唱长篇故事，代表作《西厢记诸宫调》，其曲牌联缀与叙事结构为元杂剧准备了音乐基础。","refCards":["cn07-3"],"chIds":["cn07"]},{"id":"r-2022-3","year":2022,"part":"中国音乐史","type":"名词解释","full":8,"difficulty":2,"q":"大司乐","rubric":[{"t":"周代最高音乐机构与乐官之称","s":3},{"t":"掌乐教，教国子以乐德、乐语、乐舞","s":3},{"t":"是礼乐制度的组织保障","s":2}],"answer":"大司乐是周代最高的音乐机构，也是乐官之名，掌管乐教，教国子以乐德、乐语、乐舞，统筹祭祀与典礼用乐，是礼乐制度得以运行的组织保障。","refCards":["cn03-1"],"chIds":["cn03"]},{"id":"r-2022-4","year":2022,"part":"中国音乐史","type":"名词解释","full":8,"difficulty":2,"q":"三分损益法","rubric":[{"t":"以弦长或管长为基准，损一或益一相生","s":3},{"t":"《管子·地员》先益后损求五音，《吕氏春秋》推十二律","s":3},{"t":"仲吕不能还生黄钟，无法自由旋宫","s":2}],"answer":"三分损益法是中国古代生律法，以弦长或管长为基准，三分损一（×2/3）或三分益一（×4/3）依次相生。《管子·地员》用它求五音，《吕氏春秋》推全十二律，但仲吕不能还生黄钟，无法自由旋宫。","refCards":["cn03-5"],"chIds":["cn03"]},{"id":"r-2022-5","year":2022,"part":"中国音乐史","type":"名词解释","full":8,"difficulty":2,"q":"《新诗歌集》","rubric":[{"t":"赵元任的艺术歌曲集","s":3},{"t":"中国第一部个人艺术歌曲集","s":3},{"t":"收《教我如何不想他》《卖布谣》等，讲究依字行腔","s":2}],"answer":"《新诗歌集》是赵元任的艺术歌曲集，中国第一部个人艺术歌曲集，收录《教我如何不想他》《卖布谣》《海韵》等，讲究依字行腔，把汉语声调与旋律结合。","refCards":["cn10-2"],"chIds":["cn10"]},{"id":"r-2022-6","year":2022,"part":"中国音乐史","type":"名词解释","full":8,"difficulty":2,"q":"大同乐会","rubric":[{"t":"1920 年郑觐文创办于上海","s":3},{"t":"以整理国乐、改良乐器为宗旨","s":3},{"t":"改编《春江花月夜》，推动国乐合奏","s":2}],"answer":"大同乐会是 1920 年郑觐文在上海创办的国乐社团，以整理国乐、改良乐器、编配合奏为宗旨，曾把《夕阳箫鼓》改编为《春江花月夜》，对近代国乐合奏影响深远。","refCards":["cn10-6"],"chIds":["cn10"]},{"id":"r-2022-7","year":2022,"part":"中国音乐史","type":"名词解释","full":8,"difficulty":2,"q":"国乐改进社","rubric":[{"t":"1927 年刘天华等发起","s":3},{"t":"主张从东西调和与合作中打出一条新路","s":3},{"t":"出版《音乐杂志》，改进二胡、琵琶创作","s":2}],"answer":"国乐改进社是 1927 年刘天华等发起的国乐社团，主张「从东西调和与合作中打出一条新路」，出版《音乐杂志》，推动二胡、琵琶的创作与教学，把民间乐器提升到专业独奏地位。","refCards":["cn10-4"],"chIds":["cn10"]},{"id":"r-2022-8","year":2022,"part":"中国音乐史","type":"名词解释","full":8,"difficulty":1,"q":"《小小画家》","rubric":[{"t":"黎锦晖的儿童歌舞剧","s":3},{"t":"以儿童生活为题材，载歌载舞","s":3},{"t":"中国儿童歌舞剧的代表作之一","s":2}],"answer":"《小小画家》是黎锦晖创作的儿童歌舞剧，以儿童生活为题材，歌舞与戏剧结合，与《麻雀与小孩》《可怜的秋香》同为我国儿童歌舞剧的代表作。","refCards":["cn10-3"],"chIds":["cn10"]},{"id":"r-2023-1","year":2023,"part":"中国音乐史","type":"名词解释","full":10,"difficulty":3,"q":"律吕字谱","rubric":[{"t":"用十二律律名记录音高的谱式","s":3},{"t":"以黄钟、大吕等律名逐字标音","s":3},{"t":"见于《白石道人歌曲》等，是研究古代音高的直接材料","s":2},{"t":"与减字谱、工尺谱并列为传统谱式","s":2}],"answer":"律吕字谱是用十二律律名（黄钟、大吕、太簇等）逐字记录音高的谱式，姜夔《白石道人歌曲》中的旁谱即属此类，是研究古代音高的直接材料。","refCards":["cn06-8"],"chIds":["cn06"]},{"id":"r-2023-2","year":2023,"part":"中国音乐史","type":"名词解释","full":10,"difficulty":3,"q":"《碧鸡漫志》","rubric":[{"t":"南宋王灼著","s":3},{"t":"论述词调源流与宋代词乐","s":3},{"t":"是研究宋代词乐的重要文献","s":2},{"t":"与《乐书》《琴史》同为宋代音乐著作","s":2}],"answer":"《碧鸡漫志》是南宋王灼所著的词乐著作，考述词调源流、宫调与歌唱方法，是研究宋代词乐与曲子词的重要文献，与陈旸《乐书》、朱长文《琴史》并称宋代音乐著作。","refCards":["cn07-8"],"chIds":["cn07"]},{"id":"r-2023-3","year":2023,"part":"中国音乐史","type":"名词解释","full":10,"difficulty":2,"q":"鲁迅艺术学院","rubric":[{"t":"1938 年创办于延安","s":3},{"t":"设音乐系，培养革命音乐干部","s":3},{"t":"创作《黄河大合唱》《白毛女》等","s":2},{"t":"体现文艺为工农兵服务的方向","s":2}],"answer":"鲁迅艺术学院是 1938 年创办于延安的综合性艺术学院，设音乐系，培养革命音乐干部，师生创作了《黄河大合唱》《白毛女》等作品，是延安文艺方向的代表。","refCards":["cn12-4"],"chIds":["cn12"]},{"id":"r-2023-4","year":2023,"part":"中国音乐史","type":"名词解释","full":10,"difficulty":2,"q":"王光祈","rubric":[{"t":"音乐学家，比较音乐学先驱","s":3},{"t":"著《东西乐制之研究》《东方民族之音乐》《中国音乐史》","s":4},{"t":"引入现代学术方法研究中国音乐","s":3}],"answer":"王光祈是中国近代音乐学家、比较音乐学的先驱，著有《东西乐制之研究》《东方民族之音乐》《中国音乐史》，用比较方法研究世界音乐，为中国音乐学引入现代学术方法。","refCards":["cn10-5"],"chIds":["cn10"]},{"id":"r-2013-5","year":2013,"part":"中国音乐史","type":"简答","full":15,"difficulty":2,"q":"曾侯乙墓出土了哪些乐器？这些乐器反映了当时乐律学的哪些成就？","rubric":[{"t":"1978 年湖北随州出土，战国早期","s":3},{"t":"编钟 65 件、编磬及鼓、瑟、笙、排箫等","s":4},{"t":"一钟双音、十二律俱全、可旋宫转调","s":4},{"t":"铭文记载各国律名，证明先秦乐律学高度发达","s":4}],"answer":"曾侯乙墓 1978 年出土于湖北随州，随葬编钟 65 件，另有编磬、鼓、瑟、笙、排箫等。编钟一钟双音、十二律俱全、可在多调上旋宫转调，钟体铭文记载各国律名对照，证明先秦乐律学与铸造工艺已达到很高水平。","refCards":["cn03-4"],"chIds":["cn03"]},{"id":"r-2013-6","year":2013,"part":"中国音乐史","type":"简答","full":15,"difficulty":2,"q":"简述学堂乐歌及其历史意义。","rubric":[{"t":"清末新式学堂设乐歌课，多依曲填词","s":4},{"t":"沈心工、李叔同、曾志忞等代表人物","s":4},{"t":"开近代音乐教育之先，普及五线谱与简谱","s":4},{"t":"传播新思想，为专业音乐发展准备人才","s":3}],"answer":"学堂乐歌是清末民初新式学堂的乐歌课及其歌曲，多采用日本、欧美曲调重新填词，代表人物有沈心工、李叔同、曾志忞。它开中国近代音乐教育之先，普及了记谱法与集体歌唱，传播新思想，为专业音乐的发展准备了人才与听众。","refCards":["cn09-1"],"chIds":["cn09"]},{"id":"r-2019-3","year":2019,"part":"中国音乐史","type":"简答","full":20,"difficulty":2,"q":"春秋战国时期音乐思想「百家争鸣」主要有哪些派别？反映了哪些不同的音乐思想？","rubric":[{"t":"儒家：孔子尽善尽美、荀子《乐论》，主张乐教","s":6},{"t":"墨家：墨子《非乐》，反对奢乐","s":5},{"t":"道家：老子大音希声、庄子天籁，崇尚自然","s":5},{"t":"儒道互补构成中国古代音乐美学两大源头","s":4}],"answer":"主要有儒、墨、道三家。儒家以孔子「尽善尽美」、荀子《乐论》为代表，主张以乐教化、礼乐相济；墨家墨子《非乐》反对统治者的奢侈享乐；道家老子「大音希声」、庄子「天籁」崇尚自然、否定人为。三家争鸣奠定了中国古代音乐美学的基础。","refCards":["cn03-9"],"chIds":["cn03"]},{"id":"r-2013-7","year":2013,"part":"中国音乐史","type":"论述","full":25,"difficulty":3,"q":"宋代市民音乐的发展及其历史意义。","rubric":[{"t":"城市繁荣，瓦舍勾栏等固定演艺场所出现","s":6},{"t":"曲子词、说唱（鼓子词、唱赚、诸宫调）、杂剧繁荣","s":7},{"t":"音乐重心由宫廷转向市民，职业化、商品化","s":6},{"t":"为元杂剧与明清戏曲说唱奠定基础","s":6}],"answer":"宋代城市经济繁荣，出现了瓦舍、勾栏等固定演艺场所，曲子词、鼓子词、唱赚、诸宫调、杂剧等在市井繁荣。音乐重心由宫廷转向市民，艺人职业化、演出商品化。这一转向为元杂剧的成熟和明清戏曲、说唱的发展奠定了基础。","refCards":["cn07-9","cn07-3"],"chIds":["cn07"]},{"id":"r-2013-8","year":2013,"part":"中国音乐史","type":"论述","full":25,"difficulty":3,"q":"中国歌剧史上的三次高潮及其代表性作品评述。","rubric":[{"t":"第一次：20—30 年代，《扬子江暴风雨》等探索","s":6},{"t":"第二次：40 年代延安，《白毛女》标志民族新歌剧成熟","s":7},{"t":"第三次：建国后《洪湖赤卫队》《江姐》等","s":6},{"t":"评述：民族化与西方歌剧形式的结合","s":6}],"answer":"中国歌剧的三次高潮：20—30 年代以《扬子江暴风雨》《秋子》等为代表，开始借鉴西方歌剧形式；40 年代延安秧歌运动催生《白毛女》，标志民族新歌剧的成熟；建国后《洪湖赤卫队》《江姐》把民族音调、板腔体与西方歌剧结构结合，形成中国歌剧的黄金期。三次高潮的共同主题是「民族化」。","refCards":["cn11-8","cn12-5","cn13-3"],"chIds":["cn11","cn12","cn13"]},{"id":"r-2019-4","year":2019,"part":"中国音乐史","type":"论述","full":30,"difficulty":3,"q":"论述 19 世纪末以来西方音乐传入中国的影响并举例说明。","rubric":[{"t":"传入渠道：教会、学堂、留学生、唱片与电影","s":7},{"t":"学堂乐歌与西方乐理、记谱法的普及","s":8},{"t":"专业音乐教育与交响乐、歌剧等体裁的引入","s":8},{"t":"中西融合的创作实践与民族化探索","s":7}],"answer":"19 世纪末以来，西方音乐经教会、新式学堂、留学生与唱片电影等渠道传入。学堂乐歌带来西方记谱法与集体歌唱，专业音乐教育引入交响乐、歌剧等体裁，出现《梁祝》等中西融合的作品。这一过程既重塑了中国音乐的形态，也引发了「全盘西化」与「国乐改进」的长期争论。","refCards":["cn09-5","cn11-2"],"chIds":["cn09","cn11"]},{"id":"r-2022-9","year":2022,"part":"中国音乐史","type":"论述","full":30,"difficulty":3,"q":"请论述周代礼乐制度的内涵与具体的制度表现，并论述其在春秋战国时期的发展。","rubric":[{"t":"周公制礼作乐，以乐配礼、维护宗法等级","s":7},{"t":"八佾、乐悬、大司乐、六代之乐等制度表现","s":8},{"t":"春秋战国礼崩乐坏，郑卫之音兴起","s":8},{"t":"诸子对礼乐的反思，音乐思想空前活跃","s":7}],"answer":"周代礼乐制度由周公「制礼作乐」确立，以乐配礼维护宗法等级，表现为八佾、乐悬的等级规范，大司乐掌乐教，六代之乐用于祭祀。春秋战国礼崩乐坏，郑卫之音流行，孔子「恶郑声之乱雅乐」，诸子围绕礼乐展开争鸣，音乐思想空前活跃。","refCards":["cn03-1","cn03-9"],"chIds":["cn03"]},{"id":"r-2022-10","year":2022,"part":"中国音乐史","type":"论述","full":30,"difficulty":3,"q":"请论述学堂乐歌在中国音乐历史上的价值与意义。","rubric":[{"t":"近代音乐教育的开端，乐歌课进入学堂","s":7},{"t":"依曲填词的方式与西方记谱法的普及","s":8},{"t":"启蒙与救亡的双重主题","s":8},{"t":"为专业音乐创作与教育培养人才和听众","s":7}],"answer":"学堂乐歌是中国近代音乐教育的开端，乐歌课进入新式学堂，依曲填词的创作方式普及了西方记谱法与集体歌唱。它承载启蒙与救亡的双重主题，塑造了近代国民音乐生活，并为专业音乐创作与教育培养了人才和听众。","refCards":["cn09-1"],"chIds":["cn09"]},{"id":"r-2023-5","year":2023,"part":"中国音乐史","type":"论述","full":20,"difficulty":3,"q":"请谈一谈中国古代三大音乐美学代表作的主要观点及其对中国音乐发展的影响。","rubric":[{"t":"《乐记》：物动心感、礼辨异乐和同","s":6},{"t":"《声无哀乐论》：声音无关于哀乐","s":6},{"t":"《溪山琴况》：二十四况、以和为纲","s":5},{"t":"三者构成中国古代音乐美学的主线","s":3}],"answer":"《乐记》提出「物动心感」「礼辨异、乐和同」，奠定儒家音乐功能论；嵇康《声无哀乐论》主张声音本体无哀乐，转向审美本体；徐上瀛《溪山琴况》以二十四况论琴，标举清微淡远。三者分别代表教化论、本体论与境界论，构成中国古代音乐美学的主线。","refCards":["cn03-10","cn05-3","cn08-10"],"chIds":["cn03","cn05","cn08"]},{"id":"r-2023-6","year":2023,"part":"中国音乐史","type":"论述","full":20,"difficulty":3,"q":"什么叫「旋宫转调」？「八十四调」与「二十八调」与先秦宫调理论有何不同？","rubric":[{"t":"旋宫：调高转换；转调：调式转换","s":5},{"t":"先秦：十二律与五声、三分损益的宫调体系","s":5},{"t":"八十四调：十二律×七声，隋代郑译、万宝常","s":5},{"t":"二十八调：唐代燕乐调体系，与实际实践结合","s":5}],"answer":"旋宫指十二律轮流作宫、改变调高，转调指调式转换。先秦宫调以十二律配五声、由三分损益生律，理论上可旋宫而实践受限。隋代郑译、万宝常推八十四调（十二律×七声），唐代燕乐实际用二十八调。由理论推演走向实践选择，是宫调理论的重要变化。","refCards":["cn06-9","cn03-5"],"chIds":["cn06","cn03"]},{"id":"r-2023-7","year":2023,"part":"中国音乐史","type":"论述","full":20,"difficulty":3,"q":"元杂剧与南戏之比较。","rubric":[{"t":"杂剧：四折一楔子、一人主唱、一宫到底","s":5},{"t":"南戏：结构灵活、多人分唱、曲牌自由","s":5},{"t":"代表作：关汉卿、王实甫 vs 四大传奇","s":5},{"t":"北曲与南曲的音调差异及合流","s":5}],"answer":"元杂剧用北曲，四折一楔子，一人主唱、一宫到底，结构严整，代表作《窦娥冤》《西厢记》；南戏用南曲，结构灵活、多人分唱、曲牌自由，代表作「四大传奇」。二者在音调、体制上形成南北对照，后经「南北合套」走向融合，为明清传奇铺路。","refCards":["cn07-4"],"chIds":["cn07"]},{"id":"r-2012-1","year":2012,"part":"西方音乐史","type":"名词解释","full":5,"difficulty":2,"q":"通奏低音","rubric":[{"t":"巴洛克时期的核心织体手法","s":2},{"t":"低音声部标数字指示和弦，演奏者即兴填充","s":2},{"t":"标志主调音乐的兴起","s":1}],"answer":"通奏低音是巴洛克音乐的核心手法，作曲家在低音声部标出数字指示上方和弦，由键盘与低音乐器即兴填充，形成「旋律—低音」两极的织体，标志主调音乐的兴起。","refCards":["w04-1"],"chIds":["w04"]},{"id":"r-2012-2","year":2012,"part":"西方音乐史","type":"名词解释","full":5,"difficulty":2,"q":"罗马乐派","rubric":[{"t":"16 世纪以罗马为中心的音乐流派","s":2},{"t":"帕莱斯特里那为代表，风格纯净均衡","s":2},{"t":"《马切洛斯教皇弥撒》为典范","s":1}],"answer":"罗马乐派是 16 世纪以罗马为中心的音乐流派，代表作曲家帕莱斯特里那，风格纯净、声部均衡、不协和音处理谨慎，《马切洛斯教皇弥撒》为典范，是文艺复兴复调的最高成就之一。","refCards":["w03-4"],"chIds":["w03"]},{"id":"r-2012-3","year":2012,"part":"西方音乐史","type":"名词解释","full":5,"difficulty":1,"q":"门德尔松","rubric":[{"t":"德国浪漫主义作曲家、指挥家","s":2},{"t":"《仲夏夜之梦》序曲、《无词歌》","s":2},{"t":"创办莱比锡音乐学院，复兴巴赫","s":1}],"answer":"门德尔松是德国浪漫主义作曲家、指挥家，作有《仲夏夜之梦》序曲、《无词歌》、《意大利交响曲》，创办莱比锡音乐学院，并推动巴赫《马太受难曲》的复兴。","refCards":["w06-2"],"chIds":["w06"]},{"id":"r-2012-4","year":2012,"part":"西方音乐史","type":"名词解释","full":5,"difficulty":2,"q":"乐剧","rubric":[{"t":"瓦格纳创立的音乐戏剧形式","s":2},{"t":"整体艺术：诗、乐、剧、舞台一体","s":2},{"t":"主导动机与无终旋律，《指环》为代表","s":1}],"answer":"乐剧是瓦格纳创立的音乐戏剧形式，主张「整体艺术」，把诗、音乐、戏剧、舞台美术融为一体，用主导动机贯穿全剧、以无终旋律取消分曲，代表作《尼伯龙根的指环》。","refCards":["w06-5"],"chIds":["w06"]},{"id":"r-2012-5","year":2012,"part":"西方音乐史","type":"名词解释","full":5,"difficulty":2,"q":"交响诗","rubric":[{"t":"李斯特创立的单乐章标题管弦乐体裁","s":2},{"t":"与文学、绘画、诗歌结合","s":2},{"t":"《前奏曲》《塔索》为代表","s":1}],"answer":"交响诗是李斯特创立的单乐章标题管弦乐体裁，把文学、诗歌、绘画的内容转化为音乐结构，代表作《前奏曲》《塔索》，是浪漫主义标题音乐的重要形式。","refCards":["w06-8"],"chIds":["w06"]},{"id":"r-2012-6","year":2012,"part":"西方音乐史","type":"简答","full":15,"difficulty":2,"q":"文艺复兴时期器乐的发展情况及历史意义。","rubric":[{"t":"由声乐改编走向独立创作","s":4},{"t":"利切卡尔、坎佐纳、幻想曲、舞曲等体裁","s":5},{"t":"乐器制作与演奏技术提高","s":3},{"t":"为巴洛克器乐的繁荣奠定基础","s":3}],"answer":"文艺复兴时期器乐从声乐改编（如坎佐纳）逐步走向独立创作，出现利切卡尔、幻想曲、舞曲等体裁，乐器制作与演奏技术提高。器乐的独立为巴洛克协奏曲、奏鸣曲与赋格的繁荣奠定了基础。","refCards":["w03-6"],"chIds":["w03"]},{"id":"r-2012-7","year":2012,"part":"西方音乐史","type":"简答","full":15,"difficulty":2,"q":"巴赫的复调音乐作品及特征。","rubric":[{"t":"《平均律钢琴曲集》确立十二平均律的实践","s":4},{"t":"赋格的结构：主题、答题、对题、插部","s":4},{"t":"《赋格的艺术》《哥德堡变奏曲》","s":4},{"t":"复调技术的集大成，兼具宗教性与科学性","s":3}],"answer":"巴赫的复调作品以《平均律钢琴曲集》为代表，48 首前奏曲与赋格确立十二平均律的实践；赋格由主题、答题、对题、插部构成，逻辑严密。《赋格的艺术》《哥德堡变奏曲》把复调技术推向顶峰，兼具宗教情感与数理结构。","refCards":["w04-6"],"chIds":["w04"]},{"id":"r-2012-8","year":2012,"part":"西方音乐史","type":"简答","full":15,"difficulty":2,"q":"海顿在交响曲领域的贡献。","rubric":[{"t":"确立四乐章结构与乐队编制","s":4},{"t":"104 部交响曲，《伦敦》《惊愕》《告别》","s":5},{"t":"主题发展与奏鸣曲式的完善","s":3},{"t":"被誉为「交响曲之父」","s":3}],"answer":"海顿作有 104 部交响曲，确立四乐章结构（快—慢—小步舞曲—快）与双管编制的乐队模式，完善奏鸣曲式与主题发展手法，代表作《伦敦交响曲》《惊愕》《告别》，被誉为「交响曲之父」。","refCards":["w05-3"],"chIds":["w05"]},{"id":"r-2012-9","year":2012,"part":"西方音乐史","type":"论述","full":30,"difficulty":3,"q":"结合实例论述 19 世纪下半叶法国歌剧的各种类型及其风格特征。","rubric":[{"t":"大歌剧：宏大场面与历史题材","s":7},{"t":"抒情歌剧：古诺《浮士德》","s":7},{"t":"喜歌剧／轻歌剧：奥芬巴赫《地狱中的奥菲欧》","s":8},{"t":"比才《卡门》：现实主义与西班牙色彩","s":8}],"answer":"19 世纪下半叶法国歌剧分为几类：大歌剧以宏大场面和历史题材取胜；抒情歌剧以古诺《浮士德》为代表，旋律优美、情感细腻；轻歌剧以奥芬巴赫《地狱中的奥菲欧》为代表，讽刺俏皮；比才《卡门》则以现实主义题材与西班牙色彩开创新风。","refCards":["w06-3"],"chIds":["w06"]},{"id":"r-2020-1","year":2020,"part":"西方音乐史","type":"论述","full":20,"difficulty":3,"q":"文艺复兴时期器乐的出现及发展情况。","rubric":[{"t":"从声乐改编到独立创作","s":5},{"t":"利切卡尔、坎佐纳、幻想曲、舞曲","s":6},{"t":"乐器改良与演奏技术","s":4},{"t":"为巴洛克器乐奠定基础","s":5}],"answer":"文艺复兴时期器乐先依附于声乐，由尚松、弥撒改编为坎佐纳、利切卡尔，随后出现独立的幻想曲与舞曲。乐器制作与演奏技术进步，器乐逐渐获得独立地位，为巴洛克奏鸣曲、协奏曲的繁荣准备条件。","refCards":["w03-6"],"chIds":["w03"]},{"id":"r-2020-2","year":2020,"part":"西方音乐史","type":"论述","full":20,"difficulty":3,"q":"巴洛克时期歌剧的产生及主要乐派。","rubric":[{"t":"佛罗伦萨卡梅拉塔与《达芙妮》《尤丽狄茜》","s":5},{"t":"蒙特威尔第《奥菲欧》","s":5},{"t":"威尼斯、那不勒斯乐派与返始咏叹调","s":5},{"t":"法国吕利、英国普赛尔","s":5}],"answer":"歌剧诞生于 16 世纪末佛罗伦萨的卡梅拉塔社团，佩里《达芙妮》《尤丽狄茜》是最早的作品，蒙特威尔第《奥菲欧》确立戏剧表现力。此后形成威尼斯乐派（公开歌剧院）、那不勒斯乐派（返始咏叹调），法国有吕利的抒情悲剧，英国有普赛尔《狄多与埃涅阿斯》。","refCards":["w04-2","w04-3"],"chIds":["w04"]},{"id":"r-2020-3","year":2020,"part":"西方音乐史","type":"论述","full":20,"difficulty":3,"q":"浪漫主义早期的代表性作曲家及贡献。","rubric":[{"t":"韦伯与德国民族歌剧《魔弹射手》","s":5},{"t":"舒伯特与艺术歌曲、《未完成交响曲》","s":5},{"t":"柏辽兹与标题音乐《幻想交响曲》","s":5},{"t":"门德尔松、舒曼的贡献","s":5}],"answer":"浪漫主义早期：韦伯以《魔弹射手》开创德国民族歌剧；舒伯特把艺术歌曲推向高峰，作《魔王》《冬之旅》与《未完成交响曲》；柏辽兹《幻想交响曲》确立标题音乐与固定乐思；门德尔松、舒曼在管弦乐、钢琴小品与音乐评论上各有建树。","refCards":["w06-2","w06-3"],"chIds":["w06"]},{"id":"r-2020-4","year":2020,"part":"西方音乐史","type":"论述","full":20,"difficulty":3,"q":"浪漫主义时期俄罗斯民族乐派的音乐创作情况。","rubric":[{"t":"格林卡奠基，《鲁斯兰与柳德米拉》","s":5},{"t":"五人团及各自贡献","s":6},{"t":"柴可夫斯基的独立地位","s":5},{"t":"民族题材与东方色彩","s":4}],"answer":"俄罗斯民族乐派由格林卡奠基，五人团（巴拉基列夫、穆索尔斯基、里姆斯基-科萨科夫、鲍罗丁、居伊）以民间音调与民族历史题材创作，穆索尔斯基《图画展览会》、鲍罗丁《伊戈尔王》为代表；柴可夫斯基虽不属于五人团，却把俄罗斯音乐推向世界。","refCards":["w06-6"],"chIds":["w06"]},{"id":"r-2020-5","year":2020,"part":"西方音乐史","type":"论述","full":20,"difficulty":2,"q":"列举一首西方音乐作品，谈一谈你的表演或欣赏感受。","rubric":[{"t":"准确说明作品、作曲家与体裁","s":5},{"t":"分析音乐要素（旋律、和声、结构、音色）","s":6},{"t":"结合个人表演或欣赏经验","s":5},{"t":"表达有条理、有真情实感","s":4}],"answer":"（开放题）先点明作品与体裁，再从旋律、和声、结构、音色等要素分析，最后结合自己的演奏或聆听经验谈感受。评分重点在「音乐要素分析是否具体」与「个人体验是否真实」。","refCards":["w05-5"],"chIds":["w05"]}],"hot":[{"id":"h07","part":"中国音乐史","type":"简答","full":15,"difficulty":3,"tag":"押题","chIds":["cn11","cn13"],"q":"2027 年是建军百年。试述中国革命音乐中的军歌传统及其演变。","rubric":[{"t":"《国民革命歌》《三大纪律八项注意》等早期军歌","s":4},{"t":"聂耳《义勇军进行曲》与救亡歌咏","s":4},{"t":"《中国人民解放军军歌》等建国后军旅歌曲","s":4},{"t":"军歌的节奏特征与集体歌唱功能","s":3}],"answer":"革命军歌从《国民革命歌》《三大纪律八项注意》起步，抗战时期由聂耳《义勇军进行曲》与救亡歌咏推向高潮，建国后《中国人民解放军军歌》等延续传统。军歌多用进行曲节奏、附点与切分，强调集体性与号召力。","refCards":["cn11-7","cn09-1"]},{"id":"h08","part":"中国音乐史","type":"简答","full":15,"difficulty":3,"tag":"押题","chIds":["cn12","cn15"],"q":"2027 年是香港回归三十周年。试述粤语流行曲的兴起与广东音乐的关系。","rubric":[{"t":"广东音乐：《步步高》《雨打芭蕉》，吕文成等","s":4},{"t":"粤曲与粤剧的音乐传统","s":4},{"t":"1970—80 年代粤语流行曲兴起，顾嘉辉、黄霑","s":4},{"t":"影视主题曲与流行乐互相成就","s":3}],"answer":"广东音乐以《步步高》《雨打芭蕉》为代表，粤曲、粤剧提供声腔与乐队传统。1970—80 年代粤语流行曲兴起，顾嘉辉、黄霑把粤曲的腔韵与西方编曲结合，影视主题曲成为传播主渠道，形成独特的香港声音。","refCards":["cn12-7","cn15-1"]},{"id":"h09","part":"中国音乐史","type":"论述","full":13,"difficulty":3,"tag":"押题","chIds":["cn06","cn14"],"q":"从《霓裳羽衣曲》到舞剧《丝路花雨》，谈谈「丝绸之路」题材在中国音乐舞蹈中的延续。","rubric":[{"t":"《霓裳羽衣曲》与唐代西域乐舞的吸收","s":4},{"t":"唐代多部乐与中外交流的格局","s":3},{"t":"《丝路花雨》的敦煌题材与舞剧语言","s":3},{"t":"「丝路」作为文化母题的当代意义","s":3}],"answer":"《霓裳羽衣曲》吸收《婆罗门曲》素材，是唐代西域乐舞东传的产物；十部乐的制度化说明交流已成规模。1979 年舞剧《丝路花雨》以敦煌壁画为素材，把「丝路」从历史题材转化为当代舞台语言，形成跨越千年的呼应。","refCards":["cn06-4","cn14-5"]},{"id":"h10","part":"中国音乐史","type":"论述","full":13,"difficulty":3,"tag":"押题","chIds":["cn03","cn08","cn14"],"q":"试论中国音乐史上的「雅俗之争」及其当代回响。","rubric":[{"t":"先秦：雅乐与郑卫之音的对立","s":3},{"t":"明清：花雅之争与地方戏的兴起","s":3},{"t":"近现代：学堂乐歌、流行音乐的合法性争论","s":3},{"t":"规律：俗乐不断吸收、改造并进入主流","s":2},{"t":"结构清晰","s":2}],"answer":"先秦以雅乐为正声、郑卫之音为淫声；明清花部乱弹冲击雅部昆曲，地方戏兴起；近现代流行音乐再次引发「雅俗」争论。贯穿其中的规律是：俗乐不断被吸收、改造，最终进入主流，雅俗边界始终在移动。","refCards":["cn03-9","cn08-4"]},{"id":"h11","part":"中国音乐史","type":"论述","full":13,"difficulty":3,"tag":"押题","chIds":["cn01","cn03","cn13"],"q":"音乐考古如何改写中国音乐史？请以贾湖骨笛与曾侯乙编钟为例说明。","rubric":[{"t":"贾湖骨笛：距今约八千年，七声音阶","s":3},{"t":"曾侯乙编钟：一钟双音、十二律、旋宫转调","s":4},{"t":"出土乐器与铭文对文献的印证与修正","s":3},{"t":"音乐史研究的方法论意义","s":3}],"answer":"贾湖骨笛把中国音乐的可考历史推到八千年前，证明七声音阶早已存在；曾侯乙编钟以实物与铭文证明先秦十二律与旋宫转调的高度发达，修正了「先秦乐律简陋」的旧说。音乐考古以实物证据补充文献，改变了音乐史的叙述方式。","refCards":["cn01-2","cn03-4"]},{"id":"h12","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"押题","chIds":["w04","w05","w07"],"q":"试论协奏曲体裁从巴洛克到 20 世纪的演变。","rubric":[{"t":"巴洛克：大协奏曲与独奏协奏曲，维瓦尔第","s":3},{"t":"古典：莫扎特的对话性与贝多芬的戏剧性","s":3},{"t":"浪漫：炫技与交响化，李斯特、勃拉姆斯","s":3},{"t":"20 世纪：巴托克、肖斯塔科维奇的再创造","s":2},{"t":"结构清晰","s":2}],"answer":"巴洛克协奏曲以「竞奏」为核心，维瓦尔第确立快慢快三乐章；古典时期莫扎特把独奏与乐队写成对话，贝多芬注入戏剧冲突；浪漫主义走向炫技与交响化；20 世纪巴托克、肖斯塔科维奇重新定义独奏与乐队的关系。","refCards":["w04-5","w05-4","w07-5"]},{"id":"h13","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"押题","chIds":["w06","w07"],"q":"民族乐派的观念在 20 世纪如何延续？请结合巴托克、布里顿与当代中国作曲家说明。","rubric":[{"t":"19 世纪民族乐派的基本主张","s":3},{"t":"巴托克：民间音乐的科学研究与创作转化","s":3},{"t":"布里顿：英国民歌与歌剧传统","s":3},{"t":"中国当代作曲家的「民族性」实践","s":2},{"t":"结构清晰","s":2}],"answer":"19 世纪民族乐派以民间音调与民族题材对抗德奥中心；20 世纪巴托克把民歌采集与调式研究转化为作曲语言，布里顿重建英国歌剧传统；中国当代作曲家则在现代技法中寻找本土语汇，民族性从「素材」变成「观念」。","refCards":["w06-6","w07-5"]},{"id":"h14","part":"西方音乐史","type":"论述","full":13,"difficulty":3,"tag":"押题","chIds":["w07"],"q":"人工智能与数字技术正在改变音乐创作与表演。结合 20 世纪以来的音乐技术史，谈谈你的看法。","rubric":[{"t":"20 世纪：录音、电子音乐与具体音乐","s":3},{"t":"技术如何改变音色、结构与传播","s":3},{"t":"AI 对创作主体与表演价值的挑战","s":3},{"t":"结合个人专业实践的观点","s":2},{"t":"结构清晰","s":2}],"answer":"20 世纪录音技术、电子音乐与具体音乐已经把「声音本身」变成素材，施托克豪森、瓦列兹是先行者。AI 进一步把创作与演奏的部分环节自动化，挑战「作者」与「表演」的定义。技术从未取代音乐，而是不断改写音乐的边界与听赏方式。","refCards":["w07-6"]}]},"refs":{"cn01-1":{"book":"ma","sec":"中国·第一章 远古、夏、商","secId":"ma1","page":4,"pageEnd":9},"cn01-2":{"book":"ma","sec":"中国·第一章 远古、夏、商","secId":"ma1","page":4,"pageEnd":9},"cn01-3":{"book":"ma","sec":"中国·第一章 远古、夏、商","secId":"ma1","page":4,"pageEnd":9},"cn01-4":{"book":"ma","sec":"中国·第一章 远古、夏、商","secId":"ma1","page":4,"pageEnd":9},"cn01-5":{" function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function fmt(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function todayStr(){ return fmt(new Date()); }
function parseD(s){ var p = s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(s, n){ var d = parseD(s); d.setDate(d.getDate() + n); return fmt(d); }
function diffDays(a, b){ return Math.round((parseD(b) - parseD(a)) / 86400000); }
var WD = ["周日","周一","周二","周三","周四","周五","周六"];
function cnDate(s){ var d = parseD(s); return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日 · " + WD[d.getDay()]; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function markText(text, keys){
  var src = esc(text);
  var ks = (keys||[]).filter(Boolean).map(esc).map(function(k){ return k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); })
             .sort(function(a,b){ return b.length - a.length; });
  if(!ks.length) return src;
  try { return src.replace(new RegExp("(" + ks.join("|") + ")", "g"), "<mark>$1</mark>"); }
  catch(e){ return src; }
}

/* ---------------- 计算 ---------------- */
function daysLeft(){
  var n = diffDays(todayStr(), S.settings.exam);
  return n < 0 ? 0 : n;
}
function examPassed(){ return diffDays(todayStr(), S.settings.exam) < 0; }
function paceDays(){
  var p = S.settings.pace;
  if(p === "standard") return PACES.standard.days;
  if(p === "sprint") return PACES.sprint.days;
  return daysLeft() < 60 ? PACES.sprint.days : PACES.standard.days;
}
function dueList(){
  var t = todayStr();
  return CARDS.filter(function(c){ var s = S.cards[c.id]; return s && s.due <= t; })
    .sort(function(a,b){ return S.cards[a.id].due < S.cards[b.id].due ? -1 : 1; });
}
function dueCount(){ return dueList().length; }
function newList(){ return CARDS.filter(function(c){ return !S.cards[c.id]; }); }
function planIds(){
  if(!S.plan || S.plan.date !== todayStr()) S.plan = {date: todayStr(), ids: []};
  return S.plan.ids;
}
function inPlan(id){ return planIds().indexOf(id) >= 0; }
function togglePlan(id){
  var ids = planIds(), i = ids.indexOf(id);
  if(i >= 0) ids.splice(i, 1); else ids.push(id);
  save();
}
function planCards(){
  var ids = planIds();
  return CARDS.filter(function(c){ return ids.indexOf(c.id) >= 0; });

function mastered(){ return Object.keys(S.cards).filter(function(id){ return S.cards[id].stage >= 3; }).length; }
function day(t){
  t = t || todayStr();
  if(!S.days[t]) S.days[t] = {rev:0, neu:0, check:false, due0:dueCount()};
  return S.days[t];
}
function streak(){
  var t = todayStr(), d = S.days[t];
  if(!(d && d.check)) t = addDays(t, -1);
  var n = 0;
  while(S.days[t] && S.days[t].check){ n++; t = addDays(t, -1); }
  return n;
}

function examTrend(){
  var list = examHistory().filter(function(p){ return p.result; }).slice(-6);
  if(!list.length) return '<p class="mini" style="margin:0">批改完成后，这里会出现成绩趋势</p>';
  var html = '<p class="mini" style="margin:0 0 10px">最近 ' + list.length + ' 次模考（适中分）</p><div class="trend">';
  list.forEach(function(p){
    var h = Math.max(6, Math.round((p.result.mid || 0) / 150 * 74));
    html += '<div class="tcol"><span class="tval">' + (p.result.mid || 0) + '</span>' +
      '<div class="tbar" style="height:' + h + 'px"></div>' +
      '<span class="tlab">' + esc(p.id.slice(-3)) + '</span></div>';
  });
  html += '</div>';
  return html;
}

function bestScore(){
  var best = 0;
  examHistory().forEach(function(p){ if(p.result && p.result.mid > best) best = p.result.mid; });
  return best || "--";
}
function suggest(){
  var left = newCount(), days = Math.max(1, daysLeft());
  return Math.max(4, Math.ceil(left / days));
}

function startSession(extra){
  var t = todayStr(), d = day(t);
  var picked = planIds().filter(function(id){ return BY_ID[id]; });
  var queue = dueList().map(function(c){ return c.id; });
  queue = picked.concat(queue.filter(function(id){ return picked.indexOf(id) < 0; }));
  var quotaLeft = Math.max(0, S.settings.quota - d.neu);
  var news = newList().slice(0, quotaLeft).map(function(c){ return c.id; });

  if(extra || queue.length === 0){
    var pool = CARDS.filter(function(c){ return S.cards[c.id] && S.cards[c.id].stage < 4; })
      .sort(function(a,b){ return (S.cards[a.id].due < S.cards[b.id].due) ? -1 : 1; });
    if(!pool.length) pool = CARDS.slice();
    queue = pool.slice(0, 10).map(function(c){ return c.id; });
  }
  if(!queue.length){ toast("暂时没有可学习的卡片"); return; }
  study = {queue:queue, i:0, revealed:false, stats:{got:0, vague:0, forgot:0}};
  $("#overlay").hidden = false;
  renderStudy();

function hintFor(lvl, c){
  if(lvl === "forgot") return "稍后重来";
  var iv = paceDays();
  var st = S.cards[c.id];
  if(lvl === "vague") return "明天再巩固";
  if(!st) return intervalLabel(iv[0]);
  var ns = Math.min(st.stage + 1, iv.length - 1);
  return intervalLabel(iv[ns]);
}

function rate(id, lvl){
  var t = todayStr();
  var isNew = !S.cards[id];
  var c = S.cards[id] || {stage:0, due:t, last:"", seen:0, lapses:0};
  var iv = paceDays();
  if(lvl === "forgot"){
    c.stage = 0; c.lapses = (c.lapses||0) + 1; c.due = addDays(t, 1);
  } else if(lvl === "vague"){
    var cur = Math.min(c.stage, iv.length-1);
    c.due = addDays(t, Math.max(1, Math.round(iv[cur] / 2)));
  } else {
    if(isNew){ c.stage = 0; c.due = addDays(t, iv[0]); }
    else { c.stage = Math.min(c.stage + 1, iv.length - 1); c.due = addDays(t, iv[c.stage]); }
  }
  c.seen = (c.seen||0) + 1; c.last = t;
  S.cards[id] = c;

  var d = day(t);
  if(isNew) d.neu++; else d.rev++;
  save();

  if(lvl === "forgot" && study && study.queue.length < 160){
    var at = Math.min(study.i + 1 + 2, study.queue.length);
    study.queue.splice(at, 0, id);
  }
  study.stats[lvl]++;
  try{
    var lc = window.__lastClick || {x: window.innerWidth / 2, y: window.innerHeight - 150};
    Effects.scene(lvl === "got" ? "got" : (lvl === "vague" ? "vague" : "forgot"), lc);
    Quotes.show(lvl === "got" ? "got" : (lvl === "vague" ? "vague" : "forgot"));
    if(lvl === "got") Sound.got();
    else if(lvl === "vague") Sound.vague();
    else Sound.forgot();
  }catch(e){}
  study.i++;
  study.revealed = false;
  renderStudy();
}

function findExam(id){

function lvlName(d){ return d === "basic" ? "基础" : (d === "hard" ? "拔高" : "标准"); }

var EXAM_MAP = {};
["items", "chapters", "real", "hot"].forEach(function(k){
  (EX[k] || []).forEach(function(it){ EXAM_MAP[it.id] = it; });
});
function fitItem(it, full){
  if(Math.abs(it.full - full) < 0.01) return it;
  var k = full / it.full;
  var rub = it.rubric.map(function(r){ return {t:r.t, s: Math.round(r.s * k * 2) / 2}; });
  var sum = 0; rub.forEach(function(r){ sum += r.s; });
  rub[rub.length - 1].s = Math.round((rub[rub.length - 1].s + (full - sum)) * 2) / 2;
  return {qid: it.qid || it.id, type: it.type, part: it.part, full: full,
          diff: it.diff || it.difficulty || 2, tag: it.tag || (it.year ? "真题 " + it.year : ""),
          pref: it.pref || 1, q: it.q, chIds: (it.chIds || []).slice(), refCards: (it.refCards || []).slice(),
          rubric: rub, answer: it.answer || "", hint: it.hint || ""};
}

function balanceRubric(list, full){
  var sum = 0;
  list.forEach(function(r){ sum += r.s; });
  if(list.length && Math.abs(sum - full) > 0.001){
    var last = list[list.length - 1];
    last.s = Math.round((last.s + (full - sum)) * 2) / 2;
  }
  return list;
}
function rubricFromCard(c, type, full){
  var pts = c.pts.slice(0, 6);
  var content, extra;
  if(type === "名词解释"){ content = full - 2; extra = [{t:"表述准确、条理清晰", s:2}]; }
  else if(type === "简答"){ content = full - 3; extra = [{t:"条理清晰，能举例说明", s:3}]; }
  else { content = full - 4; extra = [{t:"论证充分，有作品举例", s:2},{t:"结构完整，术语准确", s:2}]; }
  var per = Math.round((content / pts.length) * 2) / 2;
  var list = pts.map(function(p){ return {t:p, s:per}; });
  return balanceRubric(list.concat(extra), full);
}
function cardItem(c, type, full){
  var q = c.exam || c.q;
  var pre = type === "简答" ? "简述" : (type === "论述" ? "试论" : "");
  if(pre && !/[？?]$/.test(q) && !/^(简述|试述|试论|比较|说明|论述|分析|评述|为什么)/.test(q)) q = pre + q;
  return {
    qid: "c-" + c.id + "-" + type, type: type, part: c.part, full: full,
    diff: c.type === "名词解释" ? 1 : 2, tag: "",
    pref: type === "论述" && c.type !== "论述" ? 0.45 : 1,
    q: q, chIds: [c.chId], refCards: [c.id], syl: SYL[c.id] !== false, book: "card",
    rubric: rubricFromCard(c, type, full),
    answer: "", hint: c.tip || ""
  };
}
function snapItem(e){
  return {
    qid: e.id, type: e.type, part: e.part, full: e.full, diff: e.difficulty || 2,
    tag: e.tag || "", pref: (e.difficulty || 2) >= 3 ? 1.2 : 0.9, q: e.q, chIds: (e.chIds || []).slice(), refCards: (e.refCards || []).slice(),
    rubric: e.rubric.map(function(r){ return {t:r.t, s:r.s}; }), answer: e.answer, hint: "",
    syl: e.syl !== false
  };
}
function buildPools(){
  var ming = [], jian = [], lun = [];
  CARDS.forEach(function(c){
    if(c.part === "中国音乐史"){
      if(c.type === "名词解释") ming.push(cardItem(c, "名词解释", 10));
      else jian.push(cardItem(c, "简答", 15));
      lun.push(cardItem(c, "论述", 20));
    } else if(c.part === "西方音乐史"){
      lun.push(cardItem(c, "论述", 13));
      if(c.q.length <= 16) ming.push(cardItem(c, "名词解释", 10));
      else jian.push(cardItem(c, "简答", 15));
    }
  });
  (EX.chapters || []).forEach(function(e){
    if(e.part === "西方音乐史") lun.push(snapItem(e));
  });
  ["items", "real", "hot"].forEach(function(k){
    (EX[k] || []).forEach(function(e){
      var it = snapItem(e);
      if(k === "real") it.pref = 1.3;
      if(it.type === "名词解释") ming.push(it);
      else if(it.type === "简答") jian.push(it);
      else if(it.type === "论述") lun.push(it);
    });
  });

}
function weightedPick(arr, ws){
  var total = 0;
  ws.forEach(function(w){ total += w; });
  var r = Math.random() * total;
  for(var i = 0; i < arr.length; i++){ r -= ws[i]; if(r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}
function recentQids(n){
  var set = {}, list = examHistory().slice(-n);
  list.forEach(function(p){ (p.items || []).forEach(function(it){ set[it.qid] = 1; }); });
  return set;
}
function genItems(){
  var cfg = examCfg();
  var target = cfg.difficulty === "basic" ? 1 : (cfg.difficulty === "hard" ? 3 : 2);
  var pools = buildPools();
  var recent = recentQids(3);

  function prep(pool){
    return pool.filter(function(it){
      if(cfg.difficulty === "basic" && it.diff > 2) return false;
      if(!cfg.hot && it.tag === "押题") return false;
      return true;
    });
  }
  function pickMany(pool, count, minUnique, part){
    var base = prep(pool);
    if(part) base = base.filter(function(it){ return it.part === part; });
    var cands = base.filter(function(it){ return !recent[it.qid]; });
    if(cands.length < count) cands = base;
    var out = [], used = {};
    for(var i = 0; i < count; i++){
      var avail = cands.filter(function(it){ return out.indexOf(it) < 0; });
      if(!avail.length) break;
      if(out.length < (minUnique || 0)){
        var strict = avail.filter(function(it){ return !it.chIds.some(function(c){ return used[c]; }); });
        if(strict.length) avail = strict;
      }
      var ws = avail.map(function(it){
        var w = Math.max(0.12, 1 - 0.5 * Math.abs(it.diff - target));
        if(it.tag === "押题") w *= 1.5;
        if(it.pref) w *= it.pref;
        var dup = it.chIds.some(function(c){ return used[c]; });
        if(dup) w *= 0.22;
        return w;
      });
      var it = weightedPick(avail, ws);
      out.push(it);
      it.chIds.forEach(function(c){ used[c] = 1; });
    }
    return out;
  }

  var kind = cfg.type || "mixed";

  if(kind === "preset"){
    var paper = null;
    PAPERS.forEach(function(pp, i){ if(pp.title === cfg.paperId || ("p" + i) === cfg.paperId) paper = pp; });
    if(!paper) paper = PAPERS[0];
    if(!paper) return [];
    var outs = [];
    paper.sections.forEach(function(sec){
      sec.items.forEach(function(it){
        var c = it.cardId ? BY_ID[it.cardId] : null;
        var rubric = c ? rubricFromCard(c, it.type, it.full) : [
          {t: "概念/背景表述准确", s: Math.round(it.full * 0.35 * 2) / 2},
          {t: "要点完整，覆盖主要考查内容", s: Math.round(it.full * 0.4 * 2) / 2},
          {t: "结合实例，论证有条理", s: it.full - Math.round(it.full * 0.35 * 2) / 2 - Math.round(it.full * 0.4 * 2) / 2}
        ];
        outs.push({
          qid: "paper:" + paper.title + ":" + outs.length,
          type: it.type, part: sec.part || (c ? c.part : "中国音乐史"),
          full: it.full, diff: 2, tag: "套卷", pref: 1,
          q: it.q, chIds: c ? [c.chId] : [], refCards: c ? [c.id] : [],
          rubric: rubric, answer: "", hint: c ? (c.tip || "") : "",
          syl: c ? SYL[c.id] !== false : undefined,
          src: paper.title
        });
      });
    });
    return outs;
  }

  if(kind === "chapter"){
    var chId = cfg.chapter || (BOOKCH[0] && BOOKCH[0].id);
    var pool = [], seen = {};
    CARDS.forEach(function(c){
      var r = REFS[c.id];
      if(!r || r.secId !== chId) return;
      ["名词解释", "简答", "论述"].forEach(function(t){
        var full = t === "名词解释" ? 10 : (t === "简答" ? 15 : 20);
        var it = cardItem(c, t, full);
        if(!seen[c.id + t]){ seen[c.id + t] = 1; pool.push(it); }
      });
    });
    if(!pool.length) pool = pools.ming.concat(pools.jian, pools.lun);
    function take(type, n){
      var arr = pool.filter(function(it){ return it.type === type; });
      if(arr.length < n){
        arr = arr.concat(pools.ming.concat(pools.jian, pools.lun).filter(function(it){ return it.type === type; }));
      }
      var out2 = [], used2 = {};
      for(var i = 0; i < arr.length && out2.length < n; i++){
        var it = arr[i];
        if(used2[it.qid]) continue;
        used2[it.qid] = 1; out2.push(it);
      }
      return out2;
    }
    return take("名词解释", 5).map(function(it){ return fitItem(it, 10); })
      .concat(take("简答", 3).map(function(it){ return fitItem(it, 15); }))
      .concat(take("论述", 2).map(function(it){ return fitItem(it, 20); }));
  }

  if(kind === "gzmu"){
    return pickMany(pools.ming, 4, 3, "中国音乐史").map(function(it){ return fitItem(it, 10); })
      .concat(pickMany(pools.jian, 3, 3, "中国音乐史").map(function(it){ return fitItem(it, 15); }))
      .concat(pickMany(pools.lun, 2, 2, "中国音乐史").map(function(it){ return fitItem(it, 20); }))
      .concat(pickMany(pools.lun, 1, 1, "西方音乐史").map(function(it){ return fitItem(it, 25); }));
  }

  return pickMany(pools.ming, 4, 3).map(function(it){ return fitItem(it, 10); })
    .concat(pickMany(pools.jian, 3, 3).map(function(it){ return fitItem(it, 15); }))
    .concat(pickMany(pools.lun, 5, 4).map(function(it){ return fitItem(it, 13); }));
}

function clockText(){
  var p = S.examDraft;
  if(!p) return "--:--";
  var total = (p.cfg.duration || 180) * 60;
  var left = total - Math.floor((Date.now() - p.startedAt) / 1000);
  var m = Math.floor(Math.abs(left) / 60), s = Math.abs(left) % 60;
  return (left < 0 ? "+" : "") + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function startTimer(){
  stopTimer();
  examTimer = setInterval(function(){
    var el = $("#clock");
    if(!el) return;
    el.textContent = clockText();
    var p = S.examDraft;
    if(p){
      var left = (p.cfg.duration || 180) * 60 - Math.floor((Date.now() - p.startedAt) / 1000);
      el.classList.toggle("warn", left < 900);
    }
  }, 1000);
}
function submitPaper(){
  var p = S.examDraft;
  if(!p) return;
  var blank = 0;
  p.items.forEach(function(it){ if(!p.answers[it.no]) blank++; });
  var msg = "确认交卷？交卷后不能再修改答案。";
  if(p.cfg.mode !== "paper" && blank) msg = "还有 " + blank + " 题没有作答，仍要交卷吗？";
  if(!confirm(msg)) return;
  p.elapsed = Math.max(1, Math.round((Date.now() - p.startedAt) / 60000));
  p.submittedAt = Date.now();
  examHistory().push(p);
  S.examCurrent = p.id;
  S.examDraft = null;
  save();
  stopTimer();
  examView = "review";
  renderExam();
}

function cardExpr(id){
  var n = 0;
  for(var i = 0; i < id.length; i++) n = (n * 31 + id.charCodeAt(i)) % 9973;
  var order = CHARACTER.order || [];
  return order[n % order.length] || CHARACTER.daily();
}

function secFor(cid){
  var r = REFS[cid];
  if(r && r.sec) return r;
  var chId = cid.split("-")[0];
  var hit = null;
  Object.keys(REFS).forEach(function(k){
    if(hit) return;
    if(REFS[k].sec && k.split("-")[0] === chId) hit = REFS[k];
  });
  return hit;
}

function refLine(it){
  var ids = it.refCards || [];
  var out = [];
  ids.forEach(function(cid){
    var r = secFor(cid);
    if(!r || out.length >= 3) return;
    var name = r.book === "ma" ? "马强讲义" : "赵讲义";
    var short = (r.sec || "").replace(/^马强·|^赵·/, "");
    var page = r.pageEnd ? (short + " P" + r.page + "–" + r.pageEnd) : (short + " P" + r.page);
    var txt = name + " · " + page;
    if(out.indexOf(txt) < 0) out.push(txt);
  });
  if(!out.length) return "";
  return '<p class="refline">参考：' + esc(out.join("　")) + '</p>';
}

function examAggregate(p, r){
  var map = {};
  (r.items || []).forEach(function(it){ map[it.no] = it; });
  var parts = {}, types = {}, got = 0, full = 0;
  (p.items || []).forEach(function(item){
    var sc = map[item.no] ? (Number(map[item.no].score) || 0) : 0;
    got += sc; full += item.full;
    var pk = item.part || "其他", tk = item.type || "其他";
    if(!parts[pk]) parts[pk] = {s:0, f:0};
    parts[pk].s += sc; parts[pk].f += item.full;
    if(!types[tk]) types[tk] = {s:0, f:0};
    types[tk].s += sc; types[tk].f += item.full;
  });
  return {parts:parts, types:types, got:got, full:full, rate: full ? Math.round(got / full * 100) : 0};
}

function gradePack(p){
  var L = [];
  L.push("【模拟卷批改请求】");
  L.push("试卷编号：" + p.id + "　日期：" + p.date);
  var totalFull = (p.cfg && p.cfg.total) || 150;
  L.push("科目：广州大学 713 中西音乐史（模拟）　满分：" + totalFull + " 分" + (p.cfg && p.cfg.paperTitle ? "　试卷：" + p.cfg.paperTitle : ""));
  L.push("难度：" + lvlName(p.cfg.difficulty) + "　用时：" + p.elapsed + " 分钟");
  L.push("作答方式：" + (p.cfg.mode === "paper" ? "纸上作答，答题照片按题号顺序附上" : "电子作答，答案见每题下方"));
  L.push("");
  p.items.forEach(function(it){
    L.push(it.no + ".（" + it.full + " 分）" + it.q);
    if(p.cfg.mode !== "paper") L.push("   我的作答：" + (p.answers[it.no] || "（未作答）"));
    L.push("   评分点：");
    it.rubric.forEach(function(r){ L.push("   - " + r.t + "（" + r.s + " 分）"); });
    if(it.answer) L.push("   参考答案：" + it.answer);
    if(it.refCards && it.refCards.length) L.push("   关联卡片：" + it.refCards.join(","));
    L.push("");
  });
  L.push("【请只返回下面这个 JSON，不要输出任何其他文字】");
  L.push(JSON.stringify({paper:p.id, strict:0, mid:0, lenient:0,
    items:[{no:1, score:0, lost:"", cards:[]}], comment:""}, null, 2));
  L.push("");
  L.push("打分口径（重要）：请按真实的考研阅卷标准，不要死扣采分点。");
  L.push("mid＝正常阅卷给分：只要核心概念答到、无史实错误、结构完整，应给该题满分的 85%–95%；");
  L.push("一般完整的作答，整卷 mid 应落在满分的 83%–97% 之间（150 分卷即 125–145）。只有明显残缺、答非所问、史实错误才明显低于此区间。");
  L.push("strict＝比 mid 低 5–10 分（偏严格的老教授）；lenient＝比 mid 高 3–5 分（不超 150）。");
  L.push("采分点仅作为「还可以补什么」的参考，不要因为漏了一两个点就把分数压到及格线附近。");
  L.push("cards 填该题失分对应的关联卡片 id；comment 控制在 100 字以内。");
  return L.join("\n");
}
function copyText(text, ok){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text, ok); });
  } else fallbackCopy(text, ok);
}
function fallbackCopy(text, ok){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
  ok();
}

function applyResultText(){
  var p = findExam(S.examCurrent);
  var box = $("#resBox");
  if(!p || !box) return;
  var raw = (box.value || "").trim().replace(/^```(json)?/i, "").replace(/```$/, "").trim();
  if(!raw){ toast("先粘贴批改结果"); return; }
  var obj;
  try { obj = JSON.parse(raw); } catch(e){ toast("格式不对，请粘贴完整 JSON"); return; }
  var num = function(v, d){ var n = Number(v); return isFinite(n) ? n : d; };
  p.result = {
    strict: Math.min(150, Math.round(num(obj.strict, 0))),
    mid: Math.min(150, Math.round(num(obj.mid, 0))),
    lenient: Math.min(150, Math.round(num(obj.lenient, 0))),
    items: (obj.items || []).map(function(it){
      return {no: num(it.no, 0), score: num(it.score, 0), lost: it.lost || "", cards: it.cards || []};
    }),
    comment: obj.comment || ""
  };
  examChecks = {};
  save();
  closeCard();
  examView = "result";
  renderExam();
  toast("批改结果收到啦 ♡");
}
function applyWeak(){
  var ids = Object.keys(examChecks).filter(function(k){ return examChecks[k]; });
  if(!ids.length){ toast("没有勾选考点"); return; }
  var t = todayStr(), n = 0;
  ids.forEach(function(id){
    if(!BY_ID[id]) return;
    var c = S.cards[id] || {stage:0, seen:0, lapses:0};
    c.stage = 0; c.lapses = (c.lapses || 0) + 1; c.due = addDays(t, 1); c.last = t;
    c.seen = (c.seen || 0) + 1;
    S.cards[id] = c; n++;
  });
  var cur = findExam(S.examCurrent);
  if(cur) cur.applied = true;
  save();
  toast(n + " 个考点已加入复习，明天到期");
  examChecks = {};
  renderExam();
}

document.addEventListener("click", function(ev){

  if(!el) return;
  var a = el.dataset.act;

  if(a === "tab"){
    state.tab = el.dataset.tab;
    $$(".tab").forEach(function(b){ b.classList.toggle("on", b.dataset.tab === state.tab); });
    $$(".view").forEach(function(v){ v.hidden = v.dataset.view !== state.tab; });
    render();
  }
  else if(a === "exam-type"){
    S.settings.examCfg.type = el.dataset.v;
    if(el.dataset.v === "preset" && !S.settings.examCfg.paperId && PAPERS.length){
      S.settings.examCfg.paperId = PAPERS[0].title;
      S.settings.examCfg.paperTitle = PAPERS[0].title;
      S.settings.examCfg.paperTotal = PAPERS[0].total;
    }
    save(); renderExam();
  }
  else if(a === "exam-paper"){
    S.settings.examCfg.paperId = el.dataset.v;

  }
  else if(a === "exam-chapter"){ S.settings.examCfg.chapter = el.dataset.v; S.settings.examCfg.type = "chapter"; save(); renderExam(); }
  else if(a === "exam-diff"){ examCfg().difficulty = el.dataset.v; save(); renderExamHome(); }
  else if(a === "exam-hot"){ examCfg().hot = el.dataset.v === "1"; save(); renderExamHome(); }
  else if(a === "exam-mode"){ examCfg().mode = el.dataset.v; save(); renderExamHome(); }
  else if(a === "exam-dur"){ examCfg().duration = parseInt(el.dataset.v, 10) || 180; save(); renderExamHome(); }

    if(pk) copyText(gradePack(pk), function(){ toast("批改包已复制，去对话里粘贴并发照片"); });

  else if(a === "snd-combo"){ S.settings.sound.combo = el.dataset.v === "1"; Sound.setCfg(S.settings.sound); save(); renderMe(); }
  else if(a === "snd-haptic"){ S.settings.sound.haptic = el.dataset.v === "1"; Sound.setCfg(S.settings.sound); save(); renderMe(); }
  else if(a === "fx-on"){ S.settings.fx.on = el.dataset.v === "1"; Effects.set(S.settings.fx); save(); renderMe(); }
  else if(a === "fx-level"){ S.settings.fx.level = el.dataset.v; Effects.set(S.settings.fx); save(); renderMe(); }
  else if(a === "fx-char"){ S.settings.fx.char = el.dataset.v === "1"; Effects.set(S.settings.fx); save(); renderMe(); }
  else if(a === "quota-inc"){ S.settings.quota = Math.min(40, S.settings.quota + 1); save(); renderMe(); }
  else if(a === "quota-dec"){ S.settings.quota = Math.max(2, S.settings.quota - 1); save(); renderMe(); }
  else if(a === "pace"){ S.settings.pace = el.dataset.pace; save(); renderMe(); }
  else if(a === "export"){ exportData(); }
  else if(a === "import"){ $("#importFile").click(); }
  else if(a === "reset"){
    if(confirm("确定清空所有学习进度？此操作不可恢复。")){
      S = defaultState(); save(); render(); toast("都清空啦 ♡");
    }
  }
});

document.addEventListener("input", function(ev){
  if(ev.target && ev.target.id === "search"){
    state.q = ev.target.value;
    renderLibList();
  }
  if(ev.target && ev.target.classList && ev.target.classList.contains("ansbox") && ev.target.dataset.no){
    if(S.examDraft){
      S.examDraft.answers[ev.target.dataset.no] = ev.target.value;
      clearTimeout(window.__ansT);
      window.__ansT = setTimeout(function(){ save(); }, 500);
    }
  }
});
document.addEventListener("change", function(ev){
  if(ev.target && ev.target.id === "volRange"){
    var v = Number(ev.target.value) / 100;
    S.settings.sound.volume = v;
    Sound.setCfg(S.settings.sound);
    var lab = $("#volVal"); if(lab) lab.textContent = Math.round(v * 100) + "%";
    save();
  }
  if(ev.target && ev.target.id === "examInput"){
    var v = ev.target.value;
    if(v){ S.settings.exam = v; save(); render(); }
  }
  if(ev.target && ev.target.dataset && ev.target.dataset.cid){
    examChecks[ev.target.dataset.cid] = ev.target.checked;
  }
  if(ev.target && ev.target.id === "importFile"){
    var f = ev.target.files && ev.target.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var o = JSON.parse(reader.result);
        if(!o || !o.settings || !o.cards) throw new Error("bad");
        S = o; if(!S.days) S.days = {}; save(); render(); toast("导入成功啦 ♡");
      } catch(e){ toast("文件格式不正确"); }
      ev.target.value = "";
    };
    reader.readAsText(f);
  }
});

document.addEventListener("keydown", function(ev){
  if($("#overlay").hidden || !study) return;
  if(ev.key === "Escape"){ closeStudy(); return; }
  if(ev.key === " " || ev.key === "Enter"){
    ev.preventDefault();
    if(!study.revealed){ study.revealed = true; renderStudy(); }
    return;
  }
  if(study.revealed){
    if(ev.key === "1") rate(study.queue[study.i], "forgot");
    else if(ev.key === "2") rate(study.queue[study.i], "vague");
    else if(ev.key === "3") rate(study.queue[study.i], "got");
  }
});

function registerSW(){
  if(typeof navigator === "undefined" || !("serviceWorker" in navigator)) return;
  if(location.protocol !== "http:" && location.protocol !== "https:") return;
  var had = !!navigator.serviceWorker.controller;
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(had) setTimeout(function(){ toast("已更新到新版本"); }, 600);
    had = true;
  });
}
function offlineReady(){
  return typeof navigator !== "undefined" && ("serviceWorker" in navigator) && !!navigator.serviceWorker.controller;
}

function exportData(){
  var blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "音乐史打卡备份-" + todayStr() + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  toast("备份存好啦 ♡");
}

/* ---------------- 启动 ---------------- */
storageOK = probeStorage();
registerSW();
S = load();
if(!S.exams) S.exams = [];
if(!S.settings.examCfg) S.settings.examCfg = {difficulty:"standard", hot:true, duration:180, mode:"paper"};
Quotes.show("open");
day();           // 记录当日基线
if(!S.settings.fx) S.settings.fx = {on:true, level:"normal", char:true};
Effects.init(S.settings.fx);
if(!S.settings.sound) S.settings.sound = {on:true, combo:true, haptic:true, volume:0.3};
Sound.setCfg(S.settings.sound);
try{
  var bmImg = $(".brand-mark img");
  var dne = CHARACTER.daily();
  if(bmImg){ bmImg.src = CHARACTER.path(dne); bmImg.setAttribute("data-exp", dne); }
}catch(e){}
document.addEventListener("click", function(ev){
  try{
    if(typeof ev.clientX === "number") window.__lastClick = {x: ev.clientX, y: ev.clientY};
    Effects.clickAt(ev.clientX || window.innerWidth / 2, ev.clientY || window.innerHeight / 2);
    Sound.click(ev.clientX, ev.clientY);
  }catch(e){}
}, true);
render();
})();
</script>
