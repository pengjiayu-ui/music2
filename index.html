<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF3F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>音乐史 · 背诵打卡</title>
<style>
/* ==========================================================
   音乐史打卡 · 粉色可爱风（配色集中在这里，改色只改这一段）
   ========================================================== */
:root{
  --sakura:#ffe6f1;
  --peach:#ffb7d5;
  --cream:#fff8fc;
  --rose:#e84a86;
  --rose-2:#ff6fa5;
  --lilac:#cdb4f6;
  --sky:#a9dcff;
  --mint:#b9eef0;
  --butter:#ffe9a8;

  --ink:#5d3b4e;
  --ink2:#8a6076;
  --muted:#b48b9e;
  --line:#ffc9df;

  --paper:var(--cream);
  --paper2:#ffeaf3;
  --card:#fffdfe;
  --accent:var(--rose);
  --accent-soft:#ffeaf3;

  --radius:12px;
  --shadow:4px 4px 0 rgba(232,74,134,.12);
  --shadow-lg:6px 6px 0 rgba(232,74,134,.16);

  --font-body:"Nunito","Yuanti SC","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --font-title:"Yuanti SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
}
/* 深色模式：深紫粉底 + 奶油白字 */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{color-scheme:light}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(900px 500px at 50% -8%, var(--paper2) 0%, rgba(255,230,240,0) 62%),
    linear-gradient(170deg,#FFF6FA 0%,#FBF4FF 55%,#FFF3F7 100%);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:var(--font-title);font-weight:600;letter-spacing:.01em}
.shell{min-height:100dvh;display:flex;justify-content:center}
.app{
  position:relative;width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(circle at 10% 6%, rgba(255,190,214,.30), transparent 40%),
    radial-gradient(circle at 92% 18%, rgba(226,208,255,.28), transparent 38%),
    radial-gradient(circle at 50% 104%, rgba(255,214,201,.32), transparent 55%),
    linear-gradient(180deg,var(--paper) 0%,var(--paper) 45%,var(--paper) 100%);
  box-shadow:0 0 0 1px var(--line), 0 40px 90px -50px rgba(239,108,151,.75);
}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(16px + env(safe-area-inset-top)) 18px 10px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--card),var(--paper2));
  border:2px solid var(--line);
  box-shadow:0 8px 18px -10px rgba(239,108,151,.9), inset 0 1px 0 #fff;
  overflow:hidden;
}
.brand-mark svg{width:34px;height:34px;display:block}
.brand h1{
  font-family:var(--font-title);font-size:17px;margin:0;font-weight:600;white-space:nowrap;
  color:var(--rose);letter-spacing:.04em;text-shadow:0 1px 0 #fff;
}
.brand p{margin:1px 0 0;font-size:10.5px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.pill{
  border:2px solid var(--line);background:#fff;color:var(--pink-ink);font-size:11.5px;font-weight:600;
  padding:7px 13px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;
  box-shadow:0 6px 14px -10px rgba(239,108,151,.9), inset 0 1px 0 #fff;font-family:inherit;
  transition:transform .15s ease;
}
.pill:active{transform:scale(.95)}

/* ---------- 主体 ---------- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 26px;overscroll-behavior:contain}
.view{animation:viewIn .34s cubic-bezier(.22,1,.36,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
.stack{display:grid;gap:12px}
.card{
  background:var(--card);border:2px solid var(--line);border-radius:var(--radius);
  box-shadow:0 12px 28px -22px rgba(239,108,151,.85), inset 0 1px 0 rgba(255,255,255,.95);
}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;
  font-size:12px;color:var(--muted);letter-spacing:.06em}
.sec-title b{color:var(--rose);font-weight:700;font-size:14px;letter-spacing:.02em;display:flex;align-items:center;gap:5px}
.sec-title b:before{content:"♡";color:var(--pink);font-size:12px;transform:translateY(-1px)}

/* ---------- 首页 hero ---------- */
.hero{
  position:relative;overflow:hidden;padding:20px 18px 18px;border-radius:30px;
  background:linear-gradient(158deg,#FFEAF3 0%,#FFF4F9 42%,#F2ECFF 100%);
  border:2px solid var(--line);
  box-shadow:0 18px 36px -26px rgba(239,108,151,.9), inset 0 1px 0 rgba(255,255,255,.95);
}
.hero:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 86% 10%, rgba(255,255,255,.95), transparent 42%),
    radial-gradient(circle at 8% 92%, rgba(228,215,255,.6), transparent 48%);
}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:2}
.eyebrow{margin:0;font-size:11px;letter-spacing:.12em;color:var(--ink2)}
.big{display:flex;align-items:baseline;gap:6px;margin:4px 0 2px}
.big b{
  font-family:var(--font-body);font-size:52px;line-height:1.05;font-weight:800;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(165deg,var(--peach) 5%,var(--rose) 55%,#B96BEB 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;
}
.big span{font-size:12.5px;color:var(--ink2);letter-spacing:.12em}
.datesub{margin:5px 0 0;font-size:11.5px;color:var(--muted)}
.ring{width:90px;height:90px;flex:none;filter:drop-shadow(0 6px 12px rgba(239,108,151,.18))}
.ring-fg{transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)}
.ring-t{font-size:18px;font-weight:800;fill:var(--rose);font-family:var(--font-body);font-variant-numeric:tabular-nums}
.ring-s{font-size:8px;fill:var(--muted);letter-spacing:.1em}

/* 漂浮装饰 */
.deco{position:absolute;font-size:13px;color:var(--peach);opacity:.85;pointer-events:none;z-index:1;
  animation:floaty 5.5s ease-in-out infinite;text-shadow:0 1px 0 #fff}
.deco.d1{left:56%;top:14%;color:var(--peach)}
.deco.d2{right:8%;bottom:22%;font-size:15px;color:#C7A8F5;animation-delay:-1.4s}
.deco.d3{left:44%;bottom:10%;color:#FFD08E;animation-delay:-2.6s}
.deco.d4{right:30%;top:8%;font-size:11px;color:#9ED8F5;animation-delay:-3.8s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-7px) rotate(8deg)}}

/* ---------- 今日任务 ---------- */
.task{display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:24px}
.tico{width:42px;height:42px;border-radius:16px;display:grid;place-items:center;font-size:17px;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.tico.rev{background:linear-gradient(150deg,#FFE2EE,#FFC6DC);color:var(--rose)}
.tico.new{background:linear-gradient(150deg,#EFE4FF,#DDCBFF);color:#7e57c2}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:14px;font-weight:600;letter-spacing:.01em;color:var(--ink)}
.task .tx small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.task em{font-style:normal;font-family:var(--font-body);font-size:23px;font-weight:800;color:var(--rose);
  font-variant-numeric:tabular-nums}
.task em.zero{color:#D8BBC7;opacity:.9}

/* ---------- 按钮 ---------- */
.btn{
  position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;
  border-radius:999px;border:0;cursor:pointer;font-family:inherit;font-size:15.5px;font-weight:700;letter-spacing:.05em;
  color:#fff;overflow:hidden;
  background:linear-gradient(135deg,#f9b6d0 0%,#f085ae 55%,#e4638f 100%);
  box-shadow:0 14px 26px -16px rgba(238,92,140,.95), inset 0 1px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(206,62,110,.28);
  transition:transform .12s ease, filter .2s ease;
}
.btn:before{
  content:"";position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:999px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));
}
.btn:active{transform:scale(.965) translateY(1px);filter:brightness(1.02)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn.ghost{
  background:#fff;color:var(--pink-ink);border:2px solid #FFD3E1;
  box-shadow:0 10px 20px -16px rgba(239,108,151,.9), inset 0 1px 0 #fff;
}
.btn.ghost:before{display:none}

/* ---------- 7 天预报 ---------- */
.forecast{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;padding:14px 14px 10px}
.fcol{display:flex;flex-direction:column;align-items:center;gap:7px}
.fnum{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fbar{width:100%;max-width:22px;border-radius:8px 8px 5px 5px;min-height:5px;
  background:linear-gradient(180deg,var(--peach),var(--rose-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.fbar.low{background:var(--paper2)}
.flab{font-size:10.5px;color:var(--muted)}
.fcol.today .flab{color:var(--pink-ink);font-weight:700}

/* ---------- 提示卡 ---------- */
.tipcard{padding:15px 16px;border-radius:24px;border:2px solid #FBE0EC;
  background:linear-gradient(158deg,var(--paper2),var(--cream) 60%,#F7F1FF);
  box-shadow:var(--shadow)}
.tipcard h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.1em;color:var(--pink-ink);font-weight:700}
.tipcard p{margin:0;font-size:12.5px;line-height:1.8;color:var(--ink2)}

/* ---------- 底部导航 ---------- */
.tabbar{
  flex:none;display:flex;gap:2px;margin:0 12px calc(10px + env(safe-area-inset-bottom));padding:6px;
  border-radius:26px;border:2px solid var(--line);background:rgba(255,255,255,.94);
  box-shadow:0 12px 28px -20px rgba(239,108,151,.9), inset 0 1px 0 #fff;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border:0;background:none;
  color:var(--muted);font-size:10px;font-family:inherit;cursor:pointer;border-radius:20px;letter-spacing:.04em;
  transition:background .25s ease,color .25s ease,transform .2s ease}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--rose);background:linear-gradient(160deg,var(--paper2),#FFCDE0);transform:translateY(-1px)}
.tab:active{transform:scale(.94)}

/* ---------- 搜索 / 分段 ---------- */
.searchwrap{position:relative;margin:10px 0 14px}
.searchwrap input{
  width:100%;height:46px;border-radius:999px;border:2px solid var(--line);background:#fff;
  padding:0 16px 0 40px;font-size:16px;color:var(--ink);font-family:inherit;outline:none;
  box-shadow:inset 0 2px 6px rgba(239,108,151,.06)
}
.searchwrap input::placeholder{color:#D0AEBC}
.searchwrap input:focus{border-color:var(--peach);box-shadow:0 0 0 4px var(--paper2)}
.sicon{position:absolute;left:15px;top:12px;color:var(--peach);font-size:16px}
.segs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.seg{flex:none;padding:8px 15px;border-radius:999px;border:2px solid var(--line);background:#fff;
  font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:inherit;white-space:nowrap;transition:.2s}
.seg.on{background:linear-gradient(150deg,var(--peach),var(--rose-2));color:#fff;border-color:transparent;
  box-shadow:0 8px 18px -12px rgba(238,92,140,.95)}

/* ---------- 书库 ---------- */
.chap{border:2px solid var(--line);border-radius:22px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}
.chaphead{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:none;border:0;font-family:inherit;
  color:inherit;text-align:left;cursor:pointer}
.chnum{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;
  background:linear-gradient(150deg,var(--paper2),var(--peach));color:var(--rose);font-weight:700}
.cht{flex:1;min-width:0}
.cht b{display:block;font-size:14px;font-weight:600}
.cht small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.chev{color:var(--peach);transition:transform .25s ease;font-size:16px}
.chap.open .chev{transform:rotate(90deg)}
.chapbody{border-top:2px dashed var(--line);padding:6px 8px 8px;background:linear-gradient(180deg,var(--paper),#fff)}
.crow{display:flex;align-items:center;gap:9px;width:100%;padding:9px 6px;background:none;border:0;font-family:inherit;
  color:var(--ink2);font-size:13px;text-align:left;cursor:pointer;border-radius:12px;transition:background .2s}
.crow:active{background:var(--paper2)}
.crow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow em{font-style:normal;font-size:10px;color:var(--muted);flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot[data-s="new"]{background:#fff;border:2px solid #F2C3D3}
.dot[data-s="learn"]{background:var(--peach)}
.dot[data-s="mastered"]{background:#7FD8B0}

/* ---------- 统计 ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:15px 14px;border-radius:22px;background:#fff;border:2px solid var(--line);box-shadow:var(--shadow)}
.tile b{display:block;font-family:var(--font-body);font-weight:800;font-size:27px;line-height:1.15;font-variant-numeric:tabular-nums;
  color:var(--rose)}
.tile small{display:block;font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.06em}
.panel{padding:16px;border-radius:24px;background:#fff;border:2px solid var(--line);box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px;font-size:11.5px;letter-spacing:.1em;color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--paper2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--peach),var(--rose-2) 60%,var(--lilac));transition:width .6s cubic-bezier(.22,1,.36,1)}
.legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:1fr;gap:4px;width:100%}
.heat i{width:100%;height:11px;border-radius:4px;background:#FBE4EC}
.heat i[data-l="1"]{background:#FFDCE8}
.heat i[data-l="2"]{background:#FFB9D2}
.heat i[data-l="3"]{background:#F98BB4}
.heat i[data-l="4"]{background:var(--rose)}
.chline{display:flex;align-items:center;gap:10px;padding:7px 0}
.chline span{width:112px;flex:none;font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chline .bar{flex:1}
.chline em{font-style:normal;font-size:10.5px;color:var(--muted);width:38px;text-align:right;font-variant-numeric:tabular-nums}
.weakrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px;
  color:var(--ink2);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;font-family:inherit;text-align:left}
.weakrow:last-child{border-bottom:0}
.weakrow em{font-style:normal;font-size:10px;color:var(--pink-deep);margin-left:auto;flex:none}

/* ---------- 设置 ---------- */
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:2px dashed var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .tx{flex:1}
.setrow b{display:block;font-size:13.5px;font-weight:600}
.setrow small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.stepper button{width:34px;height:34px;border:0;background:#fff;color:var(--pink-ink);font-size:18px;cursor:pointer;font-family:inherit}
.stepper button:active{background:var(--paper2)}
.stepper b{min-width:36px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.dateinput{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 12px;
  font-family:inherit;font-size:12.5px}
.about{font-size:11.5px;line-height:1.9;color:var(--muted)}
.about b{color:var(--ink2)}

/* ---------- 学习层 ---------- */
#overlay{
  position:fixed;inset:0;z-index:50;display:flex;justify-content:center;
  background:rgba(255,214,229,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)
}
.panel-full{
  width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--paper) 0%,var(--paper) 100%);
  animation:up .34s cubic-bezier(.22,1,.36,1)
}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
.study-top{flex:none;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--pink-ink);
  font-size:14px;cursor:pointer;display:grid;place-items:center;font-family:inherit;
  box-shadow:0 6px 14px -10px rgba(239,108,151,.9)
}
.icon-btn:active{transform:scale(.94)}
.sprog{flex:1;height:7px;border-radius:99px;background:var(--paper2);overflow:hidden}
.sprog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--peach),var(--rose));
  transition:width .4s cubic-bezier(.22,1,.36,1)}
.scount{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.study-body{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column}
.qcard{
  background:#fff;border:2px solid var(--line);border-radius:28px;padding:20px 19px;
  box-shadow:0 18px 40px -30px rgba(239,108,151,.95), inset 0 1px 0 #fff;
  display:flex;flex-direction:column
}
.qcard.front{flex:1}
.qcard.front .qtitle{margin:auto 0;padding:16px 0;font-size:27px;line-height:1.5}
.qcard.back{margin:auto 0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ptag{font-size:10px;letter-spacing:.06em;padding:4px 10px;border-radius:99px;
  background:linear-gradient(150deg,var(--paper2),#FFD6E6);color:var(--rose-2);font-weight:600}
.ptag.w{background:linear-gradient(150deg,#EFE7FF,#E0D2FF);color:#7e57c2}
.ptag.f{background:linear-gradient(150deg,#FFF1DD,#FFE3BE);color:#a16207}
.qtype{font-size:10px;color:var(--muted);letter-spacing:.05em;border:2px solid var(--line);padding:2px 9px;border-radius:99px}
.qtitle{font-size:25px;line-height:1.5;margin:14px 0 0;font-weight:600;letter-spacing:.01em;color:var(--ink)}
.qhint{margin:auto 0 0;padding-top:26px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.qlabel{margin:0 0 10px;font-size:10px;letter-spacing:.12em;color:var(--muted)}
.qbody{margin-top:16px;padding-top:15px;border-top:2px dashed var(--line);animation:rise .32s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.pts li{position:relative;padding-left:18px;font-size:14px;line-height:1.85;color:var(--ink2)}
.pts li:before{content:"";position:absolute;left:3px;top:11px;width:6px;height:6px;border-radius:50%;
  background:linear-gradient(150deg,var(--peach),var(--rose))}
mark{background:linear-gradient(transparent 55%,rgba(255,157,191,.42) 55%);color:inherit;padding:0 1px;border-radius:3px}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.key{font-size:11px;padding:4px 10px;border-radius:99px;background:var(--paper2);color:#C4577F;letter-spacing:.02em}
.tipbox{margin-top:14px;padding:11px 13px;border-radius:16px;
  background:linear-gradient(150deg,var(--paper2),#F8F3FF);border:2px solid var(--line);
  font-size:12px;line-height:1.7;color:var(--ink2)}
.tipbox b{color:var(--pink-ink);font-weight:700;font-size:10.5px;letter-spacing:.08em;display:block;margin-bottom:4px}
.study-foot{flex:none;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.rbtn{
  height:64px;border-radius:20px;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink2);
  transition:transform .12s ease, box-shadow .2s ease;
  box-shadow:0 8px 18px -16px rgba(239,108,151,.8)
}
.rbtn:active{transform:scale(.96)}
.rbtn small{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.rbtn[data-lvl="got"]{
  background:linear-gradient(150deg,var(--peach),var(--rose-2) 55%,var(--rose));border-color:transparent;color:#fff;
  box-shadow:0 14px 26px -18px rgba(238,92,140,.95), inset 0 1px 0 rgba(255,255,255,.55)
}
.rbtn[data-lvl="got"] small{color:rgba(255,255,255,.85)}
.rbtn[data-lvl="forgot"]{color:var(--rose-2);border-color:#FFD5DF;background:var(--paper)}
.rbtn[data-lvl="vague"]{color:#a16207;border-color:var(--butter);background:#FFFBF3}

/* ---------- 完成页 ---------- */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 26px;text-align:center;position:relative}
.done-mark{
  width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,var(--card),var(--paper2) 70%);
  border:3px solid var(--line);box-shadow:0 20px 40px -24px rgba(239,108,151,.95);
  animation:pop .5s cubic-bezier(.2,1.5,.4,1) both
}
.done-mark svg{width:84px;height:84px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.done h2{font-family:var(--font-title);font-size:24px;margin:22px 0 8px;letter-spacing:.03em;color:var(--rose)}
.done p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.8}
.done-stat{display:flex;gap:26px;margin:22px 0 26px}
.done-stat div{text-align:center}
.done-stat b{display:block;font-family:var(--font-body);font-weight:800;font-size:25px;color:var(--rose);font-variant-numeric:tabular-nums}
.done-stat small{font-size:10px;color:var(--muted);letter-spacing:.08em}
.heart{position:absolute;font-size:16px;color:var(--peach);opacity:0;animation:heartUp 2.4s ease-out infinite}
@keyframes heartUp{0%{opacity:0;transform:translateY(20px) scale(.6)}25%{opacity:.95}100%{opacity:0;transform:translateY(-120px) scale(1.1)}}

/* ---------- 弹层 ---------- */
#modal{
  position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(255,214,229,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)
}
.sheet{
  width:100%;max-width:460px;background:linear-gradient(180deg,var(--paper),var(--paper));
  border-radius:30px 30px 0 0;max-height:84dvh;overflow-y:auto;
  padding:20px 20px calc(22px + env(safe-area-inset-bottom));
  border-top:2px solid var(--line);
  animation:sheetup .32s cubic-bezier(.22,1,.36,1) both
}
@keyframes sheetup{from{transform:translateY(46px);opacity:.3}to{transform:none;opacity:1}}
@media (min-width:560px){#modal{align-items:center}.sheet{border-radius:30px;max-height:78dvh;border:2px solid var(--line)}}
.sheet h2{font-family:var(--font-title);font-size:21px;line-height:1.5;margin:14px 0 4px;font-weight:600}
.sheet .mbody{margin-top:14px;padding-top:14px;border-top:2px dashed var(--line)}
.sheet-actions{display:flex;gap:9px;margin-top:18px}
.sheet-actions .btn{height:46px;font-size:13.5px;border-radius:999px}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:99;
  background:linear-gradient(135deg,var(--peach),var(--rose));color:#fff;font-size:12.5px;font-weight:600;
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.26s cubic-bezier(.22,1,.36,1);
  max-width:80vw;text-align:center;box-shadow:0 14px 28px -16px rgba(238,92,140,.95)
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 模考 ---------- */
.exam-top{display:flex;align-items:center;gap:8px;padding:8px 0 10px;position:sticky;top:0;z-index:6;
  background:linear-gradient(rgba(255,250,253,.98) 70%,rgba(255,250,253,0))}
.clock{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--pink-ink);margin-left:auto;
  padding:6px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:600}
.clock.warn{color:var(--rose-2);background:#FFF0F5;border-color:var(--peach)}
.qblock{padding:16px;border-radius:24px;background:#fff;border:2px solid var(--line);box-shadow:var(--shadow)}
.qhead{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted);letter-spacing:.05em}
.qno{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--rose);
  background:linear-gradient(150deg,var(--paper2),var(--peach));font-variant-numeric:tabular-nums;font-weight:700}
.qfull{margin-left:auto}
.qtext{margin:10px 0 12px;font-size:15px;line-height:1.85;color:var(--ink);font-weight:500}
.ansbox{
  width:100%;min-height:96px;border:2px dashed var(--line);border-radius:18px;background:var(--paper);
  padding:11px;font-family:inherit;font-size:13.5px;line-height:1.75;color:var(--ink);resize:vertical;outline:none
}
.ansbox:focus{border-color:var(--peach);background:#fff;box-shadow:0 0 0 4px var(--paper2)}
.paperhint{font-size:11.5px;color:var(--muted);padding:11px 13px;border:2px dashed var(--line);border-radius:16px;line-height:1.7;background:var(--paper)}
.scoregrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.score{text-align:center;padding:14px 6px;border-radius:22px;background:#fff;border:2px solid var(--line);box-shadow:var(--shadow)}
.score:first-child{border-color:#E6DAFF}
.score:last-child{border-color:#CFEAFF}
.score b{display:block;font-family:var(--font-body);font-weight:800;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--rose)}
.score small{font-size:10px;color:var(--muted);letter-spacing:.06em}
.score.mid{border-color:var(--peach);background:linear-gradient(160deg,var(--paper2),var(--cream));
  box-shadow:0 16px 30px -24px rgba(238,92,140,.95)}
.score.mid b{color:var(--rose);font-size:30px}
.rub{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.rub td{padding:7px 2px;border-bottom:2px dashed var(--line);vertical-align:top;color:var(--ink2);line-height:1.65}
.rub td:last-child{width:46px;text-align:right;color:var(--pink-ink);white-space:nowrap;font-weight:600}
.rub td.lost{border-bottom:0;padding-top:0;text-align:left;font-size:11px;color:var(--muted)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:2px dashed var(--line);
  font-size:13px;line-height:1.6;color:var(--ink2);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{margin:3px 0 0;accent-color:var(--rose);width:16px;height:16px;flex:none}
.mini{font-size:11.5px;color:var(--muted);line-height:1.75}
.histrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line);font-size:12.5px}
.histrow:last-child{border-bottom:0}
.histrow b{font-variant-numeric:tabular-nums;color:var(--rose)}
.histrow .muted{margin-left:auto;font-size:11px}
.muted{color:var(--muted)}
.center{text-align:center}
.warnbar{display:flex;gap:8px;background:#fff3e0;border:2px solid #ffe0b2;color:#a16207;
  font-size:11.5px;line-height:1.65;padding:10px 12px;border-radius:16px;margin-bottom:12px}

/* ---------- 点击小特效 ---------- */
.spark{position:fixed;z-index:9999;pointer-events:none;font-size:15px;line-height:1;
  animation:sparkUp .9s cubic-bezier(.2,.8,.3,1) forwards;will-change:transform,opacity}
@keyframes sparkUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.3)}
  22%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-52px) scale(1.15) rotate(14deg)}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ==========================================================
   背景氛围：樱花渐变 + 白色小星星 + 蕾丝 + 钢琴键
   ========================================================== */
body{
  background:
    radial-gradient(circle at 16% 10%, rgba(255,255,255,.95), transparent 34%),
    radial-gradient(circle at 84% 6%, rgba(255,255,255,.8), transparent 30%),
    radial-gradient(circle at 50% 108%, rgba(255,248,240,.95), transparent 60%),
    linear-gradient(170deg, var(--sakura) 0%, #fdeaf2 45%, var(--cream) 100%);
}
.app{
  background:
    radial-gradient(circle at 10% 4%, rgba(255,255,255,.85), transparent 38%),
    radial-gradient(circle at 94% 14%, rgba(255,255,255,.6), transparent 34%),
    linear-gradient(180deg, #fff6fa 0%, var(--cream) 46%, #fff4f8 100%);
  box-shadow:0 0 0 1px var(--line), 0 30px 70px -46px rgba(173,20,87,.55);
}
/* 星点 */
.app:before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle, #ffffff 1.1px, transparent 1.3px);
  background-size:44px 44px;opacity:.55;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.25) 55%,transparent);
  mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.25) 55%,transparent);
}
/* 水印：音符、谱号、星星（透明度 <10%） */
.watermarks{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.wm{position:absolute;color:var(--rose);opacity:.07;font-family:Georgia,serif}
.wm1{top:6%;right:6%;font-size:96px}
.wm2{bottom:16%;left:-14px;font-size:120px}
.wm3{top:38%;left:8%;font-size:44px;color:var(--lilac);opacity:.09}
.wm4{bottom:30%;right:4%;font-size:52px;color:var(--sky);opacity:.09}

/* 蕾丝边（顶部） */
.lace-top{position:absolute;left:0;right:0;top:0;height:16px;z-index:3;pointer-events:none;opacity:.9;
  background:
    radial-gradient(circle at 8px 0, rgba(255,255,255,.95) 7px, transparent 7.5px) 0 0/16px 16px repeat-x,
    radial-gradient(circle at 8px 2px, var(--peach) 8px, transparent 8.5px) 0 0/16px 16px repeat-x;
  filter:drop-shadow(0 2px 2px rgba(173,20,87,.06));
}
/* 悬挂蝴蝶结 */
.bows{position:absolute;left:0;right:0;top:6px;z-index:3;pointer-events:none}
.bows span{position:absolute;font-size:15px;filter:drop-shadow(0 2px 3px rgba(173,20,87,.12));opacity:.95}
.bows span:nth-child(1){left:9%}
.bows span:nth-child(2){left:47%;top:6px;font-size:13px}
.bows span:nth-child(3){right:12%;top:2px}

/* ==========================================================
   钢琴键分隔条
   ========================================================== */
.piano-strip{
  flex:none;height:18px;margin:0 12px 2px;border-radius:9px;position:relative;overflow:hidden;
  background-color:#fffdfb;
  background-image:
    linear-gradient(90deg, transparent 0 7px, #8c4a63 7px 13px, transparent 13px 26px),
    repeating-linear-gradient(90deg, #fffdfb 0 25px, var(--line) 25px 26px);
  background-size:26px 10px, 100% 100%;
  background-repeat:repeat-x, no-repeat;
  background-position:0 0, 0 0;
  box-shadow:inset 0 -2px 0 rgba(173,20,87,.10), 0 2px 6px rgba(173,20,87,.06);
  opacity:.85;
}

/* ==========================================================
   角色
   ========================================================== */
.char{
  display:block;width:100%;height:100%;object-fit:contain;object-position:center;
  border-radius:0;background:transparent;pointer-events:none;user-select:none;
}
.char-wrap{
  display:inline-grid;place-items:center;flex:none;border-radius:50%;overflow:hidden;
  background:linear-gradient(160deg,#ffffff,#ffe6f0);border:2px solid var(--line);
  box-shadow:0 6px 16px rgba(173,20,87,.12);
}
.char-badge{width:46px;height:46px}
.char-hero{width:86px;height:86px}
.char-mini{width:44px;height:44px}
.char-bob{animation:charBob 3.4s ease-in-out infinite}
@keyframes charBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}

/* 首页问候 */
.greet{display:flex;align-items:center;gap:10px;margin:2px 2px 12px;position:relative;z-index:2}
.greet .char-wrap{width:56px;height:56px}
.greet .gt{flex:1;min-width:0}
.greet .gt b{display:block;font-size:13.5px;font-weight:700;color:var(--rose)}
.greet .gt small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.streak-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;
  background:var(--accent-soft);color:var(--rose);font-size:11px;font-weight:700;white-space:nowrap}

/* ==========================================================
   点击特效层
   ========================================================== */
#fx-layer{position:fixed;inset:0;pointer-events:none;z-index:9990;overflow:hidden}
.fx{
  position:absolute;pointer-events:none;will-change:transform,opacity;
  transform:translate(-50%,-50%);animation-fill-mode:forwards;
  animation-timing-function:cubic-bezier(.2,.8,.3,1);
  text-shadow:0 1px 2px rgba(255,255,255,.7);
}
.fx-heart{animation-name:fxRise}
.fx-note{animation-name:fxSway}
.fx-star{animation-name:fxTwinkle}
.fx-bow{animation-name:fxPop}
.fx-piano{animation-name:fxRipple}
.fx-bubble{animation-name:fxBubble}
.fx-sakura{animation-name:fxFall}
.fx-paw{animation-name:fxStep}
.fx-cross{animation-name:fxTwinkle}
.fx-cloud{animation-name:fxDrift}
.fx-rain{animation-name:fxRainDown;animation-timing-function:linear}
.fx-char{
  position:absolute;object-fit:contain;pointer-events:none;border-radius:50%;
  background:rgba(255,255,255,.72);box-shadow:0 6px 18px rgba(173,20,87,.16);
  transform:translate(-50%,-60%);animation:fxCharPop .8s ease-out forwards;
}
@keyframes fxRise{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  25%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--sc,1)) rotate(var(--rot,0deg))}
}
@keyframes fxSway{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}
  30%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--sc,1)) rotate(calc(var(--rot,0deg) * 2))}
}
@keyframes fxTwinkle{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}
  40%{opacity:1;transform:translate(-50%,-50%) scale(var(--sc,1)) rotate(45deg)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.5) rotate(90deg)}
}
@keyframes fxPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  35%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.85) rotate(var(--rot,0deg))}
}
@keyframes fxRipple{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  40%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}
}
@keyframes fxBubble{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  50%{opacity:.95;transform:translate(-50%,-50%) scale(var(--sc,1))}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4)}
}
@keyframes fxFall{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(0)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + 44px)) rotate(180deg)}
}
@keyframes fxStep{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-20deg)}
  30%{opacity:.95;transform:translate(-50%,-50%) scale(1) rotate(0)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.9) rotate(10deg)}
}
@keyframes fxDrift{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  30%{opacity:.9}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) * .45)) scale(1.35)}
}
@keyframes fxRainDown{
  0%{opacity:0;transform:translate(-50%,-24px) rotate(0)}
  12%{opacity:1}
  100%{opacity:.15;transform:translate(calc(-50% + var(--dx)),110vh) rotate(200deg)}
}
@keyframes fxCharPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
  28%{opacity:1;transform:translate(-50%,-58%) scale(1.1)}
  70%{opacity:1;transform:translate(-50%,-62%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-82%) scale(.95)}
}

/* ==========================================================
   深色模式补丁（深紫粉底 + 奶油白字）
   ========================================================== */


/* 成绩趋势 */
.trend{display:flex;align-items:flex-end;gap:10px;height:118px;padding:0 2px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}
.tbar{width:100%;max-width:28px;border-radius:10px 10px 5px 5px;
  background:linear-gradient(180deg,var(--peach),#e4638f);
  box-shadow:0 6px 14px -10px rgba(173,20,87,.9)}
.tval{font-size:10px;font-weight:700;color:var(--rose)}
.tlab{font-size:9px;color:var(--muted);letter-spacing:.04em}

/* ==========================================================
   像素风皮肤（覆盖层）
   ========================================================== */
html{color-scheme:light}
body{
  background-color:#ffe6f1;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.65) 1.2px, transparent 1.3px),
    linear-gradient(180deg,#ffe4f0 0%,#ffdcec 60%,#ffe9f3 100%);
  background-size:12px 12px, 100% 100%;
}
.app{
  background-color:#fff8fc;
  background-image:
    radial-gradient(circle, rgba(255,183,213,.35) 1px, transparent 1.1px),
    linear-gradient(180deg,#fff7fc 0%,#fff2f8 100%);
  background-size:14px 14px, 100% 100%;
  box-shadow:0 0 0 3px #ffd1e4, 8px 8px 0 rgba(232,74,134,.10);
}
.app:before{display:none}

/* 顶部像素棋盘边 */
.lace-top{
  height:12px;opacity:.75;background:none;filter:none;
  background-image:repeating-linear-gradient(90deg,#ff9ec4 0 6px,#ffffff 6px 12px);
  border-bottom:2px solid #ffd1e4;
}
/* 水印改成像素小图标 */
.wm{opacity:.10;font-weight:700}
.wm1,.wm2{font-family:"Courier New",monospace}

/* 卡片：硬边 + 偏移阴影 */
.card,.tile,.panel,.chap,.qblock,.tipcard,.qcard,.score,.task,.sheet{
  border:3px solid var(--line) !important;
  border-radius:14px !important;
  box-shadow:4px 4px 0 rgba(232,74,134,.12) !important;
}
.hero{
  border:3px solid #ffc9df !important;
  border-radius:16px !important;
  box-shadow:5px 5px 0 rgba(232,74,134,.14) !important;
  background:linear-gradient(180deg,#fff5fb,#ffeaf4) !important;
}
.hero:before{display:none}

/* 按钮：像素凸起 */
.btn{
  border-radius:12px !important;
  border:3px solid #ff8fbb !important;
  background:linear-gradient(180deg,#ff8fbb,#ff6fa5) !important;
  box-shadow:0 5px 0 #c93b6f, 0 0 0 2px #fff inset !important;
  letter-spacing:.06em;
}
.btn:before{display:none}
.btn:active{transform:translateY(4px) !important;box-shadow:0 1px 0 #c93b6f, 0 0 0 2px #fff inset !important}
.btn.ghost{
  background:#fff !important;color:var(--rose) !important;
  border:3px solid var(--line) !important;
  box-shadow:0 5px 0 #ffd7e7 !important;
}
.btn.ghost:active{transform:translateY(4px) !important;box-shadow:0 1px 0 #ffd7e7 !important}

/* 分段 / 小按钮 */
.seg,.pill,.icon-btn,.stepper,.dateinput,.searchwrap input,.ansbox{
  border-radius:10px !important;border-width:3px !important;
}
.seg.on{background:linear-gradient(180deg,#ff8fbb,#ff6fa5) !important;
  box-shadow:0 3px 0 #c93b6f !important;border-color:#ff8fbb !important}

/* 导航：像游戏菜单 */
.tabbar{
  border-radius:14px !important;border:3px solid #ffc9df !important;
  box-shadow:0 4px 0 rgba(232,74,134,.12) !important;
  background:#fffafd !important;
}
.tab{border-radius:10px !important}
.tab.on{background:linear-gradient(180deg,#ffe3ef,#ffc9e1) !important;color:var(--rose) !important;
  box-shadow:inset 0 -3px 0 #ff9ec4}

}
.char-wrap .char{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;border:0}
@keyframes charFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* 背诵卡角落角色：描边 + 爱心蝴蝶结 */

}
.qchar:before,.qchar:after{position:absolute;font-size:13px;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(224,86,140,.2))}
.qchar:before{content:"♡";left:-9px;top:-9px;color:#ff7fae;animation:charFloat 2.8s ease-in-out infinite}
.qchar:after{content:"🎀";right:-10px;bottom:-10px;font-size:14px;animation:charFloat 3.1s ease-in-out infinite reverse}

/* 金粉蕾丝花瓣边框 */
.qcard{

}
.qcard:before{
  content:"";position:absolute;inset:8px;border:2px dotted #ffd9a8;border-radius:14px;pointer-events:none;
}

  border:3px solid #f3c46e !important;

.qchar:after{right:-11px !important;bottom:-11px !important;left:auto !important}

/* 金色花瓣藤蔓边 · 角色透明抠图 */

/* ========== 花瓣蕾丝边（金 + 粉） ========== */

<script>
/* ==========================================================
   角色配置：把 images 换掉即可，代码不用改
   ========================================================== */
var CHARACTER = {
  dir: "assets/characters/",
  ext: ".png",
  expressions: {
    happy:     "happy.png",
    excited:   "excited.png",
    sleepy:    "sleepy.png",
    proud:     "proud.png",
    shy:       "shy.png",
    cheer:     "cheer.png",
    surprised: "surprised.png",
    love:      "love.png"
  },
  default: "default.png",
  // 每日轮换顺序
  order: ["happy", "cheer", "excited", "sleepy", "proud", "shy", "love", "surprised"],
  // 兜底：粉色爱心
  placeholder: "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
    '<path d="M50 84C22 64 10 50 10 36c0-11 8-19 19-19 8 0 15 5 21 13 6-8 13-13 21-13 11 0 19 8 19 19 0 14-12 28-40 48z" ' +
    'fill="#f8bbd0" stroke="#ad1457" stroke-width="3"/></svg>')
};

CHARACTER.keys = function(){
  return Object.keys(this.expressions);
};
CHARACTER.path = function(name){
  var f = this.expressions[name] || this.default || "";
  return f ? this.dir + f : this.placeholder;
};
/* 每日表情：同一天稳定，不同天轮换 */
/* 每次打开随机一个（整次会话内保持不变） */
CHARACTER.daily = function(){
  if(!this._open){
    var k = this.order;
    this._open = k[Math.floor(Math.random() * k.length)];
  }
  return this._open;
};
CHARACTER.pick = function(){
  var k = this.keys();
  return k[Math.floor(Math.random() * k.length)] || this.daily();
};
/* 生成 img 标签，带多级兜底 */
CHARACTER.img = function(name, cls, size){
  var n = this.expressions[name] ? name : "daily";
  var src = n === "daily" ? this.path(this.daily()) : this.path(name);
  return '<img class="' + (cls || "char") + '" src="' + src + '" alt="" ' +
    'data-exp="' + (n === "daily" ? this.daily() : name) + '" ' +
    (size ? 'style="width:' + size + 'px;height:' + size + 'px"' : '') +
    ' loading="lazy" decoding="async" onerror="charError(this)">';
};
/* 图片不存在时的回退：表情 -> default -> 爱心 */
function charError(el){
  try{
    var exp = el.getAttribute("data-exp") || "";
    if(!el.dataset.fb1 && CHARACTER.default && exp !== "default"){
      el.dataset.fb1 = "1";
      el.src = CHARACTER.dir + CHARACTER.default;
      return;
    }
    if(!el.dataset.fb2){
      el.dataset.fb2 = "1";
      el.src = CHARACTER.placeholder;
    }
  }catch(e){}
}

</script>

    try{ if(el && el.style && el.style.setProperty) el.style.setProperty(k, v); }catch(e){}
  }
  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

  function ensureLayer(){
    if(layer) return layer;
    layer = document.createElement("div");
    layer.id = "fx-layer";
    document.body.appendChild(layer);
    return layer;
  }

  function trim(){
    var max = MAX[cfg.level] || 6;
    while(live.length >= max){
      var old = live.shift();
      if(old && old.parentNode) old.parentNode.removeChild(old);
    }
  }

  function track(el, ttl){
    ensureLayer().appendChild(el);
    live.push(el);
    trim();
    var t = setTimeout(function(){
      if(el.parentNode) el.parentNode.removeChild(el);
      var i = live.indexOf(el);
      if(i >= 0) live.splice(i, 1);
    }, ttl);
    timers.push(t);
  }

  function particle(kind, x, y){
    try{
    var def = KINDS[kind];
    if(!def) return;
    var el = document.createElement("span");
    el.className = "fx " + def.cls;
    el.textContent = pick(def.g);
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.fontSize = Math.round(rnd(def.size[0], def.size[1])) + "px";
    if(def.colors[0]) el.style.color = pick(def.colors);
    setVar(el, "--dx", rnd(-48, 48).toFixed(0) + "px");
    setVar(el, "--dy", rnd(-64, -22).toFixed(0) + "px");
    setVar(el, "--rot", rnd(-70, 70).toFixed(0) + "deg");
    setVar(el, "--sc", rnd(0.8, 1.35).toFixed(2));
    el.style.animationDuration = rnd(0.4, 0.75).toFixed(2) + "s";
    track(el, 900);
    }catch(e){}
  }

  function burst(kind, x, y, n){
    var def = KINDS[kind];
    if(!def) return;
    var count = n || (cfg.level === "festive" ? def.n + 2 : cfg.level === "gentle" ? Math.max(1, def.n - 2) : def.n);
    for(var i = 0; i < count; i++){
      (function(i){
        var t = setTimeout(function(){ particle(kind, x + rnd(-14, 14), y + rnd(-10, 10)); }, i * 45);
        timers.push(t);
      })(i);
    }
  }

  function charPop(x, y, name){
    try{
    var exp = name || CHARACTER.pick();
    var el = document.createElement("img");
    el.className = "fx-char";
    el.src = CHARACTER.path(exp);
    el.setAttribute("data-exp", exp);
    el.alt = "";
    el.onerror = function(){ charError(el); };
    var s = Math.round(rnd(48, 64));
    el.style.width = s + "px";
    el.style.height = s + "px";
    el.style.left = x + "px";
    el.style.top = y + "px";
    track(el, 820);
    }catch(e){}
  }

  function kaoPop(x, y){
    try{
      var i = Math.floor(Math.random() * KAOMOJI.length);
      if(i === lastKao) i = (i + 1) % KAOMOJI.length;
      lastKao = i;
      var el = document.createElement("span");
      el.className = "fx fx-kao";
      el.textContent = KAOMOJI[i];
      el.style.left = (x + rnd(6, 18)) + "px";
      el.style.top = (y + rnd(4, 16)) + "px";
      track(el, 950);
    }catch(e){}
  }

  function heartRain(){
    var w = window.innerWidth;
    for(var i = 0; i < 14; i++){
      (function(i){
        var t = setTimeout(function(){
          var el = document.createElement("span");
          el.className = "fx fx-rain";
          el.textContent = pick(["♥", "♡", "🌸", "✦"]);
          el.style.left = rnd(0, w) + "px";
          el.style.top = "-20px";
          el.style.fontSize = Math.round(rnd(14, 26)) + "px";
          el.style.color = pick(["#ee6c9a", "#f8bbd0", "#ffd166"]);
          el.style.animationDuration = rnd(1.4, 2.4).toFixed(2) + "s";
          setVar(el, "--dx", rnd(-40, 40).toFixed(0) + "px");
          track(el, 2600);
        }, i * 70);
        timers.push(t);
      })(i);
    }
  }

  function scoreExpr(score, full){
    var p = full ? score / full : 0;
    if(p >= 0.82) return "proud";
    if(p >= 0.66) return "happy";
    if(p >= 0.5) return "cheer";
    return "shy";
  }

  function scene(name, opts){
    opts = opts || {};
    if(reduced) return;
    var x = opts.x != null ? opts.x : window.innerWidth / 2;
    var y = opts.y != null ? opts.y : window.innerHeight * 0.55;
    switch(name){
      case "checkin":  heartRain(); charPop(x, y, "happy"); break;
      case "got":      burst("star", x, y); burst("cross", x, y); charPop(x, y, "proud"); break;
      case "vague":    burst("cloud", x, y); charPop(x, y, "sleepy"); break;
      case "forgot":   burst("cloud", x, y); charPop(x, y, "cheer"); break;
      case "card":     burst("note", x, y, 2); charPop(x, y); break;
      case "streak":   burst("star", x, y); burst("heart", x, y); charPop(x, y, "excited"); break;
      case "score":    burst("star", x, y); charPop(x, y, opts.expr || scoreExpr(opts.score || 0, opts.full || 1)); break;
      case "wrong":    burst("cloud", x, y); charPop(x, y, "shy"); break;
      default:         burst("heart", x, y); charPop(x, y); break;
    }
  }

  function clickAt(x, y){
    try{
    if(!cfg.on) return;
    if(reduced) return;
    var pool = Object.keys(KINDS);
    var count = cfg.level === "festive" ? 2 : 1;
    for(var i = 0; i < count; i++){
      burst(pool[Math.floor(Math.random() * pool.length)], x, y);
    }
    charPop(x, y);
    kaoPop(x, y);
    }catch(e){}
  }

  function init(settings){
    try{
      reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }catch(e){}
    if(settings) set(settings);
  }

  function set(s){
    cfg.on = s.on !== false;
    cfg.level = s.level || "normal";
    cfg.char = s.char !== false;
  }

  return {
    init: init, set: set, scene: scene, clickAt: clickAt,
    burst: burst, charPop: charPop, heartRain: heartRain,
    scoreExpr: scoreExpr,
    kinds: function(){ return Object.keys(KINDS); }
  };
})();

<script>
/* 统一震动模块：Android 用 navigator.vibrate，iOS 17.4+ 用 switch 触感 hack
   说明：iOS 17.4 ~ 26.4 有效；iOS 26.5+ 苹果收紧了可信事件判定，
   脚本模拟的 click 可能不再触发 Taptic Engine，此时自动降级为视觉反馈。 */
var Haptics = (function(){
  var ua = (typeof navigator !== "undefined" && navigator.userAgent) || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var m = ua.match(/OS (\d+)[_.](\d+)/);
  var iosMajor = m ? parseInt(m[1], 10) : 0;
  var iosMinor = m ? parseInt(m[2], 10) : 0;
  var nativeVibrate = typeof navigator !== "undefined" && typeof navigator.vibrate === "function";
  var switchLabel = null, switchInput = null;

  function iosSupportsSwitch(){
    /* iOS 17.4 起支持 <input type="checkbox" switch> 的触感 */
    return isIOS && (iosMajor > 17 || (iosMajor === 17 && iosMinor >= 4));
  }
  function supported(){ return nativeVibrate || iosSupportsSwitch(); }

  function ensureSwitch(){
    if(switchLabel) return;
    try{
      switchLabel = document.createElement("label");
      switchInput = document.createElement("input");
      switchInput.type = "checkbox";
      try{ switchInput.setAttribute("switch", ""); }catch(e){}
      switchLabel.appendChild(switchInput);
      switchLabel.setAttribute("aria-hidden", "true");
      switchLabel.style.cssText = "position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;";
      document.body.appendChild(switchLabel);
    }catch(e){}
  }

  /* 触发一次 tactile 反馈 */
  function placeAt(x, y){
    if(!switchLabel) return;
    try{
      switchLabel.style.left = (x||0) + "px";
      switchLabel.style.top = (y||0) + "px";
      switchLabel.style.width = "4px";
      switchLabel.style.height = "4px";
      switchLabel.style.opacity = "0.01";
    }catch(e){}
  }

  function fireOnce(){
    if(!iosSupportsSwitch()) return false;
    ensureSwitch();
    try{ switchInput.click(); return true; }catch(e){ return false; }
  }

  /* 视觉降级：轻缩一下被点的元素 */
  function visualFallback(el){
    try{
      if(!el || !el.style) return;
      el.style.transition = "transform .12s ease";
      el.style.transform = "scale(.96)";
      setTimeout(function(){ try{ el.style.transform = ""; }catch(e){} }, 120);
    }catch(e){}
  }

  /* pattern 可以是数字或数组，语义同 navigator.vibrate */
  function trigger(pattern, el, x, y){
    placeAt(x, y);
    if(nativeVibrate){
      try{ navigator.vibrate(pattern); return true; }catch(e){}
    }
    if(iosSupportsSwitch()){
      if(fireOnce()) return true;
      /* 26.5+ 可能失效：降级 */
      visualFallback(el);
      return false;
    }
    visualFallback(el);
    return false;
  }

  return { trigger: trigger, supported: supported, isIOS: isIOS,
           iosVersion: iosMajor ? iosMajor + "." + iosMinor : "", native: nativeVibrate };
})();

<script>
/* 音效 + 连击 + 震动（Web Audio 合成） */
var Sound = (function(){
  var ctx=null, master=null, ready=false;
  var cfg={on:true, combo:true, haptic:true, volume:0.3};
  /* C 大调五声音阶，两个八度，最高 C7 */
  var SCALE=[523.25,659.25,783.99,1046.50,1318.51,1567.98,2093.00]; /* C5 E5 G5 C6 E6 G6 C7 —— C 大调琶音 */
  var combo=0, lastClick=0, lastMute=0, muteHits=0;
  var COMBO_GAP=500;  /* 连击判定窗口（毫秒），想放宽改这里 */
  var POOL=[
    "🎵 华彩乐章！你的手速堪比李斯特啦！(✧◡✧)",
    "✨ 满级连击！知识正在疯狂涌入大脑！(๑•̀ㅂ•́)و✧",
    "🌟 这段旋律太棒了，这就是上岸的前奏吗！( ﾟ▽ﾟ)/",
    "💖 弹得真好，我都有点崇拜你了！(๑¯ω¯๑)",
    "🎹 功德加一！请继续保持这个节奏！(๑•̀ㅂ•́)و✧",
    "🎶 太强了！丛老师听了都要给你鼓掌！(✧◡✧)"
  ];

  function now(){ return ctx?ctx.currentTime:0; }

  function init(){
    if(ready) return true;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return false;
      ctx=new AC();
      master=ctx.createGain();
      master.gain.value=cfg.volume;
      master.connect(ctx.destination);
      try{ /* iOS 解锁：在用户手势内播一个静音样本 */
        var b=ctx.createBuffer(1,1,ctx.sampleRate);
        var src=ctx.createBufferSource(); src.buffer=b; src.connect(ctx.destination); src.start(0);
      }catch(e){}
      ready=true;
    }catch(e){ ready=false; }
    return ready;
  }

  function tone(freq,dur,gain,type,delay,pan){
    if(!ready||!cfg.on) return;
    try{
      if(ctx.state!=="running"){ ctx.resume(); }
      var t0=now()+(delay||0)+0.005;
      var osc=ctx.createOscillator(), g=ctx.createGain();
      osc.type=type||"sine";
      osc.frequency.setValueAtTime(freq,t0);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain),t0+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      var out=g;
      if(ctx.createStereoPanner && pan!==undefined){
        var p=ctx.createStereoPanner(); p.pan.value=pan; g.connect(p); out=p;
      }
      osc.connect(g); out.connect(master);
      osc.start(t0); osc.stop(t0+dur+0.02);
      osc.onended=function(){ try{ osc.disconnect(); g.disconnect(); if(out!==g) out.disconnect(); }catch(e){} };
    }catch(e){}
  }

  /* 翻页沙沙声：短噪声 + 带通扫频 */
  function noiseSweep(){
    if(!ready||!cfg.on) return;
    try{
      var dur=0.18, t0=now();
      var buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate);
      var d=buf.getChannelData(0);
      for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
      var src=ctx.createBufferSource(); src.buffer=buf;
      var bp=ctx.createBiquadFilter(); bp.type="bandpass";
      bp.frequency.setValueAtTime(900,t0);
      bp.frequency.exponentialRampToValueAtTime(2600,t0+dur);
      bp.Q.value=1.2;
      var g=ctx.createGain(); g.gain.value=0.06;
      src.connect(bp); bp.connect(g); g.connect(master);
      src.start(t0); src.stop(t0+dur);
      src.onended=function(){ try{ src.disconnect(); bp.disconnect(); g.disconnect(); }catch(e){} };
    }catch(e){}
  }

  function haptic(p, el, x, y){
    if(!cfg.haptic) return;
    try{ if(window.Haptics) Haptics.trigger(p, el, x, y); }catch(e){}
  }

  /* 泡泡破裂 */
  function pop(){
    if(!ready||!cfg.on) return;
    try{
      var t0=now();
      var osc=ctx.createOscillator(), g=ctx.createGain();
      osc.type="sine";
      osc.frequency.setValueAtTime(700,t0);
      osc.frequency.exponentialRampToValueAtTime(180,t0+0.12);
      g.gain.setValueAtTime(0.06,t0);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.14);
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0+0.16);
      osc.onended=function(){ try{ osc.disconnect(); g.disconnect(); }catch(e){} };
    }catch(e){}
  }

  function burstFX(n){
    try{
      if(!window.Effects) return;
      var cx=window.innerWidth/2, cy=window.innerHeight/2;
      var kinds=["note","heart","star","cross"];
      for(var i=0;i<Math.min(n||8,10);i++){
        Effects.burst(kinds[i%kinds.length], cx+(Math.random()*220-110), cy+(Math.random()*160-80));
      }
    }catch(e){}
  }

  function comboBadge(){
    try{
      var el=document.createElement("div");
      el.className="combo-burst";
      el.textContent="Combo x"+(combo+1)+"!";
      document.body.appendChild(el);
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },1300);
    }catch(e){}
  }

  function maxCombo(){
    if(!ready||!cfg.on) return;
    [523.25,659.25,783.99,1046.50,1318.51,1567.98].forEach(function(f,i){
      tone(f,1.0,0.05,"sine",i*0.05,(i%2?0.3:-0.3));
    });
    haptic([30,40,30,40,80]);
    burstFX(10); comboBadge();
    try{
      if(window.Quotes&&Quotes.say) Quotes.say(POOL[Math.floor(Math.random()*POOL.length)]);
    }catch(e){}
  }

  function click(px, py){
    var t=Date.now();
    if(!init()) return;
    if(ctx.state!=="running"){ try{ ctx.resume(); }catch(e){} }

    if(!cfg.on){
      if(t-lastMute<1500) muteHits++; else muteHits=1;
      lastMute=t;
      if(muteHits===10){
        muteHits=0;
        try{ if(window.Quotes&&Quotes.say) Quotes.say("(¬_¬) 你不开声音，是在用意念弹琴吗？"); }catch(e){}
        haptic(30);
      }
      return;
    }

    var gap=t-lastClick;
    if(gap>COMBO_GAP){
      if(combo>=5){
        pop();
        try{ if(window.Quotes&&Quotes.say) Quotes.say("( ˘ω˘ ) 手酸啦？"); }catch(e){}
      }
      combo=0;
    }else{
      combo++;
    }
    lastClick=t;

    var idx=Math.min(combo,SCALE.length-1);
    /* 连击走琶音；单次点击随机取中间几个音，避免每次都一样 */
    var f = combo === 0 ? SCALE[[1,2,3,4][Math.floor(Math.random()*4)]] : SCALE[idx];
    tone(f,0.34,0.055,"sine",0,(Math.random()*0.24-0.12));

    if(idx===SCALE.length-1) maxCombo();
    else if(combo>=6) haptic([15,20,15,20,30], null, px, py);
    else if(combo>=3) haptic([15,30,15], null, px, py);
    else haptic(10, null, px, py);
  }

  function page(){ /* 翻书声已移除，保持安静 */ }

  function got(){
    if(!init()) return;
    tone(880,0.16,0.09,"sine"); tone(1174.66,0.22,0.08,"sine",0.09);
    haptic([15,40,15]);
  }
  function vague(){
    if(!init()) return;
    tone(659.25,0.18,0.07,"sine"); tone(587.33,0.26,0.06,"sine",0.12);
    haptic([10,25,10]);
  }
  function forgot(){
    if(!init()) return;
    tone(392,0.34,0.06,"sine"); tone(349.23,0.4,0.04,"sine",0.1);
    haptic(40);
  }
  function checkin(){
    if(!init()) return;
    [523.25,659.25,783.99,1046.50].forEach(function(f,i){ tone(f,0.6,0.06,"sine",i*0.13); });
    haptic([20,50,20,50,60]);
  }

  /* 学习完成：约 3 秒，K46 → V7 → I 完满终止 */
  function finale(){
    if(!init()) return;
    var G2=98.00, C3=130.81, E3=164.81, G3=196.00, B3=246.94, C4=261.63,
        D4=293.66, E4=329.63, F4=349.23, G4=392.00, B4=493.88, C5=523.25, D5=587.33, E5=659.25;
    /* K46（C 大调第二转位） */
    [G2,C3,E3,G3].forEach(function(f,i){ tone(f,0.95,0.045,"sine",i*0.006,-0.25); });
    tone(E5,0.5,0.05,"triangle",0.02,0.2);
    /* V7（属七） */
    [G2,B3,D4,F4].forEach(function(f,i){ tone(f,0.9,0.045,"sine",0.88+i*0.006,-0.2); });
    tone(D5,0.4,0.045,"triangle",0.9,0.2);
    tone(B4,0.4,0.04,"triangle",1.28,0.15);
    /* I（主和弦，收满） */
    [C3,E3,G3,C4].forEach(function(f,i){ tone(f,1.5,0.05,"sine",1.78+i*0.006,-0.15); });
    tone(C5,1.4,0.05,"triangle",1.8,0.15);
    tone(E5,1.2,0.035,"sine",1.86,0.25);
    haptic([20,50,20,50,60]);
  }

  /* 切回前台/从后台回来时恢复音频，避免“静音一段时间” */
  if(typeof document !== "undefined" && document.addEventListener){
    document.addEventListener("visibilitychange", function(){
      if(ready && document.visibilityState === "visible"){
        try{ ctx.resume(); }catch(e){}
      }
    });
  }

  function setCfg(c){
    if(!c) return;
    cfg.on=c.on!==false; cfg.combo=c.combo!==false; cfg.haptic=c.haptic!==false;
    cfg.volume=typeof c.volume==="number"?Math.max(0,Math.min(1,c.volume)):0.45;
    if(master){ try{ master.gain.value=cfg.on?cfg.volume:0; }catch(e){} }
  }
  function comboNow(){ return combo; }

  return {init:init,click:click,page:page,got:got,vague:vague,forgot:forgot,finale:finale,
          checkin:checkin,setCfg:setCfg,haptic:haptic,combo:comboNow,scale:SCALE};
})();

var DATA = {"parts":[{"part":"中国音乐史","short":"中","chapters":[{"id":"cn01","num":"一","title":"原始社会音乐","era":"远古—前21世纪","intro":"乐舞一体、乐器初成，中国音乐的源头。","cards":[{"q":"原始乐舞的代表作有哪些？","type":"简答","pts":["《葛天氏之乐》：八阙歌舞，「载民、玄鸟、遂草木、奋五谷、敬天常、达帝功、依地德、总禽兽之极」，反映农耕祭祀与图腾崇拜。","《蜡辞》：伊耆氏之乐，年终祭祀万物，辞曰「土反其宅，水归其壑，昆虫毋作，草木归其泽」。","《云门》：黄帝时乐舞，又名《承云》，祭天神。","《箫韶》：舜时乐舞，又名《九韶》《九辩》《九歌》，孔子评为「尽善尽美」。","《朱襄氏之乐》：以五弦瑟求雨，带原始巫术色彩。"],"keys":["葛天氏之乐","蜡辞","云门","箫韶","尽善尽美"],"tip":"按时代串记：葛天氏→伊耆氏→黄帝→舜，口诀「葛蜡云韶」。"},{"q":"贾湖骨笛","type":"名词解释","pts":["河南舞阳贾湖遗址出土，距今约八千年，新石器时代早期。","多为七孔，可吹奏七声音阶，部分能奏完整七声。","是中国迄今发现最早的乐器实物之一，把中国音乐可考历史大幅前推。","证明原始先民已具备明确的音高与音阶意识。"],"keys":["贾湖","骨笛","七孔","八千年"],"tip":"「骨笛一响，八千年」——地点、年代、孔数、意义四要素。"},{"q":"原始乐器主要有哪些？","type":"简答","pts":["吹奏类：骨笛、骨哨、陶埙（一孔至多孔，音高渐全）。","打击类：石磬（特磬）、陶钟、陶鼓、陶响器、摇响器。","特点：材质天然，多与狩猎、祭祀、巫术相关；尚无成熟弦乐器实证。"],"keys":["骨笛","陶埙","石磬","陶鼓"],"tip":"按「吹—打」两类记，再补一句「弦乐器尚无实证」，答题更严谨。"},{"q":"夔","type":"名词解释","pts":["舜时乐官，《尚书·舜典》载「夔，命汝典乐，教胄子」。","「击石拊石，百兽率舞」，反映原始乐舞诗、乐、舞一体的形态。","被视作中国最早的音乐管理者与音乐教育者。"],"keys":["夔","典乐","击石拊石"],"tip":"记住身份（乐官）+ 出处（《尚书》）+ 名言（击石拊石）。"},{"q":"关于音乐起源的主要学说","type":"简答","pts":["劳动说：音乐起源于生产劳动（最具影响力）。","模仿说、巫术说、情感说、游戏说、异性求爱说。","中国古代有「物动心感」说，《乐记》「凡音之起，由人心生也」。","考古实证以骨笛、埙、磬等乐器为依据。"],"keys":["劳动说","巫术说","物动心感"],"tip":"五说记「劳模巫情游」——劳动、模仿、巫术、情感、游戏。"},{"q":"弹歌","type":"名词解释","pts":["《弹歌》是相传为黄帝时期的一首原始狩猎歌谣，载于东汉赵晔《吴越春秋》。","全歌仅八字「断竹，续竹，飞土，逐宍（肉）」，依次写砍竹、接竹制弓、射出泥丸、追逐猎物。","它音节短促、节奏紧凑，完整记录了原始狩猎劳动的过程，被认为是劳动号子的远祖。","其内容说明原始音乐与劳动生活关系密切，常被用作音乐起源于劳动说的例证。"],"keys":["弹歌","吴越春秋","断竹续竹","狩猎歌谣","劳动说"],"tip":"八字狩猎歌「断竹续竹，飞土逐肉」，出自《吴越春秋》→劳动号子的远祖。","extra":true,"syl":false,"sylNote":"考纲未列弹歌"},{"q":"《韶》","type":"名词解释","pts":["《韶》是舜帝时期的乐舞，又称《大韶》《箫韶》《九韶》，是六代乐舞之一。","其内容歌颂舜的功德与尧舜禅让，是原始社会末期大型乐舞的代表。","孔子对《韶》评价极高，称其「尽善尽美」，《论语》还记载「子在齐闻韶，三月不知肉味」。","《韶》体现了诗、乐、舞三位一体的原始乐舞形态，对后世雅乐影响深远。"],"keys":["韶","箫韶","舜","六代乐舞","尽善尽美"],"tip":"「舜之《韶》——尽善尽美，孔子听了三月不知肉味」。","extra":true,"syl":true,"sylNote":"考纲列《箫韶》"},{"q":"简述远古夏商时期音乐与巫术、劳动的关系。","type":"简答","pts":["原始音乐与劳动生活关系密切：相传黄帝时的《弹歌》以「断竹，续竹，飞土，逐宍」记录狩猎过程，节奏紧凑，是劳动号子的远祖。","《葛天氏之乐》八阕反映农牧生活，人们操牛尾边跳边唱，祈求草木繁盛、五谷丰登。","原始音乐又依附于巫术祭祀：《蜡辞》是祈年祭辞，《朱襄氏之乐》以五弦瑟祈雨，乐舞用于通神、驱邪。","夏商乐舞如《大夏》《大濩》《雩舞》《魌舞》《桑林》多用于祭祀与巫术仪式，体现歌、乐、舞三位一体。"],"keys":["弹歌","葛天氏之乐","蜡辞","巫术","劳动"],"tip":"「劳动出节奏、巫术出仪式」——原始音乐两条根。","extra":true,"syl":true,"sylNote":"考纲列原始乐舞、《蜡辞》"}]},{"id":"cn02","num":"二","title":"夏商音乐","era":"前21世纪—前11世纪","intro":"青铜时代，巫乐盛行，乐器由陶石走向青铜。","cards":[{"q":"夏商时期的代表性乐舞","type":"简答","pts":["《大夏》：夏禹时乐舞，歌颂治水功绩。","《大濩》：商汤时乐舞，歌颂伐桀之功。","《雩舞》：求雨祭祀之舞。","《魌舞》：驱疫逐鬼的傩舞。","《桑林》：商代祭祀乐舞，后世被视作「淫乐」代表。"],"keys":["大夏","大濩","雩舞","魌舞","桑林"],"tip":"「夏禹汤濩」；《桑林》是反面典型，常作对比考点。"},{"q":"夏商时期的乐器","type":"简答","pts":["铜铃、陶埙、石磬、编磬、编铙。","虎纹特磬、排箫、兽面纹大铙等。","商代青铜乐器发达，编铙常三件一组，音高成组。","河南安阳殷墟等地出土集中。"],"keys":["编铙","特磬","排箫","大铙"],"tip":"「青铜三件套」：铙、磬、铃，再加陶埙。"},{"q":"「候人兮猗」","type":"名词解释","pts":["见《吕氏春秋·音初》，传为涂山氏之女等候夏禹时所唱。","现存最早的南方歌曲歌词之一。","「兮猗」为语气词，体现早期歌谣「以歌代言」的形态。"],"keys":["候人兮猗","吕氏春秋","涂山氏"],"tip":"四字歌词 + 出处 + 「最早南方歌词」的地位。"},{"q":"商代音乐的特点","type":"简答","pts":["巫乐盛行，音乐与占卜、祭祀紧密结合。","「淫乐」之说，商纣「以酒为池，悬肉为林」，反映享乐性音乐。","青铜乐器高度发达，编铙、大铙为标志。","音乐教育初现，「瞽宗」为商代乐教机构。"],"keys":["巫乐","淫乐","瞽宗"],"tip":"两点定性（巫、淫）+ 一点实物（青铜）+ 一点制度（瞽宗）。"},{"q":"陶埙","type":"名词解释","pts":["陶埙是中国最古老的吹奏乐器之一，由陶土烧制而成，外形多为卵形或球形，顶部有吹孔、器身有按音孔。","其历史可追溯到距今约7000—6000年的新石器时代，音色古朴、苍凉、幽深。","殷墟出土的商代陶埙已能吹出一定音阶，是研究商代音阶制度最可靠的实物资料。","它证明中国早期已有音高、音阶观念，制作时存在统一的定音标准。"],"keys":["陶埙","吹奏乐器","音阶","殷墟","新石器时代"],"tip":"「陶土烧成、卵形带孔、七千年历史、殷墟埙证音阶」。","extra":true,"syl":true,"sylNote":"考纲列陶埙"}]},{"id":"cn03","num":"三","title":"西周春秋战国","era":"前11世纪—前221","intro":"礼乐制度确立、八音分类、曾侯乙编钟，先秦音乐的高峰。","cards":[{"q":"礼乐制度","type":"名词解释","pts":["周初周公「制礼作乐」，以乐配礼、维护宗法等级。","等级规范：天子八佾、诸侯六佾、大夫四佾、士二佾。","乐悬：王宫悬、诸侯轩悬、卿大夫判悬、士特悬。","设「大司乐」掌乐教，为周代最高音乐机构。","核心观念「礼辨异，乐和同」。"],"keys":["制礼作乐","八佾","乐悬","大司乐","礼辨异乐和同"],"tip":"「佾—悬—司乐—和同」四级记忆，数字（8/6/4/2）必写。"},{"q":"六代之乐","type":"名词解释","pts":["《云门》（黄帝）、《大咸》（尧）、《大韶》（舜）。","《大夏》（禹）、《大濩》（汤）、《大武》（周武王）。","用于祭祀大典，又称「六大舞」，是雅乐的核心。","《大武》为西周代表作，表现武王伐纣。"],"keys":["云门","大咸","大韶","大夏","大濩","大武"],"tip":"「云咸韶夏濩武」六字诀，对应黄尧舜禹汤武。"},{"q":"八音分类法","type":"名词解释","pts":["按制作材料分乐器为八类，见《周礼·春官》。","金（钟镈）、石（磬）、土（埙缶）、革（鼓）。","丝（琴瑟）、木（柷敔）、匏（笙竽）、竹（箫管）。","中国最早的乐器科学分类法，影响深远。"],"keys":["金石土革","丝木匏竹","周礼"],"tip":"八字口诀「金石土革，丝木匏竹」，每种各举一器。"},{"q":"曾侯乙墓编钟","type":"名词解释","pts":["1978年湖北随州擂鼓墩出土，战国早期。","共65件，分三层八组，总重约2500公斤。","「一钟双音」，十二律俱全，可在多调上旋宫转调。","钟体铭文2828字，记载各国律名对照。","证明先秦乐律学与铸造工艺的高度发达。"],"keys":["曾侯乙","65件","一钟双音","十二律","旋宫转调"],"tip":"数字题：1978、65件、三层八组、2828字、一钟双音。"},{"q":"三分损益法与十二律","type":"名词解释","pts":["三分损益：以弦长或管长为基准，损一（×2/3）或益一（×4/3）求得各音。","《管子·地员》以「先益后损」求出五音（宫商角徵羽）。","《吕氏春秋·音律》以「先损后益」推全十二律。","十二律：黄钟、大吕、太簇、夹钟、姑洗、仲吕、蕤宾、林钟、夷则、南吕、无射、应钟。","局限：仲吕不能还生黄钟，故有后世六十律、十八律、新法密率等探索。"],"keys":["三分损益","管子","吕氏春秋","十二律"],"tip":"十二律按「黄大太夹姑仲蕤，林夷南无应」背，顺序必考。"},{"q":"伶伦作律","type":"名词解释","pts":["传说黄帝命伶伦取昆仑之竹制管，以定十二律。","见《吕氏春秋·古乐》，有「听凤鸣以别十二律」的神话色彩。","反映古人对律吕起源的想象，是律学史的起点叙事。"],"keys":["伶伦","制管","吕氏春秋"],"tip":"「伶伦吹竹定十二律」——人物、材料、数目三要点。"},{"q":"《诗经》《楚辞》《九歌》《成相篇》","exam":"简述《诗经》《楚辞》与《成相篇》的音乐史料价值。","type":"简答","pts":["《诗经》分风、雅、颂，孔子编订，皆可弦歌。","《楚辞》：屈原作品，楚地民歌色彩。","《九歌》：屈原据民间祭神乐歌改作，共十一篇。","《成相篇》：荀子作，以「相」（春牍）击节，被视为说唱艺术的雏形。"],"keys":["风雅颂","楚辞","九歌","成相篇"],"tip":"《成相篇》是「说唱雏形」的固定考点，务必点出。"},{"q":"先秦音乐家群像","type":"简答","pts":["伶州鸠：周景王时乐官，论十二律与「七律」。","师旷：晋国盲乐师，善琴，能「听声辨吉凶」。","师涓、师襄、师文、师乙：卫、鲁、郑、鲁乐师；师襄为孔子琴师。","秦青「声振林木，响遏行云」，韩娥「余音绕梁，三日不绝」。","伯牙善琴，钟子期知音，「高山流水」典故。"],"keys":["伶州鸠","师旷","秦青","韩娥","伯牙"],"tip":"分两类：宫廷乐官（伶州鸠、师旷、师襄）+ 传说歌手琴家（秦青、韩娥、伯牙）。"},{"q":"「百家争鸣」中的音乐思想","type":"论述","pts":["儒家：孔子「尽善尽美」「兴于诗，立于礼，成于乐」；荀子《乐论》「乐者，乐也」，主张以乐教化。","墨家：墨子《非乐》，指音乐耗费财力和误政，代表小生产者立场。","道家：老子「大音希声」，庄子「天籁」「无声之中独闻和」，崇尚自然。","儒道互补，构成中国古代音乐美学的两大源头。"],"keys":["尽善尽美","非乐","大音希声","天籁"],"tip":"三家三句：儒「和」、墨「非」、道「无」。"},{"q":"《乐记》","type":"名词解释","pts":["现存最早、最系统的音乐美学专著，传为公孙尼子所作。","核心命题：「凡音之起，由人心生也」「物动心感」。","主张「礼辨异，乐和同」「乐者，通伦理者也」，强调音乐的社会功能。","对后世中国音乐美学影响深远。"],"keys":["乐记","物动心感","礼辨异乐和同"],"tip":"地位（最早最系统）+ 三句原文，是万能答题模板。"},{"q":"师涓","type":"名词解释","pts":["师涓是春秋时期卫国宫廷乐师，以善弹「新声」著称。","卫国地处商代旧地，民间「郑卫之音」流行，师涓正是这类民间新乐的推动者。","《韩非子·十过》载他为晋平公弹奏「清商」「清角」等新声，被儒家视作「靡靡之音」的代表人物。","其形象印证了春秋末期「雅乐衰、新声起」的音乐潮流。"],"keys":["师涓","卫国","新声","郑卫之音","韩非子·十过"],"tip":"「师涓弹新声」——被骂的乐师，正好反证新声之兴。","extra":true},{"q":"师襄","type":"名词解释","pts":["师襄是春秋时期卫国乐官，孔子的琴师。","孔子曾向他学琴，一曲习之十日不进，力求「得其志」而后已，体现先秦琴学传承的治学精神。","他是先秦师传徒授琴乐的最早典范之一，代表琴学谱系的源头。","其教学重意境与人格体悟而非仅求技艺，对后世琴乐教育影响深远。"],"keys":["师襄","孔子","琴师","得其志"],"tip":"「孔子的琴老师」——一曲学十日，得其志乃已。","extra":true},{"q":"师文","type":"名词解释","pts":["师文是春秋时期郑国乐师，曾从师襄学琴。","《列子·汤问》载他学琴三年不成章，师襄让他归家，他反而悟出「内不得于心，外不应于器」的道理。","再鼓琴时，春扣商弦而草木萌发，秋扣角弦而草木凋零，四时之景随弦而至，表现力惊人。","其故事说明先秦已认识到琴乐须心、器、意三者统一，技艺之上还有精神境界。"],"keys":["师文","师襄","列子·汤问","内得于心"],"tip":"「师文三年不成章，一悟通四时」（讲义未直接展开，按《列子》通行说法补）。","extra":true},{"q":"师乙","type":"名词解释","pts":["师乙是春秋时期宫廷乐师，以论歌著称，其言论保存在《乐记·师乙篇》。","《乐记·师乙篇》论歌：「故歌者，上如抗，下如坠，曲如折，止如槀木，倨中矩，句中钩，累累乎端如贯珠。」","这段话说明当时歌者已注意气息运用、音区上下贯通与咬字规矩，强调演唱的严格性。","它是研究先秦声乐技术与声乐美学最直接的文献之一。"],"keys":["师乙","乐记·师乙篇","上如抗下如坠","端如贯珠"],"tip":"「上抗下坠、端如贯珠」八个字背下先秦声乐美学。","extra":true},{"q":"六代乐舞","type":"名词解释","pts":["六代乐舞是西周礼乐制度下宫廷使用的六部大型乐舞的合称，简称「六舞」。","包括黄帝时《云门》、尧时《咸池》、舜时《韶》、夏代《大夏》、商代《大濩》、周初《大武》。","它们分别歌颂上古六个时代的帝王功德，规模宏大，强调政治歌颂与道德宣扬作用。","六代乐舞是周代雅乐的核心内容，集中体现「礼乐治国」的观念，对后世宫廷乐舞影响深远。"],"keys":["六代乐舞","六舞","云门","大武","雅乐"],"tip":"「黄云门、尧咸池、舜韶、夏大夏、商大濩、周大武」——六个朝代六部乐舞。","extra":true,"syl":true,"sylNote":"考纲作六代之乐"},{"q":"简述曾侯乙编钟的音乐学价值。","type":"简答","pts":["曾侯乙墓编钟1978年出土于湖北随县，共64枚，另有楚惠王赠送的镈钟一枚，是战国编钟艺术的顶峰。","可奏出完整的五、七声音阶，中部音区十二半音齐备，音阶结构与现代C大调七声音阶相同。","采用三分损益律与纯律复合生律法调律，一钟可击出相距大三度或小三度的两音，即「一钟双音」。","钟上铭文记载律名、阶名，为研究古代乐律提供珍贵实证，说明战国时旋律音乐已高度发达。"],"keys":["曾侯乙墓编钟","64枚","五个八度","一钟双音","乐律铭文"],"tip":"64枚、三层、五个八度、一钟双音——四个数字一起背。","extra":true,"syl":true,"sylNote":"考纲作曾侯乙墓编钟"},{"q":"雅乐","type":"名词解释","pts":["雅乐是西周礼乐制度下用于祭祀、朝会、宴享等典礼的宫廷正统音乐，与俗乐相对。","其内容包括六代乐舞及《诗经》中的大雅、小雅、颂，题材限于祀神颂德。","形式上等级森严：乐队编制、舞队人数与身份等级对应，旋律多用五声音阶，风格中正平和。","乐器以编钟、编磬为核心，功能是祭祀通神、朝会明礼、教化民众，奠定了后世宫廷雅乐的基本模式。"],"keys":["雅乐","六代乐舞","大雅小雅","编钟编磬","礼乐"],"tip":"「祭祀朝会、等级森严、中正平和、钟磬为核」。","extra":true,"syl":true,"sylNote":"考纲列雅乐"},{"q":"简述道家音乐思想。","type":"简答","pts":["道家以老子、庄子为代表，核心是「道法自然」，反对人为雕琢的艺术。","老子提出「大音希声」，认为最盛大的音乐是无声的，主张音乐应自然、朴素、平和。","其积极意义是反对统治阶级的「侈乐」风气，使音乐摆脱礼的束缚，注重音乐的独立性与特殊性。","其消极方面是否定了有声之乐与人的音乐，夸大「大音」的功能，流于玄虚；庄子更强调自然、无为、清虚、逍遥。"],"keys":["道家","老子","大音希声","庄子","道法自然"],"tip":"「大音希声、道法自然」——道家反人为、主朴素。","extra":true,"syl":true,"sylNote":"考纲列道家"},{"q":"「非乐」","type":"名词解释","pts":["「非乐」是春秋战国时期墨家创始人墨子提出的音乐主张，集中见于《墨子·非乐》篇。","墨子站在底层劳动者立场，反对一切享乐，认为音乐活动劳民伤财、无益于百姓生计，因而否定音乐。","这一主张体现了功利主义的社会思潮，也促使儒家更强调音乐的社会功能以回应其批判。","「非乐」与儒家「倡乐」形成先秦音乐思想的对立，是「百家争鸣」中音乐论争的重要一极。"],"keys":["非乐","墨子","墨家","功利主义","百家争鸣"],"tip":"「墨子非乐——劳民伤财，所以不要音乐」。","extra":true,"syl":true,"sylNote":"考纲列墨家音乐思想"},{"q":"简述《诗经》与《楚辞》区别。","type":"简答","pts":["时代地域不同：《诗经》为西周至春秋中叶的北方作品，《楚辞》为战国时期南方的楚地作品。","性质不同：《诗经》是我国第一部现实主义诗歌总集，多为无名氏集体创作；《楚辞》是第一部浪漫主义诗歌总集，以屈原等知名诗人为代表。","结构分类不同：《诗经》分风、雅、颂，多用赋、比、兴手法；《楚辞》以《离骚》《九歌》为代表，多用象征（香草美人）。","音乐上，《诗经》是周代采风与雅乐的歌辞，《楚辞·九歌》则是楚地巫风祭歌，风格瑰丽、句式自由。"],"keys":["诗经","楚辞","风雅颂","九歌","现实主义浪漫主义"],"tip":"「北方诗经现实、南方楚辞浪漫；风雅颂对离骚九歌」。","extra":true,"syl":true,"sylNote":"考纲列《诗经》、《楚辞》"},{"q":"曾侯乙编钟","type":"名词解释","pts":["曾侯乙墓编钟1978年出土于湖北随县，共64枚，另有楚惠王赠送的镈钟一枚，是战国编钟艺术的顶峰。","钟架为三层，上层钮钟三组，中下层甬钟分琥钟、嬴孠钟、揭钟三组，总音域达五个八度。","可奏出完整的五、七声音阶，中部音区十二半音齐备，采用三分损益律与纯律复合生律法调律，一钟可击出相距大三度或小三度的两音（一钟双音）。","钟上铭文记载律名、阶名，为研究古代乐律提供珍贵实证，说明战国时旋律音乐已高度发达。"],"keys":["曾侯乙墓编钟","64枚","一钟双音","五个八度","乐律铭文"],"tip":"「64枚、五个八度、一钟双音、铭文实证」。","extra":true,"syl":true,"sylNote":"考纲作曾侯乙墓编钟"},{"q":"简述儒家音乐思想。","type":"简答","pts":["孔子创立儒家学派，重视音乐的社会功能，主张「礼乐」治国，提出「尽善尽美」的审美标准，并整理《诗经》。","《乐记》是儒家音乐思想的集大成著作，提出「物感说」，认为音乐由人心感于物而生，并与政治相通。","《乐记》主张「礼乐相成」，认为礼别异、乐和同，音乐可以移风易俗、教化民众。","荀子《乐论》进一步强调「乐者，乐也」，以音乐引导人的情感向善，儒家音乐思想由此系统化。"],"keys":["儒家","孔子","乐记","礼乐","移风易俗"],"tip":"「孔子尽善尽美、《乐记》物感说、礼乐相成、荀子《乐论》」。","extra":true,"syl":true,"sylNote":"考纲列儒家"}]},{"id":"cn04","num":"四","title":"秦汉音乐","era":"前221—220","intro":"乐府采风、鼓吹乐兴起、相和歌成形、丝绸之路初开。","cards":[{"q":"乐府","type":"名词解释","pts":["秦代已设「乐府」，汉武帝时大规模扩建。","职能：采集民间歌谣、创作改编、宫廷演出。","李延年任协律都尉，主持乐府音乐。","汉哀帝时罢乐府，但所存民歌影响深远。","是中国历史上重要的官方音乐机构。"],"keys":["乐府","汉武帝","李延年","协律都尉"],"tip":"「秦设汉盛哀帝罢」——三段式记沿革。"},{"q":"鼓吹乐","type":"名词解释","pts":["源于北方游牧民族，以鼓、角、笳、笛为主要乐器。","鼓吹：用于朝会、道路仪仗。","横吹：军中马上演奏，有《横吹曲》。","短箫铙歌：军乐、凯歌，用于激励士气。","汉代宫廷重要乐种，后广泛用于仪仗、婚丧。"],"keys":["鼓吹","横吹","短箫铙歌","鼓角"],"tip":"三分类「鼓吹—横吹—短箫铙歌」，各记使用场合。"},{"q":"相和歌与相和大曲","type":"名词解释","pts":["相和歌：北方民间歌曲，「丝竹更相和，执节者歌」，一人唱、众人和。","相和大曲：在相和歌基础上发展的大型歌舞，结构为「艳—解—趋（或乱）」。","代表作：《陌上桑》《东门行》。","是汉魏时期最重要的歌舞音乐形式之一。"],"keys":["相和歌","丝竹更相和","艳解趋","相和大曲"],"tip":"结构「艳—解—趋—乱」，四个字必须按序写。"},{"q":"百戏与角抵戏","type":"名词解释","pts":["百戏：汉代综合性表演艺术，含歌舞、杂技、幻术、角抵。","角抵戏：源于战国角力，汉代盛行，带戏剧因素。","张衡《西京赋》有生动记载。","音乐与戏剧结合的先声。"],"keys":["百戏","角抵戏","西京赋"],"tip":"「百戏是筐，角抵是戏」——总类与子类的关系。"},{"q":"京房六十律与京房准","type":"名词解释","pts":["西汉京房为解决三分损益「仲吕不能还生黄钟」的矛盾。","将律数推至六十律，试图实现旋宫。","创制「京房准」，十三弦定律器，用于调律。","是律学探索的重要成果，但未真正解决问题。"],"keys":["京房","六十律","京房准"],"tip":"人—数—器：京房、六十律、十三弦准。"},{"q":"三种七声音阶","type":"简答","pts":["雅乐音阶（正声音阶）：1 2 3 #4 5 6 7，第四级升高。","清乐音阶（下徵音阶）：1 2 3 4 5 6 7，即自然七声。","燕乐音阶（清商音阶）：1 2 3 4 5 6 b7，第七级降低。","三者区别在「四级」与「七级」的半音位置，是判断调式的关键。"],"keys":["雅乐音阶","清乐音阶","燕乐音阶","变徵","闰"],"tip":"口诀「雅升四、清全白、燕降七」。"},{"q":"声曲折","type":"名词解释","pts":["汉代记谱形式，以线条或符号描摹旋律的高低走向。","见《汉书·艺文志》「歌声曲折」。","具体形态已失传，是中国早期记谱法的重要线索。"],"keys":["声曲折","汉书艺文志","记谱"],"tip":"「声」是歌，「曲折」是旋律线——望文生义即可得分。"},{"q":"丝绸之路与汉代音乐交流","type":"简答","pts":["张骞通西域，开启中外音乐交流的第一个高峰。","传入：横吹、曲项琵琶、箜篌、胡笳、羌笛。","传出：丝竹乐器、乐律观念。","为隋唐多部乐的形成奠定基础。"],"keys":["张骞","横吹","琵琶","箜篌","胡笳"],"tip":"「进多出少」——记传入乐器清单即可应付简答。"},{"q":"简述京房六十律的生律原理及其历史意义。","type":"简答","pts":["京房是西汉律学家，他在三分损益法基础上利用第一律与第十二律之间的音差继续损益推算，把一个八度分为六十律。","生至第54律「色育」时与原黄钟只差3.6音分，京房称为「一日」，今人称为「京房音差」。","他是我国第一个从理论上发现「仲吕不能还生黄钟」的律学家，六十律正是为解决此问题而作。","六十律虽只有理论意义，但体现了汉代律学探索的深化，对后世律学研究影响深远。"],"keys":["京房六十律","三分损益","京房音差","仲吕不能还生黄钟","京房准"],"tip":"「解决仲吕不能还生黄钟」→六十律→第54律差3.6音分=京房音差。","extra":true,"syl":true,"sylNote":"考纲列京房六十律"},{"q":"简述相和大曲。","type":"简答","pts":["相和大曲是汉魏时期在相和歌基础上发展而成的大型歌舞曲，是相和歌的最高形式。","其结构为「艳—曲—解—趋（或乱）」：艳是散板慢速的器乐引子，曲是歌唱主体。","解是器乐间奏与展开，趋或乱是速度加快、情绪热烈的高潮段落，常伴舞蹈结束。","伴奏用丝竹乐器，代表曲目有《陌上桑》《白头吟》等，其「引子—主体—高潮」的结构原则对隋唐燕乐大曲影响深远。"],"keys":["相和大曲","艳","曲","解","趋乱"],"tip":"「艳引子、曲主体、解间奏、趋乱高潮」——四段口诀。","extra":true,"syl":true,"sylNote":"考纲列相和大曲"},{"q":"简述汉代百戏。","type":"简答","pts":["百戏是汉代对杂技、幻术、角抵、歌舞、戏剧性表演等民间技艺的总称，起源于先秦，盛行于汉代。","它是汉代俗乐中最具观赏性的表演形式，常在宫廷与民间宴享、节庆中演出。","其中角抵戏已具戏剧因素，代表作《东海黄公》有人物扮演与故事情节。","百戏融合音乐、舞蹈、杂技与戏剧表演，为后世戏曲的形成提供了重要基础。"],"keys":["百戏","角抵戏","东海黄公","汉代俗乐","戏曲雏形"],"tip":"「杂技幻术角抵歌舞总称」+《东海黄公》=汉代百戏。","extra":true,"syl":true,"sylNote":"考纲列百戏"}]},{"id":"cn05","num":"五","title":"魏晋南北朝音乐","era":"220—589","intro":"清商乐兴盛、琴学自觉、律学探索，音乐走向独立与思辨。","cards":[{"q":"清商乐","type":"名词解释","pts":["承相和歌而来，融合南方吴歌、西曲。","「清商三调」：平调、清调、瑟调（侧调）。","北魏孝文帝时称「清商乐」，隋唐归入「清乐」。","是这一时期最具代表性的音乐。"],"keys":["清商乐","吴歌","西曲","清商三调"],"tip":"「承相和、融吴西、分三调」三句话。"},{"q":"吴歌与西曲","type":"简答","pts":["吴歌：建康一带，婉转抒情，多五言四句，如《子夜歌》。","西曲：荆楚一带，节奏明快，多写商旅离别，如《莫愁乐》。","二者共同构成清商乐的主体。"],"keys":["吴歌","西曲","子夜歌"],"tip":"「吴柔西快」——地域与风格一一对应。"},{"q":"嵇康《声无哀乐论》","type":"名词解释","pts":["魏晋玄学背景下的音乐美学论著。","核心：「声音自当以善恶为主，则无关于哀乐」。","认为音乐本体无情感，哀乐生于人心，反对儒家「乐与政通」。","是中国音乐美学史上的里程碑。"],"keys":["嵇康","声无哀乐论","无关于哀乐"],"tip":"一句核心原文 + 一句评价（里程碑），足够。"},{"q":"阮籍《酒狂》与《乐论》","type":"简答","pts":["阮籍，竹林七贤之一，善琴。","《酒狂》：古琴曲，三拍子，写醉酒佯狂之态。","《乐论》：主张「乐者，天地之体，万物之性」。"],"keys":["阮籍","酒狂","乐论"],"tip":"「嵇声无、阮乐论」——两人两书不要混。"},{"q":"荀勖笛律","type":"名词解释","pts":["西晋荀勖制十二笛，每笛可奏三调。","发现「管口校正」：管乐器空气柱长度不等于管长。","是律学与乐器声学的重要成就。"],"keys":["荀勖","笛律","管口校正"],"tip":"一个关键词「管口校正」就是得分点。"},{"q":"文字谱《碣石调·幽兰》","type":"名词解释","pts":["南朝梁丘明传谱，现存最早的古琴谱。","文字谱：用文字详述指法、弦序、徽位。","唐曹柔在此基础上发展为减字谱。","原件现存日本京都神光院。"],"keys":["文字谱","碣石调幽兰","丘明","减字谱"],"tip":"「最早琴谱 + 文字谱 + 藏于日本」三点。"},{"q":"魏晋南北朝时期的律学与音乐交流","type":"简答","pts":["何承天新律：南朝宋，律数接近十二平均律。","钱乐之三百六十律：南朝宋，律数极度细化。","曹妙达：北齐琵琶世家，西域音乐东传。","苏祗婆：北周龟兹人，传入「五旦七调」。","佛教音乐：梵呗、法曲兴起。"],"keys":["何承天","钱乐之","曹妙达","苏祗婆","五旦七调"],"tip":"「何新、钱三六、曹琵琶、苏五旦」四组对应。"},{"q":"秦汉魏晋南北朝时期中外音乐文化交流的主要路径、内容及其历史意义。","type":"论述","pts":["秦汉时张骞出使西域，带回《摩诃兜勒》一曲；随着「丝绸之路」开辟，胡笛、胡箜篌等乐器与杂伎乐舞陆续传入，佛教音乐也随佛教东传进入内地。","传出方面，月氏、乌孙把中国音乐带到中亚南亚，卫满率人入朝鲜促进中朝交流，北匈奴西迁又把中国音乐带到东欧。","魏晋南北朝时，天竺乐传入凉州；384年前秦吕光攻占龟兹得龟兹乐，与当地及中原乐舞融合形成西凉乐，北魏太武帝通西域又带回疏勒、安国乐伎。","乐律与乐器交流深入：苏祗婆传入龟兹琵琶与西域乐律，其「五旦七调」理论催生八十四调；曲项琵琶、五弦琵琶、筚篥、羯鼓、腰鼓、竖箜篌、铜钹、羌笛等相继传入。","这些交流为隋唐多部乐与燕乐体系奠定基础，促成中外音乐大融合，使隋唐音乐成为当时世界性音乐文化的高峰。"],"keys":["丝绸之路","张骞","摩诃兜勒","龟兹乐","苏祗婆","西凉乐"],"tip":"「张骞传入、月氏传出、龟兹乐+苏祗婆」——路通、乐来、律变。","extra":true,"syl":true,"sylNote":"考纲列丝绸之路、苏祗婆"},{"q":"简述魏晋南北朝时期古琴艺术的发展。","type":"简答","pts":["古琴成为文人精神寄托，出现嵇康、阮籍等琴家，嵇康作《琴赋》，其中留下关于琴徽的最早记载。","名曲有嵇康《广陵散》、阮籍《酒狂》，以及《碣石调·幽兰》等，题材多具情节性并与歌唱结合。","《碣石调·幽兰》用文字谱记写，是现存最早的古琴曲谱，由梁代丘明传谱。","古琴形制趋于成熟（七弦、十三徽），演奏形式有独奏、合奏、伴奏，并与歌结合形成琴歌。"],"keys":["嵇康","广陵散","酒狂","文字谱","碣石调·幽兰"],"tip":"「嵇康广陵散、阮籍酒狂、丘明幽兰文字谱」——魏晋琴乐三件套。","extra":true,"syl":true,"sylNote":"考纲列嵇康、文字谱等"}]},{"id":"cn06","num":"六","title":"隋唐五代音乐","era":"581—960","intro":"多部乐、燕乐大曲、教坊梨园，中国古代音乐的鼎盛期。","cards":[{"q":"七部乐、九部乐、十部乐","type":"名词解释","pts":["隋初设「七部乐」：国伎、清商、高丽、天竺、安国、龟兹、文康。","隋炀帝改为「九部乐」：清乐、西凉、龟兹、天竺、康国、疏勒、安国、高丽、礼毕（文康改名）。","唐太宗定「十部乐」：燕乐、清商、西凉、天竺、高丽、龟兹、安国、疏勒、康国、高昌。","体现唐代宫廷音乐的多元与开放。"],"keys":["七部乐","九部乐","十部乐","龟兹","高昌"],"tip":"数字递进 7→9→10；九部里的「礼毕」就是原来的「文康」，不是删掉。"},{"q":"坐部伎与立部伎","type":"名词解释","pts":["唐代宫廷燕乐分二部。","坐部伎：堂上坐奏，人数少，技艺高，共六部。","立部伎：堂下立奏，人数多，共八部。","标志唐代燕乐的高度发展。"],"keys":["坐部伎","立部伎","六部","八部"],"tip":"「坐六立八，坐高立众」。"},{"q":"唐代音乐机构","type":"简答","pts":["太常寺下设大乐署（雅乐、燕乐训练）与鼓吹署（仪仗鼓吹）。","教坊：唐初设，掌俗乐歌舞，后专管宫廷俗乐。","梨园：唐玄宗设，专习法曲，乐工称「皇帝梨园弟子」。","形成完备的宫廷音乐教育与管理体系。"],"keys":["大乐署","鼓吹署","教坊","梨园"],"tip":"「两署两坊园」——大乐、鼓吹、教坊、梨园。"},{"q":"燕乐大曲与《霓裳羽衣曲》","type":"名词解释","pts":["燕乐大曲：唐代大型歌舞音乐，结构为「散序—中序—破」。","《霓裳羽衣曲》：唐代燕乐大曲的代表作，相传唐玄宗吸收《婆罗门曲》素材作成。","白居易《霓裳羽衣歌》详述其结构与舞态，是研究唐代大曲的重要文献。","代表唐代歌舞大曲的最高成就。"],"keys":["燕乐大曲","散序中序破","霓裳羽衣曲"],"tip":"三段结构「散序—中序—破」必背；答题时归为「燕乐大曲」，不要与法曲、健舞软舞混为一类。"},{"q":"健舞、软舞与法曲","type":"简答","pts":["健舞：刚健有力，如《胡旋》《胡腾》《柘枝》。","软舞：柔美舒缓，如《绿腰》《春莺啭》。","法曲：源于佛教法会音乐，风格清雅，乐器以钟磬琴瑟为主，由梨园法部专司。","三者是唐代宫廷乐舞与音乐的不同类别，注意与燕乐大曲区分。"],"keys":["健舞","软舞","胡旋","绿腰","法曲"],"tip":"「健胡旋、软绿腰、法清雅」；法曲是音乐类别，大曲是结构体裁，别混。"},{"q":"声诗、曲子、变文与《阳关三叠》","type":"简答","pts":["声诗：入乐歌唱的唐诗，「选诗入乐」。","曲子：民间长短句歌曲，是词的音乐源头。","变文：寺院说唱，散文与韵文交替，讲唱结合。","《阳关三叠》：王维《送元二使安西》入乐，叠唱三遍。"],"keys":["声诗","曲子","变文","阳关三叠"],"tip":"「诗—词—说唱—琴歌」四条线，各一例。"},{"q":"唐代乐器与器乐","type":"简答","pts":["古琴：《梅花三弄》为代表曲目。","琵琶：曲项琵琶，横抱，用拨子演奏，是燕乐主奏乐器。","箜篌、筚篥、羌笛、胡笳等西域乐器盛行。","敦煌壁画与乐舞图像保存大量乐器资料。"],"keys":["梅花三弄","曲项琵琶","筚篥","箜篌"],"tip":"「琴一琶一，胡乐一片」。"},{"q":"唐代乐谱种类","type":"简答","pts":["减字谱：曹柔创，古琴专用，由文字谱简化而来。","管色谱：工尺谱的前身。","弦索谱、律吕字谱、龟兹谱。","记谱法的多样化反映唐代音乐传播的需要。"],"keys":["减字谱","管色谱","律吕字谱","龟兹谱"],"tip":"「减、管、弦、律、龟」五谱连背。"},{"q":"唐代乐调理论","type":"简答","pts":["旋宫转调：调高与调式的转换。","六十调、八十四调：隋代郑译、万宝常据龟兹乐调发展而来。","五旦七调：龟兹苏祗婆所传。","二十八调：唐代燕乐调体系。"],"keys":["旋宫转调","八十四调","五旦七调","二十八调"],"tip":"数字链：5+7→12→60→84→28，按时代排。"},{"q":"唐代音乐著作与音乐家","type":"简答","pts":["《乐书要录》（元万顷等）、《教坊记》（崔令钦）。","《羯鼓录》（南卓）、《乐府杂录》（段安节）。","《太乐令壁记》（刘贶）、《通典·乐典》（杜佑）。","音乐家：万宝常、祖孝孙、李隆基、张文收。","歌者乐工：永新（许和子）、念奴、张红红、段善本、雷海青。"],"keys":["乐府杂录","羯鼓录","教坊记","永新","念奴"],"tip":"「三录一记一典」+ 两组人物（律学家 / 歌者）。"},{"q":"开皇乐议与唐代对外音乐交流","type":"简答","pts":["开皇乐议：隋初关于雅乐宫调的大讨论，郑译、万宝常等参与，促成八十四调。","唐代对外交流：吸收天竺、龟兹、高丽、日本音乐。","日本遣唐使带回大量乐器与乐谱，正仓院保存唐乐器。","形成「胡乐入华、华乐外传」的双向格局。"],"keys":["开皇乐议","遣唐使","正仓院"],"tip":"「一议一传」：开皇乐议 + 遣唐使。"},{"q":"万宝常","type":"名词解释","pts":["万宝常是隋代音乐家、乐律学家，因父获罪被「配为乐户」，却以卓越才能受隋文帝赏识。","他自幼「妙达音律，遍工八音」，作曲「应手成曲，无所碍滞」，并「损益乐器，不可胜记」。","他在苏祗婆「五旦七声」与郑译推演的基础上提出「八十四调」乐律理论，以适应汉族音乐与西域音乐交流的需要。","他参与隋代雅乐改制，主张恢复华夏传统雅乐，并精通琵琶、创制律准校音。","他是隋代宫廷音乐制度的奠基人之一，也是连接南北朝乐律学与隋唐燕乐理论的关键人物。"],"keys":["万宝常","八十四调","乐户","雅乐改制"],"tip":"「乐户出身、八十四调留名」——逆境与理论两大记忆点。","extra":true},{"q":"祖孝孙","type":"名词解释","pts":["祖孝孙是唐初音乐家、乐律学家，主持唐初雅乐的修定。","他认为「陈、梁旧乐多用吴楚之音，周、齐旧乐多涉胡戎之伎」，于是「斟酌南北，考以古音」重定雅乐。","他修成《大唐雅乐》，以「十二和」为乐章结构，用于郊庙祭祀与朝廷大典。","其乐制把南北朝以来胡汉杂糅的宫廷音乐重新规范，为唐代礼乐体系奠定基础。"],"keys":["祖孝孙","大唐雅乐","十二和","斟酌南北"],"tip":"「斟酌南北、考以古音」八个字就是他的方法论（讲义未直接展开）。","extra":true},{"q":"李隆基","type":"名词解释","pts":["李隆基即唐玄宗，唐代皇帝，也是中国古代罕见的以音乐家身份载入史册的帝王，被称为「音乐皇帝」。","他创作《霓裳羽衣曲》，融合西域调式与中原舞蹈，是唐代大曲与法曲结合的典范，另有《龙池乐》《小破阵乐》等。","他创立梨园，亲选乐工、亲自教习，专习法曲与器乐，被后世梨园行尊为「梨园祖师」，并扩充教坊、完善坐立部伎制度。","他极擅羯鼓，《羯鼓录》称其演奏「头如青山峰，手如白雨点」。","他是「音乐实践型君主」，把唐代燕乐推向历史最高峰。"],"keys":["李隆基","唐玄宗","霓裳羽衣曲","梨园","羯鼓"],"tip":"「一帝三事」：作曲、办梨园、打羯鼓。","extra":true},{"q":"张文收","type":"名词解释","pts":["张文收是唐初音乐家，精通音律，长期任职太常，参与唐初雅乐与燕乐的制定。","他与祖孝孙等共同修定《大唐雅乐》，厘定律吕与乐章，是唐初礼乐建设的重要参与者。","他作有《景云河清歌》，用于宫廷宴飨，是唐初燕乐的重要作品。","他代表了唐初一批兼通雅乐与燕乐的宫廷乐官，其工作为盛唐燕乐的繁荣准备了制度基础。"],"keys":["张文收","大唐雅乐","景云河清歌","唐初燕乐"],"tip":"「祖孝孙定雅乐、张文收作《景云河清歌》」——两人一组记（讲义未直接展开）。","extra":true},{"q":"张红红","type":"名词解释","pts":["张红红是唐代民间女歌手，以「记曲」绝技著称，事迹见于段安节《乐府杂录》。","她隔屏听人演唱新曲，能以红豆记其拍节，一曲听罢即能准确复唱，一声不差。","乐工惊其才，引荐入宫，被召入内廷，时人称为「记曲娘子」。","其故事反映唐代曲子兴盛、民间歌唱水平之高，也说明当时已重视曲调的准确记诵与传习。"],"keys":["张红红","记曲娘子","乐府杂录","记曲"],"tip":"「红豆记拍、一遍不差」——「记曲娘子」四字定人物（讲义未直接展开）。","extra":true},{"q":"段善本","type":"名词解释","pts":["段善本是唐代琵琶名家，又称段和尚，代表唐代琵琶艺术的最高水平。","唐德宗贞元年间长安大旱，东西天门街祈雨斗乐，他化妆为女郎弹《录要》一曲，「及下拨，声如雷，其妙入神」。","号称「琵琶第一手」的康崑崙因此执意拜他为师，次日受德宗召见嘉奖，这是我国历史记载最早的一次琵琶比赛。","他培养李管儿等数十名琵琶弟子，在唐代音乐界享有极高声誉。"],"keys":["段善本","段和尚","录要","康崑崙","琵琶比赛"],"tip":"「一场祈雨斗琵琶」——段善本赢康崑崙，故事带考点。","extra":true},{"q":"雷海青","type":"名词解释","pts":["雷海青是唐玄宗时的宫廷乐师，精通琵琶，是梨园、教坊中的著名乐工。","安史之乱中长安陷落，他被叛军掳至洛阳，安禄山强令奏乐，他掷乐器于地、西向痛哭，拒不为叛军演奏而遇害。","其气节为后世所重，被梨园行奉为祖师，闽台地区尊为「田都元帅」加以供奉。","其事迹是唐代宫廷乐工群体与「梨园」文化的重要见证，也常被用来说明音乐与家国气节的关系。"],"keys":["雷海青","梨园","田都元帅","安史之乱"],"tip":"「掷琵琶、骂安禄山」——气节型名解（讲义未直接展开）。","extra":true},{"q":"燕乐二十八调","type":"名词解释","pts":["燕乐二十八调是唐代宫廷燕乐所用的宫调体系，又称「俗乐二十八调」。","其结构有「七宫四调」与「四宫七调」两种解释，按今存古乐音调看应为七宫、七商、七角、七羽各七调，合为二十八调。","它是在龟兹苏祗婆「五旦七调」及八十四调理论基础上形成的唐代乐调理论核心。","二十八调对宋元以来的词曲、戏曲、说唱、器乐均有深远影响。"],"keys":["燕乐二十八调","俗乐二十八调","七宫四调","五旦七调","宫调体系"],"tip":"「七宫×四调=二十八」——燕乐、俗乐、二十八调三名一体。","extra":true,"syl":true,"sylNote":"考纲列二十八调"},{"q":"梨园","type":"名词解释","pts":["梨园是唐玄宗在内廷设立的音乐机构，以教习、演奏法曲与器乐为主。","它与教坊分工不同：教坊专习歌舞，梨园专攻法曲和器乐，乐工多由玄宗亲自挑选、亲自教习。","梨园集中了唐代宫廷优秀的器乐与歌唱人才，李龟年等名家皆与宫廷音乐活动相关。","后世戏曲艺人称「梨园行」、唐玄宗被尊为「梨园祖师」，即源于此。"],"keys":["梨园","唐玄宗","法曲","教坊","梨园祖师"],"tip":"「玄宗亲教、专习法曲器乐」→后世梨园行的祖师爷。","extra":true,"syl":true,"sylNote":"考纲列梨园"},{"q":"敦煌曲谱","type":"名词解释","pts":["《敦煌曲谱》又名《敦煌琵琶谱》，是五代后唐明宗长兴四年（933年）抄写的一份曲项琵琶谱。","它用燕乐半字谱记写，1900年在敦煌莫高窟藏经洞被发现，今存巴黎国家图书馆。","谱中记录了琵琶四根弦上的指位符号，存曲二十五首，是现存重要的唐代琵琶谱实物。","它为了解唐代燕乐、琵琶演奏与半字谱记谱法提供了珍贵资料。"],"keys":["敦煌曲谱","敦煌琵琶谱","燕乐半字谱","曲项琵琶","藏经洞"],"tip":"「933年、半字谱、琵琶谱、藏经洞」——四个关键词锁定敦煌曲谱。","extra":true,"syl":false,"sylNote":"考纲未列敦煌曲谱"},{"q":"犯调","type":"名词解释","pts":["犯调是唐代曲子、曲牌音乐中变换调门（调高、调式）的手法，与「犯腔」合称「犯腔犯调」。","犯腔指在某些曲牌中借用其他曲牌的曲调，这类曲牌称为「犯腔曲牌」。",
